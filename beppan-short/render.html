<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>別班は実在するのか?</title>
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-jp/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-jp/900.css">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; height: 100vh; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// 時刻 t(秒)のフレームを決定論的に描画する。タイミングは narrate.py が書き出す output/timings.json に従う。
// capture.js が window.TIMINGS を注入する。
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const T = window.TIMINGS;
window.FPS = T.fps; window.DURATION = T.duration;

const C = {
  bg: '#090C11', panel: '#121822', panel2: '#171F2B', line: '#2A3547',
  text: '#EEF1F5', muted: '#8E9AAD', dim: '#5A6679',
  amber: '#F5B841', blue: '#7DB4EA', red: '#E5484D',
};
const SANS = '"Noto Sans JP", "IPAGothic", sans-serif';
const SERIF = '"Noto Serif JP", "IPAGothic", serif';

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const backOut = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const ap = (t, t0, d = 0.45) => easeOut((t - t0) / d);        // t0 から d 秒かけて 0→1
const scene = i => T.scenes[i];
const cue = (si, ci) => T.scenes[si].chunks[Math.min(ci, T.scenes[si].chunks.length - 1)].t0;
const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

function font(weight, size, fam = SANS) { g.font = `${weight} ${size}px ${fam}`; }
function text(s, x, y, o = {}) {
  g.save();
  font(o.w || 700, o.size || 40, o.fam || SANS);
  g.letterSpacing = (o.ls || 0) + 'px';
  g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'alphabetic';
  g.fillStyle = o.color || C.text; g.globalAlpha *= (o.a === undefined ? 1 : o.a);
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = o.blur || 40; }
  g.fillText(s, x, y);
  g.restore();
}
// 色分けした文字列を中央揃えで描く: segs = [[文字列, 色], ...]
function segsCenter(segs, cx, y, size, o = {}) {
  g.save();
  font(o.w || 900, size, o.fam || SERIF); g.letterSpacing = (o.ls || 2) + 'px';
  g.textBaseline = 'middle'; g.textAlign = 'left';
  const tot = segs.reduce((a, [s]) => a + g.measureText(s).width, 0);
  let x = cx - tot / 2;
  for (const [s, col] of segs) {
    g.fillStyle = col;
    if (col === C.red || col === C.amber) { g.shadowColor = col; g.shadowBlur = 36; } else { g.shadowBlur = 0; }
    g.fillText(s, x, y); x += g.measureText(s).width;
  }
  g.restore();
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function panel(x, y, w, h, o = {}) {
  g.save();
  rr(x, y, w, h, o.r || 18); g.fillStyle = o.fill || C.panel; g.fill();
  g.lineWidth = 2; g.strokeStyle = o.stroke || C.line; g.stroke();
  if (o.accent) { g.fillStyle = o.accent; rr(x, y + 22, 7, h - 44, 3.5); g.fill(); }
  g.restore();
}
// 出現アニメ: 下から少し持ち上がりながらフェードイン
function appear(p, dy, fn) { if (p <= 0) return; g.save(); g.globalAlpha *= p; g.translate(0, (1 - p) * dy); fn(); g.restore(); }

// ---------- 背景 ----------
const noise = (() => {
  const n = document.createElement('canvas'); n.width = n.height = 256;
  const c = n.getContext('2d'), im = c.createImageData(256, 256);
  let s = 12345;
  for (let i = 0; i < im.data.length; i += 4) {
    s = (s * 1664525 + 1013904223) >>> 0; const v = s >>> 24;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255;
  }
  c.putImageData(im, 0, 0); return n;
})();
function background(t, tint = 'rgba(46,62,88,0.55)') {
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(W / 2, 560, 60, W / 2, 560, 1100);
  rg.addColorStop(0, tint); rg.addColorStop(1, 'rgba(9,12,17,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  g.save(); g.strokeStyle = 'rgba(120,140,170,0.055)'; g.lineWidth = 1;
  const off = (t * 6) % 90;
  for (let x = 0; x <= W; x += 90) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = -90 + off; y <= H; y += 90) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.restore();
}
function overlay(t) {
  const vg = g.createRadialGradient(W / 2, H / 2, 480, W / 2, H / 2, 1250);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.68)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  // 走査線
  g.save(); g.fillStyle = 'rgba(0,0,0,0.10)';
  for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 1);
  g.restore();
  const f = Math.round(t * T.fps);
  g.save(); g.globalAlpha = 0.06; g.globalCompositeOperation = 'overlay';
  const ox = (f * 73) % 256, oy = (f * 151) % 256;
  g.translate(-ox, -oy); g.fillStyle = g.createPattern(noise, 'repeat'); g.fillRect(0, 0, W + 256, H + 256);
  g.restore();
}
// シーン切り替え直後の短いグリッチ
function glitch(t, t0, dur = 0.28, strength = 1) {
  const p = (t - t0) / dur;
  if (p < 0 || p > 1) return;
  const f = Math.round(t * T.fps), k = (1 - p) * strength;
  g.save();
  for (let i = 0; i < 7; i++) {
    const y = hash(f * 13 + i) * H, h = 8 + hash(f * 7 + i) * 60, dx = (hash(f * 3 + i) - 0.5) * 120 * k;
    g.globalAlpha = 0.85 * k;
    g.drawImage(cv, 0, y, W, h, dx, y, W, h);
    g.globalAlpha = 0.22 * k; g.fillStyle = i % 2 ? C.red : C.blue; g.fillRect(0, y, W, 2);
  }
  g.restore();
}

// ---------- 常時表示のヘッダー ----------
function header(t, si) {
  const y = 232;
  // 録画中のような点滅ドット
  const on = Math.floor(t * 1.6) % 2 === 0;
  g.beginPath(); g.arc(80, y - 9, 9, 0, Math.PI * 2); g.fillStyle = on ? C.red : 'rgba(229,72,77,0.25)'; g.fill();
  text('CLASSIFIED', 102, y, { w: 700, size: 24, ls: 6, color: C.red });
  text('FILE: 別班', 336, y, { w: 900, size: 24, ls: 4, color: C.muted });
  text(`${String(si + 1).padStart(2, '0')} / ${String(T.scenes.length).padStart(2, '0')}`, 1010, y, { w: 700, size: 24, ls: 4, color: C.dim, align: 'right' });
  g.fillStyle = C.line; g.fillRect(70, y + 22, 940, 3);
  g.fillStyle = C.amber; g.fillRect(70, y + 22, 940 * clamp(t / T.duration), 3);
}
function heading(t, si, label, title, color) {
  const s = scene(si), p = ap(t, s.start + 0.05, 0.5);
  appear(p, 24, () => {
    g.fillStyle = color; g.fillRect(70, 318, 46, 6);
    text(label, 132, 330, { w: 700, size: 26, ls: 7, color });
    text(title, 70, 428, { w: 900, size: 68, ls: 1 });
  });
}
function note(s, y, a = 1) { text(s, W / 2, y, { w: 500, size: 25, color: C.dim, align: 'center', ls: 1, a }); }

// ---------- 字幕 ----------
const NO_HEAD = '、。」）ーっゃゅょッャュョんを”';
function splitLine(s, max) {
  font(900, 60); g.letterSpacing = '1px';
  if (g.measureText(s).width <= max) return [s];
  let best = -1, bestD = 1e9;
  for (let i = 2; i < s.length - 1; i++) {
    if (NO_HEAD.includes(s[i]) || '「（“'.includes(s[i - 1])) continue;
    const d = Math.abs(g.measureText(s.slice(0, i)).width - g.measureText(s.slice(i)).width)
      + ('、。'.includes(s[i - 1]) ? -60 : 0) + (/[はがをにでもとの]/.test(s[i - 1]) ? -30 : 0);
    if (d < bestD) { bestD = d; best = i; }
  }
  return [s.slice(0, best), s.slice(best)];
}
function segments(line, hl) {
  let segs = [[line, false]];
  for (const h of hl) {
    const out = [];
    for (const [s, on] of segs) {
      const i = on ? -1 : s.indexOf(h);
      if (i < 0) { out.push([s, on]); continue; }
      if (i > 0) out.push([s.slice(0, i), false]);
      out.push([h, true]);
      if (i + h.length < s.length) out.push([s.slice(i + h.length), false]);
    }
    segs = out;
  }
  return segs;
}
function captions(t) {
  const all = T.scenes.flatMap(s => s.chunks);
  let k = -1;
  for (let i = 0; i < all.length; i++) if (t >= all[i].t0 - 0.04) k = i;
  if (k < 0) return;
  const c = all[k], next = all[k + 1];
  const end = next ? Math.min(c.t1 + 0.5, next.t0 - 0.04) : c.t1 + 0.6;
  if (t > end) return;
  const p = Math.min(ap(t, c.t0 - 0.04, 0.14), 1 - clamp((t - end + 0.1) / 0.1));
  const lines = splitLine(c.text, 900);
  const LH = 82, cy = 1380;
  g.save(); g.globalAlpha = clamp(p);
  g.translate(0, (1 - easeOut(p)) * 10);
  lines.forEach((ln, i) => {
    const y = cy + (i - (lines.length - 1) / 2) * LH;
    font(900, 60); g.letterSpacing = '1px'; g.textBaseline = 'middle'; g.textAlign = 'left';
    const segs = segments(ln, c.hl || []);
    const total = g.measureText(ln).width;
    let x = W / 2 - total / 2;
    for (const [s] of segs) {
      g.lineJoin = 'round'; g.lineWidth = 14; g.strokeStyle = 'rgba(5,7,10,0.92)'; g.strokeText(s, x, y);
      x += g.measureText(s).width;
    }
    x = W / 2 - total / 2;
    for (const [s, on] of segs) {
      g.fillStyle = on ? C.amber : '#FFFFFF'; g.fillText(s, x, y);
      x += g.measureText(s).width;
    }
  });
  g.restore();
}

// ---------- 部品 ----------
function stamp(cx, cy, w, h, label, p, rot = -0.1, color = C.red) {
  if (p <= 0) return;
  const sc = 1 + (1 - easeOut(p)) * 1.3;
  g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(sc, sc); g.globalAlpha *= clamp(p * 2.5) * 0.94;
  g.strokeStyle = color; g.lineWidth = 9; rr(-w / 2, -h / 2, w, h, 14); g.stroke();
  g.lineWidth = 3; rr(-w / 2 + 14, -h / 2 + 14, w - 28, h - 28, 7); g.stroke();
  text(label, 0, 6, { fam: SERIF, w: 900, size: h * 0.5, color, align: 'center', base: 'middle', ls: 8 });
  g.restore();
}
// 黒塗りが左から剥がれて中身が現れる
function redacted(cx, cy, w, h, p, drawInner, barVisible = 1) {
  g.save(); g.translate(cx, cy);
  if (p > 0) { g.save(); g.beginPath(); g.rect(-w / 2, -h / 2, w * p, h); g.clip(); drawInner(); g.restore(); }
  if (barVisible > 0 && p < 1) {
    g.globalAlpha *= barVisible;
    g.fillStyle = '#020304'; g.fillRect(-w / 2 + w * p, -h / 2, w * (1 - p), h);
    g.strokeStyle = 'rgba(120,140,170,0.25)'; g.lineWidth = 2; g.strokeRect(-w / 2 + w * p, -h / 2, w * (1 - p), h);
    if (p > 0) { g.fillStyle = C.amber; g.fillRect(-w / 2 + w * p - 3, -h / 2 - 16, 6, h + 32); }
  }
  g.restore();
}
function radar(cx, cy, r, t) {
  g.save();
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fillStyle = 'rgba(10,16,12,0.6)'; g.fill();
  g.strokeStyle = 'rgba(245,184,65,0.28)'; g.lineWidth = 2;
  for (let k = 1; k <= 3; k++) { g.beginPath(); g.arc(cx, cy, r * k / 3, 0, Math.PI * 2); g.stroke(); }
  g.beginPath(); g.moveTo(cx - r, cy); g.lineTo(cx + r, cy); g.moveTo(cx, cy - r); g.lineTo(cx, cy + r); g.stroke();
  const a = t * 1.7;
  const cg = g.createConicGradient(a, cx, cy);
  cg.addColorStop(0, 'rgba(245,184,65,0)'); cg.addColorStop(0.82, 'rgba(245,184,65,0)'); cg.addColorStop(1, 'rgba(245,184,65,0.42)');
  g.beginPath(); g.moveTo(cx, cy); g.arc(cx, cy, r, 0, Math.PI * 2); g.fillStyle = cg; g.fill();
  g.strokeStyle = C.amber; g.lineWidth = 3;
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); g.stroke();
  [[0.52, -0.3], [-0.42, 0.55], [0.18, 0.72], [-0.62, -0.28], [0.3, -0.75]].forEach(([u, v]) => {
    const pa = Math.atan2(v, u);
    let d = (a - pa) % (Math.PI * 2); if (d < 0) d += Math.PI * 2;
    const al = Math.exp(-d * 1.1);
    g.beginPath(); g.arc(cx + u * r, cy + v * r, 9, 0, Math.PI * 2);
    g.fillStyle = `rgba(245,184,65,${0.15 + 0.85 * al})`; g.shadowColor = C.amber; g.shadowBlur = 24 * al; g.fill();
  });
  g.restore();
}

// ---------- シーン 1: フック ----------
function sHook(t) {
  const si = 0;
  const L = [
    [[['日本では、なぜ', C.text]], 0, 0],
    [[['大規模な', C.text], ['テロ', C.red], ['が', C.text]], 1, 0],
    [[['起きないのか？', C.text]], 1, 0.35],
  ];
  L.forEach(([segs, ci, dl], i) => {
    const p = (t - cue(si, ci) - dl) / 0.4;
    if (p <= 0) return;
    g.save(); g.globalAlpha *= clamp(p * 1.6);
    const k = 1.12 - 0.12 * easeOut(p); g.translate(W / 2, 540 + i * 128); g.scale(k, k);
    segsCenter(segs, 0, 0, 104);
    g.restore();
  });
  // 「その裏には ■■■■ がいる？」
  appear(ap(t, cue(si, 2), 0.35), 20, () => {
    panel(90, 900, 900, 300, { fill: 'rgba(10,13,18,0.85)', stroke: 'rgba(229,72,77,0.5)' });
    text('その裏には――', W / 2, 980, { w: 700, size: 42, color: C.muted, align: 'center', ls: 4 });
    redacted(W / 2, 1090, 700, 120, easeInOut((t - cue(si, 3) + 0.05) / 0.5), () =>
      text('秘密部隊がいる？', 0, 4, { fam: SERIF, w: 900, size: 84, align: 'center', base: 'middle', ls: 2, glow: 'rgba(245,184,65,0.35)' }));
  });
  stamp(905, 1190, 170, 170, '噂', (t - cue(si, 4)) / 0.22, 0.18);
  note('※ この動画は噂・仮説を含みます', 1640, ap(t, 0.2, 0.5) * 0.9);
}

// ---------- シーン 2: その名は「別班」 ----------
function sName(t) {
  const si = 1, s = scene(si);
  const dim = 1 - 0.6 * ap(t, cue(si, 4), 0.25);
  g.save(); g.globalAlpha *= dim;
  const tr = cue(si, 0) + 0.35, pr = easeInOut((t - tr) / 0.55);
  const zoom = 1 + 0.04 * clamp((t - tr) / 4);
  g.save(); g.translate(W / 2, 700); g.scale(zoom, zoom);
  redacted(0, 0, 840, 360, pr, () => {
    text('別班', 0, 0, { fam: SERIF, w: 900, size: 330, align: 'center', base: 'middle', ls: 30, glow: 'rgba(245,184,65,0.4)', blur: 70 });
  });
  text('べ っ ぱ ん', 0, -212, { w: 700, size: 38, color: C.amber, align: 'center', a: ap(t, tr + 0.3, 0.4), ls: 8 });
  g.restore();
  appear(ap(t, cue(si, 1), 0.4), 20, () => {
    font(700, 34); g.letterSpacing = '2px';
    const lab = 'ドラマ『VIVANT』で一躍有名に', w = g.measureText(lab).width + 68;
    rr(W / 2 - w / 2, 936, w, 72, 36); g.fillStyle = 'rgba(245,184,65,0.12)'; g.fill();
    g.strokeStyle = C.amber; g.lineWidth = 2; g.stroke();
    text(lab, W / 2, 973, { w: 700, size: 34, ls: 2, color: C.amber, align: 'center', base: 'middle' });
  });
  appear(ap(t, cue(si, 2), 0.4), 20, () =>
    text('陸上自衛隊の秘密情報部隊', W / 2, 1086, { w: 700, size: 46, color: C.text, align: 'center', ls: 4 }));
  g.restore();
  // 政府の否定スタンプ(「ところが」で暗転しても残る)
  stamp(W / 2, 1200, 520, 120, '政府「存在しない」', (t - cue(si, 3)) / 0.22, -0.05, C.blue);
  glitch(t, cue(si, 4), 0.35, 1);
}

// ---------- シーン 3: 否定しきれない事実 ----------
function sEvidence(t) {
  const si = 2;
  heading(t, si, 'EVIDENCE', '否定しきれない“痕跡”', C.amber);
  const card = (y, h, num, title, p, extra) => appear(p, 28, () => {
    panel(70, y, 940, h, { accent: C.amber });
    text(num, 112, y + 74, { w: 900, size: 54, color: C.amber, ls: 1 });
    text(title, 204, y + 70, { w: 900, size: 46, ls: 1 });
    if (extra) extra();
  });
  card(480, 180, '01', '2013年 共同通信のスクープ', ap(t, cue(si, 0)), () =>
    appear(ap(t, cue(si, 1)), 10, () => text('総理にも知らせず、海外で情報活動', 206, 480 + 136, { w: 500, size: 34, color: C.muted, ls: 1 })));
  card(684, 180, '02', '元陸幕長が存在を認める', ap(t, cue(si, 3)), () =>
    appear(ap(t, cue(si, 4)), 10, () => text('記者の取材に対して', 206, 684 + 136, { w: 500, size: 34, color: C.muted, ls: 1 })));
  card(888, 352, '03', '名前を変えて存続？', ap(t, cue(si, 5)), () => {
    const names = ['第2部別班', '調査部別班', '運用支援・情報部別班', '指揮通信システム・情報部別班'];
    const span = Math.max(0.6, cue(si, 6) + 0.8 - cue(si, 5));
    names.forEach((nm, i) => appear(ap(t, cue(si, 5) + 0.25 + i * span / 4, 0.3), 8, () => {
      const y = 888 + 136 + i * 56, last = i === names.length - 1;
      text(i ? '↓' : '', 214, y, { w: 700, size: 28, color: C.dim });
      text(nm, 250, y, { w: last ? 900 : 500, size: 34, color: last ? C.amber : C.text, ls: 1 });
      if (last) text('2017年〜', 1000 - 32, y, { w: 700, size: 28, color: C.amber, align: 'right' });
    }));
  });
  note('※ 石井暁『自衛隊の闇組織』（講談社現代新書）による', 1272, ap(t, cue(si, 5), 0.5));
}

// ---------- シーン 4: 仮説 ----------
function sTheory(t) {
  const si = 3;
  heading(t, si, 'HYPOTHESIS', 'なぜ日本は守られてきた？', C.red);
  // 年表バー
  appear(ap(t, cue(si, 0), 0.4), 16, () => {
    const x0 = 210, x1 = 870, y = 556, p = easeInOut((t - cue(si, 0)) / 1.4);
    g.fillStyle = C.line; g.fillRect(x0, y, x1 - x0, 6);
    g.fillStyle = C.amber; g.fillRect(x0, y, (x1 - x0) * p, 6);
    [[x0, '1995', '地下鉄サリン事件'], [x1, '2026', '現在']].forEach(([x, yr, lb], i) => {
      g.beginPath(); g.arc(x, y + 3, 13, 0, Math.PI * 2); g.fillStyle = (i === 0 || p >= 1) ? C.amber : C.line; g.fill();
      text(yr, x, y - 30, { w: 900, size: 40, align: 'center', color: C.text });
      text(lb, x, y + 58, { w: 500, size: 28, align: 'center', color: C.muted });
    });
    const years = Math.round(30 * p);
    text(`約${years}年`, W / 2, 740, { fam: SERIF, w: 900, size: 132, align: 'center', color: C.amber, glow: 'rgba(245,184,65,0.35)', ls: 4 });
  });
  appear(ap(t, cue(si, 1), 0.4), 16, () => {
    text('組織的な大規模テロ', W / 2, 840, { w: 700, size: 42, align: 'center', color: C.muted, ls: 3 });
  });
  appear(ap(t, cue(si, 2), 0.3), 10, () =>
    text('起きていない', W / 2, 920, { fam: SERIF, w: 900, size: 64, align: 'center', ls: 6 }));
  // 守りの層: 警察 / 公安 / ？？？
  const boxes = [['警察', 3, C.blue], ['公安', 3, C.blue], ['？？？', 5, C.amber]];
  boxes.forEach(([lb, ci, col], i) => {
    const p = ap(t, cue(si, ci) + (i === 1 ? 0.25 : 0), 0.4);
    appear(p, 24, () => {
      const x = 90 + i * 310, y = 990, w = 280, h = 150;
      g.save();
      if (i === 2) {
        const pulse = 0.6 + 0.4 * Math.sin((t - cue(si, 5)) * 6);
        g.shadowColor = C.amber; g.shadowBlur = 40 * pulse;
        g.setLineDash([12, 8]); g.lineDashOffset = -t * 40;
      }
      rr(x, y, w, h, 16); g.fillStyle = i === 2 ? 'rgba(245,184,65,0.10)' : C.panel; g.fill();
      g.lineWidth = 3; g.strokeStyle = col; g.stroke();
      g.restore();
      text(lb, x + w / 2, y + h / 2 + 4, { fam: SERIF, w: 900, size: i === 2 ? 58 : 52, align: 'center', base: 'middle', color: i === 2 ? C.amber : C.text, ls: 4 });
    });
  });
  appear(ap(t, cue(si, 5) + 0.3, 0.4), 10, () =>
    text('表に出ない“盾”？', W / 2, 1210, { w: 900, size: 40, align: 'center', color: C.amber, ls: 3 }));
  note('※ ここからは仮説です', 1640, ap(t, cue(si, 4), 0.4));
}

// ---------- シーン 5: 成功は報じられない ----------
function sSilent(t) {
  const si = 4;
  heading(t, si, 'INTELLIGENCE', '諜報の世界の“常識”', C.amber);
  appear(ap(t, cue(si, 2), 0.4), 20, () => {
    text('成功した作戦は、', W / 2, 600, { fam: SERIF, w: 900, size: 78, align: 'center', ls: 2 });
  });
  appear(ap(t, cue(si, 3), 0.4), 20, () =>
    text('ニュースにならない', W / 2, 718, { fam: SERIF, w: 900, size: 92, align: 'center', color: C.amber, ls: 2, glow: 'rgba(245,184,65,0.4)' }));
  // 黒塗りの作戦記録
  appear(ap(t, cue(si, 4), 0.4), 30, () => {
    panel(110, 800, 860, 430, { fill: '#E9E4D6', stroke: '#B9B3A3', r: 6 });
    text('作戦記録', 150, 868, { fam: SERIF, w: 900, size: 40, color: '#2B2B2B', ls: 4 });
    text('No. ████', 940, 868, { w: 700, size: 30, color: '#2B2B2B', align: 'right' });
    g.fillStyle = '#B9B3A3'; g.fillRect(150, 892, 780, 2);
    for (let i = 0; i < 6; i++) {
      const y = 930 + i * 46, w = 780 * (0.55 + 0.45 * hash(i + 3));
      g.fillStyle = '#9E978A'; g.fillRect(150, y, w, 10);
      const p = ap(t, cue(si, 4) + 0.15 + i * 0.12, 0.25);
      g.fillStyle = '#0B0B0B'; g.fillRect(146, y - 10, (w + 8) * p, 30);
    }
  });
  stamp(780, 1150, 300, 110, '非公開', (t - cue(si, 5)) / 0.22, -0.12);
}

// ---------- シーン 6: 結び ----------
function sEnd(t) {
  const si = 5, s = scene(si);
  appear(ap(t, s.start, 0.8), 0, () => radar(W / 2, 640, 230, t));
  appear(ap(t, cue(si, 0), 0.5), 20, () =>
    text('存在しないはずの部隊', W / 2, 1000, { fam: SERIF, w: 900, size: 74, align: 'center', ls: 4 }));
  appear(ap(t, cue(si, 1), 0.5), 16, () =>
    text('彼らは今日も、どこかで――', W / 2, 1090, { w: 700, size: 44, align: 'center', color: C.muted, ls: 4 }));
  const p = (t - cue(si, 2)) / 0.6;
  if (p > 0) {
    g.save(); g.globalAlpha *= clamp(p * 1.5);
    const k = 1.15 - 0.15 * easeOut(p); g.translate(W / 2, 1200); g.scale(k, k);
    text('真相は、闇の中。', 0, 0, { fam: SERIF, w: 900, size: 84, align: 'center', base: 'middle', color: C.amber, ls: 6, glow: 'rgba(245,184,65,0.45)', blur: 50 });
    g.restore();
  }
  const pc = ap(t, cue(si, 0), 0.6);
  note('※ 本動画は噂・仮説を含みます。政府は別班の存在を公式に否定しています。', 1580, pc);
  note('音声：VOICEVOX：青山龍星', 1622, pc);
  note('出典：参議院答弁書(2013)／共同通信(2013)／石井暁『自衛隊の闇組織』', 1660, pc);
}

const DRAW = [sHook, sName, sEvidence, sTheory, sSilent, sEnd];

window.render = function (t) {
  t = clamp(t, 0, T.duration);
  let si = T.scenes.findIndex(s => t < s.end); if (si < 0) si = T.scenes.length - 1;
  const s = scene(si), last = si === T.scenes.length - 1;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  background(t, si === 3 ? 'rgba(90,40,46,0.5)' : last ? 'rgba(40,46,30,0.35)' : 'rgba(46,62,88,0.55)');
  const fin = clamp((t - s.start) / 0.22), fout = last ? 1 - clamp((t - (T.duration - 0.6)) / 0.6) : clamp((s.end - t) / 0.18);
  g.save(); g.globalAlpha = (si === 0 ? clamp(t / 0.3) : fin) * fout;
  DRAW[si](t);
  g.restore();
  g.save(); g.globalAlpha = last ? fout : 1;
  header(t, si);
  captions(t);
  g.restore();
  if (si > 0) glitch(t, s.start, 0.22, 0.7);
  overlay(t);
};

// Web フォントはサブセット分割されているので、全フレームを空描きして必要な分を読み込ませる
window.ready = (async () => {
  for (let pass = 0; pass < 3; pass++) {
    for (let t = 0; t <= T.duration; t += 0.2) window.render(t);
    await document.fonts.ready;
    await new Promise(r => setTimeout(r, 150));
  }
  window.render(0);
})();
</script>
