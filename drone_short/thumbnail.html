<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>サムネイル</title>
<style>
:root{--bg:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--blue:#3987e5;--orange:#d95926}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"IPAPGothic","IPAGothic","Noto Color Emoji",sans-serif;overflow:hidden}
.wrap{position:relative;display:flex;flex-direction:column;justify-content:center;gap:28px;padding:60px 70px}
.wrap.l{width:1280px;height:720px}
.wrap.v{width:1080px;height:1920px;gap:40px;padding:120px 80px}
.kicker{display:inline-block;background:var(--blue);color:#fff;font-weight:bold;border-radius:999px;padding:8px 26px;font-size:30px;width:max-content}
.v .kicker{font-size:40px;padding:12px 34px}
.h{font-size:64px;font-weight:bold;line-height:1.2}
.v .h{font-size:96px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:30px;margin-top:10px}
.v .vs{grid-template-columns:1fr;gap:18px}
.side .who{font-size:30px;color:var(--ink2)}
.v .side .who{font-size:44px}
.side .num{font-size:92px;font-weight:bold;line-height:1.05;white-space:nowrap}
.v .side .num{font-size:120px}
.side.us .num{color:var(--ink2)}
.mid{font-size:44px;color:var(--ink2);letter-spacing:.2em}
.v .mid{text-align:center;font-size:60px}
.tag{font-size:40px;font-weight:bold;color:var(--orange)}
.v .tag{font-size:60px}
.foot{position:absolute;right:70px;bottom:40px;font-size:24px;color:#8a8982}
.v .foot{left:0;right:0;bottom:80px;text-align:center;font-size:30px}
</style>
</head>
<body>
<div class="wrap l" id="l">
  <div class="kicker">2026年版・国際比較</div>
  <div class="h">軍用ドローン、<br>年に何機つくれる？</div>
  <div class="vs">
    <div class="side"><div class="who">🇺🇦 ウクライナ</div><div class="num">年1,000万機</div></div>
    <div class="mid">VS</div>
    <div class="side us"><div class="who">🇺🇸 米国</div><div class="num">年10万機</div></div>
  </div>
  <div class="tag">差は100倍。中国・日本は？</div>
  <div class="foot">VOICEVOX:青山龍星</div>
</div>
</body>
</html>
