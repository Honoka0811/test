<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>旧日本軍すごい技術ランキング</title>
<style>
@font-face { font-family: "Dela"; src: url("fonts/DelaGothicOne-Regular.ttf"); }
@font-face { font-family: "Noto"; src: url("fonts/NotoSansJP.ttf"); font-weight: 100 900; }
html, body { margin: 0; background: #000; }
canvas { display: block; height: 100vh; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
// 時刻 t 秒のフレームを決定論的に描く。capture.js が 1 フレームずつ render(t) を呼ぶ。
// タイミングはすべて timeline.js(narrate.py が音声の長さから作る)に従う。
const TL = window.TIMELINE;
window.FPS = TL.fps; window.DURATION = TL.duration;
const W = 1080, H = 1920;
const cv = document.getElementById('c'), g = cv.getContext('2d');

const C = { bg0: '#06090f', bg1: '#141c30', gold: '#FFC93C', red: '#F0453A', white: '#FFFFFF',
            mute: '#9AA8C7', dim: '#56668A', panel: 'rgba(255,255,255,0.07)', steel: '#C9D3E6' };
// 効果音とカメラの揺れを合わせるための時刻オフセット(mix.py と同じ値)
const SFX_OFF = { fire: 0.12, hit: 0.6 };

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, d) => clamp((t - a) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const fmt = n => Math.round(n).toLocaleString('en-US');
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const KANJI = /[㐀-鿿々]/;

function font(size, fam = 'Noto', weight = 900) { g.font = `${weight} ${size}px "${fam}", "IPAGothic", sans-serif`; }
// Dela Gothic は漢字を持たないので、漢字の部分だけ Noto Sans JP Black に切り替えて描く
function runs(s, fam) {
  if (fam !== 'Dela') return [[s, fam]];
  const out = [];
  for (const ch of s) { const f = KANJI.test(ch) ? 'Noto' : 'Dela'; if (out.length && out[out.length - 1][1] === f) out[out.length - 1][0] += ch; else out.push([ch, f]); }
  return out;
}
function measure(s, size, fam = 'Noto', weight = 900) {
  return runs(s, fam).reduce((w, [r, f]) => { font(size, f, f === 'Dela' ? 400 : weight); return w + g.measureText(r).width; }, 0);
}
function text(s, x, y, o = {}) {
  let size = o.size || 48; const fam = o.fam || 'Noto', weight = o.weight || 900;
  if (o.maxW) { const w = measure(s, size, fam, weight); if (w > o.maxW) size *= o.maxW / w; }
  const total = measure(s, size, fam, weight), align = o.align || 'center';
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  const rs = runs(s, fam);
  const pass = stroke => {
    let px = cx;
    for (const [r, f] of rs) {
      font(size, f, f === 'Dela' ? 400 : weight);
      const dy = f === 'Noto' && fam === 'Dela' ? size * 0.02 : 0;
      if (stroke) { g.lineJoin = 'round'; g.lineWidth = o.strokeW || 14; g.strokeStyle = o.stroke; g.strokeText(r, px, y + dy); }
      else { g.fillStyle = o.color || C.white; g.fillText(r, px, y + dy); }
      px += g.measureText(r).width;
    }
  };
  if (o.stroke) pass(true);
  pass(false);
  return total;
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
// 叩きつけるように出現(大きく→等倍)
function slam(p, cx, cy, fn, from = 2.2, rot = 0) {
  if (p <= 0) return;
  g.save(); g.globalAlpha *= clamp(p * 4); g.translate(cx, cy); const s = lerp(from, 1, eOut(clamp(p))); g.scale(s, s); g.rotate(rot); g.translate(-cx, -cy); fn(); g.restore();
}
// 弾むように出現
function pop(p, cx, cy, fn) {
  if (p <= 0) return;
  g.save(); g.globalAlpha *= clamp(p * 2.5); g.translate(cx, cy); const s = eBack(clamp(p)); g.scale(s, s); g.translate(-cx, -cy); fn(); g.restore();
}
function rise(p, fn, dy = 50) { if (p <= 0) return; g.save(); g.globalAlpha *= clamp(p * 1.6); g.translate(0, (1 - eOut(clamp(p))) * dy); fn(); g.restore(); }
function fade(a, fn) { if (a <= 0) return; g.save(); g.globalAlpha *= clamp(a); fn(); g.restore(); }
const cs = (sc, i) => sc.cues[i].start - sc.start;   // シーン内でのセリフ開始時刻
const ce = (sc, i) => sc.cues[i].end - sc.start;

// ---------- 背景 ----------
function background(t, hue, rays = 0) {
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, C.bg1); gr.addColorStop(1, C.bg0);
  g.fillStyle = gr; g.fillRect(-120, -120, W + 240, H + 240);
  const rg = g.createRadialGradient(W / 2, 760, 50, W / 2, 760, 1000);
  rg.addColorStop(0, hue); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(-120, -120, W + 240, H + 240);
  if (rays > 0) sunburst(540, 760, rays, t * 0.15, '#ffffff');
  // 斜めに流れるスピード線
  g.save(); g.globalAlpha = 0.06; g.strokeStyle = '#cfe0ff'; g.lineWidth = 2;
  const off = (t * 90) % 140;
  for (let i = -16; i < 26; i++) { g.beginPath(); g.moveTo(i * 140 + off, -120); g.lineTo(i * 140 + off - 800, H + 120); g.stroke(); }
  g.restore();
}
function sunburst(x, y, a, rot, col, n = 24) {
  g.save(); g.translate(x, y); g.rotate(rot); g.globalAlpha *= a; g.fillStyle = col;
  for (let i = 0; i < n; i++) { g.rotate(Math.PI * 2 / n); if (i % 2) continue; g.beginPath(); g.moveTo(0, 0); g.lineTo(-90, -1700); g.lineTo(90, -1700); g.closePath(); g.fill(); }
  g.restore();
}
function vignette() {
  const v = g.createRadialGradient(W / 2, H / 2, 560, W / 2, H / 2, 1250);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ---------- イラスト ----------
function zero(cx, cy, s, rot) {          // 零戦(平面形・機首は上)
  g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(s, s);
  const body = '#C7CFBF', dark = '#8E9887';
  g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 30; g.shadowOffsetY = 26;
  for (const m of [1, -1]) {
    g.save(); g.scale(m, 1);
    g.beginPath(); g.moveTo(0, -78); g.lineTo(60, -72); g.bezierCurveTo(150, -62, 235, -44, 262, -30); g.bezierCurveTo(280, -18, 276, 2, 252, 6);
    g.lineTo(0, 30); g.closePath(); g.fillStyle = body; g.fill();
    g.beginPath(); g.moveTo(0, 122); g.lineTo(64, 126); g.bezierCurveTo(88, 130, 90, 150, 70, 154); g.lineTo(0, 160); g.closePath(); g.fill();
    g.restore();
  }
  g.shadowColor = 'transparent';
  for (const m of [1, -1]) {
    g.strokeStyle = dark; g.lineWidth = 2; g.beginPath(); g.moveTo(m * 120, 12); g.lineTo(m * 250, -2); g.stroke();
    g.beginPath(); g.arc(m * 185, -28, 26, 0, 7); g.fillStyle = '#C8362E'; g.fill();
  }
  g.beginPath(); g.moveTo(-24, -128); g.bezierCurveTo(-26, -40, -16, 80, -5, 176); g.lineTo(5, 176); g.bezierCurveTo(16, 80, 26, -40, 24, -128); g.closePath(); g.fillStyle = body; g.fill();
  g.beginPath(); g.ellipse(0, -138, 25, 34, 0, 0, 7); g.fillStyle = '#23262b'; g.fill();
  rr(-13, -84, 26, 84, 12); g.fillStyle = '#3d5568'; g.fill(); g.strokeStyle = '#dfe7ee'; g.lineWidth = 2; g.stroke();
  g.beginPath(); g.ellipse(0, -172, 92, 9, 0, 0, 7); g.fillStyle = 'rgba(255,255,255,0.28)'; g.fill();
  g.beginPath(); g.arc(0, -172, 9, 0, 7); g.fillStyle = '#6b4a2a'; g.fill();
  g.restore();
}
function torpedo(x, y, len, color) {     // 魚雷(右向き。x は弾頭の先端)
  const h = len * 0.085;
  g.save(); g.translate(x, y);
  g.beginPath(); g.moveTo(-len, -h * 0.35); g.lineTo(-len * 0.86, -h / 2); g.lineTo(-len * 0.12, -h / 2);
  g.bezierCurveTo(-len * 0.02, -h / 2, 0, -h * 0.2, 0, 0); g.bezierCurveTo(0, h * 0.2, -len * 0.02, h / 2, -len * 0.12, h / 2);
  g.lineTo(-len * 0.86, h / 2); g.lineTo(-len, h * 0.35); g.closePath(); g.fillStyle = color; g.fill();
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(-len * 0.3, -h / 2, 5, h);
  g.fillStyle = color;
  g.beginPath(); g.moveTo(-len * 0.9, -h / 2); g.lineTo(-len * 1.0, -h * 1.1); g.lineTo(-len * 1.03, -h * 1.1); g.lineTo(-len * 0.99, 0);
  g.lineTo(-len * 1.03, h * 1.1); g.lineTo(-len * 1.0, h * 1.1); g.lineTo(-len * 0.9, h / 2); g.closePath(); g.fill();
  g.restore();
}
function battleship(cx, cy, s, col = C.steel, accent = 'rgba(229,73,63,0.9)') {   // 戦艦大和(側面・艦首は右)
  g.save(); g.translate(cx, cy); g.scale(s, s);
  g.fillStyle = col;
  g.beginPath(); g.moveTo(-440, -26); g.lineTo(-250, -30); g.lineTo(-60, -44); g.lineTo(260, -38); g.bezierCurveTo(360, -42, 420, -52, 452, -62);
  g.lineTo(436, 0); g.bezierCurveTo(430, 14, 420, 20, 404, 20); g.lineTo(-420, 20); g.lineTo(-436, 0); g.closePath(); g.fill();
  const R = (x, y, w, h) => g.fillRect(x, y - h, w, h);
  R(-150, -44, 240, 26); R(-110, -70, 170, 26);
  R(-6, -96, 54, 110); R(-12, -206, 60, 22); R(2, -184, 36, 90); R(-20, -150, 76, 12); R(-2, -232, 30, 26); R(-40, -218, 96, 6);
  g.fillRect(12, -290, 5, 60);
  g.beginPath(); g.moveTo(-74, -70); g.lineTo(-96, -168); g.lineTo(-52, -168); g.lineTo(-22, -70); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-122, -70); g.lineTo(-150, -210); g.lineTo(-144, -210); g.lineTo(-108, -70); g.closePath(); g.fill();
  R(-190, -44, 34, 46);
  const turret = (x, y, dir) => {
    g.beginPath(); g.moveTo(x - 40, y); g.lineTo(x - 36, y - 34); g.lineTo(x + 36, y - 34); g.lineTo(x + 40, y); g.closePath(); g.fill();
    g.save(); g.translate(x + dir * 30, y - 22); g.rotate(-dir * 0.09); g.fillRect(dir > 0 ? 0 : -112, -5, 112, 10); g.restore();
  };
  turret(250, -38, 1); turret(160, -66, 1); R(120, -40, 80, 26); turret(-250, -30, -1); R(-235, -30, 40, 16);
  if (accent) { g.fillStyle = accent; g.fillRect(-420, 8, 824, 12); }
  g.restore();
}
function carrier(cx, cy, s, a = 1) {     // 空母(真上から・艦首は上)
  g.save(); g.translate(cx, cy); g.scale(s, s); g.globalAlpha *= a;
  g.beginPath(); g.moveTo(-24, -150); g.bezierCurveTo(-10, -172, 10, -172, 24, -150); g.lineTo(27, 150); g.lineTo(-27, 150); g.closePath(); g.fillStyle = '#3b4a66'; g.fill();
  rr(-32, -140, 64, 284, 6); g.fillStyle = '#B79B6B'; g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = 3; g.setLineDash([14, 12]); g.beginPath(); g.moveTo(0, -128); g.lineTo(0, 132); g.stroke(); g.setLineDash([]);
  rr(30, -34, 14, 50, 3); g.fillStyle = '#56668A'; g.fill();
  g.beginPath(); g.arc(0, -104, 13, 0, 7); g.fillStyle = '#C8362E'; g.fill();
  g.restore();
}
function plane(x, y, s, a = 1, col = '#E9EEF8') {   // 小さな機影(機首は上)
  g.save(); g.translate(x, y); g.scale(s, s); g.globalAlpha *= a; g.fillStyle = col;
  g.beginPath(); g.moveTo(0, -14); g.lineTo(3, -4); g.lineTo(18, 0); g.lineTo(18, 4); g.lineTo(3, 4); g.lineTo(2, 12); g.lineTo(7, 14); g.lineTo(7, 16);
  g.lineTo(-7, 16); g.lineTo(-7, 14); g.lineTo(-2, 12); g.lineTo(-3, 4); g.lineTo(-18, 4); g.lineTo(-18, 0); g.lineTo(-3, -4); g.closePath(); g.fill();
  g.restore();
}
function submarine(cx, cy, s) {          // 伊400型(側面・艦首は右)
  g.save(); g.translate(cx, cy); g.scale(s, s); g.fillStyle = C.steel;
  g.beginPath(); g.moveTo(-450, 0); g.bezierCurveTo(-400, -22, -300, -30, -200, -32); g.lineTo(330, -32); g.bezierCurveTo(400, -30, 440, -16, 456, -2);
  g.bezierCurveTo(440, 22, 380, 34, 300, 36); g.lineTo(-260, 36); g.bezierCurveTo(-340, 34, -410, 20, -450, 0); g.closePath(); g.fill();
  rr(-150, -74, 250, 46, 22); g.fill();
  g.beginPath(); g.moveTo(-96, -74); g.lineTo(-84, -128); g.lineTo(0, -128); g.lineTo(22, -74); g.closePath(); g.fill();
  g.fillRect(-60, -176, 5, 50); g.fillRect(-36, -158, 5, 32); g.fillRect(-80, -140, 60, 6);
  g.fillRect(100, -38, 300, 6);
  g.fillRect(-300, -46, 28, 14); g.fillRect(-290, -52, 46, 5);
  g.beginPath(); g.moveTo(-452, -4); g.lineTo(-478, -30); g.lineTo(-462, -30); g.lineTo(-430, -8); g.closePath(); g.fill();
  g.restore();
}
function sea(y, t, a = 1) {
  g.save(); g.globalAlpha *= a;
  for (let k = 0; k < 3; k++) {
    g.beginPath(); g.moveTo(-120, y + k * 16);
    for (let x = -120; x <= W + 120; x += 30) g.lineTo(x, y + k * 16 + Math.sin(x * 0.012 + t * (1.2 + k * 0.4) + k * 2) * 6);
    g.lineTo(W + 120, y + 90); g.lineTo(-120, y + 90); g.closePath();
    g.fillStyle = `rgba(63,110,190,${0.22 + k * 0.1})`; g.fill();
  }
  g.restore();
}
function shell(x, y, h, col = '#D9C38A') {   // 砲弾(縦)
  const w = h * 0.3;
  g.save(); g.translate(x, y); g.fillStyle = col;
  g.beginPath(); g.moveTo(-w / 2, h / 2); g.lineTo(-w / 2, -h * 0.1); g.bezierCurveTo(-w / 2, -h * 0.35, -w * 0.2, -h * 0.5, 0, -h / 2);
  g.bezierCurveTo(w * 0.2, -h * 0.5, w / 2, -h * 0.35, w / 2, -h * 0.1); g.lineTo(w / 2, h / 2); g.closePath(); g.fill();
  g.fillStyle = '#A0563A'; g.fillRect(-w / 2, h * 0.3, w, h * 0.06);
  g.restore();
}
function car(x, y, s, col = '#7FA7E6') {     // 乗用車(側面)
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col;
  g.beginPath(); g.moveTo(-150, 20); g.lineTo(-150, -10); g.bezierCurveTo(-148, -24, -130, -30, -100, -32); g.lineTo(-60, -34);
  g.bezierCurveTo(-36, -70, -10, -76, 30, -76); g.bezierCurveTo(70, -76, 92, -60, 112, -36); g.bezierCurveTo(140, -32, 150, -20, 152, 0); g.lineTo(152, 20); g.closePath(); g.fill();
  g.fillStyle = 'rgba(10,20,40,0.6)'; g.beginPath(); g.moveTo(-44, -36); g.bezierCurveTo(-26, -62, -6, -66, 20, -66); g.lineTo(20, -36); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(32, -66); g.bezierCurveTo(62, -66, 80, -54, 96, -36); g.lineTo(32, -36); g.closePath(); g.fill();
  for (const wx of [-92, 96]) { g.beginPath(); g.arc(wx, 20, 28, 0, 7); g.fillStyle = '#1a1f2b'; g.fill(); g.beginPath(); g.arc(wx, 20, 11, 0, 7); g.fillStyle = '#aab'; g.fill(); }
  g.restore();
}
function explosion(x, y, d, s = 1) {      // d: 爆発からの経過秒
  if (d < 0 || d > 1.6) return;
  g.save(); g.translate(x, y); g.scale(s, s);
  const a = 1 - d / 1.6;
  // 水柱
  g.globalAlpha = a; g.fillStyle = 'rgba(235,245,255,0.9)';
  const hcol = 520 * eOut(clamp(d / 0.5));
  g.beginPath(); g.moveTo(-60, 0); g.bezierCurveTo(-70, -hcol * 0.5, -40, -hcol, 0, -hcol); g.bezierCurveTo(40, -hcol, 70, -hcol * 0.5, 60, 0); g.closePath(); g.fill();
  // 火球
  const r = 40 + 200 * eOut(clamp(d / 0.35));
  const gr = g.createRadialGradient(0, -30, 0, 0, -30, r); gr.addColorStop(0, `rgba(255,250,210,${a})`); gr.addColorStop(0.4, `rgba(255,170,60,${a * 0.9})`); gr.addColorStop(1, 'rgba(255,80,30,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(0, -30, r, 0, 7); g.fill();
  // 衝撃波リング
  g.globalAlpha = a * 0.7; g.strokeStyle = '#fff'; g.lineWidth = 6;
  g.beginPath(); g.ellipse(0, 0, 60 + d * 700, 12 + d * 120, 0, 0, 7); g.stroke();
  g.restore();
}
function burstStar(x, y, r, col, rot = 0) {    // ギザギザの吹き出し
  g.save(); g.translate(x, y); g.rotate(rot); g.beginPath();
  for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2, rr = i % 2 ? r * 0.78 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 0.62); }
  g.closePath(); g.fillStyle = col; g.fill(); g.lineWidth = 8; g.strokeStyle = '#000'; g.stroke(); g.restore();
}
// 吹き出し付きのスタンプ文字
function stamp(p, x, y, s, size, col = C.gold, bg = C.red, rot = -0.08, r = 230) {
  slam(p, x, y, () => { burstStar(x, y, r, bg, rot); g.save(); g.translate(x, y); g.rotate(rot); text(s, 0, 0, { size, fam: 'Dela', color: col, stroke: '#000', strokeW: 14, maxW: r * 1.6 }); g.restore(); }, 2.6);
}

// ---------- 共通パーツ ----------
function countdown(n, a) {               // 上部のランキング表示
  fade(a, () => {
    rr(50, 86, 520, 66, 33); g.fillStyle = 'rgba(0,0,0,0.5)'; g.fill(); g.strokeStyle = 'rgba(255,201,60,0.7)'; g.lineWidth = 2; g.stroke();
    text('旧日本軍 すごい技術ランキング', 310, 120, { size: 31, color: C.gold });
    for (let k = 5; k >= 1; k--) {
      const x = 640 + (5 - k) * 82, cur = k === n, done = k > n;
      g.beginPath(); g.arc(x, 119, cur ? 34 : 25, 0, 7); g.fillStyle = cur ? C.red : done ? 'rgba(255,201,60,0.85)' : 'rgba(255,255,255,0.1)'; g.fill();
      if (cur) { g.lineWidth = 4; g.strokeStyle = '#fff'; g.stroke(); }
      text(String(k), x, 121, { size: cur ? 40 : 28, fam: 'Dela', color: done ? '#2a1d00' : cur ? '#fff' : C.dim });
    }
  });
}
// 「第N位」を中央に叩きつけ、読み終わったら上部へ移動する。戻り値は移動の進み具合(0→1)
function rankHead(sc, lt, n, name, col, t) {
  const s0 = cs(sc, 0), e0 = ce(sc, 0);
  const pIn = prog(lt, s0 - 0.04, 0.2), m = eIO(prog(lt, e0 + 0.12, 0.42));
  if (pIn <= 0) return 0;
  if (m < 1) fade((1 - m) * clamp(pIn * 2), () => { sunburst(540, 720, n === 1 ? 0.26 : 0.14, t * 0.4, n === 1 ? C.gold : '#fff'); });
  const ry = lerp(600, 236, m), size = lerp(300, 112, m);
  slam(pIn, 540, ry, () => {
    const w1 = measure('第', size * 0.62), w2 = measure(String(n), size, 'Dela'), w3 = measure('位', size * 0.62), x0 = 540 - (w1 + w2 + w3 + 16) / 2;
    const sw = lerp(26, 14, m);
    text('第', x0, ry + size * 0.1, { size: size * 0.62, align: 'left', color: '#fff', stroke: '#000', strokeW: sw });
    text(String(n), x0 + w1 + 8, ry, { size, fam: 'Dela', align: 'left', color: col, stroke: '#000', strokeW: sw * 1.2 });
    text('位', x0 + w1 + w2 + 16, ry + size * 0.1, { size: size * 0.62, align: 'left', color: '#fff', stroke: '#000', strokeW: sw });
  }, 2.6, -0.05 * (1 - m));
  const nIn = prog(lt, s0 + (e0 - s0) * 0.4, 0.2);

// 字幕: 話す速さに合わせて文字が出て、強調語は金色で弾む
function wrap(s, maxW, size) {
  const lines = []; let cur = '';
  for (const ch of s) {
    if (measure(cur + ch, size) > maxW && cur && !'、。!?」'.includes(ch)) { lines.push(cur); cur = ch; } else cur += ch;
  }
  if (cur) lines.push(cur);
  if (lines.length === 2) {
    let best = null;
    for (let k = 3; k <= s.length - 3; k++) {
      const ch = s[k - 1]; if (!'、。をはがにもで」'.includes(ch) || '、。!?」'.includes(s[k])) continue;
      const m = Math.max(measure(s.slice(0, k), size), measure(s.slice(k), size)) + ('、。」'.includes(ch) ? 0 : 60);
      if (m <= maxW + 60 && (!best || m < best.m)) best = { m, k };
    }
    if (best) return [s.slice(0, best.k), s.slice(best.k)];
  }
  return lines;
}
function caption(t, sc, si) {
  const ci = sc.cues.findIndex(c => t >= c.start - 0.05 && t < c.end + 0.3); if (ci < 0) return;
  const c = sc.cues[ci];
  if (c.sfx === 'rank' || (sc.id === 'hook' && ci === 1)) return;   // 画面に大きく出ている行は字幕を出さない
  const a = Math.min(prog(t, c.start - 0.05, 0.1), 1 - prog(t, c.end + 0.18, 0.12));
  const size = 66, lh = 92, plain = c.text.replace('/', ''), N = [...plain].length;
  const rd = Math.max(0.45, (c.end - c.start) * 0.62);
  const shown = Math.floor(N * clamp((t - c.start + 0.08) / rd)) + 1;
  const hi = c.hl ? [...plain.slice(0, Math.max(0, plain.indexOf(c.hl)))].length - (plain.indexOf(c.hl) < 0 ? 1e9 : 0) : -1, hl = c.hl ? [...c.hl].length : 0;
  const lines = c.text.includes('/') ? c.text.split('/') : wrap(c.text, 960, size), y0 = 1452 - (lines.length - 1) * lh / 2;
  g.save(); g.globalAlpha = a;
  const gr = g.createLinearGradient(0, y0 - 130, 0, y0 + lines.length * lh + 60);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.3, 'rgba(0,0,0,0.5)'); gr.addColorStop(0.75, 'rgba(0,0,0,0.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, y0 - 130, W, lines.length * lh + 190);
  let k = 0;
  lines.forEach((ln, li) => {
    const y = y0 + li * lh; let x = 540 - measure(ln, size) / 2;
    for (const ch of ln) {
      const w = measure(ch, size);
      if (k < shown) {
        const isH = k >= hi && k < hi + hl && hi >= 0;
        const tk = c.start - 0.08 + rd * k / N, d = t - tk;
        const s = isH ? 1 + 0.45 * Math.exp(-d * 9) : 1 + 0.25 * Math.exp(-d * 18);
        g.save(); g.translate(x + w / 2, y); g.scale(s, s);
        text(ch, 0, 0, { size, color: isH ? C.gold : '#fff', stroke: '#000', strokeW: 15 });
        g.restore();
      }
      x += w; k++;
    }
  });
  g.restore();
}

  for (let i = 0; i < 26; i++) { const tw = Math.sin(t * (3 + rnd(i) * 3) + i * 9); if (tw < 0.6) continue;
    const x = rnd(i + 1) * W, y = 420 + rnd(i + 2) * 900, s = (tw - 0.6) * 30;
    g.save(); g.translate(x, y); g.rotate(Math.PI / 4); g.fillStyle = 'rgba(255,225,130,0.8)'; g.fillRect(-s / 2, -2, s, 4); g.fillRect(-2, -s / 2, 4, s); g.restore(); }
  const c1 = cs(sc, 1), c2 = cs(sc, 2), c3 = cs(sc, 3), hitT = c3 + SFX_OFF.hit;
  const m = rankHead(sc, lt, 1, '酸素魚雷', C.gold, t);
  countdown(1, m);
  if (m <= 0) return;
  // 射程レース
  const lanesA = 1 - prog(lt, c3 - 0.1, 0.3);
  const lane = (y, label, km, col, p, bubbles, glow) => {
    const x0 = 100, full = 880, x = x0 + full * (km / 40) * p;
    text(label, x0, y - 62, { size: 38, align: 'left', color: bubbles ? C.mute : '#fff', stroke: '#000', strokeW: 8 });
    g.fillStyle = 'rgba(255,255,255,0.1)'; g.fillRect(x0, y + 40, full, 4);
    for (let k = 0; k <= 4; k++) { g.fillRect(x0 + full * k / 4 - 1, y + 34, 2, 16); text(k * 10 + 'km', x0 + full * k / 4, y + 72, { size: 24, color: C.dim, weight: 700 }); }
    if (bubbles) {
      for (let i = 0; i < 44; i++) { const bx = x0 + (x - x0 - 170) * (i / 44); if (bx < x0) continue;
        g.beginPath(); g.arc(bx, y + (rnd(i) - 0.5) * 30, 6 + rnd(i + 7) * 8, 0, 7); g.fillStyle = `rgba(255,255,255,${0.35 + rnd(i + 2) * 0.35})`; g.fill(); }
    }
    if (glow > 0) fade(glow, () => { rr(x0 - 16, y - 30, Math.max(0, x - x0 - 150), 60, 30); g.setLineDash([12, 10]); g.strokeStyle = C.gold; g.lineWidth = 4; g.stroke(); g.setLineDash([]); });
    torpedo(Math.max(x, x0 + 170), y, 170, col);
    if (p >= 1) text(km + 'km', 980, y - 62, { size: 52, fam: 'Dela', align: 'right', color: bubbles ? C.mute : C.gold, stroke: '#000', strokeW: 10 });
  };
  fade(lanesA * clamp(m * 2), () => {
    const pr = eIO(prog(lt, c1 - 0.2, 1.5));
    lane(560, '九三式酸素魚雷(日)', 40, '#F4F6FB', pr, false, prog(lt, c2 + 0.3, 0.3));
    lane(790, 'Mk15(米)', 13.7, '#7C8BAA', eIO(prog(lt, c1 - 0.2, 0.7)), true, 0);
  });
  fade(lanesA * (1 - prog(lt, c2 - 0.1, 0.2)), () => stamp(prog(lt, c1 + 0.9, 0.2), 540, 1080, '約3倍!', 120, C.gold, C.red, -0.07, 240));
  fade(lanesA, () => stamp(prog(lt, c2 + 0.5, 0.2), 540, 1080, '航跡ほぼゼロ', 86, '#fff', '#1b4fae', 0.05, 260));
  // 見えない魚雷が命中する
  if (lt > c3 - 0.1) {
    const a = prog(lt, c3 - 0.1, 0.3), d = lt - hitT;
    fade(a, () => {
      const tilt = d > 0 ? Math.min(0.06, d * 0.05) : 0;
      g.save(); g.translate(700, 900); g.rotate(tilt); g.translate(-700, -900);
      battleship(700, 900 + (d > 0 ? d * 14 : 0), 0.62, '#4A556E', null); g.restore();
      sea(912, t);
      // ほぼ見えない雷跡(細い波紋だけ)
      if (d < 0) { const x = lerp(80, 640, clamp((lt - c3) / SFX_OFF.hit));
        for (let k = 0; k < 4; k++) { g.beginPath(); g.ellipse(x - k * 60, 940, 20 + k * 6, 4, 0, 0, 7); g.strokeStyle = `rgba(255,255,255,${0.12 - k * 0.025})`; g.lineWidth = 2; g.stroke(); } }
      explosion(660, 925, d, 1);
      if (d > 0.4) { const b = Math.sin(t * 14) * 6;
        slam(prog(d, 0.4, 0.2), 360, 640, () => text('!?', 360, 640 + b, { size: 170, fam: 'Dela', color: C.red, stroke: '#fff', strokeW: 16 }), 2);
        slam(prog(d, 0.7, 0.2), 300, 1110, () => text('どこから?', 300, 1110, { size: 76, fam: 'Dela', color: '#fff', stroke: '#000', strokeW: 14 }), 2);
      }
    });
  }
  note('※九三式:36ノットで約40km、Mk15:26.5ノットで約13.7km(概数)', m);
};

S.outro = (lt, sc, t) => {
  const c1 = cs(sc, 1), e0 = ce(sc, 0);
  // 前半: 5 つの技術 → それでも負けた
  if (lt < c1 - 0.05) {
    background(t, 'rgba(240,69,58,0.20)');
    const gray = prog(lt, e0 - 1.0, 0.4);
    const items = [['5', '零戦'], ['4', '空母機動部隊'], ['3', '伊400型'], ['2', '戦艦大和'], ['1', '酸素魚雷']];
    items.forEach((it, i) => pop(prog(lt, 0.05 + i * 0.1, 0.3), 540, 480 + i * 132, () => {
      const y = 480 + i * 132;
      rr(140, y - 54, 800, 108, 24); g.fillStyle = gray > 0 ? `rgba(${lerp(60, 40, gray)},${lerp(70, 40, gray)},${lerp(110, 45, gray)},0.9)` : 'rgba(60,70,110,0.9)'; g.fill();
      g.beginPath(); g.arc(210, y, 38, 0, 7); g.fillStyle = gray > 0.5 ? '#555' : (it[0] === '1' ? C.gold : C.red); g.fill();
      text(it[0], 210, y + 2, { size: 44, fam: 'Dela', color: it[0] === '1' && gray <= 0.5 ? '#1b1403' : '#fff' });
      text(it[1], 280, y, { size: 56, fam: 'Dela', align: 'left', color: gray > 0.5 ? '#888' : '#fff' });
    }));
    stamp(prog(lt, e0 - 0.75, 0.2), 540, 760, '日本は負けた', 110, '#fff', '#B2221A', -0.08, 330);
    return;
  }
  // 後半: 答えは数字にある → 次の動画へ
  const u = lt - c1;
  background(t, 'rgba(80,140,255,0.22)');
  g.save(); g.globalAlpha = 0.16;
  for (let i = 0; i < 40; i++) { const x = rnd(i) * W, y = ((rnd(i + 5) * H + t * (300 + rnd(i + 9) * 400)) % (H + 200)) - 100;
    text(String(Math.floor(rnd(i + Math.floor(t * 4)) * 10)), x, y, { size: 50 + rnd(i + 3) * 70, fam: 'Dela', color: '#9cc3ff' }); }
  g.restore();
  slam(prog(u, 0, 0.2), 540, 470, () => text('なぜ負けた?', 540, 470, { size: 130, fam: 'Dela', color: '#fff', stroke: '#000', strokeW: 20 }), 2);
  slam(prog(u, 0.8, 0.22), 540, 720, () => { g.save(); g.translate(540, 720); g.rotate(-0.05); text('答えは「数字」', 0, 0, { size: 140, fam: 'Dela', color: C.gold, stroke: '#000', strokeW: 22, maxW: 1000 }); g.restore(); }, 2.4);
  pop(prog(u, 1.6, 0.4), 540, 1010, () => {
    const pulse = 1 + 0.03 * Math.sin(t * 7);
    g.save(); g.translate(540, 1010); g.scale(pulse, pulse); g.translate(-540, -1010);
    rr(110, 900, 860, 220, 34); g.fillStyle = C.red; g.fill(); g.lineWidth = 6; g.strokeStyle = '#fff'; g.stroke();
    text('次回', 220, 960, { size: 40, color: C.gold });
    text('日米の戦力差を数字で比較', 560, 1030, { size: 58, fam: 'Dela', color: '#fff', maxW: 760 });
    // 小さな棒グラフアイコン
    [[0, 30], [1, 60], [2, 100]].forEach(([k, h]) => { g.fillStyle = k === 2 ? '#7FB4FF' : '#fff'; g.fillRect(150 + k * 26, 1080 - h, 18, h); });
    g.restore();
  });
  rise(prog(u, 2.1, 0.4), () => text('▼ フォローして見逃さないで', 540, 1220, { size: 50, color: '#fff', stroke: '#000', strokeW: 10 }), 20);
  text('ナレーション VOICEVOX:青山龍星 / BGM・効果音:オリジナル / 数値は概数', 540, 1712, { size: 26, color: C.mute, weight: 500, maxW: 980 });
};

// ---------- カメラ(セリフや衝撃に合わせたズームと揺れ) ----------
const EV = [];
TL.scenes.forEach(s => s.cues.forEach(c => EV.push({ t: c.start + (SFX_OFF[c.sfx] || 0), k: c.sfx })));
EV.sort((a, b) => a.t - b.t);
const ZOOM = { rank: 0.10, boom: 0.06, fire: 0.08, hit: 0.09, pop: 0.045, ping: 0.03, none: 0.025 };
const SHAKE = { rank: 22, boom: 16, fire: 34, hit: 38 };
const FLASH = { rank: ['255,255,255', 0.55], boom: ['255,255,255', 0.35], fire: ['255,200,120', 0.6], hit: ['255,210,140', 0.6] };
function camera(t) {
  let e = null; for (const x of EV) { if (x.t <= t) e = x; else break; }
  if (!e) return { z: 1, x: 0, y: 0, f: null };
  const d = t - e.t, A = (SHAKE[e.k] || 0) * Math.exp(-d * 9);
  return { z: 1 + (ZOOM[e.k] || 0) * Math.exp(-d * 6), x: A * Math.sin(d * 73), y: A * Math.cos(d * 59),
           f: FLASH[e.k] ? [FLASH[e.k][0], FLASH[e.k][1] * Math.exp(-d * 13)] : null };
}

function render(t) {
  t = clamp(t, 0, TL.duration - 1e-3);
  let si = TL.scenes.findIndex(s => t < s.end); if (si < 0) si = TL.scenes.length - 1;
  const sc = TL.scenes[si], lt = t - sc.start;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const cam = camera(t);
  g.save(); g.translate(540 + cam.x, 900 + cam.y); g.scale(cam.z, cam.z); g.translate(-540, -900);
  S[sc.id](lt, sc, t);
  g.restore();
  vignette();
  caption(t, sc, si);
  if (cam.f && cam.f[1] > 0.01) { g.fillStyle = `rgba(${cam.f[0]},${cam.f[1]})`; g.fillRect(0, 0, W, H); }
  // シーン切り替えのワイプ(赤と黒の帯が斜めに走る)
  if (si > 0 && lt < 0.45) {
    const p = eIO(prog(lt, 0, 0.45));
    [[C.red, 0, 760], ['#000', 0.1, 520]].forEach(([col, dl, bw]) => {
      const x = lerp(W + 500, -bw - 700, clamp(p * 1.15 - dl));
      g.fillStyle = col; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + bw, 0); g.lineTo(x + bw - 500, H); g.lineTo(x - 500, H); g.closePath(); g.fill();
    });
  }
  const out = prog(t, TL.duration - 0.4, 0.4); if (out > 0) { g.fillStyle = `rgba(0,0,0,${out})`; g.fillRect(0, 0, W, H); }
  g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(0, H - 10, W, 10); g.fillStyle = C.red; g.fillRect(0, H - 10, W * t / TL.duration, 10);
}
window.render = render;

Promise.all([document.fonts.load('100px "Dela"'), document.fonts.load('900 50px "Noto"'), document.fonts.load('500 50px "Noto"'), document.fonts.load('700 50px "Noto"')]).then(() => {
  window.READY = true;
  if (location.search.includes('capture')) return;
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % TL.duration); requestAnimationFrame(loop); })();
});
</script>
