<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Kyushu Univ Top10</title>
<style>
  @font-face { font-family: 'MR'; src: url('fonts/MPLUSRounded1c-Black.ttf'); font-weight: 900; }
  @font-face { font-family: 'MR'; src: url('fonts/MPLUSRounded1c-ExtraBold.ttf'); font-weight: 800; }
  @font-face { font-family: 'MR'; src: url('fonts/MPLUSRounded1c-Bold.ttf'); font-weight: 700; }
  html,body{margin:0;background:#2a0a14;}
  canvas{display:block;max-height:100vh;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
// ------------------------------------------------------------
// 九州大学のここがすごい！10選(9:16 ショート)
// render(t) は時刻 t[秒] のフレームを決定論的に描画する。尺は timeline.js(voice.py が生成)
// ------------------------------------------------------------
const W = 1080, H = 1920, FPS = 30;
const TL = window.TIMELINE, DURATION = TL.total;
window.FPS = FPS; window.DURATION = DURATION;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const F = (w, s) => `${w} ${s}px MR, "IPAGothic", sans-serif`;
const C = {
  wine: '#7B1E3A', wineDk: '#3A0C1C', wineLt: '#A33457',
  cream: '#FFF7EF', ink: '#3A0C1C', gold: '#FFC94A', goldDk: '#E09A12',
  white: '#FFFFFF', sky: '#4AA8E8', green: '#4CB86B', gray: '#C9B8BE'
};

// ---------- 補助 ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, s, d) => clamp((t - s) / d);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = x => { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function hash(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

function txt(s, x, y, { size = 60, w = 900, color = C.white, align = 'center', alpha = 1, stroke = 0, strokeColor = C.wineDk, base = 'alphabetic', ls = 0 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha;
  ctx.font = F(w, size); ctx.textAlign = align; ctx.textBaseline = base;
  if (ls) ctx.letterSpacing = ls + 'px';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fillRR(x, y, w, h, r, color, alpha = 1) { ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; rr(x, y, w, h, r); ctx.fill(); ctx.restore(); }
function circle(x, y, r, color, alpha = 1) { ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
function withT(x, y, s, rot, fn) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(s, s); fn(); ctx.restore(); }
// 幅に収まるように折り返す
function wrap(s, maxW, size, w = 800) {
  ctx.font = F(w, size);
  const lines = []; let cur = '';
  for (const ch of s) {
    if (ctx.measureText(cur + ch).width > maxW && cur) {
      // 句読点・閉じ括弧は行頭に来ないよう前の行へ
      if ('、。！？)」・'.includes(ch)) { cur += ch; lines.push(cur); cur = ''; continue; }
      lines.push(cur); cur = ch;
    } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ---------- 背景 ----------
function background(t, gold) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, gold ? '#8A2442' : C.wine); g.addColorStop(1, C.wineDk);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 流れる斜めストライプ
  ctx.save(); ctx.globalAlpha = 0.06; ctx.fillStyle = C.white;
  const off = (t * 60) % 160;
  ctx.translate(W / 2, H / 2); ctx.rotate(-Math.PI / 5);
  for (let x = -1800; x < 1800; x += 160) ctx.fillRect(x + off, -1800, 60, 3600);
  ctx.restore();
  // 浮遊する粒
  for (let i = 0; i < 26; i++) {
    const x = hash(i) * W, sp = 20 + hash(i + 50) * 50;
    const y = H - ((t * sp + hash(i + 99) * H) % (H + 100));
    circle(x, y, 4 + hash(i + 7) * 9, gold ? C.gold : C.white, 0.10 + hash(i + 3) * 0.12);
  }
}

// ---------- 共通 UI ----------
function header(t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  fillRR(150, 236, 780, 96, 48, C.cream);
  txt('九州大学のここがすごい！', 540, 302, { size: 50, w: 900, color: C.wine });
  ctx.restore();
}
function progress(rank, p) {
  const n = 10, gap = 76, x0 = 540 - gap * (n - 1) / 2, y = 392;
  for (let i = 0; i < n; i++) {
    const r = 10 - i, x = x0 + i * gap;
    const done = r > rank, cur = r === rank;
    const s = cur ? lerp(1, 1.35, easeBack(p)) : 1;
    circle(x, y, 26 * s, cur ? C.gold : done ? C.wineLt : 'rgba(255,255,255,0.18)');
    txt(String(r), x, y + 1, { size: cur ? 30 : 26, w: 900, base: 'middle', color: cur ? C.wineDk : done ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.55)' });
  }
}
function subtitle(sc, t) {
  const a = seg(t, sc.vs - 0.05, 0.12) * (1 - seg(t, sc.start + sc.dur - 0.08, 0.08));
  if (a <= 0) return;
  const lines = wrap(sc.sub, 940, 54);
  const lh = 72, y0 = sc.kind === 'rank' ? 1500 : 1540;
  ctx.save(); ctx.globalAlpha = a;
  fillRR(40, y0 - 64, 1000, lines.length * lh + 40, 28, 'rgba(30,6,14,0.55)');
  lines.forEach((l, i) => txt(l, 540, y0 + i * lh, { size: 54, w: 800, stroke: 12, strokeColor: C.wineDk }));
  ctx.restore();
}

// ---------- イラスト(カード中央 cx, cy を原点として描く) ----------
const ICON = {
  oled(p, t) { // 光る有機ELパネル
    const q = easeBack(seg(p, 0, 0.35));
    withT(0, 0, q, -0.04, () => {
      ctx.save(); ctx.shadowColor = 'rgba(90,170,255,0.9)'; ctx.shadowBlur = 50 + 20 * Math.sin(t * 4);
      fillRR(-230, -150, 460, 290, 30, '#1C1B2A'); ctx.restore();
      ctx.save(); rr(-210, -130, 420, 250, 18); ctx.clip();
      const g = ctx.createLinearGradient(-210 + Math.sin(t) * 80, 0, 210 + Math.sin(t) * 80, 0);
      g.addColorStop(0, '#3D7BFF'); g.addColorStop(0.5, '#2EE6A8'); g.addColorStop(1, '#FF5FA2');
      ctx.globalAlpha = 0.25 + 0.75 * easeOut(seg(p, 0.15, 0.4)); ctx.fillStyle = g; ctx.fillRect(-210, -130, 420, 250);
      ctx.restore();
    });
    for (let i = 0; i < 5; i++) { const k = (t * 1.2 + i / 5) % 1, a = Math.sin(k * Math.PI);
      withT(-280 + hash(i) * 560, -170 + hash(i + 4) * 300, a, k * 3, () => { ctx.fillStyle = C.gold; ctx.beginPath(); for (let j = 0; j < 8; j++) { const r = j % 2 ? 6 : 22, an = j / 8 * Math.PI * 2; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } ctx.fill(); }); }
  },
  silkworm(p, t) { // 桑の葉の上のカイコ
    const q = easeBack(seg(p, 0, 0.35));
    withT(0, 10, q, -0.12, () => { ctx.fillStyle = C.green; ctx.beginPath(); ctx.ellipse(0, 0, 290, 95, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#3A9455'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(-290, 0); ctx.lineTo(290, 0); ctx.stroke(); });
    for (let w = 0; w < 3; w++) {
      const g = easeBack(seg(p, 0.15 + w * 0.12, 0.3)), ox = -170 + w * 170, oy = -30 + (w % 2) * 40;
      withT(ox, oy, g * 0.75, 0, () => {
        for (let i = 7; i >= 0; i--) { const x = -i * 30 + 100, y = Math.sin(t * 6 - i * 0.8 + w) * 10; circle(x, y, i === 0 ? 30 : 26 - i, '#F4EDE2'); ctx.strokeStyle = '#D8CBB8'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, i === 0 ? 30 : 26 - i, 0, Math.PI * 2); ctx.stroke(); }
        circle(112, Math.sin(t * 6 + w) * 10 - 6, 5, C.ink);
      });
    }
  },
  plane(p, t) { // 建設中の建物と墜落する機体
    const q = easeOut(seg(p, 0, 0.4));
    ctx.save(); ctx.globalAlpha = q;
    ctx.strokeStyle = '#8D7F86'; ctx.lineWidth = 8;
    for (let x = 0; x <= 4; x++) { ctx.beginPath(); ctx.moveTo(-60 + x * 75, 150); ctx.lineTo(-60 + x * 75, -60); ctx.stroke(); }
    for (let y = 0; y <= 3; y++) { ctx.beginPath(); ctx.moveTo(-60, 150 - y * 70); ctx.lineTo(240, 150 - y * 70); ctx.stroke(); }
    ctx.restore();
    const d = easeOut(seg(p, 0.1, 0.45));
    const px = lerp(-330, 60, d), py = lerp(-200, -70, d);
    for (let i = 0; i < 7; i++) { const k = i / 7; circle(lerp(-360, px, k), lerp(-215, py, k) - 6, 10 + k * 22, '#9A8F95', 0.18 + 0.35 * k * d); }
    withT(px, py, 1, 0.33, () => {
      ctx.fillStyle = '#4A4F5C';
      ctx.beginPath(); ctx.moveTo(110, 0); ctx.lineTo(-90, -16); ctx.lineTo(-110, 0); ctx.lineTo(-90, 16); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-40, -80); ctx.lineTo(-60, -80); ctx.lineTo(-30, 0); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-80, 0); ctx.lineTo(-105, -40); ctx.lineTo(-115, -40); ctx.lineTo(-100, 0); ctx.closePath(); ctx.fill();
    });
    const imp = seg(p, 0.55, 0.15);
    if (imp > 0) for (let i = 0; i < 6; i++) circle(80 + Math.cos(i) * 60 * imp, -40 + Math.sin(i * 2) * 40 * imp, 30 * imp, '#B4A9AE', 0.5 * (1 - seg(p, 0.8, 0.2)));
  },
  sword(p, t) { // 金の文字が浮かぶ古代の大刀
    const q = easeBack(seg(p, 0, 0.35));
    withT(0, 0, q, -0.18, () => {
      ctx.save(); ctx.shadowColor = 'rgba(255,201,74,0.9)'; ctx.shadowBlur = 30 + 20 * Math.sin(t * 5);
      const g = ctx.createLinearGradient(0, -30, 0, 30); g.addColorStop(0, '#C9CED6'); g.addColorStop(0.5, '#8C93A0'); g.addColorStop(1, '#5D6370');
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-230, -26); ctx.lineTo(300, -26); ctx.lineTo(340, 0); ctx.lineTo(300, 22); ctx.lineTo(-230, 22); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.fillStyle = C.goldDk; ctx.fillRect(-250, -46, 24, 88);
      fillRR(-350, -20, 100, 40, 12, '#6B3A22');
      circle(-370, 0, 28, C.gold); circle(-370, 0, 14, '#6B3A22');
      // 象嵌の 19 文字(点で表現)が左から光る
      const n = Math.floor(19 * seg(p, 0.3, 0.7));
      for (let i = 0; i < n; i++) circle(-190 + i * 25, -2, 7, C.gold);
    });
    for (let i = 0; i < 6; i++) { const k = (t * 0.9 + i / 6) % 1, a = Math.sin(k * Math.PI) * seg(p, 0.3, 0.3);
      withT(-300 + hash(i + 20) * 600, -150 + hash(i + 30) * 260, a, 0, () => { ctx.fillStyle = C.gold; ctx.beginPath(); for (let j = 0; j < 8; j++) { const r = j % 2 ? 5 : 20, an = j / 8 * Math.PI * 2; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } ctx.fill(); }); }
  },
  blocks(p, t) { // 12 個のブロック(学部)が積み上がる
    for (let i = 0; i < 12; i++) {
      const col = i % 4, row = Math.floor(i / 4);
      const q = easeBack(seg(p, i * 0.05, 0.25));
      const x = -195 + col * 130, y = -120 + row * 92;
      withT(x + 55, y + 38, q, 0, () => fillRR(-55, -38, 110, 76, 16, [C.wine, C.wineLt, C.goldDk, C.sky][(i + row) % 4]));
    }
  },
  gear(p, t) { // 歯車 × ペン先
    const q = easeBack(seg(p, 0, 0.35));
    withT(-90, 0, q, t * 1.2, () => {
      ctx.fillStyle = C.wine; ctx.beginPath();
      for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; ctx.save(); ctx.rotate(a); ctx.fillRect(-18, -122, 36, 40); ctx.restore(); }
      ctx.arc(0, 0, 92, 0, Math.PI * 2); ctx.fill(); circle(0, 0, 38, C.cream);
    });
    withT(110, 10, easeBack(seg(p, 0.15, 0.35)), -0.5 + Math.sin(t * 3) * 0.08, () => {
      ctx.fillStyle = C.goldDk; ctx.beginPath(); ctx.moveTo(0, 130); ctx.lineTo(-48, 10); ctx.lineTo(-48, -120); ctx.lineTo(48, -120); ctx.lineTo(48, 10); ctx.closePath(); ctx.fill();
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(0, 130); ctx.lineTo(-22, 75); ctx.lineTo(22, 75); ctx.closePath(); ctx.fill();
      fillRR(-48, -150, 96, 40, 10, C.wine);
    });
  },
  forest(p, t) { // 雪の積もった森(北海道)
    fillRR(-330, 40, 660, 120, 30, '#EAF3FA');
    for (let i = 0; i < 6; i++) {
      const g = easeBack(seg(p, i * 0.06, 0.3)), x = -270 + i * 108, h = 150 + (i % 3) * 30;
      withT(x, 100, g, Math.sin(t * 2 + i) * 0.03, () => {
        ctx.fillStyle = '#7A4E2D'; ctx.fillRect(-9, -20, 18, 30);
        ctx.fillStyle = '#2F7D4E'; ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(-52, -16); ctx.lineTo(52, -16); ctx.closePath(); ctx.fill();
        ctx.fillStyle = C.white; ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(-18, -h + 40); ctx.lineTo(18, -h + 40); ctx.closePath(); ctx.fill();
      });
    }
    for (let i = 0; i < 24; i++) { const x = -320 + hash(i) * 640, y = -170 + ((t * 60 + hash(i + 3) * 330) % 330); circle(x + Math.sin(t * 2 + i) * 8, y, 5 + hash(i + 8) * 4, C.sky, 0.55); }
  },
  boar(p, t) { // 走るイノシシ
    const q = easeBack(seg(p, 0, 0.3)), run = Math.sin(t * 18);
    for (let i = 0; i < 4; i++) { const k = ((t * 1.6 + i * 0.25) % 1); circle(170 + k * 160, 90 - k * 30, 14 + k * 26, '#D8C3A5', 0.6 * (1 - k)); }
    withT(-10, 10 + Math.abs(run) * -10, q, 0, () => {
      ctx.fillStyle = '#5B4030';
      for (const [x, ph] of [[-90, 1], [-40, -1], [50, -1], [100, 1]]) { ctx.save(); ctx.translate(x, 60); ctx.rotate(run * 0.45 * ph); ctx.fillRect(-11, 0, 22, 62); ctx.restore(); }
      ctx.fillStyle = '#7A5640'; ctx.beginPath(); ctx.ellipse(0, 20, 150, 82, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-150, 10, 70, 58, -0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5B4030'; ctx.beginPath(); ctx.moveTo(-140, -50); ctx.lineTo(-115, -95); ctx.lineTo(-100, -40); ctx.closePath(); ctx.fill();
      fillRR(-245, -2, 50, 44, 18, '#C98F78'); circle(-230, 20, 6, C.ink); circle(-212, 20, 6, C.ink);
      ctx.fillStyle = C.white; ctx.beginPath(); ctx.moveTo(-200, 45); ctx.lineTo(-215, 75); ctx.lineTo(-190, 50); ctx.closePath(); ctx.fill();
      circle(-160, -10, 10, C.ink);
      ctx.fillStyle = '#5B4030'; for (let i = 0; i < 6; i++) ctx.fillRect(-80 + i * 32, -66, 12, 26);
    });
    const a = easeBack(seg(p, 0.25, 0.3));
    withT(250, -120, a * (1 + 0.1 * Math.max(0, Math.sin(t * 10))), 0, () => {
      ctx.fillStyle = C.gold; ctx.beginPath(); ctx.moveTo(0, -70); ctx.lineTo(70, 55); ctx.lineTo(-70, 55); ctx.closePath(); ctx.fill();
      txt('!', 0, 42, { size: 96, w: 900, color: C.wineDk });
    });
  },
  water(p, t) { // 砂漠に水路が伸び、緑が広がる
    const q = easeOut(seg(p, 0, 0.6));
    fillRR(-330, -150, 660, 300, 30, '#E9C98F');
    ctx.save(); rr(-330, -150, 660, 300, 30); ctx.clip();
    // 緑
    for (let i = 0; i < 14; i++) {
      const x = -300 + i * 46, g = easeBack(seg(p, 0.35 + i * 0.025, 0.25));
      withT(x, -60 + (i % 2) * 150, g, 0, () => { circle(0, 0, 26, C.green); circle(14, -12, 18, '#62CF80'); });
    }
    ctx.fillStyle = C.sky; ctx.fillRect(-330, -18, 660 * q, 40);
    ctx.globalAlpha = 0.6; ctx.fillStyle = C.white;
    for (let i = 0; i < 8; i++) { const x = -330 + ((t * 160 + i * 90) % 700); if (x < -330 + 660 * q) ctx.fillRect(x, -6, 34, 6); }
    ctx.restore();
  },
  wind(p, t) { // 風レンズ風車:リング(集風体)+回る羽根
    const q = easeBack(seg(p, 0, 0.35));
    withT(0, -10, q, 0, () => {
      for (let i = 0; i < 5; i++) { // 風の線
        const y = -110 + i * 55, x = -330 + ((t * 420 + i * 130) % 260);
        ctx.strokeStyle = C.sky; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 70, y + (0 - y) * 0.25); ctx.stroke(); ctx.globalAlpha = 1;
      }
      ctx.fillStyle = C.gray; ctx.fillRect(-12, 40, 24, 170);
      ctx.save(); ctx.lineWidth = 34; ctx.strokeStyle = C.wine;
      ctx.beginPath(); ctx.ellipse(40, -20, 52, 150, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      withT(40, -20, 1, 0, () => { ctx.scale(0.32, 1); ctx.rotate(t * 7);
        ctx.fillStyle = C.goldDk;
        for (let i = 0; i < 3; i++) { ctx.rotate(Math.PI * 2 / 3); ctx.beginPath(); ctx.ellipse(0, -62, 18, 62, 0, 0, Math.PI * 2); ctx.fill(); }
      });
      circle(40, -20, 14, C.ink);
    });
  },
  hospital(p, t) { // 病院の十字 + 心拍
    const q = easeBack(seg(p, 0, 0.35)), beat = 1 + 0.06 * Math.max(0, Math.sin(t * 7));
    withT(-120, 0, q * beat, 0, () => { circle(0, 0, 130, C.wine); fillRR(-30, -85, 60, 170, 12, C.white); fillRR(-85, -30, 170, 60, 12, C.white); });
    const d = easeOut(seg(p, 0.2, 0.5));
    ctx.save(); ctx.strokeStyle = C.wineLt; ctx.lineWidth = 12; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath(); const pts = [[40, 0], [90, 0], [115, -70], [150, 80], [180, 0], [300, 0]];
    ctx.moveTo(...pts[0]); const n = d * (pts.length - 1);
    for (let i = 1; i <= Math.ceil(n); i++) { const k = Math.min(1, n - (i - 1)); ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)); }
    ctx.stroke(); ctx.restore();
  },
  hall(p, t) { // 大講堂(楕円形の建物 + 縦ルーバー)
    const q = easeOut(seg(p, 0, 0.5));
    ctx.save(); ctx.beginPath(); ctx.rect(-340, 150 - 300 * q, 680, 300 * q); ctx.clip();
    ctx.fillStyle = '#E9DCD2'; ctx.beginPath(); ctx.ellipse(0, 40, 300, 110, 0, Math.PI, 0); ctx.lineTo(300, 120); ctx.lineTo(-300, 120); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.wine; ctx.fillRect(-300, 0, 600, 120);
    ctx.fillStyle = C.cream; for (let x = -280; x < 290; x += 28) ctx.fillRect(x, 12, 10, 96);
    ctx.fillStyle = C.ink; ctx.fillRect(-330, 120, 660, 14);
    ctx.restore();
    for (let i = 0; i < 3; i++) { const g = easeBack(seg(p, 0.35 + i * 0.08, 0.25)); withT(-260 + i * 260, 140, g, 0, () => { circle(0, -24, 30, C.green); ctx.fillStyle = '#7A4E2D'; ctx.fillRect(-5, -2, 10, 24); }); }
    circle(230, -110, 34, C.gold, q);
  },
  globe(p, t) { // 地球 + CO2 → 0
    const q = easeBack(seg(p, 0, 0.35));
    withT(-140, 0, q, 0, () => {
      circle(0, 0, 130, C.sky);
      ctx.save(); ctx.beginPath(); ctx.arc(0, 0, 130, 0, Math.PI * 2); ctx.clip();
      const o = (t * 40) % 260;
      for (const [x, y, r] of [[-60, -40, 50], [30, 30, 60], [90, -70, 35], [-30, 80, 40]]) { circle(x + o - 130, y, r, C.green); circle(x + o + 130, y, r, C.green); }
      ctx.restore();
    });
    const a = seg(p, 0.25, 0.25);
    txt('CO₂', 150, -20, { size: 84, w: 900, color: C.ink, alpha: a });
    txt('→ 0', 150, 80, { size: 84, w: 900, color: C.green, alpha: seg(p, 0.45, 0.25) });
  },
  h2(p, t) { // H2 分子 + 泡
    const q = easeBack(seg(p, 0, 0.35)), bob = Math.sin(t * 2.5) * 10;
    for (let i = 0; i < 12; i++) { const y = 150 - ((t * 90 + hash(i) * 300) % 300); circle(-300 + hash(i + 9) * 600, y, 8 + hash(i + 4) * 14, C.sky, 0.35); }
    withT(0, bob, q, Math.sin(t * 1.5) * 0.1, () => {
      ctx.fillStyle = C.ink; ctx.fillRect(-60, -12, 120, 24);
      circle(-110, 0, 90, C.sky); circle(110, 0, 90, C.sky);
      txt('H', -110, 30, { size: 90, w: 900 }); txt('H', 110, 30, { size: 90, w: 900 });
    });
  },
  medal(p, t) { // メダル
    const q = easeBack(seg(p, 0, 0.4)), sh = (t * 0.8) % 2;
    withT(0, 0, q, Math.sin(t * 2) * 0.05, () => {
      ctx.fillStyle = C.wineLt; ctx.beginPath(); ctx.moveTo(-70, -170); ctx.lineTo(-10, -40); ctx.lineTo(-60, -30); ctx.lineTo(-130, -170); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(70, -170); ctx.lineTo(10, -40); ctx.lineTo(60, -30); ctx.lineTo(130, -170); ctx.closePath(); ctx.fill();
      circle(0, 40, 130, C.goldDk); circle(0, 40, 108, C.gold);
      ctx.save(); ctx.beginPath(); ctx.arc(0, 40, 108, 0, Math.PI * 2); ctx.clip();
      ctx.globalAlpha = 0.5; ctx.fillStyle = C.white; ctx.translate(lerp(-260, 260, sh / 2), 40); ctx.rotate(0.5); ctx.fillRect(-20, -200, 40, 400); ctx.restore();
      txt('指定', 0, 70, { size: 76, w: 900, color: C.wineDk });
    });
  },
  domes(p, t) { // 東京ドーム 58 個が並ぶ
    const cols = 10, sz = 58;
    for (let i = 0; i < 58; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      const g = easeBack(seg(p, 0.05 + i * 0.0105, 0.12));
      const x = -(cols - 1) * sz / 2 + col * sz, y = -140 + row * 44;
      withT(x, y, g * 0.9, 0, () => {
        ctx.fillStyle = i % 2 ? C.wine : C.wineLt; ctx.beginPath(); ctx.ellipse(0, 10, 26, 22, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
        ctx.fillStyle = C.ink; ctx.fillRect(-28, 10, 56, 6);
      });
    }
  },
};

function confetti(t, t0) {
  const e = t - t0; if (e < 0) return;
  for (let i = 0; i < 90; i++) {
    const x = hash(i) * W + Math.sin(e * 2 + i) * 40, y = -40 + e * (300 + hash(i + 11) * 380) - hash(i + 5) * 600;
    if (y < -40 || y > H) continue;
    withT(x, y, 1, e * (3 + hash(i + 2) * 5), () => { ctx.fillStyle = [C.gold, C.white, C.sky, '#FF7AA8', C.green][i % 5]; ctx.fillRect(-10, -6, 20, 12); });
  }
}

// ---------- シーン ----------
function sceneIntro(sc, t) {
  const e = t - sc.start;
  const a = easeBack(seg(e, 0.05, 0.45)), b = easeBack(seg(e, 0.35, 0.45)), c = easeBack(seg(e, 0.7, 0.5));
  const h = easeBack(seg(e, 0.0, 0.35));
  withT(540, 390, h * (1 + 0.05 * Math.sin(e * 10)), 0.05, () => { fillRR(-370, -62, 740, 110, 24, C.gold); txt('九大生でも知らない！？', 0, 18, { size: 60, w: 900, color: C.wineDk }); });
  withT(540, 560, a, -0.04, () => { fillRR(-330, -70, 660, 130, 30, C.cream); txt('九州大学の', 0, 30, { size: 92, w: 900, color: C.wine }); });
  withT(540, 790, b, 0.03, () => txt('ここがすごい！', 0, 40, { size: 128, w: 900, color: C.white, stroke: 22, strokeColor: C.wineDk }));
  const pulse = 1 + 0.04 * Math.sin(e * 8);
  withT(540, 1110, c * pulse, 0, () => {
    // 星形のバッジ
    ctx.fillStyle = C.gold; ctx.beginPath();
    for (let i = 0; i < 32; i++) { const r = i % 2 ? 200 : 235, ang = i / 32 * Math.PI * 2 + e * 0.4; ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r); }
    ctx.closePath(); ctx.fill();
    txt('10', -18, 52, { size: 200, w: 900, color: C.wineDk });
    txt('選', 118, 50, { size: 90, w: 900, color: C.wineDk });
  });
  txt('衝撃の事実ですわ！', 540, 1390, { size: 64, w: 800, alpha: seg(e, 1.2, 0.3) });
}

function sceneRank(sc, t) {
  const e = t - sc.start, top = sc.rank === 1;
  const sk = (1 - seg(e, 0.28, 0.25)) * seg(e, 0.26, 0.01) * (sc.rank <= 3 ? 22 : 12);
  if (sk > 0) ctx.translate(Math.sin(e * 90) * sk, Math.cos(e * 77) * sk);
  progress(sc.rank, seg(e, 0, 0.35));
  // 「第N位」バッジ
  const bp = easeBack(seg(e, 0.0, 0.4));
  withT(540, 560, bp, -0.05 + 0.05 * bp, () => {
    const col = top ? C.gold : C.cream, ink = top ? C.wineDk : C.wine;
    fillRR(-260, -120, 520, 210, 105, col);
    txt('第', -160, 30, { size: 80, w: 900, color: ink });
    txt(String(sc.rank), 0, 58, { size: sc.rank === 10 ? 170 : 190, w: 900, color: ink });
    txt('位', 165, 30, { size: 80, w: 900, color: ink });
  });
  // タイトル
  const tp = easeOut(seg(e, 0.2, 0.35));
  let ts = 96; ctx.font = F(900, ts); while (ctx.measureText(sc.title).width > 960 && ts > 50) { ts -= 2; ctx.font = F(900, ts); }
  txt(sc.title, 540, 770 + (1 - tp) * 40, { size: ts, w: 900, alpha: tp, stroke: 18, strokeColor: C.wineDk });
  // カード
  const cp = easeOut(seg(e, 0.3, 0.4));
  ctx.save(); ctx.globalAlpha = cp;
  withT(540, 1060, lerp(0.92, 1, cp), 0, () => {
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
    fillRR(-450, -240, 900, 480, 44, C.cream); ctx.restore();
    if (top) { ctx.save(); ctx.lineWidth = 10; ctx.strokeStyle = C.gold; rr(-450, -240, 900, 480, 44); ctx.stroke(); ctx.restore(); }
    withT(0, -55, 1, 0, () => ICON[sc.icon](seg(e, 0.4, 2.2), t));
    // 大きな数字/キーワード
    const kp = easeBack(seg(e, 0.9, 0.4));
    withT(0, 190, kp, 0, () => {
      let bs = 110; ctx.font = F(900, bs); while (ctx.measureText(sc.big).width > 640 && bs > 60) { bs -= 4; ctx.font = F(900, bs); }
      const bw = ctx.measureText(sc.big).width;
      ctx.font = F(900, 54); const uw = sc.unit ? ctx.measureText(sc.unit).width + 10 : 0;
      const x0 = -(bw + uw) / 2;
      txt(sc.big, x0, 0, { size: bs, w: 900, color: C.wine, align: 'left' });
      if (sc.unit) txt(sc.unit, x0 + bw + 10, 0, { size: 54, w: 900, color: C.wine, align: 'left' });
    });
  });
  ctx.restore();
  // 補足チップ
  const np = easeOut(seg(e, 1.2, 0.3));
  if (np > 0) {
    let ns = 44; ctx.font = F(800, ns); while (ctx.measureText(sc.note).width > 880 && ns > 28) { ns -= 2; ctx.font = F(800, ns); }
    const w = ctx.measureText(sc.note).width + 80;
    ctx.save(); ctx.globalAlpha = np;
    fillRR(540 - w / 2, 1352 - 38 + (1 - np) * 20, w, 76, 38, top ? C.gold : C.wineLt);
    txt(sc.note, 540, 1352 + ns * 0.36 + (1 - np) * 20, { size: ns, w: 800, color: top ? C.wineDk : C.white });
    ctx.restore();
  }
  if (top) confetti(t, sc.start + 0.2);
}

function sceneOutro(sc, t) {
  const e = t - sc.start;
  const a = easeBack(seg(e, 0.05, 0.4)), b = easeBack(seg(e, 0.9, 0.4));
  withT(540, 640, a, 0, () => txt('いくつ', 0, 0, { size: 120, w: 900, stroke: 20 }));
  withT(540, 800, a, 0, () => txt('知ってた？', 0, 0, { size: 120, w: 900, stroke: 20 }));
  withT(540, 1060, b * (1 + 0.04 * Math.sin(e * 9)), 0, () => {
    fillRR(-300, -80, 600, 160, 80, C.gold);
    txt('フォローしてね', 0, 22, { size: 66, w: 900, color: C.wineDk });
  });
  const c = seg(e, 1.3, 0.4);
  txt('ナレーション VOICEVOX:四国めたん', 540, 1290, { size: 38, w: 700, alpha: c * 0.9 });
  txt('BGM オリジナル / 数値は概数', 540, 1350, { size: 38, w: 700, alpha: c * 0.9 });
}

function render(t) {
  const sc = TL.scenes.find(s => t >= s.start && t < s.start + s.dur) || TL.scenes[TL.scenes.length - 1];
  const isTop = sc.kind === 'rank' && sc.rank === 1;
  ctx.clearRect(0, 0, W, H);
  background(t, isTop);
  header(t, sc.kind === 'rank' ? 1 : 0);
  if (sc.kind === 'intro') sceneIntro(sc, t);
  else if (sc.kind === 'rank') { ctx.save(); sceneRank(sc, t); ctx.restore(); }
  else sceneOutro(sc, t);
  subtitle(sc, t);
  // シーン切替のフラッシュ
  const e = t - sc.start;
  if (sc.start > 0 && e < 0.12) { ctx.fillStyle = `rgba(255,255,255,${0.55 * (1 - e / 0.12)})`; ctx.fillRect(0, 0, W, H); }
  // 全体のフェードアウト
  const fo = seg(t, DURATION - 0.4, 0.4);
  if (fo > 0) { ctx.fillStyle = `rgba(20,4,10,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;

// ブラウザで開いたときのプレビュー再生
if (!navigator.webdriver) {
  document.fonts.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
}
</script>
