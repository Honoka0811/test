<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Muscle Top5 Renderer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@800&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TL = window.TL;
const BEAT = 60 / TL.bpm;
const TITLE = '"Dela Gothic One", sans-serif';
const BODY = '"M PLUS Rounded 1c", sans-serif';

// ---------------------------------------------------------------- data
const RANKS = {
  5: { name: '大胸筋', kana: 'だいきょうきん', en: 'PECTORALIS MAJOR', where: '胸の前面', view: 'front', mus: 'pecs',
       focus: [200, 215], ben: ['押す力アップ', '上半身にメリハリ', '代謝アップ'], ex: '腕立て伏せ', exk: 'pushup', col: '#3da9ff' },
  4: { name: '広背筋', kana: 'こうはいきん', en: 'LATISSIMUS DORSI', where: '脇〜腰の背中', view: 'back', mus: 'lats',
       focus: [200, 300], ben: ['猫背が改善', '逆三角形ボディ', '引く力アップ'], ex: '懸垂', exk: 'pullup', col: '#22d3a6' },
  3: { name: '体幹', kana: 'たいかん', en: 'CORE MUSCLES', where: 'お腹・背骨まわり', view: 'front', mus: 'core',
       focus: [200, 345], ben: ['姿勢が安定', '腰痛予防', 'お腹引き締め'], ex: 'プランク', exk: 'plank', col: '#a66bff' },
  2: { name: '大臀筋', kana: 'だいでんきん', en: 'GLUTEUS MAXIMUS', where: 'お尻全体', view: 'back', mus: 'glutes',
       focus: [200, 510], ben: ['姿勢が改善', '走る・跳ぶ力UP', 'ヒップアップ'], ex: 'ヒップリフト', exk: 'bridge', col: '#ff8a3d' },
  1: { name: '大腿四頭筋', kana: 'だいたいしとうきん', en: 'QUADRICEPS', where: '太ももの前', view: 'front', mus: 'quads',
       focus: [200, 585], ben: ['基礎代謝アップ', '太りにくい体に', '膝が安定'], ex: 'スクワット', exk: 'squat', col: '#ffd23f' },
};
const THEME = { hook: '#ffcc00', build: '#ff2d55', outro: '#ffcc00' };

// ---------------------------------------------------------------- utils
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const eOut = t => 1 - Math.pow(1 - clamp(t), 3);
const eIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eBack = t => { t = clamp(t); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const prog = (t, a, d) => clamp((t - a) / d);
function rnd(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function text(str, x, y, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || ''} ${o.size || 60}px ${o.font || TITLE}`;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowB || 30; }
  if (o.stroke) {
    ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || 14; ctx.strokeStyle = o.stroke; ctx.strokeText(str, x, y);
    ctx.shadowBlur = 0;
  }
  ctx.fillStyle = o.fill || '#fff'; ctx.fillText(str, x, y);
  ctx.restore();
}
function measure(str, size, font = TITLE) { ctx.save(); ctx.font = `${size}px ${font}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }
function scaled(x, y, s, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); fn(); ctx.restore(); }

// ---------------------------------------------------------------- timeline helpers
function sceneAt(t) {
  for (const s of TL.scenes) if (t >= s.start && t < s.end) return s;
  return TL.scenes[TL.scenes.length - 1];
}
const SC = Object.fromEntries(TL.scenes.map(s => [s.id, s]));
function lineAt(s, t) { let cur = null; for (const l of s.lines) if (t >= l.start - 0.05) cur = l; return cur; }
function shakeAmt(t) {
  let a = 0;
  for (const s of TL.scenes) {
    if (s.rank) { const d = t - s.start; if (d >= 0 && d < .5) a += (s.rank === 1 ? 34 : 22) * Math.exp(-d * 9); }
  }
  const h = SC.hook.lines[1].start, d = t - h; if (d >= 0 && d < .5) a += 22 * Math.exp(-d * 9);
  const b = SC.build; if (t > b.start && t < b.end) a += 5 * Math.pow(prog(t, b.start, b.end - b.start), 2);
  if (t < .4) a += 18 * Math.exp(-t * 9);
  return a;
}

// ---------------------------------------------------------------- background
function background(t, s, col) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  const dark = s.id === 'build' ? '#07030c' : '#0a0f1f';
  g.addColorStop(0, dark); g.addColorStop(.55, '#111a33'); g.addColorStop(1, dark);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const beatP = (t % BEAT) / BEAT, pulse = s.id === 'build' ? 0 : Math.exp(-beatP * 5);
  // sunburst rays
  ctx.save(); ctx.translate(540, 900); ctx.rotate(t * 0.15);
  const rays = 18;
  for (let i = 0; i < rays; i++) {
    ctx.rotate(Math.PI * 2 / rays);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-150, -1600); ctx.lineTo(150, -1600); ctx.closePath();
    ctx.fillStyle = hexA(col, (i % 2 ? .035 : .07) + pulse * .04); ctx.fill();
  }
  ctx.restore();
  // radial glow
  const rg = ctx.createRadialGradient(540, 900, 50, 540, 900, 900);
  rg.addColorStop(0, hexA(col, .28 + pulse * .1)); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  // drifting particles
  const r = rnd(11);
  for (let i = 0; i < 40; i++) {
    const x = r() * W, sp = 20 + r() * 60, sz = 2 + r() * 5;
    const y = (r() * H - t * sp) % H; const yy = y < 0 ? y + H : y;
    ctx.fillStyle = hexA(col, .15 + .25 * r()); ctx.beginPath(); ctx.arc(x + Math.sin(t + i) * 20, yy, sz, 0, 7); ctx.fill();
  }
  // diagonal speed stripes on the edges
  ctx.save(); ctx.globalAlpha = .07; ctx.fillStyle = '#fff';
  for (let i = 0; i < 6; i++) {
    const off = ((t * 220 + i * 360) % 2200) - 300;
    ctx.beginPath(); ctx.moveTo(off, 0); ctx.lineTo(off + 60, 0); ctx.lineTo(off - 540, H); ctx.lineTo(off - 600, H); ctx.fill();
  }
  ctx.restore();
}

// ---------------------------------------------------------------- body illustration (unit space 400 x 840)
function limb(x1, y1, r1, x2, y2, r2) {
  const a = Math.atan2(y2 - y1, x2 - x1), n = a + Math.PI / 2;
  ctx.moveTo(x1 + Math.cos(n) * r1, y1 + Math.sin(n) * r1);
  ctx.arc(x1, y1, r1, n, n + Math.PI);
  ctx.lineTo(x2 - Math.cos(n) * r2, y2 - Math.sin(n) * r2);
  ctx.arc(x2, y2, r2, n + Math.PI, n + 2 * Math.PI);
  ctx.closePath();
}
function silhouetteHalf() {
  // left half (viewer's left); mirrored for right
  limb(100, 205, 30, 82, 330, 23); limb(82, 330, 23, 72, 450, 16);
  ctx.moveTo(84, 478); ctx.ellipse(70, 478, 15, 24, 0.1, 0, 7);
  limb(160, 495, 44, 156, 670, 29); limb(156, 672, 29, 154, 742, 26); limb(154, 742, 26, 152, 800, 17);
  ctx.moveTo(172, 812); ctx.ellipse(150, 812, 22, 12, 0, 0, 7);
}
const PARTS = [
  () => { ctx.beginPath(); silhouetteCore(); },
  () => { ctx.beginPath(); silhouetteHalf(); },
  () => { ctx.beginPath(); ctx.save(); ctx.translate(400, 0); ctx.scale(-1, 1); silhouetteHalf(); ctx.restore(); },
];
function silhouetteCore() {
  ctx.ellipse(200, 66, 40, 50, 0, 0, 7);
  ctx.moveTo(180, 100); ctx.rect(180, 100, 40, 60);
  ctx.moveTo(150, 150);
  ctx.bezierCurveTo(175, 145, 225, 145, 250, 150);
  ctx.bezierCurveTo(280, 155, 302, 165, 306, 192);
  ctx.bezierCurveTo(309, 218, 300, 250, 290, 282);
  ctx.bezierCurveTo(280, 322, 271, 362, 270, 402);
  ctx.bezierCurveTo(270, 432, 282, 456, 286, 482);
  ctx.bezierCurveTo(290, 512, 272, 530, 252, 538);
  ctx.lineTo(200, 552); ctx.lineTo(148, 538);
  ctx.bezierCurveTo(128, 530, 110, 512, 114, 482);
  ctx.bezierCurveTo(118, 456, 130, 432, 130, 402);
  ctx.bezierCurveTo(129, 362, 120, 322, 110, 282);
  ctx.bezierCurveTo(100, 250, 91, 218, 94, 192);
  ctx.bezierCurveTo(98, 165, 120, 155, 150, 150);
  ctx.closePath();
}
// muscle shape builders: each draws the LEFT side path; mirrored automatically
const MUS = {
  front: {
    delt: () => { ctx.ellipse(104, 205, 26, 34, 0.35, 0, 7); },
    bicep: () => { ctx.ellipse(90, 275, 16, 42, 0.15, 0, 7); },
    pecs: () => { ctx.moveTo(197, 176); ctx.bezierCurveTo(170, 168, 136, 172, 120, 196); ctx.bezierCurveTo(113, 222, 121, 246, 142, 256); ctx.bezierCurveTo(166, 263, 190, 256, 197, 240); ctx.closePath(); },
    core: () => {
      for (const [y, h] of [[268, 36], [310, 36], [352, 40]]) { ctx.roundRect(168, y, 29, h, 9); }
      ctx.moveTo(168, 400); ctx.lineTo(197, 400); ctx.lineTo(197, 462); ctx.lineTo(186, 462); ctx.closePath();
      ctx.moveTo(160, 268); ctx.bezierCurveTo(145, 300, 138, 350, 140, 400); ctx.lineTo(162, 424); ctx.bezierCurveTo(164, 370, 165, 320, 164, 268); ctx.closePath();
    },
    quads: () => { ctx.moveTo(134, 500); ctx.bezierCurveTo(126, 556, 131, 614, 147, 662); ctx.bezierCurveTo(154, 675, 166, 675, 171, 662); ctx.bezierCurveTo(183, 612, 186, 556, 183, 500); ctx.bezierCurveTo(166, 490, 148, 490, 134, 500); ctx.closePath(); },
    shin: () => { ctx.ellipse(150, 730, 12, 48, 0.02, 0, 7); },
  },
  back: {
    delt: () => { ctx.ellipse(104, 205, 26, 34, 0.35, 0, 7); },
    tricep: () => { ctx.ellipse(86, 278, 16, 44, 0.15, 0, 7); },
    trap: () => { ctx.moveTo(199, 150); ctx.lineTo(160, 166); ctx.bezierCurveTo(176, 192, 190, 240, 199, 300); ctx.closePath(); },
    lats: () => { ctx.moveTo(192, 222); ctx.bezierCurveTo(162, 208, 126, 214, 113, 244); ctx.bezierCurveTo(116, 294, 136, 352, 176, 402); ctx.lineTo(196, 380); ctx.bezierCurveTo(193, 330, 191, 272, 192, 222); ctx.closePath(); },
    erector: () => { ctx.roundRect(184, 300, 13, 150, 6); },
    glutes: () => { ctx.moveTo(199, 474); ctx.bezierCurveTo(176, 462, 140, 468, 127, 498); ctx.bezierCurveTo(122, 534, 144, 560, 174, 562); ctx.bezierCurveTo(192, 560, 199, 546, 199, 530); ctx.closePath(); },
    hams: () => { ctx.moveTo(136, 572); ctx.bezierCurveTo(130, 610, 136, 640, 148, 664); ctx.lineTo(170, 664); ctx.bezierCurveTo(182, 636, 184, 606, 180, 572); ctx.closePath(); },
    calf: () => { ctx.ellipse(154, 728, 20, 42, 0, 0, 7); },
  },
};
// fiber detail lines for the highlighted muscle (left side)
const FIBERS = {
  pecs: () => { for (let i = 0; i < 4; i++) { ctx.moveTo(195, 186 + i * 16); ctx.quadraticCurveTo(160, 190 + i * 14, 128 + i * 4, 205 + i * 12); } },
  lats: () => { for (let i = 0; i < 4; i++) { ctx.moveTo(188, 240 + i * 34); ctx.quadraticCurveTo(150, 250 + i * 24, 122 + i * 10, 250 + i * 30); } },
  core: () => {},
  glutes: () => { for (let i = 0; i < 4; i++) { ctx.moveTo(196, 482 + i * 18); ctx.quadraticCurveTo(160, 488 + i * 16, 132 + i * 4, 512 + i * 12); } },
  quads: () => { ctx.moveTo(158, 500); ctx.quadraticCurveTo(152, 590, 160, 668); ctx.moveTo(140, 520); ctx.quadraticCurveTo(140, 590, 150, 650); ctx.moveTo(176, 520); ctx.quadraticCurveTo(178, 590, 168, 655); },
};

// opts: view, target, pulse(0..1), dim (silhouette), hl alpha
function drawBody(o) {
  const view = o.view || 'front';
  const dim = o.dim || 0;
  // outline + fill (union)
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineWidth = 12; ctx.strokeStyle = dim ? '#000' : '#0b1222';
  ctx.shadowColor = o.rim || 'rgba(0,0,0,.5)'; ctx.shadowBlur = o.rim ? 40 : 20;
  for (const P of PARTS) { P(); ctx.stroke(); }
  ctx.shadowBlur = 0;
  const skin = ctx.createLinearGradient(0, 0, 400, 0);
  skin.addColorStop(0, '#dfe7f2'); skin.addColorStop(.5, '#f4f7fb'); skin.addColorStop(1, '#cfd9e8');
  ctx.fillStyle = skin;
  for (const P of PARTS) { P(); ctx.fill(); }
  ctx.restore();
  // hair on back view
  if (view === 'back') { ctx.beginPath(); ctx.ellipse(200, 58, 40, 44, 0, Math.PI * 1.02, Math.PI * 1.98 + 1.3); ctx.fillStyle = '#2b3550'; ctx.fill(); }
  else { // simple face: brows+eyes for character
    ctx.fillStyle = '#2b3550';
    ctx.beginPath(); ctx.ellipse(186, 66, 4, 6, 0, 0, 7); ctx.ellipse(214, 66, 4, 6, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.lineWidth = 3.5; ctx.strokeStyle = '#2b3550'; ctx.lineCap = 'round';
    ctx.moveTo(178, 54); ctx.lineTo(192, 57); ctx.moveTo(222, 54); ctx.lineTo(208, 57);
    ctx.moveTo(190, 88); ctx.quadraticCurveTo(200, 96, 210, 88); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(150, 34); ctx.bezierCurveTo(170, 6, 230, 6, 250, 34); ctx.bezierCurveTo(240, 26, 160, 26, 150, 34); ctx.fillStyle = '#2b3550'; ctx.fill();
  }
  // base muscles
  const set = MUS[view];
  for (const k in set) {
    if (k === o.target) continue;
    ctx.beginPath(); set[k](); ctx.save(); ctx.translate(400, 0); ctx.scale(-1, 1); set[k](); ctx.restore();
    ctx.fillStyle = '#c3cfdf'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#9aaac0'; ctx.stroke();
  }
  if (view === 'back') { ctx.beginPath(); ctx.moveTo(200, 160); ctx.lineTo(200, 470); ctx.strokeStyle = '#9aaac0'; ctx.lineWidth = 3; ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(200, 262); ctx.lineTo(200, 460); ctx.strokeStyle = '#9aaac0'; ctx.lineWidth = 3; ctx.stroke(); }
  // highlighted target
  const targets = Array.isArray(o.target) ? o.target : (o.target ? [o.target] : []);
  for (const tg of targets) {
    const fn = set[tg]; if (!fn) continue;
    const p = o.pulse ?? 1, a = o.hl ?? 1;
    ctx.save(); ctx.globalAlpha = a;
    ctx.beginPath(); fn(); ctx.save(); ctx.translate(400, 0); ctx.scale(-1, 1); fn(); ctx.restore();
    const g = ctx.createLinearGradient(0, 150, 0, 700);
    g.addColorStop(0, '#ff2d55'); g.addColorStop(1, '#ff7a1a');
    ctx.shadowColor = '#ff2d55'; ctx.shadowBlur = 25 + 45 * p;
    ctx.fillStyle = g; ctx.fill(); ctx.fill();
    ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.strokeStyle = '#b3002a'; ctx.stroke();
    // shine
    ctx.globalAlpha = a * (.25 + .35 * p); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.globalAlpha = a;
    if (FIBERS[tg]) {
      ctx.beginPath(); FIBERS[tg](); ctx.save(); ctx.translate(400, 0); ctx.scale(-1, 1); FIBERS[tg](); ctx.restore();
      ctx.strokeStyle = 'rgba(140,0,30,.55)'; ctx.lineWidth = 2.5; ctx.stroke();
    }
    ctx.restore();
  }
  if (dim) { // silhouette mode
    ctx.save(); ctx.globalAlpha = dim; ctx.fillStyle = '#05030a'; for (const P of PARTS) { P(); ctx.fill(); } ctx.restore();
  }
}
function placeBody(st, fn) {
  ctx.save(); ctx.translate(st.cx, st.cy); ctx.scale(st.s * (st.flip || 1), st.s); ctx.translate(-st.px, -st.py); fn(); ctx.restore();
}
const toScreen = (st, x, y) => [st.cx + (x - st.px) * st.s, st.cy + (y - st.py) * st.s];
const mixSt = (a, b, k) => ({ cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k), s: lerp(a.s, b.s, k), px: lerp(a.px, b.px, k), py: lerp(a.py, b.py, k) });

// ---------------------------------------------------------------- exercise stick figures (box 220 x 160)
const EX = {
  squat: { segs: [['h', 'n'], ['n', 'hip'], ['hip', 'k'], ['k', 'f'], ['n', 'e'], ['e', 'w']], period: 1.6,
    A: { h: [110, 20], n: [110, 44], hip: [110, 92], k: [112, 122], f: [110, 152], e: [128, 62], w: [148, 60] },
    B: { h: [124, 52], n: [118, 74], hip: [78, 112], k: [126, 112], f: [110, 152], e: [146, 86], w: [172, 82] } },
  pushup: { segs: [['h', 'n'], ['n', 'hip'], ['hip', 'k'], ['k', 'f'], ['n', 'e'], ['e', 'w']], period: 1.4,
    A: { h: [178, 66], n: [162, 76], hip: [98, 100], k: [62, 116], f: [26, 130], e: [164, 104], w: [166, 132] },
    B: { h: [184, 102], n: [166, 108], hip: [98, 118], k: [62, 125], f: [26, 130], e: [140, 104], w: [166, 132] } },
  pullup: { segs: [['h', 'n'], ['n', 'hip'], ['hip', 'k'], ['k', 'f'], ['n', 'e'], ['e', 'w'], ['n', 'e2'], ['e2', 'w2']], period: 1.8, bar: true,
    A: { h: [110, 34], n: [110, 56], hip: [110, 104], k: [112, 132], f: [104, 156], e: [76, 38], w: [80, 14], e2: [144, 38], w2: [140, 14] },
    B: { h: [110, 58], n: [110, 80], hip: [110, 128], k: [112, 154], f: [104, 176], e: [72, 48], w: [80, 14], e2: [148, 48], w2: [140, 14] } },
  plank: { segs: [['h', 'n'], ['n', 'hip'], ['hip', 'k'], ['k', 'f'], ['n', 'e'], ['e', 'w']], period: 0.25, timer: true,
    A: { h: [182, 84], n: [164, 92], hip: [98, 104], k: [62, 116], f: [26, 128], e: [160, 130], w: [192, 130] },
    B: { h: [182, 85], n: [164, 93], hip: [98, 106], k: [62, 117], f: [26, 128], e: [160, 130], w: [192, 130] } },
  bridge: { segs: [['h', 'n'], ['n', 'hip'], ['hip', 'k'], ['k', 'f'], ['n', 'e'], ['e', 'w']], period: 1.6,
    A: { h: [186, 122], n: [166, 124], hip: [108, 124], k: [66, 92], f: [52, 130], e: [140, 130], w: [116, 131] },
    B: { h: [186, 122], n: [166, 120], hip: [104, 84], k: [64, 80], f: [52, 130], e: [140, 130], w: [116, 131] } },
};
function drawEx(key, x, y, s, t, col) {
  const e = EX[key];
  const p = key === 'plank' ? (Math.sin(t * 40) > 0 ? 1 : 0) : .5 - .5 * Math.cos(t / e.period * Math.PI * 2);
  const P = {}; for (const k in e.A) P[k] = [lerp(e.A[k][0], e.B[k][0], p), lerp(e.A[k][1], e.B[k][1], p)];
  if (key === 'pullup') { x += 20 * s; s *= .82; }
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, key === 'pullup' ? 186 : 154); ctx.lineTo(220, key === 'pullup' ? 186 : 154);
  if (key === 'bridge' || key === 'plank' || key === 'pushup') { ctx.moveTo(0, 133); ctx.lineTo(220, 133); }
  ctx.stroke();
  if (e.bar) { ctx.beginPath(); ctx.moveTo(40, 12); ctx.lineTo(180, 12); ctx.lineWidth = 8; ctx.strokeStyle = '#9aa7bd'; ctx.stroke(); }
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 11; ctx.lineJoin = 'round';
  ctx.shadowColor = col; ctx.shadowBlur = 16;
  ctx.beginPath(); for (const [a, b] of e.segs) { ctx.moveTo(...P[a]); ctx.lineTo(...P[b]); } ctx.stroke();
  ctx.beginPath(); ctx.arc(P.h[0], P.h[1], 15, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.restore();
  if (e.timer) text(`${String(Math.min(30, Math.floor(t * 4) % 31)).padStart(2, '0')}秒`, x + 205 * s, y + 30 * s, { size: 30 * s, font: BODY, fill: col, align: 'right' });
}

// ---------------------------------------------------------------- HUD
function hud(t, s, col) {
  text('VOICEVOX:青山龍星', 1040, 42, { size: 26, font: BODY, fill: 'rgba(255,255,255,.75)', align: 'right' });
  const show = s.id === 'hook' ? eBack(prog(t, SC.hook.lines[1].start + .2, .5)) : 1;
  if (show <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(show);
  text('鍛えると得する筋肉 TOP5', 540, 104, { size: 46, stroke: '#000', sw: 10, fill: '#fff' });
  const cur = s.rank || (s.id === 'build' ? 1 : s.id === 'outro' ? 0 : 6);
  for (let i = 0; i < 5; i++) {
    const r = 5 - i, x = 300 + i * 120, y = 178;
    const pop = s.id === 'hook' ? eBack(prog(t, SC.hook.lines[1].start + .3 + i * .08, .35)) : 1;
    const done = r > cur || s.id === 'outro', active = r === cur && s.id !== 'build';
    if (i < 4) { ctx.fillStyle = done ? col : 'rgba(255,255,255,.25)'; ctx.fillRect(x + 28, y - 3, 64, 6); }
    scaled(x, y, pop * (active ? 1.25 + .06 * Math.sin(t * 8) : 1), () => {
      ctx.beginPath(); ctx.arc(0, 0, 28, 0, 7);
      ctx.fillStyle = active ? col : done ? hexA(col, .5) : 'rgba(255,255,255,.12)'; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = active ? '#fff' : 'rgba(255,255,255,.4)'; ctx.stroke();
      text(s.id === 'build' && r === 1 ? '?' : String(r), 0, 2, { size: 32, fill: active ? '#111' : '#fff' });
    });
  }
  ctx.restore();
}

function subtitle(t, s, col) {
  const l = lineAt(s, t); if (!l) return;
  if (t > l.start + l.dur + .35) return;
  const k = eBack(prog(t, l.start - .05, .25));
  const parts = l.text.split(/(【[^】]+】)/).filter(Boolean).map(p => p.startsWith('【') ? { s: p.slice(1, -1), hl: 1 } : { s: p, hl: 0 });
  let size = 66; const total = () => parts.reduce((a, p) => a + measure(p.s, size, TITLE), 0);
  while (total() > 900 && size > 40) size -= 2;
  const tw = total(); let x = 540 - tw / 2; const y = 1530;
  ctx.save(); ctx.translate(540, y); ctx.scale(lerp(.6, 1, k), lerp(.6, 1, k)); ctx.translate(-540, -y); ctx.globalAlpha = clamp(k * 2);
  rr(540 - tw / 2 - 34, y - size * .85, tw + 68, size * 1.7, 26); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fill();
  for (const p of parts) {
    const w = measure(p.s, size, TITLE);
    text(p.s, x + w / 2, y, { size: p.hl ? size * 1.04 : size, fill: p.hl ? col : '#fff', stroke: '#000', sw: 12 });
    x += w;
  }
  ctx.restore();
}

function flash(t, at, dur = .35, color = '#fff') {
  const d = t - at; if (d < 0 || d > dur) return;
  ctx.save(); ctx.globalAlpha = Math.pow(1 - d / dur, 2) * .9; ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore();
}

// ---------------------------------------------------------------- scenes
function sceneHook(t, s, col) {
  const l0 = s.lines[0], l1 = s.lines[1];
  // body with scanning highlight cycling through all five muscles
  const order = [['front', 'quads'], ['back', 'glutes'], ['front', 'core'], ['back', 'lats'], ['front', 'pecs']];
  const idx = Math.floor(t / .42) % 5;
  const [view, mus] = order[idx];
  const st = { cx: 540, cy: 1060 + 20 * Math.sin(t * 2), s: .92 + .03 * Math.sin(t * 3), px: 200, py: 420 };
  const enter = eOut(prog(t, 0, .5));
  st.cy += (1 - enter) * 300;
  placeBody(st, () => drawBody({ view, target: mus, pulse: .5 + .5 * Math.sin(t * 12) }));
  // scan line
  const sy = 640 + ((t * 700) % 820);
  ctx.save(); const g = ctx.createLinearGradient(0, sy - 60, 0, sy); g.addColorStop(0, 'rgba(255,204,0,0)'); g.addColorStop(1, 'rgba(255,204,0,.45)');
  ctx.fillStyle = g; ctx.fillRect(160, sy - 60, 760, 60); ctx.fillStyle = '#ffcc00'; ctx.fillRect(160, sy, 760, 4); ctx.restore();
  // corner brackets
  ctx.save(); ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  for (const [x, y, dx, dy] of [[180, 600, 1, 1], [900, 600, -1, 1], [180, 1480, 1, -1], [900, 1480, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, y + dy * 70); ctx.lineTo(x, y); ctx.lineTo(x + dx * 70, y); ctx.stroke();
  }
  ctx.restore();
  const tagA = ['大腿四頭筋', '大臀筋', '体幹', '広背筋', '大胸筋'][idx];
  text('SCANNING…  ' + tagA, 540, 1430, { size: 34, font: BODY, fill: '#ffcc00' });

  if (t < l1.start) {
    // kinetic type for line 0
    const a = eBack(prog(t, l0.start, .3)), b = eBack(prog(t, l0.start + l0.dur * .42, .3));
    scaled(540, 330, a * (1 + .02 * Math.sin(t * 10)), () => text('鍛えるだけで', 0, 0, { size: 104, stroke: '#000', sw: 18 }));
    scaled(540, 480, b * 1.0, () => text('得する筋肉がある！', 0, 0, { size: 112, fill: '#ffcc00', stroke: '#000', sw: 20, glow: '#ff8a00', glowB: 40 }));
  } else {
    const k = eBack(prog(t, l1.start, .35));
    const wob = 1 + .03 * Math.sin(t * 9);
    scaled(540, 330, lerp(2.5, 1, k) * wob, () => {
      ctx.globalAlpha = clamp(k * 2);
      const w1 = measure('筋肉', 150), w2 = measure('TOP5', 190), g = 20, x0 = -(w1 + w2 + g) / 2;
      text('筋肉', x0 + w1 / 2, 6, { size: 150, stroke: '#000', sw: 22 });
      text('TOP5', x0 + w1 + g + w2 / 2, 0, { size: 190, fill: '#ffcc00', stroke: '#000', sw: 24, glow: '#ff5500', glowB: 50 });
    });
    const k2 = eBack(prog(t, l1.start + .35, .3));
    scaled(540, 490, k2, () => {
      rr(-300, -50, 600, 100, 50); ctx.fillStyle = '#ff2d55'; ctx.fill();
      text('一気に紹介！', 0, 4, { size: 64 });
    });
  }
}

function sceneRank(t, s, col) {
  const R = RANKS[s.rank], lt = t - s.start;
  const L = s.lines.map(l => l.start - s.start);
  const D = s.lines.map(l => l.dur);
  const pulse = .5 + .5 * Math.sin(t * 7);
  // body state machine
  const S0 = { cx: 540, cy: 960, s: .95, px: 200, py: 420 };
  const S1 = { cx: 540, cy: 960, s: R.mus === 'quads' ? 1.45 : 1.75, px: R.focus[0], py: R.focus[1] };
  const S2 = { cx: 300, cy: 930, s: .86, px: 200, py: 420 };
  let st = S0;
  const k1 = eIO(prog(lt, L[1] - .1, .55)), k2 = eIO(prog(lt, L[2] - .1, .55));
  st = mixSt(mixSt(S0, S1, k1), S2, k2);
  const enter = eOut(prog(lt, .75, .55));
  st.cy += (1 - enter) * 700;
  // gentle idle bob
  st.cy += Math.sin(t * 2.2) * 8;
  const hlOn = eOut(prog(lt, L[0] + D[0] * .4, .4));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 455, W, 1000); ctx.clip();
  if (s.rank === 1) { // ? silhouette then reveal
    const reveal = eOut(prog(lt, 0, .5));
    placeBody(st, () => drawBody({ view: R.view, target: R.mus, pulse, hl: hlOn, dim: 1 - reveal }));
  } else placeBody(st, () => drawBody({ view: R.view, target: R.mus, pulse, hl: hlOn }));
  ctx.restore();
  // view tag
  if (enter > .5) {
    const tag = R.view === 'back' ? '背面' : '正面';
    const [tx, ty] = toScreen(st, 330, 140);
    ctx.save(); ctx.globalAlpha = clamp((enter - .5) * 2) * (1 - k1 + k2);
    rr(tx - 10, ty - 30, 120, 60, 30); ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fill();
    text(tag, tx + 50, ty + 2, { size: 34, font: BODY, fill: '#fff' });
    ctx.restore();
  }
  // callout during zoom (line 1)
  const cA = prog(lt, L[1] + .2, .3) * (1 - prog(lt, L[2] - .25, .2));
  if (cA > 0) {
    const [fx, fy] = toScreen(st, R.focus[0], R.focus[1]);
    ctx.save(); ctx.globalAlpha = clamp(cA);
    const rp = (lt * 1.6) % 1;
    for (const q of [rp, (rp + .5) % 1]) {
      ctx.beginPath(); ctx.arc(fx, fy, 40 + q * 160, 0, 7); ctx.strokeStyle = hexA(col, 1 - q); ctx.lineWidth = 8; ctx.stroke();
    }
    const by = 560;
    ctx.beginPath(); ctx.moveTo(fx, fy - 40); ctx.lineTo(fx, by + 70); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.setLineDash([16, 12]); ctx.lineDashOffset = -lt * 80; ctx.stroke(); ctx.setLineDash([]);
    const k = eBack(prog(lt, L[1] + .2, .35));
    scaled(540, by, k, () => {
      const w = Math.max(measure(R.where, 64, TITLE) + 120, 420);
      rr(-w / 2, -70, w, 140, 30); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.lineWidth = 8; ctx.strokeStyle = col; ctx.stroke();
      rr(-w / 2 + 20, -100, 170, 64, 20); ctx.fillStyle = col; ctx.fill();
      text('ココ！', -w / 2 + 105, -67, { size: 40, fill: '#111' });
      text(R.where, 0, 12, { size: 64, fill: '#111' });
    });
    ctx.restore();
  }
  // benefit cards (line 2)
  for (let i = 0; i < 3; i++) {
    const k = eBack(prog(lt, L[2] + .15 + i * .22, .4));
    if (k <= 0) continue;
    const y = 590 + i * 150;
    ctx.save(); ctx.translate(780, y); ctx.scale(k, k); ctx.rotate((1 - k) * .3);
    rr(-215, -60, 430, 120, 24); ctx.fillStyle = 'rgba(255,255,255,.96)'; ctx.fill();
    rr(-215, -60, 18, 120, [24, 0, 0, 24]); ctx.fillStyle = col; ctx.fill();
    ctx.beginPath(); ctx.arc(-150, 0, 34, 0, 7); ctx.fillStyle = col; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-166, 0); ctx.lineTo(-154, 14); ctx.lineTo(-132, -12); ctx.strokeStyle = '#111'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    const fs = Math.min(48, 300 / measure(R.ben[i], 48, TITLE) * 48);
    text(R.ben[i], 50, 3, { size: fs, fill: '#111' });
    ctx.restore();
  }
  // exercise card (line 3)
  const ke = eOut(prog(lt, L[3] - .1, .45));
  if (ke > 0) {
    ctx.save(); ctx.translate((1 - ke) * 600, 0);
    rr(560, 1050, 400, 330, 30); ctx.fillStyle = 'rgba(10,15,31,.92)'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = col; ctx.stroke();
    rr(590, 1025, 220, 54, 27); ctx.fillStyle = col; ctx.fill();
    text('おすすめ種目', 700, 1053, { size: 30, font: BODY, fill: '#111' });
    drawEx(R.exk, 600, 1085, 1.45, lt, col);
    const fs = Math.min(56, 340 / measure(R.ex, 56, TITLE) * 56);
    text(R.ex, 760, 1335, { size: fs, fill: '#fff', glow: col, glowB: 20 });
    ctx.restore();
  }
  // header: rank slam -> badge
  const slam = eBack(prog(lt, 0, .28));
  const toBadge = eIO(prog(lt, .75, .35));
  const bx = lerp(540, 170, toBadge), by2 = lerp(860, 330, toBadge), bs = lerp(1, .36, toBadge) * lerp(3, 1, slam);
  if (toBadge > .3) {
    const kb = eBack(prog(lt, .85, .35));
    scaled(170, 330, kb, () => {
      ctx.beginPath(); ctx.arc(0, 0, 112, 0, 7); ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 40; ctx.fill(); ctx.shadowBlur = 0;
      ctx.lineWidth = 8; ctx.strokeStyle = '#fff'; ctx.stroke();
      if (s.rank === 1) { // crown
        ctx.beginPath(); ctx.moveTo(-70, -110); ctx.lineTo(-80, -175); ctx.lineTo(-38, -140); ctx.lineTo(0, -195); ctx.lineTo(38, -140); ctx.lineTo(80, -175); ctx.lineTo(70, -110); ctx.closePath();
        ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#7a5200'; ctx.stroke();
      }
    });
  }
  scaled(bx, by2, bs, () => {
    ctx.globalAlpha = clamp(slam * 3);
    text('第', -150, 30, { size: 110, fill: toBadge > .5 ? '#111' : '#fff', stroke: toBadge > .5 ? null : '#000', sw: 20 });
    text(String(s.rank), 0, 0, { size: 300, fill: toBadge > .5 ? '#111' : col, stroke: toBadge > .5 ? null : '#000', sw: 26, glow: toBadge > .5 ? null : col, glowB: 60 });
    text('位', 150, 30, { size: 110, fill: toBadge > .5 ? '#111' : '#fff', stroke: toBadge > .5 ? null : '#000', sw: 20 });
  });
  // muscle name slam
  const nk = eBack(prog(lt, Math.max(.95, L[0] + D[0] * .4), .35));
  if (nk > 0) {
    const x0 = 320;
    ctx.save(); ctx.globalAlpha = clamp(nk * 2);
    const fs = Math.min(130, 700 / measure(R.name, 130) * 130);
    scaled(x0, 335, lerp(1.8, 1, nk), () => {
      text(R.kana, 0, -100, { size: 38, font: BODY, fill: col, align: 'left' });
      text(R.name, 0, 0, { size: fs, align: 'left', stroke: '#000', sw: 22, glow: col, glowB: 35 });
      text(R.en, 0, 92, { size: 32, font: BODY, fill: 'rgba(255,255,255,.7)', align: 'left', ls: 6 });
    });
    ctx.restore();
  }
}

function sceneBuild(t, s, col) {
  const lt = t - s.start, dur = s.end - s.start, p = lt / dur;
  // spotlight
  const sx = 540 + Math.sin(lt * 2.4) * 260 * (1 - p);
  ctx.save();
  const g = ctx.createRadialGradient(sx, 1000, 30, sx, 1000, 520);
  g.addColorStop(0, 'rgba(255,240,200,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.beginPath(); ctx.moveTo(sx - 40, 0); ctx.lineTo(sx + 40, 0); ctx.lineTo(sx + 360, 1450); ctx.lineTo(sx - 360, 1450); ctx.closePath();
  ctx.fillStyle = 'rgba(255,240,200,.07)'; ctx.fill();
  ctx.restore();
  const st = { cx: 540, cy: 1000, s: .95 + p * .1, px: 200, py: 420 };
  placeBody(st, () => drawBody({ view: 'front', dim: 1, rim: col }));
  const q = .5 + .5 * Math.sin(lt * 10);
  scaled(540, 900, 1 + q * .08 + p * .3, () => text('?', 0, 0, { size: 380, fill: col, stroke: '#000', sw: 24, glow: col, glowB: 60 + q * 40 }));
  // typed text
  const msg = '栄えある第1位は…';
  const n = Math.floor(clamp(lt / 1.6) * msg.length);
  text(msg.slice(0, n), 540, 400, { size: 96, stroke: '#000', sw: 18, glow: col, glowB: 30 });
  // vignette that tightens
  const v = ctx.createRadialGradient(540, 960, 300, 540, 960, 1100 - p * 300);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.85)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

function confetti(t, at, col) {
  const d = t - at; if (d < 0 || d > 6) return;
  const r = rnd(99), C = ['#ffd23f', '#ff2d55', '#3da9ff', '#22d3a6', '#ffffff', '#a66bff'];
  for (let i = 0; i < 160; i++) {
    const x0 = r() * W, vy = 300 + r() * 500, sw = r() * 6, ph = r() * 6, sz = 12 + r() * 16, c = C[i % C.length], del = r() * .6;
    const dd = d - del; if (dd < 0) continue;
    const y = -60 + dd * vy, x = x0 + Math.sin(dd * 3 + ph) * 60 * sw / 6;
    if (y > H + 40) continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate(dd * (3 + sw) + ph); ctx.scale(1, Math.cos(dd * 8 + ph));
    ctx.fillStyle = c; ctx.globalAlpha = clamp(1 - (d - 4.5) / 1.5); ctx.fillRect(-sz / 2, -sz / 4, sz, sz / 2); ctx.restore();
  }
}

function sceneOutro(t, s, col) {
  const lt = t - s.start, L = s.lines.map(l => l.start - s.start);
  const k0 = eBack(prog(lt, .0, .4));
  scaled(540, 330, k0, () => {
    const w1 = measure('まずは', 70), w2 = measure('この3つ！', 120), g = 16, x0 = -(w1 + w2 + g) / 2;
    text('まずは', x0 + w1 / 2, 14, { size: 70, stroke: '#000', sw: 14 });
    text('この3つ！', x0 + w1 + g + w2 / 2, 0, { size: 120, fill: col, stroke: '#000', sw: 20, glow: '#ff8a00', glowB: 40 });
  });
  const items = [['スクワット', 'squat', '第1位 大腿四頭筋', RANKS[1].col], ['腕立て伏せ', 'pushup', '第5位 大胸筋', RANKS[5].col], ['プランク', 'plank', '第3位 体幹', RANKS[3].col]];
  const shrink = eIO(prog(lt, L[1] - .1, .5));
  items.forEach(([nm, key, sub, c], i) => {
    const k = eBack(prog(lt, .25 + i * .25, .45)); if (k <= 0) return;
    const y = lerp(560 + i * 270, 520 + i * 170, shrink), sc = lerp(1, .62, shrink);
    ctx.save(); ctx.translate(540, y); ctx.scale(k * sc, k * sc);
    rr(-430, -115, 860, 230, 34); ctx.fillStyle = 'rgba(10,15,31,.9)'; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = c; ctx.stroke();
    text(String(i + 1), -380, -70, { size: 54, fill: c });
    drawEx(key, -360, -105, 1.25, lt + i * .3, c);
    text(nm, 160, -18, { size: 76, fill: '#fff', glow: c, glowB: 20 });
    text(sub, 160, 62, { size: 36, font: BODY, fill: c });
    ctx.restore();
  });
  // save CTA
  const kc = eBack(prog(lt, L[1], .45));
  if (kc > 0) {
    const bob = Math.abs(Math.sin(lt * 5)) * 30;
    scaled(540, 1180 - bob, kc, () => {
      // bookmark icon
      ctx.beginPath(); ctx.moveTo(-70, -110); ctx.lineTo(70, -110); ctx.lineTo(70, 110); ctx.lineTo(0, 55); ctx.lineTo(-70, 110); ctx.closePath();
      ctx.fillStyle = '#fff'; ctx.shadowColor = col; ctx.shadowBlur = 50; ctx.fill(); ctx.shadowBlur = 0;
      ctx.lineWidth = 10; ctx.strokeStyle = '#111'; ctx.lineJoin = 'round'; ctx.stroke();
    });
    const kt = eBack(prog(lt, L[1] + .2, .4));
    scaled(540, 1380, kt, () => {
      rr(-380, -60, 760, 120, 60); ctx.fillStyle = '#ff2d55'; ctx.fill();
      text('保存して今日から実践！', 0, 4, { size: 60 });
    });
    // tap ripple hint
    const rp = (lt * 1.2) % 1;
    ctx.beginPath(); ctx.arc(540, 1180, 120 + rp * 120, 0, 7); ctx.strokeStyle = `rgba(255,255,255,${(1 - rp) * .6})`; ctx.lineWidth = 6; ctx.stroke();
  }
  const kcred = clamp(prog(lt, L[1] + .5, .5));
  text('ナレーション  VOICEVOX:青山龍星', 540, 1600, { size: 34, font: BODY, fill: `rgba(255,255,255,${.85 * kcred})` });
}

// ---------------------------------------------------------------- main
function render(t) {
  const s = sceneAt(t);
  const col = s.rank ? RANKS[s.rank].col : THEME[s.id];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  const sh = shakeAmt(t), r = rnd(Math.floor(t * 60));
  ctx.save();
  ctx.translate((r() - .5) * 2 * sh, (r() - .5) * 2 * sh);
  // slight zoom punch on every bar downbeat
  ctx.fillStyle = '#000'; ctx.fillRect(-60, -60, W + 120, H + 120);
  background(t, s, col);
  if (s.id === 'hook') sceneHook(t, s, col);
  else if (s.rank) sceneRank(t, s, col);
  else if (s.id === 'build') sceneBuild(t, s, col);
  else sceneOutro(t, s, col);
  if (s.rank === 1) confetti(t, s.start, col);
  if (s.id !== 'hook') subtitle(t, s, col);
  hud(t, s, col);
  ctx.restore();
  // transitions
  for (const x of TL.scenes) if (x.rank || x.id === 'outro') flash(t, x.start, x.rank === 1 ? .6 : .3);
  flash(t, 0, .35);
  flash(t, SC.hook.lines[1].start, .25, '#ffcc00');
  // scene-out wipe (last 0.18s of a scene)
  const out = s.end - t;
  if (out < .18 && s.id !== 'outro' && s.id !== 'build') {
    ctx.save(); ctx.fillStyle = col; const w = (1 - out / .18) * (W + 400);
    ctx.beginPath(); ctx.moveTo(-200, 0); ctx.lineTo(w, 0); ctx.lineTo(w - 400, H); ctx.lineTo(-200, H); ctx.fill(); ctx.restore();
  }
}

// font loading: include every glyph we draw
const ALL = JSON.stringify(RANKS) + TL.scenes.map(s => s.lines.map(l => l.text).join('')).join('') +
  '鍛えると得する筋肉TOP5一気に紹介！がある第位ココ！おすすめ種目背面正面まずはこの3つ保存して今日から実践ナレーションVOICEVOX:青山龍星SCANNING…栄えある1は?0123456789秒';
window.ready = Promise.all([
  document.fonts.load(`80px "Dela Gothic One"`, ALL),
  document.fonts.load(`800 40px "M PLUS Rounded 1c"`, ALL),
]).then(() => document.fonts.ready).then(() => true);
window.render = render;
</script>
</body>
