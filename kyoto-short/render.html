<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Kyoto Short</title>
<style>
  @font-face { font-family: "Dela"; src: url("fonts/DelaGothicOne-Regular.ttf"); }
  @font-face { font-family: "MRound"; src: url("fonts/MPLUSRounded1c-ExtraBold.ttf"); }
  html,body{margin:0;background:#000;}
  canvas{display:block;max-height:100vh;}
</style>
<script src="timeline.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ------------------------------------------------------------
// 京都のヤバい雑学 TOP3(9:16 ショート)
// render(t) は時刻 t[秒] のフレームを決定論的に描画する。
// シーン/字幕のタイミングは narrate.py が書き出す timeline.js から読む。
// ------------------------------------------------------------
const W = 1080, H = 1920, FPS = 30;
const TL = window.TIMELINE, DURATION = TL.total;
const main = document.getElementById('c');
const mctx = main.getContext('2d');
let ctx = mctx;
const off = document.createElement('canvas'); off.width = W; off.height = H;
const octx = off.getContext('2d');

const F_HEAVY = '"Dela","IPAPGothic",sans-serif';
const F_CAP = '"MRound","IPAPGothic",sans-serif';
const YEL = '#FFE14D', RED = '#E63946', VERM = '#E2421F', GOLD = '#F2C14E';

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, s, d) => clamp((t - s) / d);
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeInOut = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeBack = k => { k = clamp(k); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SC = Object.fromEntries(TL.scenes.map(s => [s.id, s]));
const cap = sub => TL.caps.find(c => c.text.includes(sub));
function sceneAt(t) { return TL.scenes.find(s => t >= s.t0 && t < s.t1) || TL.scenes[TL.scenes.length - 1]; }

function poly(pts, fill) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function rect(x, y, w, h, fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
function rrect(x, y, w, h, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 4; ctx.stroke(); }
}
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function glow(x, y, r, color, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); ctx.restore();
}
function vgrad(y0, y1, stops) { const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }

// 縁取りの太いテキスト(ショート動画向け)
function otext(str, x, y, { size = 80, font = F_HEAVY, fill = '#fff', stroke = '#111', sw = 14, align = 'center', alpha = 1, scale = 1, rot = 0, shadow = true, maxW = 0 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) { const k = maxW / w; ctx.scale(k, k); } }
  ctx.lineJoin = 'round';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8; }
  if (sw) { ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(str, 0, 0); }
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = fill; ctx.fillText(str, 0, 0);
  ctx.restore();
}

// ---------- 共通の背景部品 ----------
function ridge(y, amp, seed, color, step = 30) {
  const r = mulberry(seed); const ph = [r() * 6, r() * 6, r() * 6];
  ctx.beginPath(); ctx.moveTo(-50, H);
  for (let x = -50; x <= W + 50; x += step) {
    const yy = y - amp * (0.55 * Math.sin(x * 0.004 + ph[0]) + 0.3 * Math.sin(x * 0.011 + ph[1]) + 0.15 * Math.sin(x * 0.027 + ph[2]));
    ctx.lineTo(x, yy);
  }
  ctx.lineTo(W + 50, H); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
const MAPLE = ['#B3261E', '#D63A22', '#E8642A', '#F08A24', '#F5B13A', '#9E1F1A', '#C7462A'];
function makeTrees(seed, n, x0, x1, y0, y1, rmin, rmax, pal) {
  const r = mulberry(seed), out = [];
  for (let i = 0; i < n; i++) {
    const x = lerp(x0, x1, r()), y = lerp(y0, y1, r()), R = lerp(rmin, rmax, r());
    const blobs = [];
    for (let k = 0; k < 7; k++) blobs.push([x + (r() - 0.5) * R * 1.4, y + (r() - 0.5) * R, R * lerp(0.45, 0.75, r()), pal[Math.floor(r() * pal.length)]]);
    out.push({ y, blobs });
  }
  return out.sort((a, b) => a.y - b.y);
}
function drawTrees(list, t, sway = 1) {
  for (const tr of list) for (const [x, y, R, c] of tr.blobs) {
    const dx = Math.sin(t * 1.3 + y * 0.01) * 2 * sway;
    circle(x + dx + R * 0.15, y + R * 0.2, R, 'rgba(40,10,10,0.35)');
    circle(x + dx, y, R, c);
  }
}

// ---------- パーティクル ----------
function leaf(x, y, s, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) { const a = i / 60 * Math.PI * 2 - Math.PI / 2; const r = 10 * (0.45 + 0.55 * Math.abs(Math.cos(2.5 * (a + Math.PI / 2)))); ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function particles(t, kind, n = 40, a = 1) {
  const r = mulberry(kind === 'leaf' ? 3 : kind === 'gold' ? 5 : kind === 'ember' ? 9 : 7);
  ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < n; i++) {
    const x0 = r() * W, y0 = r() * H, sp = lerp(60, 160, r()), ph = r() * 6.28, sz = lerp(1.2, 3.0, r());
    if (kind === 'leaf') {
      const y = (y0 + t * sp) % (H + 80) - 40, x = (x0 + Math.sin(t * 1.4 + ph) * 60 + t * 30) % (W + 60) - 30;
      leaf(x, y, sz, t * 2 + ph, MAPLE[i % MAPLE.length]);
    } else if (kind === 'gold') {
      const y = (y0 + t * sp * 0.6) % (H + 40) - 20, x = x0 + Math.sin(t + ph) * 30;
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * 3 + ph); ctx.scale(Math.cos(t * 4 + ph), 1);
      ctx.fillStyle = i % 3 ? GOLD : '#FFF2B0'; ctx.fillRect(-sz * 4, -sz * 4, sz * 8, sz * 8); ctx.restore();
    } else if (kind === 'ember') {
      const y = H - ((H - y0 + t * sp * 2.2) % (H * 0.9)), x = x0 + Math.sin(t * 2 + ph) * 40;
      glow(x, y, sz * 9, i % 2 ? 'rgba(255,170,60,0.9)' : 'rgba(255,90,30,0.9)');
    } else { // 光の粒
      const y = y0 + Math.sin(t * 0.7 + ph) * 40, x = x0 + Math.cos(t * 0.5 + ph) * 40;
      glow(x, y, sz * 10, 'rgba(255,230,170,0.5)', 0.5 + 0.5 * Math.sin(t * 2 + ph));
    }
  }
  ctx.restore();
}

// ============ シーン: 清水寺 ============
const KY_TREES_BACK = makeTrees(11, 70, -60, 1140, 940, 1150, 40, 70, MAPLE);
const KY_TREES_FRONT = makeTrees(12, 60, -80, 1160, 1380, 1900, 70, 120, MAPLE);
const KY_TREES_MID = makeTrees(13, 26, -80, 260, 1000, 1450, 60, 100, MAPLE);
function pagoda(cx, base, w, floors, body, roof, s = 1) {
  let y = base;
  for (let i = 0; i < floors; i++) {
    const ww = w * (1 - i * 0.12) * s, hh = 52 * s;
    rect(cx - ww * 0.32, y - hh, ww * 0.64, hh, body);
    poly([[cx - ww * 0.62, y - hh + 6 * s], [cx + ww * 0.62, y - hh + 6 * s], [cx + ww * 0.4, y - hh - 14 * s], [cx - ww * 0.4, y - hh - 14 * s]], roof);
    y -= hh + 6 * s;
  }
  rect(cx - 3 * s, y - 70 * s, 6 * s, 80 * s, '#C9A24A');
  return y;
}
function drawKiyomizu(t, hi13 = 0) {
  ctx.fillStyle = vgrad(0, 1000, ['#1B2350', '#5A3A78', '#D9603E', '#F6B26B']); ctx.fillRect(0, 0, W, H);
  glow(800, 820, 520, 'rgba(255,200,120,0.75)');
  circle(800, 830, 70, 'rgba(255,236,190,0.95)');
  ridge(870, 70, 4, '#7B4B7A'); ridge(930, 60, 5, '#5D3A62'); ridge(990, 40, 6, '#3E2A48');
  drawTrees(KY_TREES_BACK, t, 0.5);
  // 三重塔(朱塗り)
  pagoda(150, 980, 170, 3, '#C8402A', '#2B2226', 1.0);
  // 本堂: 舞台下の懸造り
  const sx0 = 260, sx1 = 960, sy = 905, gy = 1360;
  for (let x = sx0 + 10; x <= sx1; x += 52) {
    rect(x, sy + 20, 16, gy - sy, '#6E4426'); rect(x, sy + 20, 6, gy - sy, '#8E5C34');
  }
  for (let y = sy + 90; y < gy; y += 105) {
    rect(sx0, y, sx1 - sx0 + 16, 16, '#7A4D2B'); rect(sx0, y, sx1 - sx0 + 16, 5, '#A06A3C');
  }
  if (hi13 > 0) { // 懸造りの格子を光らせる
    ctx.save(); ctx.globalAlpha = hi13 * (0.55 + 0.45 * Math.sin(t * 8)); ctx.strokeStyle = YEL; ctx.lineWidth = 5; ctx.shadowColor = YEL; ctx.shadowBlur = 20;
    for (let x = sx0 + 10; x <= sx1; x += 52) ctx.strokeRect(x, sy + 20, 16, gy - sy);
    for (let y = sy + 90; y < gy; y += 105) ctx.strokeRect(sx0, y, sx1 - sx0 + 16, 16);
    ctx.restore();
  }
  // 舞台(床と欄干)
  rect(sx0 - 10, sy, sx1 - sx0 + 40, 26, '#9B6A3E'); rect(sx0 - 10, sy, sx1 - sx0 + 40, 7, '#C79563');
  rect(sx0 - 10, sy - 34, sx1 - sx0 + 40, 7, '#7A4D2B');
  for (let x = sx0; x <= sx1 + 20; x += 34) rect(x, sy - 34, 6, 34, '#7A4D2B');
  // 本堂の建物と屋根
  rect(150, 760, 520, 150, '#5C3A22');
  for (let x = 165; x < 660; x += 46) rect(x, 770, 10, 140, '#8E5C34');
  rect(150, 760, 520, 30, '#E9DFC8');
  poly([[70, 770], [750, 770], [640, 640], [180, 640]], '#3A2E2A');
  poly([[70, 770], [750, 770], [760, 755], [60, 755]], '#5A4A40');
  poly([[180, 640], [640, 640], [600, 610], [220, 610]], '#2A2120');
  drawTrees(KY_TREES_MID, t, 0.8);
  drawTrees(KY_TREES_FRONT, t, 1);
}

// ============ シーン: 金閣寺 ============
const KK_PINES = (() => { const r = mulberry(21), out = []; for (let i = 0; i < 18; i++) { const left = i % 2 === 0; out.push({ x: left ? lerp(-60, 250, r()) : lerp(830, 1140, r()), y: lerp(760, 1000, r()), s: lerp(0.8, 1.4, r()) }); } return out; })();
function pine(x, y, s) {
  rect(x - 6 * s, y - 120 * s, 12 * s, 130 * s, '#3B2A1E');
  for (let k = 0; k < 4; k++) { const yy = y - 120 * s + k * 26 * s, ww = (90 - k * 6) * s; ctx.beginPath(); ctx.ellipse(x + (k % 2 ? 22 : -22) * s, yy, ww, 20 * s, 0, 0, Math.PI * 2); ctx.fillStyle = k % 2 ? '#1F4A2E' : '#2A5E3A'; ctx.fill(); }
}
function goldFill(y0, y1, t, shine) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, '#FFE08A'); g.addColorStop(0.5, '#D9A12B'); g.addColorStop(1, '#A87414');
  return g;
}
function drawKinkakuWorld(t, fire, shine) {
  ctx.fillStyle = vgrad(0, 1010, ['#2D6CC0', '#6FA6DE', '#F4D9A0']); ctx.fillRect(0, 0, W, 1010);
  glow(260, 300, 300, 'rgba(255,250,220,0.6)');
  ridge(880, 120, 31, '#3E6B4A', 20); ridge(950, 60, 32, '#2D5238', 20);
  for (const p of KK_PINES) pine(p.x, p.y + 30, p.s);
  const cx = 540, base = 1000;
  // 1層目(白木と白壁)
  rect(cx - 180, base - 100, 360, 100, '#E8DFC8');
  for (let x = cx - 175; x < cx + 180; x += 45) rect(x, base - 100, 10, 100, '#6B4A2E');
  poly([[cx - 225, base - 100], [cx + 225, base - 100], [cx + 190, base - 125], [cx - 190, base - 125]], '#3A2A1C');
  // 2層目(金)
  const g2 = goldFill(base - 215, base - 125);
  rect(cx - 165, base - 210, 330, 85, g2);
  for (let x = cx - 160; x < cx + 165; x += 40) rect(x, base - 205, 6, 80, 'rgba(120,70,0,0.45)');
  rect(cx - 175, base - 140, 350, 10, '#B9860F');
  poly([[cx - 215, base - 210], [cx + 215, base - 210], [cx + 175, base - 235], [cx - 175, base - 235]], '#3A2A1C');
  rect(cx - 215, base - 214, 430, 5, GOLD);
  // 3層目(金)
  rect(cx - 110, base - 315, 220, 80, goldFill(base - 315, base - 235));
  for (let x = cx - 100; x < cx + 110; x += 40) rect(x, base - 305, 6, 70, 'rgba(120,70,0,0.45)');
  poly([[cx - 165, base - 312], [cx + 165, base - 312], [cx + 40, base - 400], [cx - 40, base - 400]], '#3A2A1C');
  rect(cx - 165, base - 316, 330, 5, GOLD);
  // 鳳凰
  ctx.save(); ctx.translate(cx, base - 410); ctx.fillStyle = GOLD;
  ctx.beginPath(); ctx.moveTo(0, 10); ctx.quadraticCurveTo(-30, -30, -10, -40); ctx.quadraticCurveTo(0, -20, 10, -40); ctx.quadraticCurveTo(30, -30, 0, 10); ctx.fill(); ctx.restore();
  // 金色の輝き(シャインが左→右へ流れる)
  if (shine > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(cx - 170, base - 420, 340, 300); ctx.clip();
    const sx = lerp(cx - 300, cx + 300, (t * 0.7) % 1);
    const g = ctx.createLinearGradient(sx - 60, 0, sx + 60, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, `rgba(255,255,240,${0.8 * shine})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - 170, base - 420, 340, 300); ctx.restore();
    glow(cx, base - 260, 380, `rgba(255,215,90,${0.45 * shine})`);
  }
  // 中島と岩
  ctx.beginPath(); ctx.ellipse(170, 1012, 140, 22, 0, 0, Math.PI * 2); ctx.fillStyle = '#4C5A3A'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(900, 1010, 120, 18, 0, 0, Math.PI * 2); ctx.fillStyle = '#556244'; ctx.fill();
  // 炎(1950 年の焼失)
  if (fire > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const r = mulberry(77);
    for (let i = 0; i < 70; i++) {
      const x0 = cx + (r() - 0.5) * 420, sp = lerp(160, 360, r()), life = lerp(0.6, 1.2, r()), ph = r() * life;
      const k = ((t + ph) % life) / life, y = base - 40 - k * sp * 1.6;
      const R = lerp(70, 10, k) * fire * lerp(0.7, 1.3, r());
      glow(x0 + Math.sin(t * 6 + i) * 18 * k, y, R, k < 0.4 ? 'rgba(255,220,120,0.9)' : 'rgba(255,90,20,0.8)');
    }
    ctx.restore();
  }
}
function drawKinkaku(t, fire, shine) {
  ctx = octx; ctx.clearRect(0, 0, W, H); drawKinkakuWorld(t, fire, shine); ctx = mctx;
  ctx.drawImage(off, 0, 0, W, 1010, 0, 0, W, 1010);
  const wy = 1010;
  ctx.fillStyle = vgrad(wy, H, ['#1D4A5E', '#0E2A3A']); ctx.fillRect(0, wy, W, H - wy);
  ctx.save(); ctx.globalAlpha = 0.62;
  for (let y = 0; y < H - wy; y += 4) {
    const src = wy - y * 1.05 - 4; if (src < 0) break;
    const dx = Math.sin(y * 0.09 + t * 3.2) * (1.5 + y * 0.025);
    ctx.drawImage(off, 0, src, W, 4, dx, wy + y, W, 4);
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(20,60,80,0.25)'; ctx.fillRect(0, wy, W, H - wy);
  // 水面のきらめき
  ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = '#E8F4FF';
  const r = mulberry(8);
  for (let i = 0; i < 40; i++) { const x = r() * W, y = wy + 10 + r() * 700, w = lerp(20, 70, r()); const a = 0.5 + 0.5 * Math.sin(t * 3 + i); ctx.globalAlpha = 0.25 * a; ctx.fillRect(x + Math.sin(t + i) * 10, y, w, 3); }
  ctx.restore();
  // 手前の松(シルエット)
  for (const [x, y, s] of [[60, 1950, 2.6], [1040, 1980, 2.9]]) pine(x, y, s);
}

// ============ シーン: 伏見稲荷(千本鳥居を進むカメラ) ============
function drawInari(t) {
  const vx = 540, vy = 930, F = 520;
  ctx.fillStyle = vgrad(0, H, ['#0E1A12', '#1E3A24', '#2E4A2C', '#3A3020']); ctx.fillRect(0, 0, W, H);
  glow(vx, vy, 420, 'rgba(255,245,210,0.95)');
  glow(vx, vy, 160, 'rgba(255,255,255,1)');
  // 石畳の参道
  const pg = ctx.createLinearGradient(0, vy, 0, H); pg.addColorStop(0, '#9C9080'); pg.addColorStop(1, '#4A4038');
  poly([[vx - 12, vy + 20], [vx + 12, vy + 20], [W + 300, H], [-300, H]], pg);
  const spacing = 1.0, camZ = t * 2.4;
  const first = Math.floor(camZ / spacing) + 1;
  for (let i = first + 26; i >= first; i--) {
    const z = i * spacing - camZ; if (z < 0.35) continue;
    const s = F / z;  // 画面上のスケール
    const halfW = 1.05 * s, top = vy - 1.9 * s + 300 / z * 0.0, ground = vy + 1.15 * s;
    const fade = clamp(1 - z / 26);
    const pw = 0.13 * s;
    const col = `rgba(${Math.round(lerp(255, 226, fade))},${Math.round(lerp(240, 66, fade))},${Math.round(lerp(220, 31, fade))},1)`;
    const dark = `rgba(${Math.round(lerp(240, 30, fade))},${Math.round(lerp(230, 22, fade))},${Math.round(lerp(210, 20, fade))},1)`;
    // 柱
    rect(vx - halfW - pw / 2, top, pw, ground - top, col);
    rect(vx + halfW - pw / 2, top, pw, ground - top, col);
    rect(vx - halfW - pw / 2, ground - 0.22 * s, pw, 0.22 * s, dark);
    rect(vx + halfW - pw / 2, ground - 0.22 * s, pw, 0.22 * s, dark);
    // 内側の影
    rect(vx - halfW - pw / 2 + pw * 0.65, top, pw * 0.35, ground - top, `rgba(0,0,0,${0.35 * fade})`);
    rect(vx + halfW - pw / 2, top, pw * 0.3, ground - top, `rgba(0,0,0,${0.25 * fade})`);
    // 貫
    rect(vx - halfW - 0.18 * s, top + 0.32 * s, 2 * halfW + 0.36 * s, 0.1 * s, col);
    // 笠木(黒)と島木
    poly([[vx - halfW - 0.42 * s, top - 0.02 * s], [vx + halfW + 0.42 * s, top - 0.02 * s], [vx + halfW + 0.36 * s, top - 0.14 * s], [vx - halfW - 0.36 * s, top - 0.14 * s]], dark);
    rect(vx - halfW - 0.3 * s, top - 0.02 * s, 2 * halfW + 0.6 * s, 0.1 * s, col);
    // 柱の奉納文字(黒い縦線で表現)
    if (fade > 0.5 && s > 60) {
      ctx.fillStyle = `rgba(20,10,10,${0.6 * fade})`;
      for (let k = 0; k < 6; k++) ctx.fillRect(vx - halfW - pw * 0.12, top + 0.55 * s + k * 0.12 * s, pw * 0.24, 0.08 * s);
    }
  }
  // 木漏れ日
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) { const x = 140 + i * 160 + Math.sin(t * 0.5 + i) * 30; ctx.fillStyle = 'rgba(255,240,200,0.05)'; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 80, 0); ctx.lineTo(x + 300, H); ctx.lineTo(x + 180, H); ctx.fill(); }
  ctx.restore();
}

// ============ シーン: 八坂の塔(エンディング) ============
function drawYasaka(t) {
  ctx.fillStyle = vgrad(0, 1150, ['#131A3A', '#3B2C66', '#B04E6A', '#F29A5E']); ctx.fillRect(0, 0, W, H);
  // 星
  const r = mulberry(41); ctx.fillStyle = '#fff';
  for (let i = 0; i < 60; i++) { ctx.globalAlpha = 0.3 + 0.3 * Math.sin(t * 2 + i); ctx.fillRect(r() * W, r() * 500, 3, 3); } ctx.globalAlpha = 1;
  ridge(1000, 60, 42, '#2C2140');
  // 五重塔(シルエット + ライトアップ)
  glow(540, 760, 360, 'rgba(255,170,90,0.35)');
  pagoda(540, 1080, 300, 5, '#4A2418', '#1A1216', 1.0);
  // 坂道と町家
  const vx = 540, vy = 1080;
  poly([[vx - 60, vy], [vx + 60, vy], [W + 200, H], [-200, H]], vgrad(vy, H, ['#5A4A52', '#2A2026']));
  for (const side of [-1, 1]) {
    for (let k = 0; k < 7; k++) {
      const z = 1 + k * 0.9, s = 1 / z;
      const xIn = vx + side * (90 + 700 * s), xOut = vx + side * (90 + 1300 * s);
      const yTop = vy - 420 * s, yBot = vy + 900 * s;
      poly([[xIn, yTop + 40 * s], [xOut, yTop], [xOut, yBot], [xIn, yBot - 10 * s]], k % 2 ? '#2A1E22' : '#33252A');
      // 格子窓の明かり
      ctx.save(); ctx.globalAlpha = 0.85;
      ctx.fillStyle = 'rgba(255,190,110,0.55)';
      const wx = lerp(xIn, xOut, 0.25), ww = (xOut - xIn) * 0.5;
      ctx.fillRect(Math.min(wx, wx + ww), yTop + 260 * s, Math.abs(ww), 200 * s);
      ctx.restore();
      // 提灯
      const lx = xIn + side * 30 * s, ly = yTop + 140 * s;
      glow(lx, ly, 160 * s, 'rgba(255,170,80,0.8)');
      ctx.beginPath(); ctx.ellipse(lx, ly, 34 * s, 50 * s, 0, 0, Math.PI * 2); ctx.fillStyle = '#FFD7A0'; ctx.fill();
      ctx.fillStyle = '#C0392B'; ctx.fillRect(lx - 30 * s, ly - 6 * s, 60 * s, 12 * s);
    }
  }
}

function captionLine(str, x, y, size, alpha, scale) {

  const fl = s.id === 'hook' ? 0 : Math.exp(-since / 0.07);
  if (fl > 0.01) { ctx.fillStyle = `rgba(255,255,255,${0.85 * fl})`; ctx.fillRect(0, 0, W, H); }
  // 進捗バー
  rect(0, 0, W, 12, 'rgba(255,255,255,0.18)'); rect(0, 0, W * t / DURATION, 12, YEL);
}
window.render = render; window.FPS = FPS; window.DURATION = DURATION;

// ブラウザで開いたときはプレビュー再生
if (!navigator.webdriver) {
  const t0 = performance.now();
  document.fonts.ready.then(() => { (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
}
</script>
