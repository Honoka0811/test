  const k5 = prog(t, EV.five, EV.five + 0.18); if (k5 > 0) { ctx.save(); ctx.translate(fx, 170 + (hash(f) - 0.5) * 8); ctx.scale(lerp(2, 1.15, ease(k5)), lerp(2, 1.15, ease(k5))); ctx.lineWidth = 18; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineJoin = 'round'; ctx.strokeText('5', 0, 0); ctx.fillStyle = RED; ctx.shadowColor = RED; ctx.shadowBlur = 30; ctx.fillText('5', 0, 0); ctx.restore(); }
  if (dark > 0) { ctx.fillStyle = `rgba(10,2,16,${0.5 * dark})`; ctx.fillRect(0, 0, W, H); }
  const v = ctx.createLinearGradient(0, 1300, 0, 1560); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.9)'); ctx.fillStyle = v; ctx.fillRect(0, 1300, W, 700);
}

// ---- 字幕 ----
function subtitle(t) {
  const l = D.lines.find(l => l.kind !== 'kid' && t >= l.start - 0.08 && t < l.end + 0.3); if (!l) return;
  const a = Math.min(prog(t, l.start - 0.08, l.start + 0.1), 1 - prog(t, l.end + 0.15, l.end + 0.3));
  const rows = l.text.split('\n').map(r => { const segs = []; r.split(/(\[[^\]]*\])/).forEach(p => { if (!p) return; segs.push(p[0] === '[' ? { s: p.slice(1, -1), red: true } : { s: p, red: false }); }); return segs; });
  let fs = l.id === 'now' ? 130 : 66; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
  const width = r => r.reduce((w, s) => w + ctx.measureText(s.s).width, 0);
  ctx.font = `800 ${fs}px ${MIN}`; const mw = Math.max(...rows.map(width)); if (mw > 960) { fs = Math.floor(fs * 960 / mw); ctx.font = `800 ${fs}px ${MIN}`; }
  const lh = fs * 1.42, y0 = 1480 - (rows.length - 1) * lh / 2, f = Math.round(t * FPS);
  ctx.save(); ctx.globalAlpha = a;
  rows.forEach((r, i) => {
    let x = W / 2 - width(r) / 2; const y = y0 + i * lh + (l.id === 'now' ? (hash(f) - 0.5) * 8 : 0);
    r.forEach(s => { ctx.strokeStyle = 'rgba(0,0,0,0.95)'; ctx.lineWidth = fs * 0.2; ctx.strokeText(s.s, x, y); ctx.fillStyle = s.red ? RED : '#fff'; ctx.shadowColor = s.red ? 'rgba(255,0,0,0.7)' : 'rgba(0,0,0,0)'; ctx.shadowBlur = s.red ? 18 : 0; ctx.fillText(s.s, x, y); ctx.shadowBlur = 0; x += ctx.measureText(s.s).width; });
  });
  ctx.restore();
}

function render(t) {
  const f = Math.round(t * FPS);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let grain = 0.11;
  const fadeIn = (a, d = 0.35) => { const k = 1 - prog(t, a, a + d); if (k > 0) { ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(0, 0, W, H); } };
  const breathe = { sx: Math.sin(t * 0.5) * 6, sy: Math.sin(t * 0.37 + 1) * 5 };
  const HID = [[800, 1100], [742, 1052], [905, 1104]], OUT = [[760, 1104], [690, 1066], [860, 1108]];      // 友達3人の隠れ場所と、出てきた位置
  if (t < EV.hit) {
    if (t < EV.t_oni) {           // 夕暮れの神社。鳥居ごしに、ゆっくり近づく
      const k = prog(t, 0, EV.t_oni); shrine(t, f, { z: lerp(1, 1.22, k), cx: 540, cy: lerp(860, 900, k), ...breathe }, { dusk: 0,
        kids: () => { if (t > LN.l1.start) { kid(ctx, 335, 1108, 150, { ...KIDS[0], armL: 'eyes', armR: 'eyes' }); } } }); fadeIn(0, 0.7); }
    else if (t < EV.t_dusk) {     // 「もういいかい」→ 3人の返事 → 1人ずつ見つける
      const k = ease(prog(t, EV.t_oni, EV.t_oni + 1.2)), k2 = ease(prog(t, LN.r3.end - 0.1, LN.l3.start + 0.3)), z = lerp(lerp(1.22, 1.5, k), 2.05, k2) + 0.05 * prog(t, EV.t_oni, EV.t_dusk), ccx = lerp(lerp(540, 525, k), 665, k2), ccy = lerp(lerp(900, 985, k), 1010, k2);
      const seek = ease(prog(t, LN.r3.end, LN.l3.start + 0.1)), ox = lerp(335, 470, seek), found = EV.found.map(tf => ease(prog(t, tf, tf + 0.4)));
      shrine(t, f, { z, cx: ccx, cy: ccy, ...breathe }, { dusk: 0.12 * prog(t, EV.t_oni, EV.t_dusk),
        kidsFar: () => { if (found[1] > 0) kid(ctx, lerp(HID[1][0], OUT[1][0], found[1]), OUT[1][1], 124, { ...KIDS[2], crouch: 1 - found[1], armL: -1.2 * found[1] + 1.6 }); },
        kids: () => {
          const nearest = found[2] > 0 ? 2 : found[1] > 0 ? 1 : found[0] > 0 ? 0 : -1;
          kid(ctx, ox, 1108, 150, { ...KIDS[0], armL: seek < 0.05 ? 'eyes' : undefined, armR: seek < 0.05 ? 'eyes' : nearest >= 0 ? -0.35 : undefined, walk: t * 9, amp: seek > 0.02 && seek < 0.98 ? 0.9 : 0 });
          if (found[0] > 0) kid(ctx, lerp(HID[0][0], OUT[0][0], found[0]), OUT[0][1], 142, { ...KIDS[1], crouch: 1 - found[0] });
          if (found[2] > 0) kid(ctx, lerp(HID[2][0], OUT[2][0], found[2]), OUT[2][1], 146, { ...KIDS[3], crouch: 1 - found[2] }); } });
      // 返事は、隠れている場所から聞こえる
      const P2 = (x, y) => [540 + (x - ccx) * z, 860 + (y - ccy) * z];
      EV.replies.forEach((tr, i) => { const p = P2(HID[i][0] - (i === 2 ? -20 : 30), HID[i][1] - 200); floatText('もういいよ', clamp(p[0], 170, 910), p[1], tr, t, '#fff', 60); });
      EV.found.forEach((tf, i) => { const p = P2(OUT[i][0], OUT[i][1] - 200); floatText('みーつけた', clamp(p[0], 170, 910), p[1] - i * 30, tf + 0.1, t, '#ffe9b0', 52); });
    }
    else if (t < EV.t_run) {      // 日が暮れる。帰ろうとすると、拝殿の奥から声がする
      const k = prog(t, EV.t_dusk, EV.t_run), d = ease(prog(t, EV.t_dusk, EV.extra)), sc = prog(t, EV.extra, EV.extra + 0.4), shv = sc > 0 ? Math.sin(t * 40) * 1.5 * (1 - prog(t, EV.extra, EV.t_run)) : 0;
      shrine(t, f, { z: lerp(2.1, 2.7, ease(prog(t, EV.extra - 0.6, EV.t_run))), cx: lerp(665, 540, ease(prog(t, EV.t_dusk, EV.t_dusk + 1.5))), cy: lerp(1010, 985, ease(k)), sx: breathe.sx + shv, sy: breathe.sy }, { dusk: 0.12 + 0.88 * d, open: ease(prog(t, EV.extra - 0.2, EV.extra + 1.6)), windy: 1 - sc,
        kids: () => { const turn = ease(prog(t, EV.extra + 0.1, EV.extra + 0.5)); [[420, 1118], [500, 1122], [585, 1118], [668, 1124]].forEach((p, i) => kid(ctx, p[0], p[1], KIDS[i].h, { ...KIDS[i], bag: true, tilt: (i < 2 ? 0.14 : -0.14) * turn, walk: t * 8, amp: turn > 0 ? 0 : 0.5 * (1 - prog(t, EV.t_dusk, EV.t_dusk + 2.2)) })); } });
      }
    else if (t < EV.t_road) {     // 走って逃げる。振り返ると、神社が遠ざかっていく
      const k = prog(t, EV.t_run, EV.t_road), ph = t * 21;
      shrine(t, f, { z: lerp(2.6, 0.78, ease(k)), cx: 540, cy: lerp(985, 880, k), sx: Math.sin(ph * 0.5) * 34, sy: Math.abs(Math.sin(ph)) * 46, rot: Math.sin(ph * 0.5) * 0.02 }, { dusk: 1, open: 1, windy: 2 });
      ctx.globalAlpha = 0.35; ctx.drawImage(cv, 0, 26); ctx.globalAlpha = 1; fadeIn(EV.t_run, 0.15); const o = prog(t, EV.t_road - 0.3, EV.t_road); if (o > 0) { ctx.fillStyle = `rgba(0,0,0,${o})`; ctx.fillRect(0, 0, W, H); } }
    else {                        // 帰り道の影を数える
      roadScene(t, f, { look: ease(prog(t, EV.stop, EV.stop + 0.5)) }); fadeIn(EV.t_road, 0.5);
      const z = Math.max(0, 1 - Math.abs(t - EV.five - 0.05) / 0.3); if (z && t >= EV.five) { ctx.fillStyle = `rgba(255,30,30,${0.22 * z})`; ctx.fillRect(0, 0, W, H); }
      if (t >= LN.now.start - 0.1) ctx.drawImage(cv, (hash(f) - 0.5) * 10, (hash(f + 2) - 0.5) * 10); }
  } else if (t < EV.hit + 0.5) {
    const k = (t - EV.hit) / 0.5; roadScene(EV.hit - 0.01, f, { look: 1, px: 60 + 500 * k, grow: 1 + 3 * k });
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = f % 2 ? '#ff4038' : '#ffffff'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 9; i++) { const y = hash(f * 3 + i) * H | 0, h = 30 + hash(f + i) * 140 | 0, dx = (hash(f * 7 + i) - 0.5) * 400 | 0; ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); }
    grain = 0.3;
  } else {
    if (t < EV.hit + 0.6) noise(0.7, f, 5, 'source-over');
    const a = prog(t, EV.hit + 0.7, EV.hit + 1.0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 64px ${MIN}`; ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillText('かくれんぼは', W / 2, 860);
    ctx.fillStyle = `rgba(255,43,43,${a})`; ctx.fillText('全員、見つけてから帰ること。', W / 2, 960);
    ctx.font = `800 38px ${MIN}`; ctx.fillStyle = `rgba(190,190,190,${a * 0.85})`; ctx.fillText('ナレーション  VOICEVOX:四国めたん', W / 2, 1250);
  }
  subtitle(t);
  noise(grain, f + 17, 2, 'overlay');
  const v = ctx.createRadialGradient(W / 2, H / 2, 540, W / 2, H / 2, 1180); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

window.FPS = FPS; window.DURATION = DURATION; window.render = render;
window.ready = document.fonts.load(`800 60px "Shippori Mincho"`, D.lines.map(l => l.text).join('') + 'もういいよみーつけた…かくれんぼは全員、見つけてから帰ること。ナレーション四国めたん0123456789').then(() => document.fonts.ready);
if (!navigator.webdriver) window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
</script></body></html>
