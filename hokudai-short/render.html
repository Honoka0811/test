<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Hokudai Top 10</title>
<style>
  html,body{margin:0;background:#0b2e24;}
  canvas{display:block;max-height:100vh;margin:0 auto;}
</style>
<script src="output/timeline.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ------------------------------------------------------------
// 北海道大学のここがすごい！10選 (9:16 ショート動画)
// render(t) は時刻 t[秒] のフレームを決定論的に描画する。
// シーンの開始時刻・長さは tts.py が書き出す output/timeline.js(ナレーション長)に従う。
// ------------------------------------------------------------
const W = 1080, H = 1920, FPS = 30;
const TL = window.TL || { total: 53, scenes: Array.from({ length: 12 }, (_, i) => ({ start: i * 4.4, dur: 4.4, sub: '' })) };
const DURATION = TL.total;
window.FPS = FPS; window.DURATION = DURATION;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"IPAPGothic","IPAGothic",sans-serif';
const C = {
  bg1: '#0e3d30', bg2: '#06231b', panel: '#f7f4ea', panelInk: '#163a2f',
  ink: '#ffffff', ink2: '#cfe3da', gold: '#F2C230', gold2: '#d99a16',
  red: '#E5544B', sky: '#8fd0f0', brown: '#8a5a3b', green: '#2f8f5b', green2: '#5cbf7f'
};

// ---------- 10選の中身 ----------
const ITEMS = [
  { big: '徒歩{n}分', n: 7, small: 'JR札幌駅から正門まで', icon: 'train' },
  { big: '東京ドーム{n}個分', n: 38, small: '札幌キャンパス 約177ha', icon: 'bike' },
  { big: '約{n}km²', n: 660, small: '東京23区(約627km²)より広い', icon: 'forest' },
  { big: '{n}年 創基', n: 1876, small: '札幌農学校 → 2026年で150周年', icon: 'clock' },
  { big: 'Boys, be ambitious!', small: '初代教頭 W.S.クラーク博士', icon: 'quote' },
  { big: '旧5千円札の顔', small: '新渡戸稲造も札幌農学校の出身', icon: 'bill' },
  { big: 'ノーベル化学賞', small: '2010年 鈴木章 名誉教授', icon: 'medal' },
  { big: '総合入試', small: '入学後に学部を選べる', icon: 'sign' },
  { big: 'イチョウ並木', small: '北13条 約70本・約380m', icon: 'ginkgo' },
  { big: '入場無料', small: '北海道大学総合博物館', icon: 'museum' },
];

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeBack = t => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const seg = (t, s, d) => clamp((t - s) / d);
const lerp = (a, b, t) => a + (b - a) * t;
function hash(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function setFont(size, weight = 'bold') { ctx.font = `${weight} ${size}px ${FONT}`; }
function fitSize(str, size, maxW, weight = 'bold') { setFont(size, weight); const w = ctx.measureText(str).width; return w > maxW ? size * maxW / w : size; }
function text(str, x, y, { size = 48, weight = 'bold', color = C.ink, align = 'center', base = 'alphabetic', alpha = 1, stroke = null, sw = 10, maxW = 0, shadow = 0 } = {}) {
  ctx.save();
  ctx.globalAlpha = alpha;
  if (maxW) size = fitSize(str, size, maxW, weight);
  setFont(size, weight);
  ctx.textAlign = align; ctx.textBaseline = base;
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = shadow; ctx.shadowOffsetY = shadow / 3; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.strokeText(str, x, y); ctx.shadowColor = 'transparent'; }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.restore();
}
function rrect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fillR(x, y, w, h, r, color, alpha = 1) { ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; rrect(x, y, w, h, r); ctx.fill(); ctx.restore(); }
function circle(x, y, r, color) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }
function poly(pts, color) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fillStyle = color; ctx.fill(); }
function stroke(color, w) { ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }

// ---------- 背景: グラデーション + 雪 ----------
function background(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 斜めのストライプ(ゆっくり流れる)
  ctx.save(); ctx.globalAlpha = 0.05; ctx.fillStyle = '#ffffff';
  const off = (t * 30) % 160;
  for (let x = -H; x < W + H; x += 160) { ctx.beginPath(); ctx.moveTo(x + off, 0); ctx.lineTo(x + off + 60, 0); ctx.lineTo(x + off + 60 - H * 0.5, H); ctx.lineTo(x + off - H * 0.5, H); ctx.fill(); }
  ctx.restore();
  // 雪
  for (let i = 0; i < 70; i++) {
    const sp = 40 + hash(i) * 90, r = 3 + hash(i + 9) * 6;
    const y = ((hash(i + 3) * H + t * sp) % (H + 40)) - 20;
    const x = (hash(i + 5) * W + Math.sin(t * (0.5 + hash(i + 7)) + i) * 30 + W) % W;
    ctx.globalAlpha = 0.25 + hash(i + 11) * 0.45; circle(x, y, r, '#ffffff');
  }
  ctx.globalAlpha = 1;
}

// ---------- アイコン(中心 0,0 / 約 ±200px) ----------
function ginkgoLeaf(x, y, s, rot, color = C.gold) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-70, -30, -95, -95, -60, -120);
  ctx.quadraticCurveTo(-30, -135, -5, -110); ctx.lineTo(0, -95); ctx.lineTo(5, -110);
  ctx.quadraticCurveTo(30, -135, 60, -120);
  ctx.bezierCurveTo(95, -95, 70, -30, 0, 0); ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 45); stroke(C.gold2, 8);
  ctx.restore();
}
const ICONS = {
  train(t) {
    ctx.save(); ctx.translate(0, Math.sin(t * 12) * 3);
    fillR(-150, -170, 300, 300, 60, '#3aa36b');
    fillR(-115, -130, 230, 120, 20, C.sky);
    fillR(-150, 20, 300, 26, 0, '#ffffff');
    circle(-85, 85, 22, C.gold); circle(85, 85, 22, C.gold);
    fillR(-40, 70, 80, 30, 10, '#1f6e47');
    ctx.restore();
    ctx.beginPath(); ctx.moveTo(-200, 175); ctx.lineTo(200, 175); stroke('#ffffff', 10);
    for (let i = -3; i <= 3; i++) { ctx.beginPath(); ctx.moveTo(i * 60 - 20, 195); ctx.lineTo(i * 60 + 20, 195); stroke('rgba(255,255,255,0.6)', 8); }
    // 「7min」タグ
    fillR(110, -230, 150, 76, 38, C.red); text('7min', 185, -180, { size: 40, color: '#fff' });
  },
  bike(t) {
    const rot = t * 4;
    const wheel = (x) => {
      ctx.beginPath(); ctx.arc(x, 60, 85, 0, Math.PI * 2); stroke('#ffffff', 14);
      for (let k = 0; k < 6; k++) { const a = rot + k * Math.PI / 3; ctx.beginPath(); ctx.moveTo(x, 60); ctx.lineTo(x + Math.cos(a) * 80, 60 + Math.sin(a) * 80); stroke('rgba(255,255,255,0.55)', 4); }
    };
    wheel(-130); wheel(130);
    ctx.beginPath(); ctx.moveTo(-130, 60); ctx.lineTo(-40, -60); ctx.lineTo(90, -60); ctx.lineTo(130, 60); ctx.moveTo(-40, -60); ctx.lineTo(10, 60); ctx.lineTo(90, -60); ctx.moveTo(-130, 60); ctx.lineTo(10, 60); stroke(C.gold, 14);
    ctx.beginPath(); ctx.moveTo(-40, -60); ctx.lineTo(-55, -100); ctx.moveTo(-85, -100); ctx.lineTo(-20, -100); stroke('#ffffff', 14);
    ctx.beginPath(); ctx.moveTo(90, -60); ctx.lineTo(80, -120); ctx.lineTo(130, -135); stroke('#ffffff', 14);
    // ドーム
    ctx.save(); ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.ellipse(0, -200, 120, 55, 0, Math.PI, 0); ctx.fillStyle = '#e9eef0'; ctx.fill();
    fillR(-120, -202, 240, 18, 4, '#c9d3d6');
    ctx.restore();
    text('×38', 170, -190, { size: 56, color: C.gold });
  },
  forest(t) {
    for (let i = 0; i < 7; i++) {
      const x = -210 + i * 70, h = 170 + hash(i + 2) * 110, sway = Math.sin(t * 2 + i) * 4;
      const y0 = 150 - (i % 2) * 30;
      fillR(x - 10, y0 - 30, 20, 50, 4, C.brown);
      poly([x + sway, y0 - h, x - 55, y0 - 20, x + 55, y0 - 20], i % 2 ? C.green2 : C.green);
    }
    fillR(-240, 150, 480, 24, 12, '#ffffff');
    text('660km²', 0, -210, { size: 64, color: C.gold });
  },
  clock(t) {
    // 時計台(札幌農学校の演武場として建てられた)
    poly([-150, -20, 150, -20, 0, -110], C.red);
    fillR(-140, -20, 280, 220, 6, '#ffffff');
    for (let i = 0; i < 3; i++) fillR(-110 + i * 80, 20, 50, 70, 4, '#7bb7d9');
    fillR(-40, 120, 80, 80, 4, '#9e6b45');
    fillR(-60, -230, 120, 130, 6, '#ffffff');
    poly([-75, -230, 75, -230, 0, -300], C.red);
    circle(0, -165, 44, '#f3efe3'); ctx.beginPath(); ctx.arc(0, -165, 44, 0, Math.PI * 2); stroke('#163a2f', 6);
    const a = t * 2;
    ctx.beginPath(); ctx.moveTo(0, -165); ctx.lineTo(Math.sin(a) * 32, -165 - Math.cos(a) * 32); stroke('#163a2f', 6);
    ctx.beginPath(); ctx.moveTo(0, -165); ctx.lineTo(Math.sin(a / 12) * 22, -165 - Math.cos(a / 12) * 22); stroke('#163a2f', 8);
    fillR(130, -280, 150, 80, 40, C.gold); text('150th', 205, -226, { size: 40, color: '#163a2f' });
  },
  quote(t) {
    ctx.save(); ctx.rotate(Math.sin(t * 3) * 0.03);
    fillR(-230, -190, 460, 260, 40, '#ffffff');
    poly([-80, 60, -10, 60, -120, 150], '#ffffff');
    text('少年よ', 0, -90, { size: 72, color: C.panelInk });
    text('大志を抱け', 0, 10, { size: 72, color: C.panelInk });
    ctx.restore();
    // 指さし(クラーク像のポーズ)を矢印で表現
    ctx.save(); ctx.translate(170, 150); ctx.rotate(-0.6 + Math.sin(t * 4) * 0.05);
    fillR(-20, -10, 140, 34, 17, C.gold); poly([120, -30, 175, 7, 120, 44], C.gold);
    ctx.restore();
  },
  bill(t) {
    ctx.save(); ctx.rotate(-0.08 + Math.sin(t * 2) * 0.03);
    fillR(-230, -130, 460, 250, 18, '#c8b6d8');
    ctx.beginPath(); rrect(-210, -110, 420, 210, 12); stroke('#7d6595', 6);
    circle(90, -5, 70, '#e7dcef');
    // 人物シルエット
    circle(90, -25, 30, '#7d6595'); ctx.beginPath(); ctx.ellipse(90, 50, 52, 38, 0, Math.PI, 0); ctx.fillStyle = '#7d6595'; ctx.fill();
    text('5000', -100, 10, { size: 72, color: '#5b4572' });
    text('円', -100, 70, { size: 40, color: '#5b4572' });
    ctx.restore();
    fillR(-260, -230, 130, 70, 35, C.red); text('旧', -195, -180, { size: 44, color: '#fff' });
  },
  medal(t) {
    poly([-90, -230, -20, -230, 40, -60, -30, -60], C.red);
    poly([90, -230, 20, -230, -40, -60, 30, -60], '#3f7fd0');
    const s = 1 + Math.sin(t * 3) * 0.02;
    ctx.save(); ctx.scale(s, s);
    circle(0, 40, 130, C.gold2); circle(0, 40, 108, C.gold);
    text('2010', 0, 30, { size: 54, color: '#7a5108' });
    text('Nobel', 0, 92, { size: 40, color: '#7a5108' });
    ctx.restore();
    // きらめき
    for (let i = 0; i < 4; i++) {
      const a = t * 3 + i * 1.6, r = 0.5 + 0.5 * Math.sin(a);
      ctx.save(); ctx.translate([-200, 190, -170, 200][i], [-60, -120, 160, 110][i]); ctx.scale(r, r);
      poly([0, -26, 7, -7, 26, 0, 7, 7, 0, 26, -7, 7, -26, 0, -7, -7], '#ffffff'); ctx.restore();
    }
  },
  sign(t) {
    fillR(-14, -200, 28, 400, 8, '#c89060');
    const arms = [['文', -1, -150, C.red], ['理', 1, -60, '#3f7fd0'], ['?', -1, 30, C.gold]];
    arms.forEach(([s, d, y, col], i) => {
      const wob = Math.sin(t * 3 + i) * 0.04;
      ctx.save(); ctx.translate(0, y); ctx.rotate(wob);
      const x0 = d > 0 ? 10 : -230;
      fillR(x0, -38, 220, 76, 10, col);
      poly(d > 0 ? [230, -50, 275, 0, 230, 50] : [-230, -50, -275, 0, -230, 50], col);
      text(s, x0 + 110, 18, { size: 52, color: '#fff' });
      ctx.restore();
    });
    fillR(-120, 180, 240, 30, 15, 'rgba(255,255,255,0.4)');
  },
  ginkgo(t) {
    // 並木(遠近)
    for (let side = -1; side <= 1; side += 2) {
      for (let k = 0; k < 5; k++) {
        const z = k / 5, x = side * lerp(220, 40, z), y = lerp(150, -80, z), s = lerp(1, 0.35, z);
        fillR(x - 8 * s, y - 20 * s, 16 * s, 80 * s, 4, C.brown);
        circle(x, y - 70 * s, 70 * s, k % 2 ? C.gold : '#f5d35b');
      }
    }
    ctx.beginPath(); ctx.moveTo(-60, 200); ctx.lineTo(-10, -60); ctx.lineTo(10, -60); ctx.lineTo(60, 200); ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
    // 舞い落ちる葉
    for (let i = 0; i < 8; i++) {
      const y = ((t * 70 + hash(i) * 500) % 500) - 260;
      const x = -220 + hash(i + 4) * 440 + Math.sin(t * 2 + i) * 30;
      ginkgoLeaf(x, y, 0.28, t * 2 + i, i % 2 ? C.gold : '#ffd95a');
    }
  },
  museum(t) {
    poly([-230, -110, 230, -110, 0, -230], '#ffffff');
    fillR(-230, -110, 460, 26, 2, '#e6e2d6');
    for (let i = 0; i < 5; i++) fillR(-200 + i * 92, -80, 34, 220, 4, '#ffffff');
    fillR(-250, 140, 500, 34, 4, '#e6e2d6');
    // FREE チケット
    ctx.save(); ctx.translate(150, 150); ctx.rotate(-0.25 + Math.sin(t * 4) * 0.05);
    fillR(-110, -55, 220, 110, 16, C.red);
    ctx.setLineDash([10, 10]); ctx.beginPath(); ctx.moveTo(-60, -50); ctx.lineTo(-60, 50); stroke('rgba(255,255,255,0.7)', 4); ctx.setLineDash([]);
    text('FREE', 25, 20, { size: 54, color: '#fff' });
    ctx.restore();
    // 恐竜の骨っぽいシルエット
    ctx.beginPath(); ctx.moveTo(-150, 60); ctx.quadraticCurveTo(-80, -20, 0, 30); ctx.quadraticCurveTo(50, 60, 90, 20); stroke('rgba(22,58,47,0.5)', 10);
  },
};

// ---------- 字幕 ----------
function wrapLines(str, size, maxW) {
  setFont(size);
  const lines = []; let cur = '';
  for (const ch of str) {
    if (ctx.measureText(cur + ch).width > maxW && cur) {
      // 句読点が行頭に来ないように
      if ('、。！？」'.includes(ch)) { cur += ch; continue; }
      lines.push(cur); cur = ch;
    } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}
function subtitle(str, t, sc) {
  if (!str) return;
  const a = clamp(seg(t, sc.start, 0.15)) * (1 - seg(t, sc.start + sc.dur - 0.12, 0.12));
  if (a <= 0) return;
  str = str.replace(/^[①-⑩]/, '');
  const size = 56, lh = 74, lines = wrapLines(str, size, 900);
  const y0 = 1560 - (lines.length - 1) * lh / 2;
  lines.forEach((ln, i) => text(ln, W / 2, y0 + i * lh, { size, color: '#ffffff', stroke: '#06231b', sw: 14, alpha: a, base: 'middle' }));
}

// ---------- シーン ----------
function header(t, a) {
  ctx.save(); ctx.globalAlpha = a;
  fillR(90, 120, 900, 120, 60, 'rgba(0,0,0,0.25)');
  text('北海道大学の', 330, 200, { size: 54, color: '#ffffff' });
  text('ここがすごい！', 650, 200, { size: 54, color: C.gold });
  text('10選', 890, 200, { size: 54, color: '#ffffff' });
  ctx.restore();
}
function progress(idx, t, a) {
  ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < 10; i++) {
    const x = 540 + (i - 4.5) * 78, on = i <= idx;
    const r = i === idx ? 18 + Math.sin(t * 6) * 2 : 12;
    circle(x, 300, r, on ? C.gold : 'rgba(255,255,255,0.25)');
  }
  ctx.restore();
}

function intro(t, sc) {
  const lt = t - sc.start;
  // 飛び交うイチョウ
  for (let i = 0; i < 14; i++) {
    const p = (lt * 0.25 + hash(i)) % 1;
    ginkgoLeaf(hash(i + 1) * W, lerp(-100, H + 100, p), 0.5 + hash(i + 2) * 0.5, lt * (1 + hash(i)) + i, i % 3 ? C.gold : '#ffd95a');
  }
  const p1 = easeBack(seg(lt, 0.0, 0.45)), p2 = easeBack(seg(lt, 0.35, 0.45)), p3 = easeBack(seg(lt, 0.75, 0.55));
  ctx.save(); ctx.translate(W / 2, 640); ctx.scale(p1, p1);
  text('北海道大学の', 0, 0, { size: 120, color: '#ffffff', stroke: '#06231b', sw: 18, shadow: 20 }); ctx.restore();
  ctx.save(); ctx.translate(W / 2, 830); ctx.scale(p2, p2); ctx.rotate(-0.04);
  fillR(-470, -130, 940, 180, 40, C.red);
  text('ここがすごい！', 0, 0, { size: 140, color: '#ffffff' }); ctx.restore();
  ctx.save(); ctx.translate(W / 2, 1130); const s3 = p3 * (1 + Math.sin(lt * 5) * 0.03); ctx.scale(s3, s3);
  circle(0, -60, 190, C.gold);
  text('10', -45, 10, { size: 230, color: '#163a2f' });
  text('選', 125, 40, { size: 90, color: '#163a2f' }); ctx.restore();
}

function item(idx, t, sc) {
  const it = ITEMS[idx], lt = t - sc.start;
  const out = seg(t, sc.start + sc.dur - 0.18, 0.18);
  header(t, 1); progress(idx, t, 1);
  // 番号バッジ
  const pb = easeBack(seg(lt, 0, 0.35));
  ctx.save(); ctx.translate(540, 470); ctx.scale(pb, pb); ctx.rotate((1 - pb) * -0.6);
  circle(0, 0, 105, C.gold); circle(0, 0, 90, '#ffd95a');
  text('No.', 0, -28, { size: 40, color: '#163a2f' });
  text(String(idx + 1), 0, 62, { size: 110, color: '#163a2f' });
  ctx.restore();
  // アイコンパネル
  const pp = easeOut(seg(lt, 0.08, 0.4));
  ctx.save(); ctx.globalAlpha = 1 - out;
  ctx.translate(lerp(W + 500, 540, pp) - out * 300, 910);
  fillR(-430, -300, 860, 560, 50, 'rgba(255,255,255,0.10)');
  ctx.save(); ctx.beginPath(); rrect(-430, -300, 860, 560, 50); ctx.clip();
  ctx.translate(0, 20); ICONS[it.icon](lt);
  ctx.restore(); ctx.restore();
  // 大見出し(数字はカウントアップ)
  const pt = easeBack(seg(lt, 0.3, 0.4));
  let big = it.big;
  if (it.n != null) {
    const v = Math.round(it.n * easeOut(seg(lt, 0.3, 0.9)));
    big = big.replace('{n}', it.n >= 1000 ? String(v) : v.toLocaleString('ja-JP'));
  }
  ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(540, 1300); ctx.scale(pt, pt);
  const bs = fitSize(big, 118, 960);
  text(big, 0, 0, { size: bs, color: C.gold, stroke: '#06231b', sw: 16, shadow: 16 });
  ctx.restore();
  const ps = seg(lt, 0.55, 0.3);
  text(it.small, 540 + (1 - easeOut(ps)) * 40, 1395, { size: 46, color: C.ink2, alpha: ps * (1 - out), maxW: 940 });
}

function outro(t, sc) {
  const lt = t - sc.start;
  header(t, 1); progress(9, t, 1);
  const p = easeBack(seg(lt, 0, 0.5));
  // ハート
  ctx.save(); ctx.translate(540, 720); const s = p * (1 + 0.06 * Math.max(0, Math.sin(lt * 7))); ctx.scale(s * 2.4, s * 2.4);
  ctx.beginPath(); ctx.moveTo(0, 40); ctx.bezierCurveTo(-90, -20, -60, -90, 0, -50); ctx.bezierCurveTo(60, -90, 90, -20, 0, 40);
  ctx.fillStyle = C.red; ctx.fill(); ctx.restore();
  const p2 = easeBack(seg(lt, 0.3, 0.5));
  ctx.save(); ctx.translate(540, 1080); ctx.scale(p2, p2);
  text('いいね＆フォロー', 0, 0, { size: 110, color: '#ffffff', stroke: '#06231b', sw: 16, shadow: 16 });
  text('お願いしますわ！', 0, 150, { size: 90, color: C.gold, stroke: '#06231b', sw: 14 });
  ctx.restore();
  text('ナレーション  VOICEVOX:四国めたん', 540, 1730, { size: 34, color: C.ink2, alpha: seg(lt, 0.5, 0.4) });
  text('BGM  オリジナル', 540, 1780, { size: 30, color: C.ink2, alpha: seg(lt, 0.5, 0.4) });
}

function render(t) {
  background(t);
  const sc = TL.scenes;
  let i = sc.findIndex(s => t >= s.start && t < s.start + s.dur);
  if (i < 0) i = sc.length - 1;
  if (i === 0) intro(t, sc[0]);
  else if (i === sc.length - 1) outro(t, sc[i]);
  else item(i - 1, t, sc[i]);
  if (i > 0) subtitle(sc[i].sub, t, sc[i]);
  // シーン切替の白フラッシュ
  const fl = 1 - clamp((t - sc[i].start) / 0.12);
  if (i > 0 && fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl * 0.35})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;

// ブラウザで開いたときのプレビュー再生
if (!navigator.webdriver) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else render(0);
</script>
