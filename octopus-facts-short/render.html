<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Octopus Facts Short</title>
<style>
  @font-face { font-family: 'Anton'; src: url(fonts/anton.woff2) format('woff2'); }
  @font-face { font-family: 'Mont'; font-weight: 900; src: url(fonts/montserrat-900.woff2) format('woff2'); }
  @font-face { font-family: 'Mont'; font-weight: 800; src: url(fonts/montserrat-800.woff2) format('woff2'); }
  html,body{margin:0;background:#000;}
  canvas{display:block;max-height:100vh;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
// ------------------------------------------------------------
// "5 Octopus Facts That Sound FAKE"  9:16 Shorts / 30fps
// render(t) draws frame at t seconds deterministically.
// Scene timing comes from timeline.js (generated by narrate.py).
// ------------------------------------------------------------
const W = 1080, H = 1920, FPS = 30;
const DURATION = window.TOTAL;
window.FPS = FPS; window.DURATION = DURATION;
window.fontsReady = Promise.all(['400 100px Anton', '900 100px Mont', '800 100px Mont', '400 30px "WenQuanYi Zen Hei"'].map(f => document.fonts.load(f, 'AB四国めたん')));
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
const tctx = tmp.getContext('2d');
const TL = window.TIMELINE;
const YEL = '#FFE14D', PINK = '#FF5C8A', CYAN = '#3DF2FF', GREEN = '#5BFF8F', RED = '#FF3B4E';

// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, s, d) => clamp((t - s) / d);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIn = t => Math.pow(clamp(t), 3);
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const backOut = t => { t = clamp(t); const c = 2.2; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(c1, c2, t) { const a = hex2rgb(c1), b = hex2rgb(c2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`; }

function txt(s, x, y, { size = 80, font = 'Mont', weight = 900, color = '#fff', stroke = 0, strokeColor = '#000', align = 'center', base = 'middle', alpha = 1, rot = 0, scale = 1, shadow = 0, shadowColor = 'rgba(0,0,0,.6)', ls = 0 } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (ls) ctx.letterSpacing = ls + 'px';
  if (shadow) { ctx.shadowColor = shadowColor; ctx.shadowBlur = shadow; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(s, 0, 0); ctx.shadowBlur = 0; }
  ctx.fillStyle = color; ctx.fillText(s, 0, 0);
  ctx.restore();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function heartPath(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y + s * 0.95);
  c.bezierCurveTo(x - s * 1.25, y + s * 0.15, x - s * 1.05, y - s * 0.95, x, y - s * 0.38);
  c.bezierCurveTo(x + s * 1.05, y - s * 0.95, x + s * 1.25, y + s * 0.15, x, y + s * 0.95);
  c.closePath();
}

// ---------- timeline helpers ----------
function sceneAt(t) {
  let i = 0;
  for (let k = 0; k < TL.length; k++) if (t >= TL[k].start) i = k;
  const sc = TL[i];
  return { sc, i, lt: t - sc.start, cue: sc.cues.map(c => c[0] - sc.start) };
}
// emphasized impacts (shake/zoom) : scene starts + ALL-CAPS highlighted words
const IMPACTS = [];
TL.forEach((sc, si) => {
  if (si > 0) IMPACTS.push({ t: sc.start + 0.02, k: 1.0 });
  sc.cues.forEach(([a, b, s]) => {
    const plain = s.replace(/\*/g, '');
    const m = s.match(/\*([^*]+)\*/g) || [];
    m.forEach(w => {
      const word = w.slice(1, -1);
      if (word.replace(/[^A-Z]/g, '').length >= 3) {
        const idx = plain.indexOf(word);
        IMPACTS.push({ t: a + (b - a) * (idx / plain.length) + 0.05, k: 0.75 });
      }
    });
  });
});
window.IMPACTS = IMPACTS;
function impactAmt(t, decay = 9) {
  let v = 0;
  for (const im of IMPACTS) if (t >= im.t) v += im.k * Math.exp(-(t - im.t) * decay);
  return Math.min(v, 1.4);
}

// ---------- background ----------
const THEMES = {
  hook:   ['#0d2a5c', '#030b1c', 160],
  hearts: ['#5c0f2e', '#14030b', 345],
  blood:  ['#0b2f72', '#020818', 210],
  brains: ['#3d1468', '#0c0419', 280],
  taste:  ['#0d4a42', '#021512', 165],
  color:  ['#262033', '#07060b', 300],
  outro:  ['#0d2a5c', '#030b1c', 160],
};
function background(t, name) {
  const [top, bot, hue] = THEMES[name];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(-60, -60, W + 120, H + 120);
  // light rays
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const a = -0.5 + i * 0.22 + Math.sin(t * 0.4 + i * 1.7) * 0.06;
    const x0 = W * 0.5 + (i - 2.5) * 70;
    const len = H * 1.1, w = 70 + 40 * rnd(i);
    ctx.beginPath();
    ctx.moveTo(x0, -40);
    ctx.lineTo(x0 + Math.sin(a) * len - w, Math.cos(a) * len);
    ctx.lineTo(x0 + Math.sin(a) * len + w, Math.cos(a) * len);
    ctx.closePath();
    const rg = ctx.createLinearGradient(0, 0, 0, H);
    rg.addColorStop(0, hsl(hue, 80, 75, 0.10 + 0.04 * Math.sin(t * 1.3 + i)));
    rg.addColorStop(0.7, hsl(hue, 80, 60, 0));
    ctx.fillStyle = rg; ctx.fill();
  }
  ctx.restore();
  // bubbles & plankton
  for (let i = 0; i < 46; i++) {
    const sp = 60 + rnd(i + 3) * 160;
    const x = rnd(i) * W + Math.sin(t * 1.5 + i) * 18;
    const y = H + 80 - ((t * sp + rnd(i + 9) * (H + 200)) % (H + 200));
    const r = 3 + rnd(i + 5) * (i % 4 === 0 ? 16 : 6);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    if (i % 4 === 0) { ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(x - r * .35, y - r * .35, r * .25, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fill(); }
    else { ctx.fillStyle = 'rgba(200,240,255,.18)'; ctx.fill(); }
  }
}
function vignette() {
  const g = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.25, W / 2, H * 0.5, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- the octopus ----------
function armPoints(cx, cy, s, k, t, o) {
  const N = 18, L = 470 * s * (o.armLen || 1);
  const side = k < 4 ? -1 : 1;
  const spread = o.swim ? lerp(0.36, 0.13, o.swim) : 0.36;
  let ang = Math.PI / 2 + (k - 3.5) * spread;
  let x = cx + (k - 3.5) * 30 * s, y = cy + 120 * s;
  const pts = [[x, y]];
  for (let j = 1; j <= N; j++) {
    const f = j / N;
    const wave = Math.sin(t * 2.6 - j * 0.42 + k * 1.37) * 0.20 * (o.swim ? lerp(1, 0.4, o.swim) : 1);
    const curl = side * f * f * 0.55 * (1 - (o.swim || 0));
    ang += wave * f + curl * 0.12;
    x += Math.cos(ang) * L / N; y += Math.sin(ang) * L / N;
    pts.push([x, y]);
  }
  return pts;
}
function drawArm(pts, s, fill, dark, suckers, glow) {
  const N = pts.length - 1, left = [], right = [];
  for (let j = 0; j <= N; j++) {
    const p = pts[j], q = pts[Math.min(j + 1, N)], pp = pts[Math.max(j - 1, 0)];
    const dx = q[0] - pp[0], dy = q[1] - pp[1], d = Math.hypot(dx, dy) || 1;
    const r = 34 * s * (1 - (j / N) * 0.85);
    left.push([p[0] - dy / d * r, p[1] + dx / d * r]); right.push([p[0] + dy / d * r, p[1] - dx / d * r]);
  }
  ctx.beginPath(); ctx.moveTo(left[0][0], left[0][1]);
  for (const p of left) ctx.lineTo(p[0], p[1]);
  const tip = pts[N]; ctx.arc(tip[0], tip[1], 34 * s * 0.15, 0, Math.PI);
  for (let j = N; j >= 0; j--) ctx.lineTo(right[j][0], right[j][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 5 * s; ctx.strokeStyle = dark; ctx.stroke();
  if (suckers) for (let j = 3; j < N; j += 2) {
    const p = pts[j], r = 9 * s * (1 - j / N * 0.7);
    const e = right[j]; const sx = lerp(p[0], e[0], 0.55), sy = lerp(p[1], e[1], 0.55);
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7);
    ctx.fillStyle = glow ? glow : 'rgba(255,235,240,.85)'; ctx.fill();
  }
}
// o: {hue, sat, light, blink, look, swim, armGlow(k)->color|null, brain, gray}
function octopus(cx, cy, s, t, o = {}) {
  const hue = o.hue ?? 345, sat = o.sat ?? 75, li = o.light ?? 60;
  const fill = hsl(hue, sat, li), dark = hsl(hue, sat, li * 0.55), lite = hsl(hue, sat, Math.min(92, li + 18));
  ctx.save();
  // arms (back ones first)
  const order = [0, 7, 1, 6, 2, 5, 3, 4];
  const tips = [];
  for (const k of order) {
    const pts = armPoints(cx, cy, s, k, t, o);
    drawArm(pts, s, fill, dark, true, o.suckerGlow ? o.suckerGlow(k) : null);
    tips[k] = pts;
  }
  // head
  ctx.beginPath(); ctx.ellipse(cx, cy + 95 * s, 170 * s, 85 * s, 0, 0, 7); ctx.fillStyle = fill; ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy - 40 * s, 165 * s, 185 * s, 0, 0, 7); ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 6 * s; ctx.strokeStyle = dark; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy + 95 * s, 166 * s, 80 * s, 0, 0.15, Math.PI - 0.15); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx - 55 * s, cy - 120 * s, 55 * s, 75 * s, -0.5, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill();
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(cx + (rnd(i + 40) - .5) * 220 * s, cy - 90 * s + (rnd(i + 50) - .5) * 160 * s, (8 + rnd(i + 60) * 12) * s, 0, 7); ctx.fillStyle = hsl(hue, sat, li * 0.75, .7); ctx.fill(); }
  // brain (glowing inside head)
  if (o.brain) {
    const b = o.brain;
    ctx.save(); ctx.globalAlpha = b;
    ctx.shadowColor = '#ff9bd0'; ctx.shadowBlur = 40 * s;
    ctx.beginPath(); ctx.ellipse(cx, cy - 110 * s, 80 * s * b, 55 * s * b, 0, 0, 7); ctx.fillStyle = '#ffb3d9'; ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = '#d94f93'; ctx.lineWidth = 6 * s;
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(cx + (i - 1.5) * 36 * s, cy - 110 * s, 22 * s * b, Math.PI * 0.1, Math.PI * 1.1); ctx.stroke(); }
    ctx.restore();
  }
  // face
  const blink = o.blink ?? (((t + 0.7) % 3.3) < 0.12 ? 0.12 : 1);
  const lx = (o.look ? o.look[0] : Math.sin(t * 0.9) * 0.4) * 12 * s, ly = (o.look ? o.look[1] : 0.2) * 12 * s;
  for (const sx of [-1, 1]) {
    const ex = cx + sx * 66 * s, ey = cy + 25 * s;
    ctx.beginPath(); ctx.ellipse(ex, ey, 44 * s, 52 * s * blink, 0, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.lineWidth = 5 * s; ctx.strokeStyle = dark; ctx.stroke();
    if (blink > 0.5) {
      if (o.dizzy) { // spiral eyes
        ctx.strokeStyle = '#222'; ctx.lineWidth = 6 * s; ctx.beginPath();
        for (let a = 0; a < 14; a += 0.3) { const r = a * 2.6 * s; ctx.lineTo(ex + Math.cos(a + t * 8 * sx) * r, ey + Math.sin(a + t * 8 * sx) * r); }
        ctx.stroke();
      } else {
        ctx.beginPath(); ctx.ellipse(ex + lx, ey + ly, 24 * s, 28 * s, 0, 0, 7); ctx.fillStyle = '#1a1020'; ctx.fill();
        ctx.beginPath(); ctx.arc(ex + lx - 9 * s, ey + ly - 11 * s, 9 * s, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
      }
    }
  }
  ctx.beginPath(); ctx.ellipse(cx - 118 * s, cy + 85 * s, 26 * s, 15 * s, 0, 0, 7); ctx.ellipse(cx + 118 * s, cy + 85 * s, 26 * s, 15 * s, 0, 0, 7);
  ctx.fillStyle = 'rgba(255,120,160,.55)'; ctx.fill();
  ctx.beginPath();
  if (o.mouth === 'o') ctx.ellipse(cx, cy + 105 * s, 16 * s, 20 * s, 0, 0, 7);
  else ctx.arc(cx, cy + 92 * s, 22 * s, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.lineWidth = 6 * s; ctx.strokeStyle = '#3a1020'; o.mouth === 'o' ? (ctx.fillStyle = '#3a1020', ctx.fill()) : ctx.stroke();
  ctx.restore();
  return tips;
}

// ---------- shared UI ----------
const FACT_SCENES = ['hearts', 'blood', 'brains', 'taste', 'color'];
function hud(t, S) {
  // progress bar
  const p = t / DURATION;
  ctx.fillStyle = 'rgba(255,255,255,.18)'; rrect(60, 150, W - 120, 12, 6); ctx.fill();
  ctx.fillStyle = YEL; rrect(60, 150, (W - 120) * p, 12, 6); ctx.fill();
  // fact tracker 5..1
  const idx = FACT_SCENES.indexOf(S.sc.name);
  const looping = S.sc.name === 'outro' && S.lt > S.cue[2] + 0.45;
  const doneUpTo = looping ? 0 : S.sc.name === 'outro' ? 5 : idx; // number of completed
  for (let i = 0; i < 5; i++) {
    const x = W / 2 + (i - 2) * 118, y = 225;
    const active = i === idx, done = i < doneUpTo;
    const pulse = active ? 1 + 0.08 * Math.sin(t * 10) : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(pulse, pulse);
    ctx.beginPath(); ctx.arc(0, 0, 40, 0, 7);
    ctx.fillStyle = active ? YEL : done ? 'rgba(91,255,143,.9)' : 'rgba(0,0,0,.45)'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = active ? '#fff' : 'rgba(255,255,255,.35)'; ctx.stroke();
    ctx.restore();
    txt(done ? '✓' : String(5 - i), x, y + 3, { size: done ? 44 : 46, font: 'Mont', color: active || done ? '#111' : '#fff', scale: pulse });
  }
  if (S.sc.name === 'hook') {
    const a = seg(t, 1.0, 0.3);
    txt('WAIT FOR #1!', W / 2, 1530, { size: 40, color: YEL, alpha: a * (0.75 + 0.25 * Math.sin(t * 8)), stroke: 8 });
  }
}

function captions(t) {
  let cur = null;
  for (const sc of TL) for (const c of sc.cues) if (t >= (c[0] < 0.2 ? 0 : c[0]) && t < c[1] + 0.12) cur = c;
  if (!cur) return;
  const [a0, , s] = cur;
  const a = a0 < 0.2 ? 0 : a0;
  const k = a === 0 ? 1 : t - a;
  const pop = k < 0.16 ? lerp(0.55, 1.08, easeOut(k / 0.16)) : lerp(1.08, 1, easeOut((k - 0.16) / 0.1));
  // tokens with highlight flags
  const toks = [];
  s.split(/(\*[^*]+\*)/).forEach(part => {
    if (!part) return;
    const hl = part.startsWith('*');
    part.replace(/\*/g, '').replace(/(?<!\.)[,.](?!\.)/g, '').split(' ').forEach(w => { if (w) toks.push({ w: w.toUpperCase(), hl }); });
  });
  let size = 96;
  ctx.font = `900 ${size}px Mont`;
  const sp = () => ctx.measureText(' ').width;
  // wrap into max 2 lines of width 900
  const maxW = 900;
  let lines;
  for (;;) {
    ctx.font = `900 ${size}px Mont`;
    lines = [[]]; let lw = 0;
    for (const tk of toks) {
      const w = ctx.measureText(tk.w).width;
      if (lw && lw + sp() + w > maxW) { lines.push([]); lw = 0; }
      lines[lines.length - 1].push(tk); lw += (lw ? sp() : 0) + w;
    }
    if (lines.length <= 2 || size < 64) break;
    size -= 6;
  }
  const lh = size * 1.12, y0 = 1330 - (lines.length - 1) * lh / 2;
  ctx.save();
  ctx.translate(W / 2, 1330); ctx.rotate(-0.025); ctx.scale(pop, pop); ctx.translate(-W / 2, -1330);
  lines.forEach((ln, li) => {
    ctx.font = `900 ${size}px Mont`;
    const ws = ln.map(tk => ctx.measureText(tk.w).width);
    const tot = ws.reduce((x, y) => x + y, 0) + sp() * (ln.length - 1);
    let x = W / 2 - tot / 2;
    ln.forEach((tk, i) => {
      txt(tk.w, x, y0 + li * lh, { size, align: 'left', color: tk.hl ? YEL : '#fff', stroke: 22, strokeColor: '#000', shadow: 0 });
      x += ws[i] + sp();
    });
  });
  ctx.restore();
}

// big "#N" slam that flies into a corner badge
function numberSlam(n, lt, color = YEL) {
  const inT = seg(lt, 0, 0.22), out = easeInOut(seg(lt, 0.62, 0.3));
  const sc = lerp(2.6, 1, easeOut(inT));
  const x = lerp(W / 2, 150, out), y = lerp(720, 400, out), size = lerp(420, 120, out);
  ctx.save();
  if (out < 1) { // radial burst
    ctx.globalAlpha = (1 - out) * inT;
    ctx.translate(W / 2, 720); ctx.rotate(lt * 0.8);
    for (let i = 0; i < 16; i++) { ctx.rotate(Math.PI / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1400, -90); ctx.lineTo(1400, 90); ctx.closePath(); ctx.fillStyle = i % 2 ? 'rgba(255,225,77,.16)' : 'rgba(255,255,255,.06)'; ctx.fill(); }
  }
  ctx.restore();
  txt('#' + n, x, y, { font: 'Anton', weight: 400, size: size, color, stroke: lerp(26, 12, out), scale: sc, rot: lerp(-0.08, -0.05, out), alpha: inT });
}

function stamp(str, x, y, lt, color, rot = -0.18, size = 130) {
  if (lt < 0) return;
  const k = easeOut(seg(lt, 0, 0.14));
  const sc = lerp(2.2, 1, k);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc); ctx.globalAlpha = k;
  ctx.font = `400 ${size}px Anton`; const w = ctx.measureText(str).width + 70;
  rrect(-w / 2, -size * 0.72, w, size * 1.44, 22); ctx.lineWidth = 12; ctx.strokeStyle = color; ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
  ctx.restore();
  txt(str, x, y + 6, { font: 'Anton', weight: 400, size, color, rot, scale: sc, alpha: k });
}

function glitchTitle(str, x, y, size, t, amt = 1) {
  const j = amt * (rnd(Math.floor(t * 24)) > 0.7 ? 14 : 4);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  txt(str, x - j, y, { font: 'Anton', weight: 400, size, color: 'rgba(255,40,80,.85)' });
  txt(str, x + j, y + 2, { font: 'Anton', weight: 400, size, color: 'rgba(40,230,255,.85)' });
  ctx.restore();
  txt(str, x, y, { font: 'Anton', weight: 400, size, color: '#fff', stroke: 0, shadow: 30, shadowColor: 'rgba(91,255,143,.8)' });
}

// ---------- scenes ----------
function sceneHook(lt, t, C) {
  // tractor beam
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const bg = ctx.createLinearGradient(0, 300, 0, 1400);
  bg.addColorStop(0, 'rgba(91,255,143,.35)'); bg.addColorStop(1, 'rgba(91,255,143,0)');
  ctx.beginPath(); ctx.moveTo(W / 2 - 90, 330); ctx.lineTo(W / 2 + 90, 330); ctx.lineTo(W / 2 + 420, 1400); ctx.lineTo(W / 2 - 420, 1400); ctx.closePath();
  ctx.fillStyle = bg; ctx.fill();
  for (let i = 0; i < 10; i++) { const yy = 350 + ((lt * 260 + i * 110) % 1050); ctx.beginPath(); ctx.ellipse(W / 2, yy, 90 + (yy - 330) * 0.3, 12, 0, 0, 7); ctx.strokeStyle = `rgba(160,255,190,${0.25 * (1 - (yy - 330) / 1100)})`; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.restore();
  // UFO
  const ux = W / 2 + Math.sin(t * 1.6) * 20, uy = 330 + Math.sin(t * 2.2) * 8;
  ctx.beginPath(); ctx.ellipse(ux, uy - 30, 90, 60, 0, Math.PI, 0); ctx.fillStyle = 'rgba(160,240,255,.55)'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(ux, uy, 210, 44, 0, 0, 7); ctx.fillStyle = '#9aa6b8'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#4b5566'; ctx.stroke();
  for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(ux + (i - 3) * 55, uy + 8, 10, 0, 7); ctx.fillStyle = (Math.floor(t * 8) + i) % 2 ? YEL : '#fff'; ctx.fill(); }
  // octopus floating up in the beam
  const oy = 930 + Math.sin(t * 2) * 18;
  octopus(W / 2, oy, 0.95, t, { hue: 345, look: [0, -0.8], mouth: lt > C[2] ? undefined : 'o' });
  // title
  glitchTitle('ALIENS?!', W / 2, 560, 250, t, 1);
  txt('OCTOPUSES ARE', W / 2, 430, { size: 64, color: '#fff', stroke: 12, alpha: 1 });
  // FAKE -> REAL stamp
  if (lt >= C[1] && lt < C[2]) stamp('FAKE?', 790, 1050, lt - C[1] - 0.55, RED, 0.16, 120);
  if (lt >= C[2]) stamp('REAL ✓', 790, 1050, lt - C[2] - 0.6, GREEN, 0.16, 120);
  if (lt >= C[1]) {
    const k = backOut(seg(lt, C[1], 0.3));
    txt('5 FACTS', 280, 1050, { font: 'Anton', weight: 400, size: 130, color: YEL, stroke: 14, scale: k, rot: -0.12 });
  }
}

function ecg(x, y, w, lt, flat, color) {
  ctx.save(); ctx.beginPath();
  for (let i = 0; i <= 120; i++) {
    const u = i / 120, px = x + u * w;
    const ph = (u * 3 - lt * 1.4) % 1, p = ph < 0 ? ph + 1 : ph;
    let v = 0;
    if (p > 0.4 && p < 0.44) v = -1; else if (p >= 0.44 && p < 0.48) v = 0.6; else if (p >= 0.48 && p < 0.52) v = -0.25;
    ctx.lineTo(px, y + v * 70 * (1 - flat));
  }
  ctx.strokeStyle = color; ctx.lineWidth = 6; ctx.shadowColor = color; ctx.shadowBlur = 14; ctx.stroke();
  ctx.restore();
}
function sceneHearts(lt, t, C) {
  const stop = seg(lt, C[2] + 0.9, 0.35);
  const swim = easeInOut(seg(lt, C[3] - 0.1, 0.6));
  const oy = 1080 - swim * 50 + Math.sin(t * 2) * 12;
  octopus(W / 2, oy, 0.8, t, { hue: 350, swim, mouth: stop > 0.5 ? 'o' : undefined, look: swim ? [0, -1] : null });
  if (swim) { for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + (i - 2) * 50, oy + 520 + ((lt * 600 + i * 60) % 200)); ctx.lineTo(W / 2 + (i - 2) * 50, oy + 620 + ((lt * 600 + i * 60) % 200)); ctx.strokeStyle = `rgba(255,255,255,${0.35 * swim})`; ctx.lineWidth = 5; ctx.stroke(); } }
  // three hearts
  const beat = p => { const f = (p % 0.8) / 0.8; return 1 + 0.16 * Math.exp(-Math.pow((f - 0.05) * 18, 2)) + 0.1 * Math.exp(-Math.pow((f - 0.25) * 18, 2)); };
  const hs = [{ x: 250, s: 70, d: 0.0 }, { x: W / 2, s: 120, d: 0.12 }, { x: 830, s: 70, d: 0.24 }];
  hs.forEach((h, i) => {
    const app = backOut(seg(lt, C[1] + 0.2 + i * 0.18, 0.3));
    if (app <= 0) return;
    const main = i === 1;
    const b = main ? lerp(beat(lt + h.d), 1, stop) : beat(lt * 1.15 + h.d);
    const sc = app * b;
    ctx.save(); ctx.translate(h.x, 560); ctx.scale(sc, sc);
    heartPath(ctx, 0, 0, h.s);
    const col = main ? mix('#ff3b5c', '#6b6f78', stop) : '#ff3b5c';
    ctx.shadowColor = main && stop > 0.5 ? 'transparent' : '#ff3b5c'; ctx.shadowBlur = 40;
    ctx.fillStyle = col; ctx.fill(); ctx.shadowBlur = 0;
    ctx.lineWidth = 8; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-h.s * 0.4, -h.s * 0.25, h.s * 0.18, h.s * 0.28, -0.6, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
    ctx.restore();
    txt(main ? 'MAIN' : 'GILL', h.x, 560 + h.s + 45, { size: 38, color: '#fff', stroke: 8, alpha: app });
  });
  if (lt > C[1] + 0.2) {
    const k = backOut(seg(lt, C[1] + 0.2, 0.3));
    txt('×3', 960, 470, { font: 'Anton', weight: 400, size: 150, color: YEL, stroke: 14, scale: k, rot: 0.12 });
  }
  if (lt > C[2] + 0.2) ecg(140, 790, 800, lt, stop, stop > 0.5 ? '#9aa0aa' : '#5BFF8F');
  if (stop > 0) stamp('PAUSED', W / 2, 560, lt - C[2] - 1.0, '#fff', -0.12, 90);
}

function dropPath(x, y, s, wob) {
  ctx.beginPath();
  ctx.moveTo(x, y - s * 1.5);
  ctx.bezierCurveTo(x + s * (0.55 + wob), y - s * 0.6, x + s * 1.05, y + s * 0.1, x + s, y + s * 0.45);
  ctx.arc(x, y + s * 0.45, s, 0, Math.PI);
  ctx.bezierCurveTo(x - s * 1.05, y + s * 0.1, x - s * (0.55 - wob), y - s * 0.6, x, y - s * 1.5);
  ctx.closePath();
}
function tile(x, y, sym, num, name, col, lt0, crossed) {
  const k = backOut(seg(lt0, 0, 0.3)); if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  rrect(-130, -150, 260, 300, 26); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.restore();
  txt(String(num), x - 90, y - 105, { size: 40, color: '#fff', scale: k, align: 'left' });
  txt(sym, x, y - 5, { font: 'Anton', weight: 400, size: 150, color: '#fff', scale: k });
  txt(name, x, y + 105, { size: 40, color: '#fff', scale: k });
  if (crossed > 0) {
    ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 26; ctx.strokeStyle = RED; ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
    const e = easeOut(crossed);
    ctx.beginPath(); ctx.moveTo(x - 150, y - 160); ctx.lineTo(x - 150 + 300 * e, y - 160 + 320 * e); ctx.stroke();
    if (crossed > 0.5) { const e2 = easeOut((crossed - 0.5) * 2); ctx.beginPath(); ctx.moveTo(x + 150, y - 160); ctx.lineTo(x + 150 - 300 * e2, y - 160 + 320 * e2); ctx.stroke(); }
    ctx.restore();
  }
}
function sceneBlood(lt, t, C) {
  octopus(W / 2, 1380, 0.6, t, { hue: 215, sat: 70, light: 58, look: [0, -1] });
  const turn = easeInOut(seg(lt, C[1] + 0.45, 0.35));
  const app = backOut(seg(lt, C[1] - 0.1, 0.35));
  if (app > 0) {
    const col = mix('#e3122f', '#1f6bff', turn);
    ctx.save(); ctx.translate(W / 2, 640); ctx.scale(app, app);
    ctx.shadowColor = col; ctx.shadowBlur = 60 + 30 * turn;
    dropPath(0, 0, 150, Math.sin(t * 6) * 0.08); ctx.fillStyle = col; ctx.fill(); ctx.shadowBlur = 0;
    ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(-55, 10, 26, 50, -0.3, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fill();
    ctx.restore();
    if (turn > 0.5) txt('BLUE!', W / 2, 400, { font: 'Anton', weight: 400, size: 150, color: '#7fb2ff', stroke: 14, scale: backOut(seg(lt, C[1] + 0.6, 0.3)), rot: -0.06 });
  }
  if (lt > C[2]) {
    // shrink drop away, show tiles
    tile(300, 1000, 'Cu', 29, 'COPPER', '#1aa39a', lt - C[2], 0);
    tile(780, 1000, 'Fe', 26, 'IRON', '#8b3a3a', lt - C[3] + 0.15, seg(lt, C[3] + 0.35, 0.35));
    if (lt > C[2] + 0.35) txt('✓', 300, 790, { size: 90, color: GREEN, stroke: 10, scale: backOut(seg(lt, C[2] + 0.35, 0.25)) });
  }
}

function miniBrain(x, y, s) {
  ctx.save(); ctx.shadowColor = '#ff9bd0'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.ellipse(x, y, 34 * s, 25 * s, 0, 0, 7); ctx.fillStyle = '#ffb3d9'; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = '#d94f93'; ctx.lineWidth = 4;
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + (i - 1) * 18 * s, y, 11 * s, Math.PI * 0.1, Math.PI * 1.1); ctx.stroke(); }
  ctx.restore();
}
function sceneBrains(lt, t, C) {
  const big = backOut(seg(lt, C[2], 0.35));
  const armOn = k => seg(lt, C[3] + 0.1 + k * 0.17, 0.12);
  const cy = 760;
  const tips = octopus(W / 2, cy, 1.0, t, { hue: 285, sat: 60, light: 60, brain: big,
    suckerGlow: k => armOn(k) > 0.5 ? '#ffb3ec' : null, dizzy: lt > C[3] + 1.5 });
  let count = big > 0.5 ? 1 : 0;
  for (let k = 0; k < 8; k++) {
    const a = armOn(k); if (a <= 0) continue;
    count++;
    const p = tips[k][15];
    const sc = backOut(a) * 1.0;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath(); ctx.arc(p[0], p[1], 70 * a, 0, 7); ctx.fillStyle = 'rgba(255,120,220,.25)'; ctx.fill(); ctx.restore();
    miniBrain(p[0], p[1], sc);
  }
  // counter
  if (lt > C[1]) {
    const k = backOut(seg(lt, C[1], 0.3));
    const shown = lt < C[2] ? 9 : Math.max(count, 1);
    txt('BRAINS', 870, 330, { size: 52, color: '#fff', stroke: 10, scale: k });
    txt(String(shown), 870, 460, { font: 'Anton', weight: 400, size: 200, color: YEL, stroke: 16, scale: k * (1 + 0.15 * impactAmt(t, 14)) });
  }
}

function sceneTaste(lt, t, C) {
  // giant tentacle sweeping across the screen
  const enter = easeOut(seg(lt, C[1] - 0.2, 0.5));
  const N = 26, pts = [];
  for (let j = 0; j <= N; j++) {
    const f = j / N;
    const x = lerp(-260, 1240, f) - (1 - enter) * 1400;
    const y = 760 + Math.sin(f * 4.2 + t * 2.2) * 120 + (f - 0.5) * 160;
    pts.push([x, y]);
  }
  // fat arm drawn manually (bigger than drawArm)
  const left = [], right = [];
  for (let j = 0; j <= N; j++) {
    const p = pts[j], q = pts[Math.min(j + 1, N)], pp = pts[Math.max(j - 1, 0)];
    const dx = q[0] - pp[0], dy = q[1] - pp[1], d = Math.hypot(dx, dy) || 1;
    const r = 150 * (1 - (j / N) * 0.75);
    left.push([p[0] - dy / d * r, p[1] + dx / d * r]); right.push([p[0] + dy / d * r, p[1] - dx / d * r]);
  }
  ctx.beginPath(); left.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p));
  for (let j = N; j >= 0; j--) ctx.lineTo(...right[j]); ctx.closePath();
  ctx.fillStyle = hsl(10, 75, 58); ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = hsl(10, 75, 32); ctx.stroke();
  // suckers (on lower side)
  const lit = seg(lt, C[2], 0.8);
  for (let j = 1; j < N - 1; j++) {
    const p = pts[j], e = left[j];
    const sx = lerp(p[0], e[0], 0.45), sy = lerp(p[1], e[1], 0.45), r = 56 * (1 - j / N * 0.7);
    const on = lit > j / N;
    ctx.save();
    if (on) { ctx.shadowColor = YEL; ctx.shadowBlur = 30; }
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fillStyle = on ? '#fff3c4' : '#ffd9cf'; ctx.fill(); ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(sx, sy, r * 0.55, 0, 7); ctx.fillStyle = on ? '#ffb347' : '#e8a090'; ctx.fill();
    ctx.restore();
    // tiny tongues pop out on the last cue
    const tg = backOut(seg(lt, C[3] + j * 0.03, 0.25));
    if (tg > 0 && j % 2 === 1) {
      ctx.save(); ctx.translate(sx, sy); ctx.scale(tg * r / 55, tg * r / 55);
      ctx.beginPath(); ctx.moveTo(-22, -6); ctx.lineTo(-22, 34); ctx.arc(0, 34, 22, Math.PI, 0, true); ctx.lineTo(22, -6); ctx.closePath();
      ctx.fillStyle = '#ff5c8a'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#b8234f'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 30); ctx.stroke();
      ctx.restore();
    }
  }
  // flavor tags
  const tags = [['SWEET', '#ff8ad8', 230, 540], ['SALTY', '#8ad8ff', 580, 420], ['SOUR', '#c8ff5c', 900, 520], ['YUM!', YEL, 760, 1110]];
  tags.forEach(([s, c, x, y], i) => {
    const k = backOut(seg(lt, C[1] + 0.5 + i * 0.25, 0.3)); if (k <= 0) return;
    txt(s, x, y + Math.sin(t * 3 + i) * 10, { font: 'Anton', weight: 400, size: 86, color: c, stroke: 12, scale: k, rot: (i % 2 ? 0.1 : -0.1) });
  });
}

function sceneColor(lt, t, C) {
  const cycle = seg(lt, C[1], 0.2);
  const hue = 345 + (cycle ? (lt - C[1]) * 900 : 0);
  // rainbow ring
  if (cycle) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 12; i++) {
      ctx.beginPath(); ctx.arc(W / 2, 820, 430 + Math.sin(t * 4 + i) * 20, i / 12 * 7, (i + 1) / 12 * 7);
      ctx.strokeStyle = hsl((hue + i * 30) % 360, 100, 60, 0.35 * cycle); ctx.lineWidth = 50; ctx.stroke();
    }
    ctx.restore();
  }
  const blind = lt > C[3] + 0.35;
  octopus(W / 2, 800 + Math.sin(t * 2) * 12, 1.0, t, { hue: hue % 360, sat: 85, light: 58, mouth: blind ? 'o' : undefined, dizzy: blind });
  if (lt > C[2] + 0.2 && !blind) {
    const k = backOut(seg(lt, C[1] + 0.1, 0.3));
    txt('0.2 SEC', 880, 420, { font: 'Anton', weight: 400, size: 110, color: YEL, stroke: 12, scale: k, rot: 0.1 });
  } else if (lt > C[1] + 0.1 && !blind) {
    const k = backOut(seg(lt, C[1] + 0.1, 0.3));
    txt('0.2 SEC', 880, 420, { font: 'Anton', weight: 400, size: 110, color: YEL, stroke: 12, scale: k, rot: 0.1 });
  }
}
function postColorblind(lt, t, C) {
  if (lt <= C[3] + 0.35) return;
  // grayscale + glitch slices
  tctx.clearRect(0, 0, W, H); tctx.drawImage(cv, 0, 0);
  ctx.save(); ctx.filter = 'grayscale(1) contrast(1.15)'; ctx.drawImage(tmp, 0, 0); ctx.restore();
  const g = Math.exp(-(lt - C[3] - 0.35) * 3);
  for (let i = 0; i < 7; i++) {
    const r = rnd(Math.floor(t * 20) * 7 + i);
    if (r < 0.5) continue;
    const y = Math.floor(rnd(i * 3 + Math.floor(t * 20)) * H), h = 20 + r * 90;
    ctx.drawImage(cv, 0, y, W, h, (r - 0.75) * 120 * (0.3 + g), y, W, h);
  }
  glitchTitle('COLORBLIND?!', W / 2 + 70, 430, 120, t, 1.5);
}

function sceneOutro(lt, t, C) {
  const back = easeInOut(seg(lt, C[2] + 0.15, 0.55)); // morph back into the hook for a seamless loop
  ctx.save(); ctx.globalAlpha = 1 - back;
  txt('WHICH ONE', W / 2, 400, { font: 'Anton', weight: 400, size: 130, color: '#fff', stroke: 14, scale: backOut(seg(lt, 0, 0.3)) });
  txt('SHOCKED YOU?', W / 2, 540, { font: 'Anton', weight: 400, size: 130, color: YEL, stroke: 14, scale: backOut(seg(lt, 0.15, 0.3)) });
  const rows = [['5', '3 HEARTS', '#ff3b5c'], ['4', 'BLUE BLOOD', '#3f8cff'], ['3', '9 BRAINS', '#c070ff'], ['2', 'TASTY ARMS', '#ff8a3d'], ['1', 'COLORBLIND', '#cfd3da']];
  rows.forEach(([n, s, c], i) => {
    const k = easeOut(seg(lt, 0.3 + i * 0.12, 0.3)); if (k <= 0) return;
    const y = 690 + i * 112, x = lerp(-600, 0, k);
    ctx.save(); ctx.translate(x, 0);
    ctx.fillStyle = 'rgba(0,0,0,.45)'; rrect(150, y - 46, 780, 92, 46); ctx.fill();
    ctx.beginPath(); ctx.arc(196, y, 40, 0, 7); ctx.fillStyle = c; ctx.fill();
    ctx.restore();
    txt(n, 196 + x, y + 2, { font: 'Anton', weight: 400, size: 56, color: '#fff' });
    txt(s, 270 + x, y + 2, { size: 54, color: '#fff', align: 'left' });
  });
  // comment bubble
  const b = backOut(seg(lt, C[1], 0.3));
  if (b > 0) {
    const bx = W / 2, by = 1560 + Math.sin(t * 7) * 10;
    ctx.save(); ctx.translate(bx, by); ctx.scale(b, b);
    rrect(-110, -70, 220, 130, 36); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-40, 55); ctx.lineTo(-70, 110); ctx.lineTo(10, 58); ctx.fill();
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 50, -5, 14, 0, 7); ctx.fillStyle = '#222'; ctx.fill(); }
    ctx.restore();
  }
  txt('VOICEVOX:四国めたん', W / 2, 1700, { size: 34, font: '"WenQuanYi Zen Hei", Mont', weight: 400, color: 'rgba(255,255,255,.75)' });
  ctx.restore();
  if (back > 0) {
    ctx.save(); ctx.globalAlpha = back;
    background(t, 'hook');
    sceneHook(0.0, t, TL[0].cues.map(c => c[0]));
    ctx.restore();
  }
}

const SCENE_FN = { hook: sceneHook, hearts: sceneHearts, blood: sceneBlood, brains: sceneBrains, taste: sceneTaste, color: sceneColor, outro: sceneOutro };
const SLAM = { hearts: 5, blood: 4, brains: 3, taste: 2, color: 1 };

function render(t) {
  const S = sceneAt(t), { sc, lt, cue } = S;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  const imp = impactAmt(t);
  const sh = imp * 16;
  const zoom = 1 + 0.05 * imp + 0.04 * Math.exp(-lt * 6) * (S.i > 0 ? 1 : 0);
  ctx.save();
  ctx.translate(W / 2 + (rnd(Math.floor(t * 60)) - 0.5) * 2 * sh, H / 2 + (rnd(Math.floor(t * 60) + 99) - 0.5) * 2 * sh);
  ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  background(t, sc.name);
  SCENE_FN[sc.name](lt, t, cue);
  if (SLAM[sc.name]) numberSlam(SLAM[sc.name], lt, sc.name === 'color' ? '#ffcf3d' : YEL);
  ctx.restore();
  if (sc.name === 'color') postColorblind(lt, t, cue);
  vignette();
  hud(t, S);
  captions(t);
  // whip transition: white flash + streaks at every scene start
  if (S.i > 0 && lt < 0.18) {
    ctx.fillStyle = `rgba(255,255,255,${0.75 * (1 - lt / 0.18)})`; ctx.fillRect(0, 0, W, H);
  }
  // pre-transition streak (last 0.12s of a scene)
  const nxt = TL[S.i + 1];
  if (nxt && nxt.start - t < 0.12) {
    const k = 1 - (nxt.start - t) / 0.12;
    ctx.save(); ctx.globalAlpha = 0.5 * k;
    for (let i = 0; i < 14; i++) { ctx.fillStyle = '#fff'; ctx.fillRect(0, rnd(i + 3) * H, W, 4 + rnd(i) * 20 * k); }
    ctx.restore();
  }
}
window.render = render;

// preview playback in a normal browser
if (!navigator.webdriver) {
  window.fontsReady.then(() => {
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
</body>
