    r.forEach(s => { ctx.strokeStyle = 'rgba(0,0,0,0.95)'; ctx.lineWidth = fs * 0.2; ctx.strokeText(s.s, x, y); ctx.fillStyle = s.red ? RED : '#fff'; ctx.shadowColor = s.red ? 'rgba(255,0,0,0.7)' : 'rgba(0,0,0,0)'; ctx.shadowBlur = s.red ? 18 : 0; ctx.fillText(s.s, x, y); ctx.shadowBlur = 0; x += ctx.measureText(s.s).width; });
  });
  ctx.restore();
}

function render(t) {
  const f = Math.round(t * FPS);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let grain = 0.12;
  const breathe = { sx: Math.sin(t * 0.5) * 5, sy: Math.sin(t * 0.37 + 1) * 4 };
  const WIDE = { z: 1, cx: 540, cy: 880 }, W2 = { z: 1.1, cx: 540, cy: 900 }, FAR = { z: 2.9, cx: 580, cy: 870 }, FLOWER = { z: 2.5, cx: 350, cy: 1265 };
  const camL = (a, b, k) => ({ z: lerp(a.z, b.z, k), cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k), ...breathe });
  // 向こうの街灯は切れかけ。ふだんは点いているが、ときどき瞬く
  const flick = (hash(Math.floor(t * 14)) < 0.05 ? 0.3 : 1) * (0.92 + 0.08 * Math.sin(t * 50));
  if (t < EV.hit) {
    let cam, o = { street: flick };
    if (t < EV.t_far) cam = camL(WIDE, W2, prog(t, 0, EV.t_far));
    else if (t < EV.t_wide) cam = camL(W2, FAR, ease(prog(t, EV.t_far, EV.t_far + 2.0)));                         // 向こう側の女、手招き
    else if (t < EV.t_flower) cam = camL(FAR, W2, ease(prog(t, EV.t_wide, EV.t_wide + 1.3)));                      // 遮断機に手をかける
    else if (t < EV.t_back) cam = camL(W2, FLOWER, ease(prog(t, EV.t_flower - 0.2, EV.t_flower + 1.1)));           // 足もとの花束
    else cam = camL(FLOWER, { z: 1.04, cx: 540, cy: 890 }, ease(prog(t, EV.t_back, EV.t_back + 1.2)));             // 電車が通りすぎる
    if (t >= EV.appear && t < EV.train + 0.3) { o.wm = { x: 556, y: 938, h: 150, beckon: t >= EV.beckon ? t : 0 }; if (t < EV.appear + 0.25) o.street = flick * prog(t, EV.appear, EV.appear + 0.25); }
    // 遮断棒に手をかけると少し持ち上がり、離すと落ちる
    o.lift = t >= EV.touch && t < EV.release ? 0.05 * ease(prog(t, EV.touch, EV.touch + 0.5)) + (hash(f) - 0.5) * 0.004 : t >= EV.release ? 0.05 * Math.max(0, 1 - (t - EV.release) / 0.12) : 0;
    o.flowerLit = ease(prog(t, EV.t_flower, EV.t_flower + 0.8)) * (1 - prog(t, EV.t_back, EV.t_back + 1));
    const tp = (t - EV.train) / EV.train_d; o.train = tp;
    if (tp >= 0 && tp <= 1) { cam.sx += (hash(f) - 0.5) * 26; cam.sy += (hash(f + 3) - 0.5) * 18; o.shake = 1; o.lift += (hash(f + 7) - 0.5) * 0.02; }
    if (t >= EV.off && t < EV.on) o.street = 0;
    if (t >= EV.on) { o.street = 0.8 + 0.2 * hash(f); o.wm = { x: 540, y: 1580 + 60 * prog(t, EV.on, EV.hit), h: 1050 + 160 * prog(t, EV.on, EV.hit) }; }
    crossing(t, f, cam, o);
    if (t >= EV.off && t < EV.on) { ctx.fillStyle = 'rgba(0,0,6,0.6)'; ctx.fillRect(0, 0, W, H); }
    if (t >= EV.on) ctx.drawImage(cv, (hash(f) - 0.5) * 10, (hash(f + 2) - 0.5) * 10);
    const k0 = 1 - prog(t, 0, 0.6); if (k0 > 0) { ctx.fillStyle = `rgba(0,0,0,${k0})`; ctx.fillRect(0, 0, W, H); }
    const g = ctx.createLinearGradient(0, 1330, 0, 1520); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.85)'); ctx.fillStyle = g; ctx.fillRect(0, 1330, W, 600);
  } else if (t < EV.hit + 0.5) {
    const k = (t - EV.hit) / 0.5; crossing(EV.hit - 0.01, f, { z: 1 + 0.3 * k, cx: 540, cy: 900 }, { street: 1, wm: { x: 540 + (hash(f) - 0.5) * 40, y: 1700 + 900 * k, h: 1400 + 2200 * k } });
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = f % 2 ? '#ff4038' : '#ffffff'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 9; i++) { const y = hash(f * 3 + i) * H | 0, h = 30 + hash(f + i) * 140 | 0, dx = (hash(f * 7 + i) - 0.5) * 400 | 0; ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); }
    grain = 0.3;
  } else {
    if (t < EV.hit + 0.6) noise(0.7, f, 5, 'source-over');
    const a = prog(t, EV.hit + 0.7, EV.hit + 1.0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 64px ${MIN}`; ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillText('電車の来ない踏切は', W / 2, 860);
    ctx.fillStyle = `rgba(255,43,43,${a})`; ctx.fillText('開くまで、待ってはいけない。', W / 2, 960);
    ctx.font = `800 38px ${MIN}`; ctx.fillStyle = `rgba(190,190,190,${a * 0.85})`; ctx.fillText('ナレーション  VOICEVOX:四国めたん', W / 2, 1250);
  }
  subtitle(t);
  noise(grain, f + 17, 2, 'overlay');
  const v = ctx.createRadialGradient(W / 2, H / 2, 540, W / 2, H / 2, 1180); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

window.FPS = FPS; window.DURATION = DURATION; window.render = render;
window.ready = document.fonts.load(`800 60px "Shippori Mincho"`, D.lines.map(l => l.text).join('') + '電車の来ない踏切は開くまで、待ってはいけない。ナレーション四国めたん0123456789').then(() => document.fonts.ready);
if (!navigator.webdriver) window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
</script></body></html>
