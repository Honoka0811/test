<script>

const TILES = [];

function noise(alpha, f, scale = 2, op = 'overlay') {

  ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = op; ctx.translate(-ox * scale, -oy * scale); ctx.scale(scale, scale); ctx.fillStyle = ctx.createPattern(tile, 'repeat');

}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function tx(s, x, y, size, col, o = {}) {

const GREEN = '#2fd16b', AMBER = '#ffb347', MEC = '#5aa2ff';
function base(clock) {

  tx(clock, 60, 52, 34, '#e9e9ee', { font: SANS, w: 'bold' });
  ctx.strokeStyle = '#e9e9ee'; ctx.lineWidth = 3; rr(948, 36, 62, 30, 8); ctx.stroke(); ctx.fillStyle = '#e9e9ee'; rr(953, 41, 40, 20, 4); ctx.fill(); ctx.fillRect(1012, 45, 5, 12);
  ctx.fillStyle = GREEN; rr(60, 122, 60, 60, 16); ctx.fill(); ctx.fillStyle = '#0a0d14'; ctx.fillRect(84, 134, 12, 36); ctx.fillRect(72, 146, 36, 12);   // アプリ名(架空)
  tx('ヘルスノート', 140, 152, 46, '#fff', { bold: true });
}
function card(x, y, w, h, o = {}) { ctx.fillStyle = o.fill || 'rgba(255,255,255,0.055)'; rr(x, y, w, h, o.r || 36); ctx.fill(); if (o.stroke) { ctx.save(); ctx.strokeStyle = o.stroke; ctx.lineWidth = o.lw || 4; ctx.shadowColor = o.stroke; ctx.shadowBlur = o.glow || 0; rr(x, y, w, h, o.r || 36); ctx.stroke(); ctx.restore(); } }

function kg(v, x, y, size, col, o = {}) {     // 「58.4 kg」。x は数字の右端
  ctx.save(); if (o.glow) { ctx.shadowColor = col; ctx.shadowBlur = o.glow; } tx(v, x, y, size, col, { font: SANS, w: 'bold', align: 'right' }); ctx.restore(); tx('kg', x + size * 0.08, y + size * 0.2, size * 0.36, o.unit || DIMC, { font: SANS, w: 'bold' });

function lcd(y, h, v, col, label, sub, o = {}) {

  if (label) tx(label, 110, y + 70, 44, col === '#fff' ? DIMC : col, { bold: true }); if (sub) tx(sub, 970, y + 70, 44, DIMC, { align: 'right', font: GOT });

function topBanner(t, t0, l1, l2) {
  const k = ease(prog(t, t0, t0 + 0.22)), v = t - t0 < 0.5 ? Math.sin((t - t0) * 95) * 9 * (1 - (t - t0) / 0.5) : 0;

// ---- フック: 体重計の表示 ----
function hookScene(t, f) {
  base('7:05'); tx('体重計 ・ 洗面所', 70, 300, 56, '#fff', { bold: true });

// ---- 自分の記録 ----
const MY = [48.3, 48.1, 48.4, 48.2, 48.0, 48.3, 48.2, 48.1, 48.3, 48.2, 48.4, 48.1, 48.2, 48.2];
function meScene(t) {

}

// ---- 未登録の測定 ----

  const c = ease(prog(t, EV.t_cmp, EV.t_cmp + 0.3));
  ctx.save(); ctx.globalAlpha = 1 - c; tx('この測定は誰のものですか?', 540, 850, 46, '#cfd6e6', { align: 'center' });
  ['自分', 'ゲスト', '削除'].forEach((s, i) => { card(80 + i * 320, 910, 280, 110, { fill: 'rgba(255,255,255,0.08)', r: 55 }); tx(s, 220 + i * 320, 966, 46, '#fff', { align: 'center', bold: true }); }); ctx.restore();
  if (c > 0) { ctx.save(); ctx.globalAlpha = c; card(60, 800, 960, 500);
    const bar = (y, lab, v, col, t0) => { const w = 640 * (v / 60) * ease(prog(t, t0, t0 + 0.5)); tx(lab, 110, y, 46, col === RED ? '#ff8a84' : '#cfe2ff', { bold: true }); ctx.fillStyle = col; rr(250, y - 34, Math.max(w, 2), 68, 16); ctx.fill(); if (w > 400) tx(v.toFixed(1) + ' kg', 250 + w - 24, y, 44, '#06080c', { align: 'right', font: SANS, w: 'bold' }); };
    bar(900, '自分', 48.2, MEC, EV.t_cmp + 0.1); bar(1030, '誰か', 58.4, RED, EV.t_cmp + 0.4);
    const d = ease(prog(t, EV.t_cmp + 1.0, EV.t_cmp + 1.3)); ctx.globalAlpha = c * d; tx('+10.2 kg', 540, 1190, 110, RED, { align: 'center', font: SANS, w: 'bold' }); ctx.restore(); }

  else { const a = 1 - prog(t, EV.t_val + 0.2, EV.t_val + 0.5); if (a > 0) { ctx.save(); ctx.globalAlpha = a; topBanner(t, EV.t_notif, '未登録の測定が 1件 あります'); ctx.restore(); } }
}

// ---- 毎晩の記録 ----
function listScene(t, f) {
  base('7:05'); tx('未登録の測定', 70, 300, 60, '#fff', { bold: true }); tx('午前3時台', 1010, 304, 40, DIMC, { align: 'right' });
  ['4日前', '3日前', '2日前'].forEach((d, i) => { const t0 = EV.nights[i]; if (t < t0) return; const a = ease(prog(t, t0, t0 + 0.2)), y = 440 + i * 140;
    ctx.save(); ctx.globalAlpha = a * (t >= EV.t_last ? 0.45 : 1); ctx.translate((1 - a) * 60, 0); card(60, y - 58, 960, 116, { fill: 'rgba(255,43,43,0.12)', r: 26 });
    tx(d, 100, y, 46, '#cfd6e6', { bold: true }); tx('3:10', 300, y, 52, '#fff', { font: SANS, w: 'bold' }); kg('58.4', 860, y, 76, RED); ctx.restore(); });
  if (t >= EV.t_lastrow) { const a = ease(prog(t, EV.t_lastrow, EV.t_lastrow + 0.25)), has = t >= EV.t_last, k = has ? Math.max(0, 1 - (t - EV.t_last) / 0.6) : 0, p = 0.5 + 0.5 * Math.sin(t * 9);
    ctx.save(); ctx.globalAlpha = a; lcd(860, 440, has ? '106.6' : '---.-', has ? RED : '#5d6680', '昨夜', '午前 3:10', { size: 210, stroke: has ? RED : '#3a4258', glow: has ? 14 + 26 * p : 0, numGlow: has ? 34 : 0, dx: 50 + (hash(f) - 0.5) * 40 * k, dy: (hash(f + 2) - 0.5) * 40 * k }); ctx.restore();
    if (k > 0) { ctx.fillStyle = `rgba(255,30,30,${0.3 * k})`; ctx.fillRect(0, 0, W, H); } }
}

// ---- 足し算 ----
function mathScene(t, f) {
  base('7:05'); tx('106.6 kg の内訳', 70, 300, 60, '#fff', { bold: true });
  const a = ease(prog(t, EV.math.a, EV.math.a + 0.25)), b = ease(prog(t, EV.math.b, EV.math.b + 0.25)), e = ease(prog(t, EV.math.eq, EV.math.eq + 0.2)), p = 0.5 + 0.5 * Math.sin(t * 9);
  ctx.save(); ctx.globalAlpha = a; person(170, 520, 0.9, RED); tx('誰か', 170, 640, 44, '#ff8a84', { align: 'center', bold: true }); kg('58.4', 860, 520, 190, RED); ctx.restore();
  ctx.save(); ctx.globalAlpha = b; person(170, 800, 0.9, MEC); tx('私', 170, 920, 44, '#cfe2ff', { align: 'center', bold: true }); tx('+', 350, 800, 150, '#fff', { font: SANS, w: 'bold', align: 'center' }); kg('48.2', 860, 800, 190, MEC); ctx.restore();
  ctx.fillStyle = `rgba(255,255,255,${b})`; ctx.fillRect(280, 950, 740, 8);
  if (e > 0) { ctx.save(); ctx.globalAlpha = e; const s = lerp(1.5, 1, e); ctx.translate(540, 1120); ctx.scale(s, s); tx('=', -410, 0, 140, '#fff', { font: SANS, w: 'bold', align: 'center' }); kg('106.6', 330, 0, 190, RED, { glow: 20 + 30 * p, unit: '#ff8a84' }); ctx.restore();
    const z = Math.max(0, 1 - (t - EV.math.eq) / 0.5); if (z) { ctx.fillStyle = `rgba(255,30,30,${0.3 * z})`; ctx.fillRect(0, 0, W, H); } }

// ---- 昨夜、起きたこと ----
function carryScene(t, f) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0a0d16'); g.addColorStop(1, '#030407'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  tx('昨夜 ・ 午前 3:10', 540, 180, 56, '#fff', { align: 'center', bold: true }); tx('洗面所', 540, 250, 40, DIMC, { align: 'center' });
  const t0 = EV.t_carry, r = ease(prog(t, t0 + 0.5, t0 + 1.1)), b = ease(prog(t, t0 + 2.0, t0 + 2.7)), on = ease(prog(t, t0 + 3.9, t0 + 4.6)), p = 0.5 + 0.5 * Math.sin(t * 8);

  tx(on >= 1 ? '106.6' : on > 0 ? (106.6 * on).toFixed(1) : '0.0', 540, 1217, 34, on >= 1 ? RED : '#7de3a0', { align: 'center', font: SANS, w: 'bold' });
  ctx.fillStyle = '#12161f'; ctx.fillRect(0, 1250, W, 8);

  ctx.save(); ctx.globalAlpha = r; if (on >= 1) { ctx.shadowColor = RED; ctx.shadowBlur = 30 + 20 * p; } person(px, py, 2.6, RED); ctx.restore();

    ctx.save(); ctx.globalAlpha = b; ctx.fillStyle = MEC; const by = py - 20;
    rr(px - 200, by, 440, 96, 48); ctx.fill(); ctx.beginPath(); ctx.arc(px - 262, by + 40, 56, 0, 7); ctx.fill();
    rr(px + 180, by + 30, 62, 190, 31); ctx.fill(); rr(px + 110, by + 40, 56, 150, 28); ctx.fill(); rr(px - 150, by + 50, 44, 150, 22); ctx.fill();
    ctx.fillStyle = RED; rr(px - 96, by + 70, 84, 50, 25); ctx.fill(); rr(px + 20, by + 70, 84, 50, 25); ctx.fill(); ctx.restore(); }
  ctx.save(); ctx.globalAlpha = r; tx('誰か  58.4kg', 90, 420, 50, '#ff8a84', { bold: true }); ctx.restore();
  ctx.save(); ctx.globalAlpha = b; tx('眠っている私  48.2kg', 990, 500, 50, '#cfe2ff', { bold: true, align: 'right' }); ctx.restore();
  if (on >= 1) { const z = Math.max(0, 1 - (t - (t0 + 4.6)) / 0.5); if (z) { ctx.fillStyle = `rgba(255,30,30,${0.25 * z})`; ctx.fillRect(0, 0, W, H); } }
}

// ---- 字幕 ----
function subtitle(t) {
  const l = D.lines.find(l => t >= l.start - 0.08 && t < l.end + 0.3); if (!l) return;
  const a = Math.min(prog(t, l.start - 0.08, l.start + 0.1), 1 - prog(t, l.end + 0.15, l.end + 0.3));
  const rows = l.text.split('\n').map(r => { const segs = []; r.split(/(\[[^\]]*\])/).forEach(p => { if (!p) return; segs.push(p[0] === '[' ? { s: p.slice(1, -1), red: true } : { s: p, red: false }); }); return segs; });
  let fs = l.id === 'now' ? 130 : 66; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
  const width = r => r.reduce((w, s) => w + ctx.measureText(s.s).width, 0);
  ctx.font = `800 ${fs}px ${MIN}`; const mw = Math.max(...rows.map(width)); if (mw > 960) { fs = Math.floor(fs * 960 / mw); ctx.font = `800 ${fs}px ${MIN}`; }
  const lh = fs * 1.42, y0 = 1480 - (rows.length - 1) * lh / 2, f = Math.round(t * FPS);
  ctx.save(); ctx.globalAlpha = a;
  rows.forEach((r, i) => {
    let x = W / 2 - width(r) / 2; const y = y0 + i * lh + (l.id === 'now' ? (hash(f) - 0.5) * 8 : 0);
    r.forEach(s => { ctx.strokeStyle = 'rgba(0,0,0,0.95)'; ctx.lineWidth = fs * 0.2; ctx.strokeText(s.s, x, y); ctx.fillStyle = s.red ? RED : '#fff'; ctx.shadowColor = s.red ? 'rgba(255,0,0,0.7)' : 'rgba(0,0,0,0)'; ctx.shadowBlur = s.red ? 18 : 0; ctx.fillText(s.s, x, y); ctx.shadowBlur = 0; x += ctx.measureText(s.s).width; });
  });
  ctx.restore();
}

function render(t) {

  if (t < EV.hit) {
    if (t < EV.t_me) { hookScene(t, f); const sh = Math.max(0, 1 - t / 0.4); if (sh) { ctx.fillStyle = `rgba(255,255,255,${0.3 * sh})`; ctx.fillRect(0, 0, W, H); } }
    else if (t < EV.t_notif) { meScene(t); fadeIn(EV.t_me); }
    else if (t < EV.t_list) { unknownScene(t, f); fadeIn(EV.t_notif); }
    else if (t < EV.t_math) { listScene(t, f); fadeIn(EV.t_list); }
    else if (t < EV.t_carry) { mathScene(t, f); fadeIn(EV.t_math); }
    else { carryScene(t, f); fadeIn(EV.t_carry);
      if (t >= LN.now.start - 0.1) { ctx.fillStyle = `rgba(0,0,0,${0.5 * prog(t, LN.now.start - 0.1, LN.now.start + 0.2)})`; ctx.fillRect(0, 0, W, H); ctx.drawImage(cv, (hash(f) - 0.5) * 10, (hash(f + 2) - 0.5) * 10); } }
    const g = ctx.createLinearGradient(0, 1330, 0, 1500); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.85)'); ctx.fillStyle = g; ctx.fillRect(0, 1330, W, 600);
  } else if (t < EV.hit + 0.5) {
    const k = (t - EV.hit) / 0.5; ctx.fillStyle = f % 2 ? '#300' : '#000'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(540 + (hash(f) - 0.5) * 70, 900 + (hash(f + 4) - 0.5) * 70); ctx.scale(1 + k, 1 + k); tx('106.6', 0, 0, 330, f % 3 ? RED : '#fff', { font: SANS, w: 'bold', align: 'center' }); ctx.restore();
    for (let i = 0; i < 9; i++) { const y = hash(f * 3 + i) * H | 0, h = 30 + hash(f + i) * 140 | 0, dx = (hash(f * 7 + i) - 0.5) * 400 | 0; ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); }
    grain = 0.3;
  } else {
    if (t < EV.hit + 0.6) noise(0.7, f, 5, 'source-over');
    const a = prog(t, EV.hit + 0.7, EV.hit + 1.0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 64px ${MIN}`; ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillText('あなたの体重計に', W / 2, 860);
    ctx.fillStyle = `rgba(255,43,43,${a})`; ctx.fillText('知らない記録はありませんか?', W / 2, 960);
    ctx.font = `800 38px ${MIN}`; ctx.fillStyle = `rgba(190,190,190,${a * 0.85})`; ctx.fillText('ナレーション  VOICEVOX:四国めたん', W / 2, 1250);
  }
  subtitle(t);
  noise(grain, f + 17, 2, 'overlay');
  const v = ctx.createRadialGradient(W / 2, H / 2, 560, W / 2, H / 2, 1180); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
