    const hl = ctx.createRadialGradient(bx, 1380, 10, bx, 1380, 800); hl.addColorStop(0, 'rgba(255,248,220,0.95)'); hl.addColorStop(1, 'rgba(255,248,220,0)'); ctx.fillStyle = hl; ctx.fillRect(bx - 800, 600, 1600, 1500);
    const sr = rngOf(f); ctx.fillStyle = 'rgba(210,222,255,0.5)'; for (let i = 0; i < 90; i++) ctx.fillRect(bx + sr() * len, 1600 + sr() * 160 - sr() * 120, 3 + sr() * 5, 3 + sr() * 5); }   // 水しぶき
  ctx.restore();
}

// ---- 字幕 ----
function subtitle(t) {
  const l = D.lines.find(l => l.kind !== 'kid' && t >= l.start - 0.08 && t < l.end + 0.3); if (!l) return;
  const a = Math.min(prog(t, l.start - 0.08, l.start + 0.1), 1 - prog(t, l.end + 0.15, l.end + 0.3));
  const rows = l.text.split('\n').map(r => { const segs = []; r.split(/(\[[^\]]*\])/).forEach(p => { if (!p) return; segs.push(p[0] === '[' ? { s: p.slice(1, -1), red: true } : { s: p, red: false }); }); return segs; });
  let fs = l.id === 'now' ? 130 : 66; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
  const width = r => r.reduce((w, s) => w + ctx.measureText(s.s).width, 0);
  ctx.font = `800 ${fs}px ${MIN}`; const mw = Math.max(...rows.map(width)); if (mw > 960) { fs = Math.floor(fs * 960 / mw); ctx.font = `800 ${fs}px ${MIN}`; }
  const lh = fs * 1.42, y0 = 1480 - (rows.length - 1) * lh / 2, f = Math.round(t * FPS);
  ctx.save(); ctx.globalAlpha = a;
  rows.forEach((r, i) => {
    let x = W / 2 - width(r) / 2; const y = y0 + i * lh + (l.id === 'now' ? (hash(f) - 0.5) * 8 : 0);
    r.forEach(s => { ctx.strokeStyle = 'rgba(0,0,0,0.95)'; ctx.lineWidth = fs * 0.2; ctx.strokeText(s.s, x, y); ctx.fillStyle = s.red ? RED : '#fff'; ctx.shadowColor = s.red ? 'rgba(255,0,0,0.7)' : 'rgba(0,0,0,0)'; ctx.shadowBlur = s.red ? 18 : 0; ctx.fillText(s.s, x, y); ctx.shadowBlur = 0; x += ctx.measureText(s.s).width; });
  });
  ctx.restore();
}

function render(t) {
  const f = Math.round(t * FPS);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let grain = 0.1;
  const breathe = { sx: Math.sin(t * 0.5) * 5, sy: Math.sin(t * 0.37 + 1) * 4 };
  const WIDE = { z: 1, cx: 540, cy: 900 }, W2 = { z: 1.12, cx: 540, cy: 920 }, BENCH = { z: 1.7, cx: 545, cy: 930 }, SIGN = { z: 3.3, cx: 119, cy: 740 }, LAST = { z: 1.42, cx: 540, cy: 900 };
  const camL = (a, b, k) => ({ z: lerp(a.z, b.z, k), cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k), ...breathe });
  const flick = (hash(Math.floor(t * 14)) < 0.04 ? 0.45 : 1) * (0.94 + 0.06 * Math.sin(t * 50));
  if (t < EV.hit + 0.62) {
    let cam, o = { lamp: flick };
    if (t < EV.t_close) cam = camL(WIDE, W2, prog(t, 0, EV.t_close));
    else if (t < EV.glow) cam = camL(W2, BENCH, ease(prog(t, EV.t_close, EV.t_close + 1.6)));
    else if (t < EV.t_sign) cam = camL(BENCH, { z: 1.25, cx: 540, cy: 940 }, ease(prog(t, EV.glow, EV.glow + 1.4)));
    else if (t < EV.t_wide) cam = camL({ z: 1.25, cx: 540, cy: 940 }, SIGN, ease(prog(t, EV.t_sign, EV.t_sign + 1.5)));
    else if (t < EV.turn) cam = camL(camL(SIGN, WIDE, ease(prog(t, EV.t_wide, EV.t_wide + 1.2))), { z: 1.1, cx: 540, cy: 900 }, prog(t, EV.flash, EV.turn));
    else cam = camL({ z: 1.1, cx: 540, cy: 900 }, LAST, ease(prog(t, EV.turn, EV.turn + 1.6)));
    // 雷: 冒頭に遠くで一度、そして「そのとき」。最後に街灯が消えてからもう一度
    o.L = Math.max(t >= EV.flash0 && t < EV.flash0 + 0.067 ? 0.32 : 0, bolt(t, EV.flash), bolt(t, EV.hit + 0.12));
    o.seen = t >= EV.flash ? 0.62 : 0; o.near = t >= EV.hit ? 1 : 0;
    // 立ち上がろうとして、袖をつかまれ、座り直す
    const up = ease(prog(t, EV.rise, EV.rise + 0.9)), down = ease(prog(t, EV.grab + 1.6, EV.grab + 2.6));
    o.rise = up * (1 - down) * (t >= EV.grab ? 1 - 0.25 * ease(prog(t, EV.grab, EV.grab + 0.3)) : 1);
    o.grab = ease(prog(t, EV.grab - 0.25, EV.grab + 0.1));
    o.glow = ease(prog(t, EV.glow, EV.bus)) ** 2 * (t < EV.bus ? 1 : 0);
    o.bus = (t - EV.bus) / EV.bus_d; if (o.bus >= 0 && o.bus <= 1) { cam.sx += (hash(f) - 0.5) * 18; cam.sy += (hash(f + 3) - 0.5) * 12; }
    o.stick = t >= EV.stick ? 0.8 + 0.2 * Math.sin(t * 9) : 0.75 * ease(prog(t, EV.t_sign + 0.9, EV.stick));
    o.tilt = 0.5 * ease(prog(t, EV.turn, EV.turn + 0.9)); o.umb = 0.16 * ease(prog(t, EV.turn, EV.turn + 0.9)); o.still = t >= EV.grab;
    if (t >= EV.hit) { o.lamp = 0; }                       // 街灯が消える。赤い傘だけがぼんやり残る
    stop(t, f, cam, o);
    if (t >= EV.hit) { ctx.fillStyle = `rgba(0,0,4,${(0.55 + 0.4 * prog(t, EV.hit + 0.35, EV.hit + 0.6)) * (1 - o.L)})`; ctx.fillRect(0, 0, W, H); for (let i = 0; i < 6; i++) { const y = hash(f * 3 + i) * H | 0, h = 30 + hash(f + i) * 120 | 0, dx = (hash(f * 7 + i) - 0.5) * 260 | 0; ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); } grain = 0.25; }
    else if (t >= LN.g4.start - 0.1) ctx.drawImage(cv, (hash(f) - 0.5) * 8, (hash(f + 2) - 0.5) * 8);
    const z = t >= EV.grab ? Math.max(0, 1 - (t - EV.grab) / 0.4) : 0; if (z) { ctx.fillStyle = `rgba(255,30,30,${0.18 * z})`; ctx.fillRect(0, 0, W, H); }
    const k0 = 1 - prog(t, 0, 0.6); if (k0 > 0) { ctx.fillStyle = `rgba(0,0,0,${k0})`; ctx.fillRect(0, 0, W, H); }
    const g = ctx.createLinearGradient(0, 1330, 0, 1520); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.85)'); ctx.fillStyle = g; ctx.fillRect(0, 1330, W, 600);
  } else {
    if (t < EV.hit + 0.72) noise(0.7, f, 5, 'source-over');
    const a = prog(t, EV.hit + 0.85, EV.hit + 1.15); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 56px ${MIN}`; ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillText('来るはずのない人を待つ子と', W / 2, 860);
    ctx.fillStyle = `rgba(255,43,43,${a})`; ctx.fillText('「いっしょに待つ」約束は、しないこと。', W / 2, 960);
    ctx.font = `800 38px ${MIN}`; ctx.fillStyle = `rgba(190,190,190,${a * 0.85})`; ctx.fillText('ナレーション  VOICEVOX:四国めたん', W / 2, 1250);
  }
  subtitle(t);
  noise(grain, f + 17, 2, 'overlay');
  const v = ctx.createRadialGradient(W / 2, H / 2, 540, W / 2, H / 2, 1180); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

window.FPS = FPS; window.DURATION = DURATION; window.render = render;
window.ready = document.fonts.load(`800 60px "Shippori Mincho"`, D.lines.map(l => l.text).join('') + '来るはずのない人を待つ子と「いっしょに待つ」約束は、しないこと。ナレーション四国めたん0123456789').then(() => document.fonts.ready);
if (!navigator.webdriver) window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
</script></body></html>
