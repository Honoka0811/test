  fc.fillStyle = `rgba(118,128,146,${0.8 * Math.min(1, fa * 1.25)})`; fc.fillRect(0, 0, W, H);
  fc.globalAlpha = Math.min(1, fa * 1.4); fc.drawImage(fogTex, 0, 0); fc.globalAlpha = 1;
  fc.globalCompositeOperation = 'destination-out';
  const ca = (1 - fa) ** 0.8; if (ca > 0.01) { const g = fc.createRadialGradient(540, 660, 60, 540, 660, 760); g.addColorStop(0, `rgba(0,0,0,${ca})`); g.addColorStop(1, 'rgba(0,0,0,0)'); fc.fillStyle = g; fc.fillRect(0, 0, W, H); }   // まん中ほど、最後まで透けている
  fc.fillStyle = fc.strokeStyle = 'rgba(0,0,0,0.92)';
  EV.prints.forEach((tp, i) => { const k = prog(t, tp, tp + 0.25); if (k <= 0) return; const [x, y, s, r] = PRINTS[i]; fc.globalAlpha = Math.min(1, k * 1.4); hand(fc, x, y + 12 * ease(prog(t, tp + 0.2, tp + 1.6)), s, r, ease(prog(t, tp, tp + 2.2))); });
  fc.restore(); ctx.drawImage(fogCv, 0, 0);
}

// ---- 車内 ----
function bust(c, x, y, s, col, rim) {
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = col;
  c.beginPath(); c.moveTo(-46, 60); c.quadraticCurveTo(-44, 14, -20, 6); c.lineTo(20, 6); c.quadraticCurveTo(44, 14, 46, 60); c.closePath(); c.fill();
  c.beginPath(); c.ellipse(0, -14, 17, 21, 0, 0, 7); c.fill(); c.fillRect(-7, 0, 14, 10);
  if (rim) { c.strokeStyle = rim; c.lineWidth = 1.6; c.beginPath(); c.ellipse(0, -14, 17, 21, 0, Math.PI * 1.05, Math.PI * 1.75); c.stroke(); c.beginPath(); c.moveTo(-44, 40); c.quadraticCurveTo(-42, 14, -20, 7); c.stroke(); }
  c.restore();
}
function mirror(t, f, inT, pulse) {
  const mx = 150, my = 180, mw = 360, mh = 118;
  ctx.fillStyle = '#06070b'; ctx.fillRect(mx + mw / 2 - 9, 0, 18, my + 4);
  ctx.save(); ctx.beginPath(); ctx.roundRect(mx, my, mw, mh, 22); ctx.clip();
  ctx.fillStyle = '#05060a'; ctx.fillRect(mx, my, mw, mh);
  // リアガラス(後ろの景色)
  ctx.fillStyle = inT ? mix([20, 12, 6], [120, 74, 30], pulse * 0.7) : '#0b1022'; ctx.beginPath(); ctx.moveTo(mx + 40, my + 6); ctx.lineTo(mx + mw - 40, my + 6); ctx.lineTo(mx + mw - 18, my + 58); ctx.lineTo(mx + 18, my + 58); ctx.closePath(); ctx.fill();
  const fa = ease(prog(t, EV.fog + 1, EV.fogfull)); if (fa > 0) { ctx.fillStyle = `rgba(140,150,166,${0.7 * fa})`; ctx.fill(); }
  // 後部座席
  ctx.fillStyle = '#14161c'; ctx.fillRect(mx, my + 70, mw, mh); for (const hx of [mx + 72, mx + 180, mx + 288]) { ctx.fillStyle = '#1b1e26'; ctx.beginPath(); ctx.roundRect(hx - 26, my + 48, 52, 32, 10); ctx.fill(); }
  // 乗っている人たち
  const rim = 'rgba(150,170,220,0.55)', col = '#020204';
  if (t >= EV.bump + 0.05 && t < EV.bump + 0.2) bust(ctx, mx + 288, my + 64, 0.95, col, rim);       // 沈んだ瞬間、一瞬だけ映る
  if (t >= EV.full) {
    const ln = ease(prog(t, EV.lean, EV.hit - 0.3));
    bust(ctx, mx + 100, my + 44, 0.7, col, rim); bust(ctx, mx + 262, my + 40, 0.66, col, rim);                     // リアガラスの前にも、顔を寄せている
    bust(ctx, mx + 70, my + 62, 0.98, col, rim); bust(ctx, mx + 292, my + 64, 0.96, col, rim); bust(ctx, mx + 128, my + 80, 0.62, col, rim);   // 子どもも
    bust(ctx, lerp(mx + 182, mx + 250, ln), lerp(my + 66, my + 120, ln), lerp(1.02, 3.4, ln * ln), col, rim);        // まん中の人が、身を乗り出してくる
  }
  ctx.restore();
  ctx.strokeStyle = '#0a0b10'; ctx.lineWidth = 9; ctx.beginPath(); ctx.roundRect(mx, my, mw, mh, 22); ctx.stroke();
  const sh = ctx.createLinearGradient(mx, my, mx + mw, my + mh); sh.addColorStop(0, 'rgba(255,255,255,0.06)'); sh.addColorStop(0.5, 'rgba(255,255,255,0)'); ctx.fillStyle = sh; ctx.beginPath(); ctx.roundRect(mx, my, mw, mh, 22); ctx.fill();
}
function cabin(t, f, inT, pulse, speed) {
  // 天井と A ピラー
  ctx.fillStyle = '#040408'; ctx.fillRect(-300, -300, 1700, 452); ctx.beginPath(); ctx.moveTo(-300, -300); ctx.lineTo(110, 150); ctx.lineTo(-20, 1160); ctx.lineTo(-300, 1160); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.moveTo(1400, -300); ctx.lineTo(970, 150); ctx.lineTo(1100, 1160); ctx.lineTo(1400, 1160); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#07080d'; ctx.beginPath(); ctx.moveTo(-300, 1290); ctx.quadraticCurveTo(540, 1180, 1400, 1290); ctx.lineTo(1400, 2300); ctx.lineTo(-300, 2300); ctx.closePath(); ctx.fill();
  // メーター
  for (const [gx, gv] of [[400, speed / 120], [680, 0.35 + speed / 400]]) { const g = ctx.createRadialGradient(gx, 1470, 10, gx, 1470, 120); g.addColorStop(0, 'rgba(60,140,255,0.22)'); g.addColorStop(1, 'rgba(60,140,255,0)'); ctx.fillStyle = g; ctx.fillRect(gx - 130, 1340, 260, 260);
    ctx.strokeStyle = 'rgba(110,170,255,0.75)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(gx, 1470, 92, Math.PI * 0.8, Math.PI * 2.2); ctx.stroke();
    for (let i = 0; i <= 10; i++) { const a = Math.PI * (0.8 + 1.4 * i / 10); ctx.beginPath(); ctx.moveTo(gx + Math.cos(a) * 80, 1470 + Math.sin(a) * 80); ctx.lineTo(gx + Math.cos(a) * 90, 1470 + Math.sin(a) * 90); ctx.stroke(); }
    const a = Math.PI * (0.8 + 1.4 * clamp(gv)); ctx.strokeStyle = '#ff6a3a'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(gx, 1470); ctx.lineTo(gx + Math.cos(a) * 78, 1470 + Math.sin(a) * 78); ctx.stroke(); }
  // ハンドルと手
  ctx.strokeStyle = '#030306'; ctx.lineWidth = 74; ctx.beginPath(); ctx.arc(540, 1900, 560, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  ctx.strokeStyle = 'rgba(120,140,190,0.12)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(540, 1900, 594, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke();
  for (const a of [Math.PI * 1.17, Math.PI * 1.83]) { const hx = 540 + Math.cos(a) * 560, hy = 1900 + Math.sin(a) * 560; ctx.fillStyle = '#0c0b0e'; ctx.beginPath(); ctx.ellipse(hx, hy, 58, 46, a + Math.PI / 2, 0, 7); ctx.fill(); ctx.fillStyle = '#08080a'; ctx.fillRect(hx - 40 + (a > 4.5 ? 30 : -30), hy + 30, 80, 400); }
  mirror(t, f, inT, pulse);
  // トンネルの照明が、車内を順番に照らしていく
  if (inT) { ctx.fillStyle = `rgba(255,150,60,${0.1 * pulse})`; ctx.fillRect(-300, -300, 1700, 2600); }
  const dg = ctx.createRadialGradient(540, 1460, 40, 540, 1460, 700); dg.addColorStop(0, 'rgba(70,120,255,0.07)'); dg.addColorStop(1, 'rgba(70,120,255,0)'); ctx.fillStyle = dg; ctx.fillRect(-300, 900, 1700, 1400);
}

function scene(t, f) {
  const d = dist(t), inT = d >= PORTAL && d < D_OUT, speed = t < EV.l2s ? 24 : t < EV.l2e ? 12 : 47;
  const blackout = t >= EV.bump - 0.42 && t < EV.bump - 0.06;
  WDY = -16 * ease(prog(t, EV.bump, EV.bump + 0.18)); const sh = t >= EV.bump ? Math.exp(-(t - EV.bump) * 6) : 0; WDY += (hash(f) - 0.5) * 30 * sh + Math.sin(t * 7) * 1.2; WDX = (hash(f + 1) - 0.5) * 12 * sh;
  ctx.save(); clipShield(ctx); ctx.clip();
  if (!inT) { sky(); if (d < PORTAL) portal(t, d); road(d, d < PORTAL ? PORTAL - d : 120); guard(d); cedars(d); }
  else { ctx.fillStyle = '#020203'; ctx.fillRect(-300, -300, 1700, 2600); tunnelInner(d, 0, !blackout); if (blackout) { ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(-300, -300, 1700, 2600); } }
  // ヘッドライトの光
  const hg = ctx.createRadialGradient(540, 1150, 30, 540, 1050, 640); hg.addColorStop(0, 'rgba(255,250,225,0.10)'); hg.addColorStop(1, 'rgba(255,250,225,0)'); ctx.fillStyle = hg; ctx.fillRect(-300, 400, 1700, 1000);
  ctx.restore();
  glass(t, f);
  const pulse = inT && !blackout ? Math.max(0, Math.cos(2 * Math.PI * ((d - PORTAL + 6) % 12) / 12)) ** 4 : 0;
  cabin(t, f, inT, pulse, speed + (hash(Math.floor(t * 2)) - 0.5) * 2);
  if (blackout) { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-300, -300, 1700, 2600); }
}

// ---- 字幕 ----
function subtitle(t) {
  const l = D.lines.find(l => l.kind !== 'kid' && t >= l.start - 0.08 && t < l.end + 0.3); if (!l) return;
  const a = Math.min(prog(t, l.start - 0.08, l.start + 0.1), 1 - prog(t, l.end + 0.15, l.end + 0.3));
  const rows = l.text.split('\n').map(r => { const segs = []; r.split(/(\[[^\]]*\])/).forEach(p => { if (!p) return; segs.push(p[0] === '[' ? { s: p.slice(1, -1), red: true } : { s: p, red: false }); }); return segs; });
  let fs = l.id === 'now' ? 130 : 66; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
  const width = r => r.reduce((w, s) => w + ctx.measureText(s.s).width, 0);
  ctx.font = `800 ${fs}px ${MIN}`; const mw = Math.max(...rows.map(width)); if (mw > 960) { fs = Math.floor(fs * 960 / mw); ctx.font = `800 ${fs}px ${MIN}`; }
  const lh = fs * 1.42, y0 = 1480 - (rows.length - 1) * lh / 2, f = Math.round(t * FPS);
  ctx.save(); ctx.globalAlpha = a;
  rows.forEach((r, i) => {
    let x = W / 2 - width(r) / 2; const y = y0 + i * lh + (l.id === 'now' ? (hash(f) - 0.5) * 8 : 0);
    r.forEach(s => { ctx.strokeStyle = 'rgba(0,0,0,0.95)'; ctx.lineWidth = fs * 0.2; ctx.strokeText(s.s, x, y); ctx.fillStyle = s.red ? RED : '#fff'; ctx.shadowColor = s.red ? 'rgba(255,0,0,0.7)' : 'rgba(0,0,0,0)'; ctx.shadowBlur = s.red ? 18 : 0; ctx.fillText(s.s, x, y); ctx.shadowBlur = 0; x += ctx.measureText(s.s).width; });
  });
  ctx.restore();
}

function render(t) {
  const f = Math.round(t * FPS);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let grain = 0.1;
  // カメラ: 慰霊碑に寄る → 戻る → バックミラーに寄る
  const zm = ease(prog(t, EV.l2s + 1.0, EV.l2s + 2.4)) * (1 - ease(prog(t, EV.l2e - 0.4, EV.t_in))), zr = ease(prog(t, EV.mirror, EV.mirror + 1.4)), zl = ease(prog(t, EV.lean, EV.hit));
  const d = dist(t), mon = P(-5.0, 1.2, Math.max(2, PORTAL - 6 - d));
  let z = 1 + 1.25 * zm, cx = lerp(540, mon[0], zm), cy = lerp(960, mon[1], zm);
  if (zr > 0) { z = lerp(1, 2.6, zr) + 0.6 * zl; cx = lerp(540, 330, zr); cy = lerp(960, 240 + 10 * zl, zr); }
  if (t < EV.hit + 0.5) {
    ctx.save(); ctx.translate(540, 960); ctx.scale(z, z); ctx.translate(-cx, -cy);
    if (t < EV.hit) scene(t, f);
    else { const k = (t - EV.hit) / 0.5; ctx.translate(330, 240); ctx.scale(1 + 1.6 * k, 1 + 1.6 * k); ctx.translate(-330, -240); scene(EV.hit - 0.02, f); }
    ctx.restore();
    if (t >= EV.hit) { ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = f % 2 ? '#ff4038' : '#ffffff'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
      for (let i = 0; i < 9; i++) { const y = hash(f * 3 + i) * H | 0, h = 30 + hash(f + i) * 140 | 0, dx = (hash(f * 7 + i) - 0.5) * 400 | 0; ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); } grain = 0.3; }
    else if (t >= LN.now.start - 0.1) ctx.drawImage(cv, (hash(f) - 0.5) * 8, (hash(f + 2) - 0.5) * 8);
    const zf = t >= EV.full ? Math.max(0, 1 - (t - EV.full) / 0.4) : 0; if (zf) { ctx.fillStyle = `rgba(255,30,30,${0.2 * zf})`; ctx.fillRect(0, 0, W, H); }
    const k0 = 1 - prog(t, 0, 0.7); if (k0 > 0) { ctx.fillStyle = `rgba(0,0,0,${k0})`; ctx.fillRect(0, 0, W, H); }
    const g = ctx.createLinearGradient(0, 1330, 0, 1520); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.8)'); ctx.fillStyle = g; ctx.fillRect(0, 1330, W, 600);
  } else {
    if (t < EV.hit + 0.6) noise(0.7, f, 5, 'source-over');
    const a = prog(t, EV.hit + 0.7, EV.hit + 1.0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 64px ${MIN}`; ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillText('家に帰れない人たちは', W / 2, 860);
    ctx.fillStyle = `rgba(255,43,43,${a})`; ctx.fillText('空いている席を、さがしている。', W / 2, 960);
    ctx.font = `800 38px ${MIN}`; ctx.fillStyle = `rgba(190,190,190,${a * 0.85})`; ctx.fillText('ナレーション  VOICEVOX:四国めたん', W / 2, 1250);
  }
  subtitle(t);
  noise(grain, f + 17, 2, 'overlay');
  const v = ctx.createRadialGradient(W / 2, H / 2, 540, W / 2, H / 2, 1180); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

window.FPS = FPS; window.DURATION = DURATION; window.render = render;
window.ready = document.fonts.load(`800 60px "Shippori Mincho"`, D.lines.map(l => l.text).join('') + '慰霊碑崩落事故犠牲者家に帰れない人たちは空いている席を、さがしている。ナレーション四国めたん0123456789').then(() => document.fonts.ready);
if (!navigator.webdriver) window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
</script></body></html>
