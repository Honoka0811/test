}

// ---- 字幕 ----

const lowCv = document.createElement('canvas'); lowCv.width = W / 3; lowCv.height = H / 3; const lc = lowCv.getContext('2d');
const prevCv = document.createElement('canvas'); prevCv.width = W; prevCv.height = H; const pc = prevCv.getContext('2d'); let prevF = -9;
const grainCv = document.createElement('canvas'); grainCv.width = 540; grainCv.height = 960; const gc = grainCv.getContext('2d'); const gImg = gc.createImageData(540, 960);
function lowLight(t, f, dark) {

  const src = document.createElement('canvas'); src.width = W; src.height = H; src.getContext('2d').drawImage(cv, 0, 0);

function render(t) {
  const f = Math.round(t * FPS);
  if (!PCV) PCV = { p30: photoCanvas('p30'), p10: photoCanvas('p10'), blank1: plainPhoto(1), blank2: plainPhoto(2) };
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

      const k = ease(prog(t, LN.l1.start + 1.2, LN.l1.start + 4.5)); hallScene(t, f, { z: lerp(1, 1.9, k), cx: lerp(540, 820, k), cy: lerp(900, 900, k), lineW: true, wTurn: -0.9 + 0.5 * ease(prog(t, LN.l1.end - 1.0, LN.l1.end)) }); fadeIn(0, 0.8); }

    else if (t < EV.p10) { albumScene(t, f, { z: lerp(1.0, 1.15, prog(t, EV.album, EV.p10)), cx: 540, cy: 900, page: 'p10' }); fadeIn(EV.album, 0.5); dark = 0.3; }
    else if (t < EV.p30) {      // 10年前の写真に寄る
      const k = ease(prog(t, EV.p10, EV.p10 + 1.2)); albumScene(t, f, { z: lerp(1.15, 2.4, k), cx: lerp(540, 790, k), cy: lerp(900, 760, k), page: 'p10' });

      const L0 = PLOC('p30'), s = 2.4, sp = (px, py) => [540 + (790 - 210 + px * 420 / 960 - 790) * s, 960 + (800 - 157.5 + py * 420 / 960 - 800) * s]; const w = sp(L0.wx, L0.wy); ring(w[0], w[1] - 8, 70, ease(prog(t, EV.p30 + 2.4, EV.p30 + 3.0)));

      ctx.drawImage(woodCv, 0, 0); const lg = ctx.createRadialGradient(540, 900, 200, 540, 900, 1100); lg.addColorStop(0, 'rgba(255,214,150,0.12)'); lg.addColorStop(1, 'rgba(0,0,0,0.75)'); ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H);
      const PW = 900, A = [540, 420], B = [540, 1080]; bigPhoto(t, 'p30', A[0], A[1], PW * 0.98, -0.01); bigPhoto(t, 'p10', B[0], B[1], PW * 0.98, 0.01);
      ctx.font = `800 44px ${MIN}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; for (const [lb, yy] of [['30年前', A[1] - 352], ['10年前', B[1] - 352]]) { ctx.strokeStyle = '#000'; ctx.lineWidth = 10; ctx.strokeText(lb, 60, yy); ctx.fillStyle = '#e8dcc0'; ctx.fillText(lb, 60, yy); }
      const pa = k => PLOC(k), q = (k, px, py, C) => photoPt(k, px, py, C[0], C[1], PW * 0.98);

      const hl = ease(prog(t, LN.l6.start + 2.0, LN.l6.start + 2.6)); ring(wa[0], wa[1] - 6, 60, hl); ring(wb[0], wb[1] - 6, 60, hl);
      gaze(wa, ta, ease(prog(t, EV.g1, EV.g1 + 0.6)), '祖母'); gaze(wb, tb, ease(prog(t, EV.g2, EV.g2 + 0.6)), '祖父');

        ctx.font = `800 46px ${MIN}`; ctx.textAlign = 'right'; ctx.strokeStyle = '#000'; ctx.lineWidth = 10; ctx.strokeText('次のお葬式', 1030, (ta[1] + pb[1]) / 2); ctx.fillStyle = '#ffd24a'; ctx.fillText('次のお葬式', 1030, (ta[1] + pb[1]) / 2); ctx.restore(); }
      fadeIn(EV.cmp); dark = 0.25;
    }
    else if (t < EV.turn) {     // 今日の記憶: あの人が見つめていたのは、私

      ctx.save(); ctx.globalCompositeOperation = 'saturation'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore();       // 思い出の場面は色を抜く
      fadeIn(EV.today, 0.4);

    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = f % 2 ? '#ff4038' : '#ffffff'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 9; i++) { const y = hash(f * 3 + i) * H | 0, h = 30 + hash(f + i) * 140 | 0, dx = (hash(f * 7 + i) - 0.5) * 400 | 0; ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); }

  } else {

    ctx.font = `800 38px ${MIN}`; ctx.fillStyle = `rgba(190,190,190,${a * 0.85})`; ctx.fillText('ナレーション  VOICEVOX:四国めたん', W / 2, 1250);
  }

  const v = ctx.createRadialGradient(W / 2, H / 2, 540, W / 2, H / 2, 1180); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
