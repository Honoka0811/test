  let x0, x1;
  if (phase === 1) { x0 = lerp(W + sk, -sk, eInOut(p)); x1 = W + sk * 2; } else { x0 = -sk * 2; x1 = lerp(W + sk, -sk, eInOut(p)); }
  ctx.save(); ctx.beginPath(); ctx.moveTo(x0 + sk, 0); ctx.lineTo(x1 + sk, 0); ctx.lineTo(x1 - sk, H); ctx.lineTo(x0 - sk, H); ctx.closePath();
  ctx.fillStyle = col[1]; ctx.fill(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  for (let i = -6; i < 14; i++) { const x = i * 160; ctx.beginPath(); ctx.moveTo(x + sk, 0); ctx.lineTo(x + sk + 60, 0); ctx.lineTo(x - sk + 60, H); ctx.lineTo(x - sk, H); ctx.closePath(); ctx.fill(); }
  for (let i = 0; i < 6; i++) snowflake(((i * 211) % W), 200 + i * 300, 50, i);
  ctx.restore();
  ctx.save(); ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 16;
  for (const x of [x0, x1]) { ctx.beginPath(); ctx.moveTo(x + sk, 0); ctx.lineTo(x - sk, H); ctx.stroke(); }
  ctx.restore();
}

function sceneIndex(t) {
  const sc = TL.scenes; for (let i = sc.length - 1; i >= 0; i--) if (t >= sc[i].start) return i; return 0;
}
window.render = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const i = sceneIndex(t), s = TL.scenes[i], lt = t - s.start;
  const wipe = i > 0 && !(s.kind === 'rank' && s.rank === 1);
  const col = s.kind === 'rank' ? RANKCOL[s.rank] : s.kind === 'drum' ? ['#000', '#2A1F5C'] : ['#000', '#E8452E'];
  if (wipe && lt < WIPE / 2) { const pv = TL.scenes[i - 1]; drawScene(pv, pv.dur + lt, t); wipeBand(1, lt / (WIPE / 2), col); }
  else { drawScene(s, lt, t); if (wipe && lt < WIPE) wipeBand(2, (lt - WIPE / 2) / (WIPE / 2), col); }
  if (!window.NO_SUB) subtitle(t);
  // フラッシュ(1位の直前・直後)
  let fl = 0;
  if (s.kind === 'drum') fl = P(lt, s.dur - .12, .12);
  if (s.kind === 'rank' && s.rank === 1) fl = 1 - P(lt, 0, .35);
  if (fl > 0) { ctx.fillStyle = `rgba(255,255,240,${fl})`; ctx.fillRect(0, 0, W, H); }
};

// フォント読み込み(使う文字だけのサブセットを確実に取得してから描く)
const ALLTEXT = [
  ...TL.lines.map(l => l.text), ...TL.ranking.map(d => d.name + d.shime + d.pops.join('')),
  '冬に食べたい お鍋ランキング カタカタ グツグツ さむ〜い！！ 独断と偏見で選ぶ TOP5 まとめ 第位 ポカポカ度 シメ ▶ ？ 第1位は…？ ドゥルルルル…',
  'あなたの推し鍋はどれ？ コメントで教えてね！ フォローよろしくなのだ！ 音声：VOICEVOX:四国めたん／ずんだもん 0123456789',
].join('');
window.READY = (async () => {
  await Promise.all([
    document.fonts.load(`400 100px ${FD}`, ALLTEXT),
    document.fonts.load(`800 100px ${FR}`, ALLTEXT),
    document.fonts.load(`900 100px ${FR}`, ALLTEXT),
  ]);
  await document.fonts.ready;
})();

if (!/capture/.test(location.search)) {
  const fixed = new URLSearchParams(location.search).get('t');
  window.READY.then(() => {
    if (fixed != null) { render(parseFloat(fixed)); return; }
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % TL.total); requestAnimationFrame(loop); };
    loop();
  });
}
</script>
