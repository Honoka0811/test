<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>近づいてくるアイコン</title>
<link rel="stylesheet" href="node_modules/@fontsource/shippori-mincho/800.css">
<style>html,body{margin:0;background:#000}canvas{display:block;height:100vh;margin:0 auto}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script>
<script>
// render(t) が時刻 t 秒のフレームを決定論的に描く。ブラウザで直接開くとプレビュー再生。
const W = 1080, H = 1920, FPS = 30;
const D = window.DATA, EV = D.ev, DURATION = D.duration, ENV = EV.env;
const LN = Object.fromEntries(D.lines.map(l => [l.id, l]));
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const MIN = '"Shippori Mincho", "IPAGothic", serif', GOT = '"IPAGothic", sans-serif', SANS = '"DejaVu Sans", sans-serif';
const RED = '#ff2b2b', PINK = '#ff6fa3', BLUE = '#5aa2ff', DIMC = '#8a93ad';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const hash = n => { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function rngOf(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const TILES = [];
for (let k = 0; k < 8; k++) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'), im = g.createImageData(256, 256), r = rngOf(4000 + k);
  for (let i = 0; i < 256 * 256; i++) { const v = r() * 255 | 0; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  g.putImageData(im, 0, 0); TILES.push(c);
}
function noise(alpha, f, scale = 2, op = 'overlay') {
  const tile = TILES[f % TILES.length], ox = hash(f * 3.1) * 256 | 0, oy = hash(f * 7.7) * 256 | 0;
  ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = op; ctx.translate(-ox * scale, -oy * scale); ctx.scale(scale, scale); ctx.fillStyle = ctx.createPattern(tile, 'repeat');
  ctx.fillRect(0, 0, (W + 256 * scale) / scale, (H + 256 * scale) / scale); ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function tx(s, x, y, size, col, o = {}) {
  ctx.font = `${o.w || ''} ${size}px ${o.font || GOT}`; ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = col;
  if (o.bold) { ctx.lineWidth = size * 0.035; ctx.strokeStyle = col; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillText(s, x, y);
}

// ---- 距離と経路 ----
const DK = EV.dk;
function dist(t) { if (t <= DK[0][0]) return DK[0][1]; for (let i = 1; i < DK.length; i++) if (t <= DK[i][0]) { const k = (t - DK[i - 1][0]) / (DK[i][0] - DK[i - 1][0]); return lerp(DK[i - 1][1], DK[i][1], i >= DK.length - 1 || DK[i][1] === DK[i - 1][1] ? k : ease(k) * 0.4 + k * 0.6); } return 0; }
const ME = [3.5, -2.2];                                     // 自分(私の部屋のベッド)
const ROUTE = [[620, -1106], [620, -306], [220, -306], [220, -146], [60, -146], [60, 14], [-3, 14], [-3, 7.2], [-3, -2.2], [3.5, -2.2]];
const SAMP = [];
for (let i = 0; i < ROUTE.length - 1; i++) { const [ax, ay] = ROUTE[i], [bx, by] = ROUTE[i + 1], n = Math.ceil(Math.hypot(bx - ax, by - ay) / 0.2); for (let k = 0; k < n; k++) SAMP.push([lerp(ax, bx, k / n), lerp(ay, by, k / n)]); }
SAMP.push(ME);
function posFor(d) { let lo = 0; for (let i = 0; i < SAMP.length; i++) { if (Math.hypot(SAMP[i][0] - ME[0], SAMP[i][1] - ME[1]) <= d + 1e-6) { lo = i; break; } lo = i; } return lo; }
const fmt = d => d >= 100 ? Math.round(d / 10) * 10 : d >= 10 ? Math.round(d) : d > 0.4 ? Math.round(d) : 0;

// ---- 地図 ----
function map(t, f) {
  const d = dist(t), idx = posFor(d), [mx, my] = SAMP[idx];
  const sc = 400 / Math.max(d * 1.12, 9.5) * lerp(1, 1.75, ease(prog(t, EV.bed - 0.4, EV.bed + 0.5)));                 // px/m。近づくほど拡大
  const cx = lerp(ME[0], mx, 0.5), cy = lerp(ME[1], my, 0.5);
  const X = x => 540 + (x - cx) * sc, Y = y => 860 + (y - cy) * sc;
  ctx.fillStyle = '#0b111d'; ctx.fillRect(0, 0, W, H);
  const x0 = cx - 600 / sc, x1 = cx + 600 / sc, y0 = cy - 900 / sc, y1 = cy + 1100 / sc;
  // 公園と川
  ctx.fillStyle = '#0f2219'; ctx.fillRect(X(300), Y(-626), 240 * sc, 160 * sc); ctx.fillRect(X(-260), Y(94), 160 * sc, 160 * sc);
  ctx.strokeStyle = '#0d2238'; ctx.lineWidth = 46 * sc; ctx.beginPath(); ctx.moveTo(X(-900), Y(-900)); ctx.lineTo(X(-200), Y(-520)); ctx.lineTo(X(60), Y(-460)); ctx.lineTo(X(1200), Y(-560)); ctx.stroke();
  // 道路
  const road = (a, b, c, e, w, col) => { ctx.strokeStyle = col; ctx.lineWidth = Math.max(w * sc, 2); ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, e); ctx.stroke(); };
  for (let k = Math.floor((x0 + 20) / 80); k <= Math.ceil((x1 + 20) / 80); k++) { const x = 80 * k - 20, main = (k % 4 + 4) % 4 === 0; road(X(x), 0, X(x), H, main ? 10 : 5, main ? '#263550' : '#1a2438'); }
  for (let k = Math.floor((y0 - 14) / 80); k <= Math.ceil((y1 - 14) / 80); k++) { const y = 80 * k + 14, main = (k % 4 + 4) % 4 === 0; road(0, Y(y), W, Y(y), main ? 10 : 5, main ? '#263550' : '#1a2438'); }
  // 通ってきた道
  ctx.strokeStyle = 'rgba(255,111,163,0.55)'; ctx.lineWidth = Math.min(Math.max(2.2 * sc, 5), 18); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();
  const step = Math.max(1, Math.floor(1.5 / sc / 0.2)); let first = true;
  for (let i = 0; i <= idx; i += step) { const p = SAMP[i]; if (p[0] < x0 - 50 || p[0] > x1 + 50 || p[1] < y0 - 50 || p[1] > y1 + 50) { first = true; continue; } first ? ctx.moveTo(X(p[0]), Y(p[1])) : ctx.lineTo(X(p[0]), Y(p[1])); first = false; }
  ctx.lineTo(X(mx), Y(my)); ctx.stroke();
  // 家(拡大すると間取りが見える)
  const ha = prog(sc, 3, 9);
  if (ha > 0) {
    ctx.save(); ctx.globalAlpha = ha;
    ctx.fillStyle = '#131c2e'; ctx.fillRect(X(-6), Y(-4.6), 12 * sc, 9.2 * sc);
    const bedHot = t >= EV.bed, p = 0.5 + 0.5 * Math.sin(t * 9);
    ctx.fillStyle = bedHot ? `rgba(255,43,43,${0.35 + 0.3 * p})` : '#1e2a44'; rr(X(1.9), Y(-3.6), 3.4 * sc, 2.6 * sc, 0.25 * sc); ctx.fill();          // ベッド
    ctx.fillStyle = bedHot ? 'rgba(255,255,255,0.35)' : '#2b3a5c'; rr(X(4.3), Y(-3.3), 0.8 * sc, 2.0 * sc, 0.2 * sc); ctx.fill();                       // 枕
    ctx.strokeStyle = '#c9d3ea'; ctx.lineWidth = Math.max(0.22 * sc, 3); ctx.lineCap = 'butt'; ctx.beginPath();
    ctx.moveTo(X(-2.2), Y(4.6)); ctx.lineTo(X(6), Y(4.6)); ctx.lineTo(X(6), Y(-4.6)); ctx.lineTo(X(-6), Y(-4.6)); ctx.lineTo(X(-6), Y(4.6)); ctx.lineTo(X(-3.8), Y(4.6));   // 外壁(玄関だけ開いている)
    ctx.moveTo(X(0.8), Y(-4.6)); ctx.lineTo(X(0.8), Y(-3.2)); ctx.moveTo(X(0.8), Y(-1.2)); ctx.lineTo(X(0.8), Y(0.4)); ctx.lineTo(X(6), Y(0.4));                       // 私の部屋の壁
    ctx.moveTo(X(-1.2), Y(4.6)); ctx.lineTo(X(-1.2), Y(0.4)); ctx.stroke();
    if (sc > 14) { const fs = Math.min(0.62 * sc, 44); tx('玄関', X(-3), Y(3.6), fs, DIMC, { align: 'center' }); tx('廊下', X(-3.6), Y(-0.6), fs, DIMC, { align: 'center' }); tx('私の部屋', X(3.4), Y(-0.35), fs, bedHot ? '#fff' : DIMC, { align: 'center' }); tx('ベッド', X(3.0), Y(-3.2), fs * 0.8, bedHot ? '#fff' : '#6f7da3', { align: 'center', bold: bedHot }); tx('リビング', X(2.6), Y(2.5), fs, DIMC, { align: 'center' }); }
    ctx.restore();
  }
  // 自分のピン
  const zero = t >= EV.zero, pu = (t * 0.8) % 1;
  if (ha < 1) { ctx.save(); ctx.globalAlpha = 1 - ha; ctx.fillStyle = '#16233c'; ctx.beginPath(); ctx.arc(X(0), Y(0), 46, 0, 7); ctx.fill(); ctx.restore(); }
  ctx.strokeStyle = `rgba(90,162,255,${0.5 * (1 - pu)})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(X(ME[0]), Y(ME[1]), 30 + pu * 60, 0, 7); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(X(ME[0]), Y(ME[1]), 30, 0, 7); ctx.fill(); ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(X(ME[0]), Y(ME[1]), 22, 0, 7); ctx.fill();
  if (!zero || f % 20 < 10) { ctx.fillStyle = 'rgba(8,12,22,0.85)'; rr(X(ME[0]) - 62, Y(ME[1]) + 42, 124, 56, 28); ctx.fill(); tx('自分', X(ME[0]), Y(ME[1]) + 71, 38, '#cfe2ff', { align: 'center', bold: true }); }
  // ミキのピン
  const px = X(mx), py = Y(my), ping = EV.pings.reduce((a, p) => t >= p ? Math.max(a, 1 - (t - p) / 0.5) : a, 0), col = zero ? RED : PINK;
  if (ping > 0 && !zero) { ctx.strokeStyle = `rgba(255,111,163,${ping * 0.8})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(px, py, 50 + (1 - ping) * 70, 0, 7); ctx.stroke(); }
  if (zero) for (let i = 0; i < 3; i++) { const q = ((t - EV.zero) * 1.2 + i / 3) % 1; ctx.strokeStyle = `rgba(255,43,43,${1 - q})`; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(px, py, 50 + q * 240, 0, 7); ctx.stroke(); }
  ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 30; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(px, py - (zero ? 0 : 0), 48, 0, 7); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, 40, 0, 7); ctx.fill(); tx('ミ', px, py + 2, 50, col, { align: 'center', bold: true });
  if (!zero) { ctx.fillStyle = 'rgba(8,12,22,0.85)'; rr(px - 60, py - 116, 120, 56, 28); ctx.fill(); tx('ミキ', px, py - 87, 38, '#ffd0e0', { align: 'center', bold: true }); }
  // 上部カード
  const stopped = t >= DK[6][0] && t < DK[7][0];
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40; ctx.fillStyle = zero ? 'rgba(60,10,14,0.96)' : 'rgba(22,28,44,0.96)'; rr(40, 96, 1000, 250, 46); ctx.fill(); ctx.restore();
  if (zero) { ctx.strokeStyle = RED; ctx.lineWidth = 5; rr(40, 96, 1000, 250, 46); ctx.stroke(); }
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(140, 221, 62, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(140, 221, 53, 0, 7); ctx.fill(); tx('ミ', 140, 224, 66, col, { align: 'center', bold: true });
  tx('ミキ', 232, 178, 58, '#fff', { bold: true });
  tx(zero ? (t >= EV.bed ? 'ミキのスマホ ・ ベッドの下' : 'あなたと同じ場所にいます') : stopped ? '停止中' : 'あなたの方へ移動中', 232, 262, 40, zero ? '#ff8a84' : stopped ? '#ffd27a' : '#9fb0d6');
  const ds = String(fmt(d)); ctx.font = `bold 120px ${SANS}`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillStyle = zero ? RED : d < 120 ? '#ffb347' : '#fff';
  if (zero) { ctx.shadowColor = RED; ctx.shadowBlur = 30; } ctx.fillText(ds, 925, 216); ctx.shadowBlur = 0; tx('m', 990, 240, 60, zero ? RED : '#9fb0d6', { align: 'right', font: SANS, w: 'bold' });
  // 送ったメッセージ(未読のまま)
  if (t >= LN.l3.start - 0.2 && t < LN.l4.end) { const k = ease(prog(t, LN.l3.start - 0.2, LN.l3.start + 0.1)) * (1 - prog(t, LN.l4.end - 0.3, LN.l4.end));
    ctx.save(); ctx.globalAlpha = k; ctx.translate(0, (1 - k) * 40); ctx.fillStyle = '#3b6cf0'; rr(380, 1120, 640, 120, 46); ctx.fill(); tx('どうしたの?何かあった?', 420, 1182, 50, '#fff', { bold: true });
    tx('未読', 1010, 1278, 38, '#ffb347', { align: 'right', bold: true }); ctx.restore(); }
}

// ---- 電話 ----
function callScene(t, f) {
  const k = ease(prog(t, EV.ring, EV.ring + 0.3)), talk = t >= EV.call[0];
  ctx.fillStyle = `rgba(4,6,12,${0.9 * k})`; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = k; const v = !talk && Math.sin(t * 95) * 8 * (((t - EV.buzz) % 0.95) < 0.65 ? 1 : 0);
  ctx.translate(v || 0, 0);
  ctx.fillStyle = '#2a3350'; ctx.beginPath(); ctx.arc(540, 520, 120, 0, 7); ctx.fill(); ctx.fillStyle = '#8a93ad'; ctx.beginPath(); ctx.arc(540, 490, 44, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(540, 590, 74, 46, 0, Math.PI, 0); ctx.fill();
  tx('知らない番号', 540, 720, 76, '#fff', { align: 'center', bold: true }); tx('080-••••-••••', 540, 810, 50, DIMC, { align: 'center', font: SANS });
  if (!talk) { tx('着信中…', 540, 900, 46, '#9fb0d6', { align: 'center' });
    ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.arc(330, 1130, 84, 0, 7); ctx.fill(); ctx.fillStyle = '#2fd16b'; ctx.beginPath(); ctx.arc(750, 1130, 84 + 6 * Math.sin(t * 10), 0, 7); ctx.fill();
    tx('拒否', 330, 1260, 40, DIMC, { align: 'center' }); tx('応答', 750, 1260, 40, DIMC, { align: 'center' });
  } else { tx('通話中  00:0' + Math.floor(t - EV.call[0]), 540, 900, 46, '#2fd16b', { align: 'center', font: SANS });
    for (let i = 0; i < 44; i++) { const e = (ENV[clamp(f - (43 - i), 0, ENV.length - 1)] || 0) * (0.75 + 0.5 * hash(f * 1.3 + i * 7.1)), h = 8 + e * 260; ctx.fillStyle = '#7fe3a6'; rr(100 + i * 20, 1110 - h / 2, 13, h, 6); ctx.fill(); } }
  ctx.restore();
}

// ---- 字幕 ----
function subtitle(t) {
  const l = D.lines.find(l => t >= l.start - 0.08 && t < l.end + 0.3); if (!l) return;
  const a = Math.min(prog(t, l.start - 0.08, l.start + 0.1), 1 - prog(t, l.end + 0.15, l.end + 0.3));
  const rows = l.text.split('\n').map(r => { const segs = []; r.split(/(\[[^\]]*\])/).forEach(p => { if (!p) return; segs.push(p[0] === '[' ? { s: p.slice(1, -1), red: true } : { s: p, red: false }); }); return segs; });
  let fs = l.id === 'now' ? 120 : 66; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.lineJoin = 'round';
  const width = r => r.reduce((w, s) => w + ctx.measureText(s.s).width, 0);
  ctx.font = `800 ${fs}px ${MIN}`; const mw = Math.max(...rows.map(width)); if (mw > 960) { fs = Math.floor(fs * 960 / mw); ctx.font = `800 ${fs}px ${MIN}`; }
  const lh = fs * 1.42, y0 = 1480 - (rows.length - 1) * lh / 2, f = Math.round(t * FPS);
  ctx.save(); ctx.globalAlpha = a;
  rows.forEach((r, i) => {
    let x = W / 2 - width(r) / 2; const y = y0 + i * lh + (l.id === 'now' ? (hash(f) - 0.5) * 8 : 0);
    r.forEach(s => { ctx.strokeStyle = 'rgba(0,0,0,0.95)'; ctx.lineWidth = fs * 0.2; ctx.strokeText(s.s, x, y); ctx.fillStyle = s.red ? RED : '#fff'; ctx.shadowColor = s.red ? 'rgba(255,0,0,0.7)' : 'rgba(0,0,0,0)'; ctx.shadowBlur = s.red ? 18 : 0; ctx.fillText(s.s, x, y); ctx.shadowBlur = 0; x += ctx.measureText(s.s).width; });
  });
  ctx.restore();
}

function render(t) {
  const f = Math.round(t * FPS);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let grain = 0.08;
  if (t < EV.hit) {
    map(t, f);
    tx('1:07', 60, 52, 34, '#e9e9ee', { font: SANS, w: 'bold' }); tx('いまどこマップ', 1020, 52, 32, '#8a93ad', { align: 'right' });
    if (t >= EV.ring && t < EV.call[1] + 0.3) { ctx.save(); ctx.globalAlpha = 1 - prog(t, EV.call[1], EV.call[1] + 0.3); callScene(t, f); ctx.restore(); }
    const g = ctx.createLinearGradient(0, 1320, 0, 1500); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.85)'); ctx.fillStyle = g; ctx.fillRect(0, 1320, W, 600);
    const z = t >= EV.zero ? Math.max(0, 1 - (t - EV.zero) / 0.5) : 0; if (z) { ctx.fillStyle = `rgba(255,30,30,${0.35 * z})`; ctx.fillRect(0, 0, W, H); }
    if (t >= LN.now.start - 0.1) { ctx.fillStyle = `rgba(0,0,0,${0.6 * prog(t, LN.now.start - 0.1, LN.now.start + 0.2)})`; ctx.fillRect(0, 0, W, H); ctx.drawImage(cv, (hash(f) - 0.5) * 10, (hash(f + 2) - 0.5) * 10); }
    const sh = Math.max(0, 1 - t / 0.4); if (sh) { ctx.fillStyle = `rgba(255,255,255,${0.3 * sh})`; ctx.fillRect(0, 0, W, H); }
  } else if (t < EV.hit + 0.5) {
    const k = (t - EV.hit) / 0.5; ctx.fillStyle = f % 2 ? '#300' : '#000'; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 5; i++) { const q = (k * 1.5 + i / 5) % 1; ctx.strokeStyle = f % 3 ? RED : '#fff'; ctx.lineWidth = 30; ctx.beginPath(); ctx.arc(540, 900, 80 + q * 1400, 0, 7); ctx.stroke(); }
    ctx.fillStyle = f % 3 ? RED : '#fff'; ctx.beginPath(); ctx.arc(540 + (hash(f) - 0.5) * 60, 900 + (hash(f + 4) - 0.5) * 60, 150 + 500 * k, 0, 7); ctx.fill();
    ctx.font = `bold ${300 + 500 * k}px ${SANS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText('0', 540, 920);
    for (let i = 0; i < 9; i++) { const y = hash(f * 3 + i) * H | 0, h = 30 + hash(f + i) * 140 | 0, dx = (hash(f * 7 + i) - 0.5) * 400 | 0; ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); }
    grain = 0.3;
  } else {
    if (t < EV.hit + 0.6) noise(0.7, f, 5, 'source-over');
    const a = prog(t, EV.hit + 0.7, EV.hit + 1.0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 64px ${MIN}`; ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillText('あなたの位置情報は', W / 2, 860);
    ctx.fillStyle = `rgba(255,43,43,${a})`; ctx.fillText('いま、誰に見えていますか?', W / 2, 960);
    ctx.font = `800 38px ${MIN}`; ctx.fillStyle = `rgba(190,190,190,${a * 0.85})`; ctx.fillText('ナレーション  VOICEVOX:四国めたん', W / 2, 1250);
  }
  subtitle(t);
  noise(grain, f + 17, 2, 'overlay');
  const v = ctx.createRadialGradient(W / 2, H / 2, 560, W / 2, H / 2, 1180); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

window.FPS = FPS; window.DURATION = DURATION; window.render = render;
window.ready = document.fonts.load(`800 60px "Shippori Mincho"`, D.lines.map(l => l.text).join('') + 'あなたの位置情報は、いま誰に見えていますか?ナレーション四国めたん0123456789:').then(() => document.fonts.ready);
if (!navigator.webdriver) window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
</script></body></html>
