<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eaf0f3; --surface:#ffffff; --line:#d3dee4; --fg:#1b2a33; --muted:#5a6c77;
  --accent:#23779f; --accent-soft:#dcedf5; --metan:#c2407a;
  --air:#e4f1f7; --tissue:#f4c3bf; --tissue-deep:#d9898a; --nucleus:#a05c7e; --cilia:#c97273;
  --base:#f8dedb; --lung:#f7d3cf; --vessel:#d24b47; --virus:#7447bd; --wbc:#f6f2ff; --wbc-edge:#8a78b8;
  --mucus-clear:#b9e0e6; --mucus-yellow:#dcc03c; --mucus-now:#b9e0e6;
  --display:"Zen Maru Gothic","Noto Sans JP",sans-serif; --body:"Noto Sans JP",sans-serif;
}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:var(--bg)}
#frame{position:relative;width:1280px;height:720px}
svg{position:absolute;inset:0}
#sub{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:1240px;display:flex;align-items:center;gap:12px;
  color:#fff;font-family:var(--display);font-weight:900;font-size:33px;line-height:1.3;box-sizing:border-box;text-align:center;white-space:nowrap}
#sub #subtext{-webkit-text-stroke:9px #1b2a33;paint-order:stroke fill;letter-spacing:.02em}
#sub #subtext b{color:#ffd84a;font-weight:900}
#sub .who{flex:none;background:var(--metan);color:#fff;font-size:17px;border-radius:999px;padding:5px 12px;font-family:var(--display);font-weight:700;border:3px solid #fff}
#sub[hidden]{display:none}
.T{font-family:var(--display);font-weight:700;fill:var(--fg)}
.B{font-family:var(--body);fill:var(--fg)}
.M{font-family:var(--body);fill:var(--muted)}
.lead{stroke:var(--muted);stroke-width:1.3;fill:none}
.head{fill:var(--surface);stroke:var(--muted);stroke-width:2}
.outline{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.lung{fill:var(--lung);stroke:var(--tissue-deep);stroke-width:1.5}
.airway{stroke:var(--tissue-deep);fill:none;stroke-linecap:round;stroke-linejoin:round}
.glow{stroke:var(--accent);fill:none;stroke-linecap:round;stroke-linejoin:round}
.ring{stroke:var(--tissue);stroke-width:2}
.mag{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:5 4}
.tissue{fill:var(--tissue);stroke:var(--tissue-deep);stroke-width:1.5}
.nucleus{fill:var(--nucleus)}
.granule{fill:var(--mucus-clear);stroke:var(--tissue-deep);stroke-width:1}
.cil{stroke:var(--cilia);stroke-width:2.4;fill:none;stroke-linecap:round}
.mucus{fill:var(--mucus-now)}
.basement{fill:var(--base)}
.vessel{fill:var(--vessel);opacity:.28}
.rbc{fill:var(--vessel)}
.virus-b{fill:var(--virus)} .virus-s{stroke:var(--virus);stroke-width:2}
.wbc{fill:var(--wbc);stroke:var(--wbc-edge);stroke-width:1.5} .wbc-n{fill:var(--wbc-edge)}
.pill rect{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.pill text{fill:var(--fg);font-family:var(--body);font-size:16px;font-weight:700;text-anchor:middle}
.flow-arrow{stroke:var(--accent);stroke-width:3;fill:none;stroke-dasharray:14 10;stroke-linecap:round}
.dot{fill:var(--mucus-clear);stroke:var(--tissue-deep);stroke-width:1}
.blob{fill:var(--mucus-yellow);stroke:var(--tissue-deep);stroke-width:1.2}
.burst{stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.icon{fill:none;stroke:var(--fg);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
</style>

    <g id="k1" transform="translate(320 250)"><rect x="-22" y="-22" width="44" height="44" rx="8" fill="none" stroke="var(--fg)" stroke-width="3"/><path class="ck" d="M-12 0 L-3 10 L14 -12" stroke="#d24b47" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>

      <text class="B" x="46" y="12" style="font-size:36px;font-weight:700">高い熱・息苦しさがある</text></g>

    <g id="e2" transform="translate(640 336)"><rect x="-440" y="-46" width="880" height="92" rx="20" class="card"/>
      <text x="-400" y="12" style="font-family:var(--display);font-weight:900;font-size:30px;fill:#23779f">役目は？</text><text class="T" x="-250" y="12" style="font-size:34px">ウイルスを捕まえて外へ出す</text></g>
    <g id="e3" transform="translate(640 452)"><rect x="-440" y="-46" width="880" height="92" rx="20" class="card"/>
      <text x="-400" y="12" style="font-family:var(--display);font-weight:900;font-size:30px;fill:#23779f">飲んだら？</text><text class="T" x="-250" y="12" style="font-size:34px">大丈夫。出せるなら吐き出す</text></g>
   </g>
   <g id="end">
    <text class="T" x="330" y="300" text-anchor="middle" style="font-size:96px;font-weight:900">お大事に！</text>
    <text class="B" x="330" y="380" text-anchor="middle" style="font-size:24px">ナレーション　VOICEVOX:四国めたん</text>
    <text class="B" x="330" y="418" text-anchor="middle" style="font-size:24px">BGM・効果音　オリジナル</text>
    <text class="M" x="330" y="480" text-anchor="middle" style="font-size:17px">一般的な説明です。気になる症状は医療機関へ相談してください。</text>

<div id="sub" hidden><span class="who">めたん</span><span id="subtext"></span></div>
</div>
<script>
const TL=window.TL;
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function mk(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
let seed=12345;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
function show(id,o){const e=$(id);e.setAttribute('opacity',o.toFixed(3));e.style.display=o<=0.001?'none':'';}
const baseTf={};
function pop(id,o){const e=$(id);show(id,o);if(!(id in baseTf))baseTf[id]=e.getAttribute('transform')||'';e.setAttribute('transform',baseTf[id]+' translate(0 '+((1-o)*18).toFixed(1)+')');}

const titles=['','痰はどこで作られる？','気道の壁を拡大すると','ウイルスが入ってくる','線毛がのどへ運ぶ','白血球が戦う','咳で外へ出す','痰の色をチェック','飲みこんでもいいの？','出せるなら吐き出そう','出しにくいときは','こんなときは病院へ',''];
// chapter dots
for(let i=1;i<=11;i++)mk('circle',{id:'cd'+i,cx:1216-(11-i)*22,cy:46,r:6},$('chap'));

// body setup
for(let y=160;y<=240;y+=12)mk('line',{class:'ring',x1:394,x2:406,y1:y,y2:y},$('rings'));
const p1=$('p1'),p2=$('p2'),L1=p1.getTotalLength(),L2=p2.getTotalLength();
const dots=[];[[p1,L1],[p2,L2]].forEach(([p,L])=>{for(let k=0;k<7;k++)dots.push({p,L,off:k/7,el:mk('circle',{class:'dot',r:4.5},$('dots'))});});

// micro setup
const cil=[],goblets=[2,6];
for(let i=0;i<10;i++){const x0=i*80;
  mk('rect',{class:'tissue',x:x0+2,y:240,width:76,height:100,rx:12},$('cells'));
  if(goblets.includes(i)){mk('ellipse',{class:'granule',cx:x0+40,cy:270,rx:26,ry:22},$('cells'));
    [[-12,-8],[2,-12],[14,-4],[-6,4],[8,8],[-16,8]].forEach(([dx,dy])=>mk('circle',{class:'granule',cx:x0+40+dx,cy:270+dy,r:5},$('cells')));
    mk('ellipse',{class:'nucleus',cx:x0+40,cy:318,rx:13,ry:9},$('cells'));}
  else{mk('ellipse',{class:'nucleus',cx:x0+40,cy:298,rx:14,ry:18},$('cells'));
    for(let x=x0+9;x<=x0+71;x+=7.5)cil.push({x,el:mk('path',{class:'cil'},$('cilia'))});}}
const rbcs=[];for(let i=0;i<9;i++)rbcs.push({x:i*95,y:386+(i%3)*11,el:mk('ellipse',{class:'rbc',rx:11,ry:5},$('rbcs'))});

const SC={2:{thick:16,flow:.35,yellow:0,secrete:.03,virus:0,wbc:0,labels:['lbl-mucus','lbl-cilia','lbl-goblet']},
 3:{thick:36,flow:.3,yellow:0,secrete:.12,virus:.06,wbc:0,labels:['lbl-mucus','lbl-goblet','legend']},
 4:{thick:36,flow:1.5,yellow:0,secrete:.05,virus:.035,wbc:0,labels:['lbl-flow','lbl-cilia','legend']},
 5:{thick:40,flow:.8,yellow:1,secrete:.05,virus:.04,wbc:.014,labels:['lbl-vessel','legend']}};
const cur={thick:16,flow:.35,yellow:0};let tgt=SC[2];let mphase=0,cphase=0,simT=0;const BOT=204;
function mtop(x){return BOT-cur.thick+3*Math.sin(x*.025-mphase);}
let parts=[];
function addPart(type,o){const e=type==='drop'?mk('circle',{class:'mucus',r:3.5},$('parts')):mk('use',{href:type==='virus'?'#virus':'#wbc'},$('parts'));
  const p=Object.assign({type,el:e,op:1,rot:rnd()*90,state:'move'},o);parts.push(p);return p;}
function clearParts(types){parts=parts.filter(p=>{if(types.includes(p.type)){p.el.remove();return false;}return true;});}
const cA=[185,224,230],cB=[220,192,60];
let lastScene=-1;
function enterMicro(i){
  tgt=SC[i];
  if(i===2){clearParts(['virus','wbc']);}
  if(i<5)clearParts(['wbc']);
  if(i===5){for(let k=0;k<2;k++)addPart('wbc',{x:150+k*320,y:395,state:'rise'});}
}
function stepMicro(dt,T,idx){
  const k=.025*dt;cur.thick+=(tgt.thick-cur.thick)*k;cur.flow+=(tgt.flow-cur.flow)*k*1.5;cur.yellow+=(tgt.yellow-cur.yellow)*k*.5;
  mphase+=cur.flow*dt*.05;cphase+=dt*(.1+cur.flow*.09);
  for(const r of rbcs){r.x+=1.2*dt;if(r.x>820)r.x=-20;}
  if(rnd()<tgt.secrete*dt){const g=goblets[rnd()<.5?0:1];addPart('drop',{x:g*80+30+rnd()*20,y:244});}
  if(rnd()<tgt.virus*dt)addPart('virus',{x:-20+rnd()*700,y:-12,state:'fall'});
  if(rnd()<tgt.wbc*dt&&parts.filter(p=>p.type==='wbc').length<5)addPart('wbc',{x:40+rnd()*600,y:395,state:'rise'});
  const wbcs=parts.filter(p=>p.type==='wbc'&&p.state==='stuck');
  parts=parts.filter(p=>{
    if(p.type==='drop'){p.y-=.7*dt;p.x+=cur.flow*.3*dt;if(p.y<mtop(p.x)+cur.thick*.5){p.el.remove();return false;}return true;}
    if(p.type==='virus'){
      if(p.state==='fall'){p.y+=1.2*dt;p.x+=.35*dt;p.rot+=1.5*dt;if(p.y>=mtop(p.x)+4){p.state='stuck';p.depth=4+rnd()*Math.max(4,cur.thick-12);}}
      else{p.x+=cur.flow*.9*dt;p.y=mtop(p.x)+Math.min(p.depth,cur.thick-5);p.rot+=.3*dt;}
      if(!p.dying)for(const w of wbcs){if(Math.hypot(w.x-p.x,w.y-p.y)<30){p.dying=true;break;}}
      if(p.dying)p.op-=.012*dt;
      if(p.x>830||p.op<=0){p.el.remove();return false;}return true;}
    if(p.type==='wbc'){
      if(p.state==='rise'){p.y-=.5*dt;p.x+=Math.sin(T*.002+p.x)*.2;if(p.y<=mtop(p.x)+cur.thick*.5)p.state='stuck';}
      else{p.x+=cur.flow*.9*dt;p.y=mtop(p.x)+cur.thick*.5;}
      if(p.x>850){p.el.remove();return false;}return true;}
    return true;});
}
function drawMicro(T){
  const col=cA.map((a,i)=>Math.round(a+(cB[i]-a)*cur.yellow));document.documentElement.style.setProperty('--mucus-now','rgb('+col.join(',')+')');
  let d='M0 '+(BOT+2);for(let x=0;x<=800;x+=20)d+=' L'+x+' '+mtop(x).toFixed(1);d+=' L800 '+(BOT+2)+' Z';$('mucus').setAttribute('d',d);
  $('lbl-mucus').setAttribute('y',(mtop(22)+cur.thick/2+6).toFixed(1));$('lbl-mucus').style.fontSize=(cur.thick<24?14:16)+'px';
  for(const c of cil){const a=Math.sin(cphase-c.x*.05);const b=a*12+3;c.el.setAttribute('d','M'+c.x.toFixed(1)+' 240 Q'+(c.x+b*.25).toFixed(1)+' 222 '+(c.x+b).toFixed(1)+' 203');}
  for(const r of rbcs){r.el.setAttribute('cx',r.x.toFixed(1));r.el.setAttribute('cy',r.y);}
  $('flowline').style.strokeDashoffset=((-T*.05)%240).toFixed(1);
  for(const p of parts){
    if(p.type==='drop'){p.el.setAttribute('cx',p.x.toFixed(1));p.el.setAttribute('cy',p.y.toFixed(1));}
    else if(p.type==='virus'){p.el.setAttribute('transform','translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+') rotate('+p.rot.toFixed(0)+') scale('+(p.dying?.6+.4*p.op:1).toFixed(2)+')');p.el.setAttribute('opacity',Math.max(0,p.op).toFixed(2));}
    else p.el.setAttribute('transform','translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+')');
  }
}
// floaters for title
const fl=[];for(let i=0;i<16;i++){const v=i%3===0;fl.push({x:rnd()*1280,y:rnd()*720,s:.6+rnd()*1.2,ph:rnd()*6,v,el:v?mk('use',{href:'#virus',opacity:.35},$('floaters')):mk('circle',{r:6+rnd()*10,fill:'var(--mucus-clear)',opacity:.55},$('floaters'))});}
// swallow / steam / water
const bub=[];for(let i=0;i<10;i++)bub.push({x:230+rnd()*180,ph:rnd(),el:mk('circle',{r:3+rnd()*4,fill:'#e8f0a8',stroke:'#a7b43a','stroke-width':1.5},$('bubbles'))});
const swv=[];for(let i=0;i<4;i++)swv.push({ph:i/4,el:mk('use',{href:'#virus'},$('sw-virus'))});
function steam(g){const a=[];for(let i=0;i<3;i++)a.push({x:-16+i*16,ph:i/3,el:mk('path',{d:'M0 0 C-8 -10 8 -20 0 -30',fill:'none',stroke:'var(--muted)','stroke-width':3,'stroke-linecap':'round'},$(g))});return a;}
const st1=steam('steam1'),st2=steam('steam2');
const drops=[];for(let i=0;i<3;i++)drops.push({ph:i/3,el:mk('ellipse',{rx:3,ry:5,fill:'#8fcbe0'},$('water'))});

const A=id=>TL.appear[id];
const ap=(t,id,d)=>ease((t-A(id))/(d||.35));
const backOut=x=>{if(x<=0)return 0;if(x>=1)return 1;const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function popS(id,x){const e=$(id);show(id,Math.min(1,x*2));if(!(id in baseTf))baseTf[id]=e.getAttribute('transform')||'';const s=backOut(x);e.setAttribute('transform',baseTf[id]+' scale('+(0.3+0.7*s).toFixed(3)+')');}
const byid=TL.byid;
// rays for hook
for(let i=0;i<16;i++)mk('path',{d:'M0 0 L1400 -140 L1400 140 Z',fill:i%2?'#22465a':'#1d3a4a',transform:'rotate('+(i*22.5)+')'},$('rays'));
fl.forEach(f=>{if(!f.v)f.el.setAttribute('fill','#6fb6c4');});
titles[8]='クイズ！';titles[12]='まとめ';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
window.renderAt=function(t){
  let idx=TL.scenes.findIndex(s=>t>=s.start&&t<s.end);if(idx<0)idx=TL.scenes.length-1;
  const sc=TL.scenes[idx],lt=t-sc.start;
  if(idx!==lastScene){if(SC[idx])enterMicro(idx);lastScene=idx;}
  if(SC[idx]){while(simT<t){stepMicro(1,simT*1000,idx);simT+=1/60;}drawMicro(t*1000);}else simT=t;
  const fin=ease(lt/0.3);
  const isBody=idx===1||idx===6,isMicro=!!SC[idx];
  const ended=idx===12&&t>=A('end');
  show('topbar',idx===0||ended?0:1);
  $('stitle').textContent=titles[idx];
  for(let i=1;i<=11;i++){const c=$('cd'+i);c.setAttribute('fill',i===idx?'#23779f':i<idx?'#9cc6da':'#d3dee4');}
  show('stageframe',isBody||isMicro?1:0);
  show('body',isBody?fin:0);show('micro',isMicro?fin:0);
  ['s0','s7','s8','s9','s10','s11','s12'].forEach(id=>show(id,id==='s'+idx?fin:0));
  const T=t*1000;
  // camera: slide-in + slow push-in
  if(idx===0)$('world').setAttribute('transform','');
  else{const dx=(1-ease(lt/.35))*70,z=1+Math.min(lt,14)*0.003;
    $('world').setAttribute('transform','translate('+dx.toFixed(1)+' 0) translate(640 370) scale('+z.toFixed(4)+') translate(-640 -370)');}
  if(isBody){
    show('glow',idx===1?1:0);show('mag',idx===1&&t>byid.w3.start?1:0);show('dots',idx===1?1:0);show('cough',idx===6?1:0);show('b-labels',idx===1?1:.35);
    show('noseglow',(t>byid.w2.start&&t<byid.w2.end+.3)?1:0);
    if(idx===1){$('glow').setAttribute('opacity',(.55+.45*Math.sin(T*.003)).toFixed(3));
      dots.forEach(d=>{const u=(d.off+T*.00005)%1;const pt=d.p.getPointAtLength(d.L*u);d.el.setAttribute('cx',pt.x);d.el.setAttribute('cy',pt.y);d.el.setAttribute('opacity',u>.92?(1-u)/.08:1);});}
    if(idx===6){const c=((lt+0.6)%3.2)/3.2;const blob=$('blob'),burst=$('burst');
      if(c<.62){const e=ease(c/.62);const pt=p1.getPointAtLength(L1*e);blob.setAttribute('cx',pt.x);blob.setAttribute('cy',pt.y);blob.setAttribute('r',8+e*3);blob.setAttribute('opacity',1);burst.setAttribute('opacity',0);}
      else{const e=(c-.62)/.38;blob.setAttribute('cx',400+e*40);blob.setAttribute('cy',112-e*6);blob.setAttribute('r',11+e*8);blob.setAttribute('opacity',Math.max(0,1-e*1.3));burst.setAttribute('opacity',e<.75?1:(1-e)/.25);
        const sh=e<.3?Math.sin(e*80)*3:0;burst.setAttribute('transform','translate('+sh.toFixed(1)+' 0)');}}
  }
  if(isMicro){['lbl-mucus','lbl-cilia','lbl-goblet','lbl-vessel','lbl-flow','legend'].forEach(id=>show(id,SC[idx].labels.includes(id)?ease(lt/0.6):0));}
  if(idx===0){
    $('rays').setAttribute('transform','translate(640 360) rotate('+(T*.006).toFixed(2)+')');
    fl.forEach(f=>{const x=(f.x+T*.02*f.s)%1340-30,y=f.y+Math.sin(T*.001*f.s+f.ph)*14;f.el.setAttribute(f.v?'transform':'cx',f.v?'translate('+x.toFixed(1)+' '+y.toFixed(1)+')':x.toFixed(1));if(!f.v)f.el.setAttribute('cy',y.toFixed(1));});
    popS('hk1',ease((t-0.05)/.3));popS('hk2',ease((t-A('hk2'))/.3));popS('badge',ease((t-A('badge'))/.3));
    $('hkdrop').setAttribute('transform','translate(1110 '+(200+Math.sin(T*.004)*10).toFixed(1)+') rotate('+(14+Math.sin(T*.003)*8).toFixed(1)+')');}
  if(idx===7){popS('c1',ap(t,'c1'));popS('c2',ap(t,'c2'));popS('c3',ap(t,'c3'));}
  if(idx===8){
    const sw=ease((t-A('sw'))/.4);show('quiz',1-sw);show('sw',sw);
    popS('qa',ap(t,'qa'));popS('qb',ap(t,'qb'));
    const cdv=t-TL.cd;show('cdn',cdv>=0&&cdv<3?1:0);if(cdv>=0&&cdv<3){$('cdt').textContent=String(3-Math.floor(cdv));const f=cdv%1;$('cdn').setAttribute('transform','translate(640 430) scale('+(1.25-0.25*ease(f/.25)).toFixed(3)+')');}
    popS('ans',ap(t,'ans',.3));$('qb').setAttribute('opacity',t>A('ans')?(1-0.6*ap(t,'ans')).toFixed(2):Math.min(1,ap(t,'qb')*2).toFixed(2));
    show('sw-text',ap(t,'sw',.5));show('sw-q',sw);
    bub.forEach(b=>{const u=(b.ph+T*.0004)%1;b.el.setAttribute('cx',b.x+Math.sin(u*9)*5);b.el.setAttribute('cy',(470-u*60).toFixed(1));b.el.setAttribute('opacity',(1-u).toFixed(2));});
    swv.forEach(v=>{const u=(v.ph+T*.00035)%1;let x,y,o=1;if(u<.5){x=300;y=110+u/.5*170;}else{const e=(u-.5)/.5;x=300-e*40;y=280+e*130;o=1-e;}
      v.el.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') rotate('+(u*360).toFixed(0)+') scale('+(1-Math.max(0,u-.5)).toFixed(2)+')');v.el.setAttribute('opacity',o.toFixed(2));});}
  if(idx===9){popS('r1',ap(t,'r1'));popS('r2',ap(t,'r2'));popS('r3',ap(t,'r3'));
    popS('st1',ap(t,'st1'));show('ar1',ap(t,'st2'));popS('st2',ap(t,'st2'));show('ar2',ap(t,'st3'));popS('st3',ap(t,'st3'));
    $('lid').setAttribute('transform','rotate('+(Math.sin(T*.006)*6).toFixed(1)+' 0 -30)');
    drops.forEach(d=>{const u=(d.ph+T*.0015)%1;d.el.setAttribute('cx',24);d.el.setAttribute('cy',(-10+u*30).toFixed(1));d.el.setAttribute('opacity',(1-u).toFixed(2));});}
  if(idx===10){popS('t0',ap(t,'t0'));popS('t1',ap(t,'t1'));popS('t2',ap(t,'t2'));popS('t3',ap(t,'t3'));show('t4',ap(t,'t3',.6));
    $('wlevel').setAttribute('y',(46-ease((t-A('t1'))/2)*70).toFixed(1));
    [[st1,-14],[st2,-12]].forEach(([a,y0])=>a.forEach(s=>{const u=(s.ph+T*.0008)%1;s.el.setAttribute('transform','translate('+s.x+' '+(y0-u*30).toFixed(1)+')');s.el.setAttribute('opacity',(Math.sin(u*Math.PI)).toFixed(2));}));}
  if(idx===11){['k1','k2','k3'].forEach(id=>{pop(id,ap(t,id));const ck=$(id).querySelector('.ck');ck.style.strokeDasharray='1';ck.style.strokeDashoffset=(1-ease((t-A(id)-.15)/.3)).toFixed(3);});
    popS('k4',ap(t,'k4'));}
  if(idx===12){const en=ease((t-A('end'))/.4);show('sum',1-en);show('end',en);popS('e1',ap(t,'e1'));popS('e2',ap(t,'e2'));popS('e3',ap(t,'e3'));}
  // subtitles
  const l=TL.lines.find(l=>t>=l.start-.1&&t<l.end+.25);
  const sub=$('sub');if(l){sub.hidden=false;const h=esc(l.sub).replace(/【/g,'<b>').replace(/】/g,'</b>');if($('subtext').innerHTML!==h)$('subtext').innerHTML=h;}else sub.hidden=true;
};
</script>
