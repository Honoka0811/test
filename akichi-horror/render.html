<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>空き地の番号</title>
<style>
  html,body{margin:0;background:#000;}
  canvas{display:block;max-height:100vh;margin:0 auto;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="output/timeline.js"></script>
<script>
// ------------------------------------------------------------
// 空き地の番号 (9:16 ホラーショート / スマホ視点)
// render(t) は時刻 t[秒] の静止フレームを決定論的に描画する。
// シーンの尺と字幕は narrate.py が書き出す output/timeline.js から読む。
// ------------------------------------------------------------
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const GOTH = '"IPAPGothic","IPAGothic",sans-serif';
const MONO = '"DejaVu Sans Mono",monospace';
const SANS = '"DejaVu Sans",' + GOTH;
const TL = window.TIMELINE;
const FPS = 30, DURATION = TL.total;
window.FPS = FPS; window.DURATION = DURATION;
const SC = Object.fromEntries(TL.scenes.map(s => [s.id, s]));
const CUE = Object.fromEntries(TL.scenes.map(s => [s.id, TL.cues.find(c => c.a >= s.start && c.a < s.end)]));

// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const seg = (t, s, d) => clamp((t - s) / d);
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const noise1 = (x) => { const i = Math.floor(x), f = x - i; const u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); };
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// 手持ちカメラの揺れ
function shake(t, amt = 1) {
  return { x: (noise1(t * 1.1) - .5) * 30 * amt + (noise1(t * 6 + 9) - .5) * 5 * amt,
           y: (noise1(t * 0.9 + 4) - .5) * 26 * amt + (noise1(t * 7 + 3) - .5) * 5 * amt,
           r: (noise1(t * 0.7 + 7) - .5) * 0.02 * amt };
}
function withShake(t, amt, fn) {
  const s = shake(t, amt); ctx.save(); ctx.translate(W / 2 + s.x, H / 2 + s.y); ctx.rotate(s.r); ctx.scale(1.06, 1.06); ctx.translate(-W / 2, -H / 2); fn(); ctx.restore();
}

// ---------- 事前生成テクスチャ ----------
const GRAIN = [];
for (let k = 0; k < 8; k++) {
  const c = mk(540, 960), g = c.getContext('2d'); const id = g.createImageData(540, 960); const r = rng(1000 + k);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); GRAIN.push(c);
}
const GROUND = (() => {
  const c = mk(1080, 920), g = c.getContext('2d'); const r = rng(9);
  const gr = g.createLinearGradient(0, 0, 0, 920); gr.addColorStop(0, '#0d0e10'); gr.addColorStop(1, '#221e19');
  g.fillStyle = gr; g.fillRect(0, 0, 1080, 920);
  for (let i = 0; i < 9000; i++) {
    const y = Math.pow(r(), 1.6) * 920, sc = 0.2 + y / 920 * 1.6, x = r() * 1080, v = 15 + r() * 35;
    g.fillStyle = `rgba(${v + 10},${v + 6},${v},${0.4 + r() * 0.4})`; g.fillRect(x, y, 2.5 * sc, 1.4 * sc);
  }
  return c;
})();
const HOUSES = (() => {
  const r = rng(42), list = []; let x = -40;
  while (x < 1120) {
    const w = 150 + r() * 130, h = 140 + r() * 140, roof = 40 + r() * 50, wins = [];
    const nw = 1 + Math.floor(r() * 3);
    for (let i = 0; i < nw; i++) wins.push({ x: 20 + r() * (w - 70), y: 30 + r() * (h - 80), on: r() < 0.35 });
    list.push({ x, w, h, roof, wins }); x += w + 10 + r() * 30;
  }
  return list;
})();
// 看板の地(汚れ・錆)
const BOARD = (() => {
  const c = mk(860, 1100), g = c.getContext('2d'); const r = rng(5);
  g.fillStyle = '#c3bead'; g.fillRect(0, 0, 860, 1100);
  for (let i = 0; i < 90; i++) {
    const x = r() * 860, y = r() * 330, len = 60 + r() * 420;
    const gr = g.createLinearGradient(0, y, 0, y + len); gr.addColorStop(0, 'rgba(110,60,30,0.35)'); gr.addColorStop(1, 'rgba(110,60,30,0)');
    g.fillStyle = gr; g.fillRect(x, y, 4 + r() * 14, len);
  }
  for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(60,50,40,${r() * 0.12})`; g.fillRect(r() * 860, r() * 1100, 2 + r() * 4, 2 + r() * 4); }
  g.strokeStyle = '#5a5850'; g.lineWidth = 12; g.strokeRect(6, 6, 848, 1088);
  return c;
})();

// ---------- 看板 ----------
// scratch: 0..1 下4桁の上の塗りつぶしがどれだけ削れたか / sold: 「売約済」の札の出現
function drawSign(scratch = 0, sold = 0) {
  ctx.drawImage(BOARD, -430, -550);
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#8a2219'; ctx.font = `bold 310px ${GOTH}`; ctx.fillText('売地', 0, -150);
  ctx.fillStyle = '#2b2a27'; ctx.font = `bold 56px ${GOTH}`; ctx.fillText('お問い合わせ', 0, 0);
  ctx.textAlign = 'left'; ctx.font = `bold 78px ${GOTH}`; ctx.fillText('TEL', -370, 190);
  ctx.font = `bold 92px ${MONO}`; ctx.fillText('090-', -230, 190);
  ctx.fillText('4444', 120, 190);
  ctx.textAlign = 'center'; ctx.font = `bold 48px ${GOTH}`; ctx.fillText('空地管理', 0, 430);
  // マジックの塗りつぶし(右端の下4桁だけ削れていく)
  const rr = rng(13);
  ctx.save(); ctx.lineCap = 'round'; ctx.lineWidth = 30;
  for (let i = 0; i < 28; i++) {
    const x1 = -250 + rr() * 30, x2 = 390 + rr() * 30, y = 108 + i * 4.2 + rr() * 12, yy = y + (rr() - .5) * 18;
    ctx.strokeStyle = 'rgba(8,8,8,0.97)';
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, yy); ctx.stroke();
  }
  ctx.restore();
  if (scratch > 0) {
    // 削れた部分: 看板の地と数字を描き戻し、削りカスを残す
    ctx.save(); ctx.beginPath(); ctx.rect(110, 90, 290, 130); ctx.clip();
    const r2 = rng(99);
    ctx.globalAlpha = scratch;
    ctx.drawImage(BOARD, 520, 640, 300, 140, 110, 90, 300, 140);
    ctx.fillStyle = '#2b2a27'; ctx.font = `bold 92px ${MONO}`; ctx.textAlign = 'left'; ctx.fillText('4444', 120, 190);
    ctx.globalAlpha = 1;
    for (let i = 0; i < 160; i++) {
      const x = 110 + r2() * 290, y = 90 + r2() * 130;
      if (r2() > 1 - scratch * 0.9) continue;
      ctx.fillStyle = 'rgba(10,10,10,0.9)'; ctx.fillRect(x, y, 6 + r2() * 26, 3 + r2() * 8);
    }
    ctx.restore();
  }
  if (sold > 0) {
    // 斜めに貼られた「売約済」
    ctx.save(); ctx.globalAlpha = sold; ctx.rotate(-0.2); ctx.translate(0, -230);
    ctx.fillStyle = '#e9e3d0'; ctx.fillRect(-380, -110, 760, 200);
    ctx.strokeStyle = '#b21c12'; ctx.lineWidth = 14; ctx.strokeRect(-366, -96, 732, 172);
    ctx.fillStyle = '#b21c12'; ctx.font = `bold 140px ${GOTH}`; ctx.textAlign = 'center'; ctx.fillText('売約済', 0, 40);
    ctx.restore();
  }
}
// スマホのライト
function flashlight(x, y, r, dark = 0.93) {
  const g = ctx.createRadialGradient(x, y, r * 0.12, x, y, r);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.65, `rgba(0,0,0,${dark * 0.55})`); g.addColorStop(1, `rgba(0,0,0,${dark})`);
  ctx.fillStyle = g; ctx.fillRect(-W, -H, W * 3, H * 3);
}
// 指先(爪で削る)
function drawFinger(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const g = ctx.createLinearGradient(-60, 0, 60, 0); g.addColorStop(0, '#6e5040'); g.addColorStop(0.5, '#b58c72'); g.addColorStop(1, '#6a4c3c');
  ctx.fillStyle = g; rrect(-58, -20, 116, 520, 56); ctx.fill();
  ctx.fillStyle = 'rgba(235,215,200,0.75)'; rrect(-40, -8, 80, 92, 34); ctx.fill();
  ctx.strokeStyle = 'rgba(80,50,40,0.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-40, 170); ctx.quadraticCurveTo(0, 182, 40, 170); ctx.stroke();
  ctx.restore();
}

// ---------- 空き地の全景 ----------
const HORIZON = 1000;
function drawLot(t, { phoneGlow = 0 } = {}) {
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
  g.addColorStop(0, '#020305'); g.addColorStop(0.7, '#0a0f17'); g.addColorStop(1, '#141a22');
  ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, HORIZON + 202);
  ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 3;
  for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.moveTo(-200, 330 + k * 26); ctx.quadraticCurveTo(540, 420 + k * 30, 1290, 360 + k * 24); ctx.stroke(); }
  const base = HORIZON + 6;
  for (const h of HOUSES) {
    ctx.fillStyle = '#050608'; ctx.fillRect(h.x, base - h.h, h.w, h.h);
    ctx.beginPath(); ctx.moveTo(h.x - 12, base - h.h); ctx.lineTo(h.x + h.w / 2, base - h.h - h.roof); ctx.lineTo(h.x + h.w + 12, base - h.h); ctx.fill();
    for (const w of h.wins) if (w.on) { ctx.fillStyle = 'rgba(214,170,96,0.3)'; ctx.fillRect(h.x + w.x, base - h.h + w.y, 34, 26); }
  }
  ctx.drawImage(GROUND, -200, HORIZON, W + 400, 1120);
  ctx.fillStyle = '#0b0c0e'; ctx.fillRect(-200, HORIZON - 4, W + 400, 26);
  // 街灯(遠く・弱い)
  ctx.fillStyle = '#08090b'; ctx.fillRect(-20, 560, 14, 460); ctx.fillRect(-20, 560, 90, 8);
  ctx.save(); ctx.globalCompositeOperation = 'screen';
  const hg = ctx.createRadialGradient(60, 570, 0, 60, 570, 110); hg.addColorStop(0, 'rgba(220,235,220,0.5)'); hg.addColorStop(1, 'rgba(220,235,220,0)');
  ctx.fillStyle = hg; ctx.fillRect(-60, 450, 240, 240); ctx.restore();
  // 地面に落ちたスマホ(画面が光っている)
  if (phoneGlow > 0) {
    ctx.save(); ctx.translate(560, 1330);
    ctx.globalCompositeOperation = 'screen';
    const pg = ctx.createRadialGradient(0, 0, 0, 0, 0, 260); pg.addColorStop(0, `rgba(150,190,255,${0.45 * phoneGlow})`); pg.addColorStop(1, 'rgba(150,190,255,0)');
    ctx.fillStyle = pg; ctx.fillRect(-300, -300, 600, 600);
    ctx.globalCompositeOperation = 'source-over';
    ctx.transform(1, 0, -0.5, 0.42, 0, 0);        // 地面に寝かせたパース
    ctx.fillStyle = '#0b0b0d'; rrect(-48, -96, 96, 192, 14); ctx.fill();
    ctx.fillStyle = `rgba(190,215,255,${0.85 * phoneGlow})`; rrect(-42, -88, 84, 176, 10); ctx.fill();
    ctx.fillStyle = `rgba(40,170,90,${phoneGlow})`; ctx.beginPath(); ctx.arc(0, 54, 14, 0, 7); ctx.fill();
    ctx.restore();
  }
}

// ---------- スマホ UI ----------
const PH = { x: 150, y: 260, w: 780, h: 1560, r: 90 };
function fmtTimer(sec) { sec = Math.max(0, Math.floor(sec)); return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; }
function drawPhoneFrame(fn, { glass = 1 } = {}) {
  ctx.save();
  // 手
  ctx.fillStyle = '#21180f';
  ctx.beginPath(); ctx.ellipse(PH.x + 40, PH.y + PH.h * 0.78, 120, 300, 0.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(PH.x + PH.w - 10, PH.y + PH.h * 0.7, 70, 200, -0.25, 0, 7); ctx.fill();
  // 本体
  ctx.fillStyle = '#0a0a0c'; rrect(PH.x - 18, PH.y - 18, PH.w + 36, PH.h + 36, PH.r + 14); ctx.fill();
  ctx.save(); rrect(PH.x, PH.y, PH.w, PH.h, PH.r); ctx.clip();
  fn();
  // ガラスの反射
  const gg = ctx.createLinearGradient(PH.x, PH.y, PH.x + PH.w, PH.y + PH.h);
  gg.addColorStop(0, `rgba(255,255,255,${0.05 * glass})`); gg.addColorStop(0.4, 'rgba(255,255,255,0)'); gg.addColorStop(1, `rgba(255,255,255,${0.03 * glass})`);
  ctx.fillStyle = gg; ctx.fillRect(PH.x, PH.y, PH.w, PH.h);
  ctx.restore();
  // ノッチ
  ctx.fillStyle = '#000'; rrect(PH.x + PH.w / 2 - 110, PH.y + 22, 220, 50, 25); ctx.fill();
  // 指先
  ctx.fillStyle = '#2a1e16'; ctx.beginPath(); ctx.ellipse(PH.x + PH.w + 12, PH.y + PH.h * 0.42, 34, 90, 0.1, 0, 7); ctx.fill();
  ctx.restore();
}
function statusBar(clock = '2:04') {
  ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = `bold 40px ${SANS}`; ctx.textAlign = 'left'; ctx.fillText(clock, PH.x + 80, PH.y + 62);
  ctx.textAlign = 'right'; ctx.fillText('▮▮▮ 12%', PH.x + PH.w - 70, PH.y + 62);
}
function callScreen(t, mode, since) {
  // mode: 'dial' 発信中 / 'talk' 通話中 / 'end' 通話終了
  const g = ctx.createLinearGradient(0, PH.y, 0, PH.y + PH.h); g.addColorStop(0, '#1d2733'); g.addColorStop(1, '#07090c');
  ctx.fillStyle = g; ctx.fillRect(PH.x, PH.y, PH.w, PH.h);
  statusBar();
  const cx = PH.x + PH.w / 2;
  // アバター
  ctx.fillStyle = '#3a4350'; ctx.beginPath(); ctx.arc(cx, PH.y + 420, 120, 0, 7); ctx.fill();
  ctx.fillStyle = '#566173'; ctx.beginPath(); ctx.arc(cx, PH.y + 395, 48, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, PH.y + 500, 80, 50, 0, Math.PI, 0); ctx.fill();
  if (mode === 'dial') for (let k = 0; k < 3; k++) {
    const ph = ((t * 0.8 + k / 3) % 1); ctx.strokeStyle = `rgba(150,190,240,${0.5 * (1 - ph)})`; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(cx, PH.y + 420, 120 + ph * 160, 0, 7); ctx.stroke();
  }
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = `bold 76px ${MONO}`;
  ctx.fillText('090-****-4444', cx, PH.y + 700);
  ctx.font = `44px ${GOTH}`; ctx.fillStyle = 'rgba(255,255,255,0.7)';
  const label = mode === 'dial' ? '発信中' + '.'.repeat(1 + Math.floor(t * 2) % 3) : mode === 'talk' ? '通話中  ' + fmtTimer(t - since) : '通話終了';
  ctx.fillText(label, cx, PH.y + 790);
  if (mode === 'talk') {   // 音声の波形
    for (let i = 0; i < 24; i++) {
      const hh = 12 + 90 * Math.pow(noise1(t * 9 + i * 1.7), 2.2);
      ctx.fillStyle = 'rgba(120,220,150,0.8)'; ctx.fillRect(cx - 300 + i * 25, PH.y + 960 - hh / 2, 12, hh);
    }
  }
  // 終話ボタン
  ctx.fillStyle = mode === 'end' ? '#552222' : '#e0392f'; ctx.beginPath(); ctx.arc(cx, PH.y + PH.h - 240, 82, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(cx, PH.y + PH.h - 240); ctx.rotate(2.36); rrect(-46, -14, 92, 28, 14); ctx.fill(); ctx.restore();
}
function profileScreen(t, hi) {
  ctx.fillStyle = '#f2f2f5'; ctx.fillRect(PH.x, PH.y, PH.w, PH.h);
  ctx.save(); ctx.fillStyle = '#111'; statusBar(); ctx.restore();
  ctx.fillStyle = '#111'; ctx.font = `bold 40px ${SANS}`; ctx.textAlign = 'left'; ctx.fillText('2:03', PH.x + 80, PH.y + 62);
  const cx = PH.x + PH.w / 2;
  ctx.fillStyle = '#222'; ctx.font = `bold 58px ${GOTH}`; ctx.textAlign = 'center'; ctx.fillText('マイプロフィール', cx, PH.y + 230);
  ctx.fillStyle = '#c9ccd3'; ctx.beginPath(); ctx.arc(cx, PH.y + 450, 130, 0, 7); ctx.fill();
  ctx.fillStyle = '#9aa0ab'; ctx.beginPath(); ctx.arc(cx, PH.y + 420, 52, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx, PH.y + 535, 88, 56, 0, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#222'; ctx.font = `bold 64px ${GOTH}`; ctx.fillText('自分', cx, PH.y + 690);
  ctx.fillStyle = '#888'; ctx.font = `40px ${GOTH}`; ctx.fillText('電話番号', cx, PH.y + 820);
  ctx.fillStyle = '#111'; ctx.font = `bold 80px ${MONO}`; ctx.textAlign = 'left';
  const x0 = cx - ctx.measureText('090-****-4444').width / 2;
  ctx.fillText('090-****-', x0, PH.y + 920);
  ctx.fillStyle = `rgb(${lerp(17, 225, hi)},${lerp(17, 30, hi)},${lerp(17, 30, hi)})`;
  ctx.fillText('4444', x0 + ctx.measureText('090-****-').width, PH.y + 920);
  if (hi > 0) { ctx.strokeStyle = `rgba(225,30,30,${hi})`; ctx.lineWidth = 8; ctx.strokeRect(x0 + ctx.measureText('090-****-').width - 14, PH.y + 840, ctx.measureText('4444').width + 28, 106); }
}

// ---------- シーン ----------
function sceneSign(t, u, d) {
  // 冒頭いきなり看板。ライトが番号の塗りつぶしへ寄っていく
  ctx.fillStyle = '#0b0c0d'; ctx.fillRect(0, 0, W, H);
  const p = ease(u / d);
  withShake(t, 1, () => {
    ctx.save(); ctx.translate(540, lerp(900, 820, p)); ctx.rotate(0.03); const s = lerp(1.0, 1.25, p); ctx.scale(s, s);
    drawSign(0);
    ctx.restore();
    flashlight(lerp(560, 600, p), lerp(760, 1050, p), 820, 0.9);
  });
}
function sceneScratch(t, u, d) {
  ctx.fillStyle = '#0b0c0d'; ctx.fillRect(0, 0, W, H);
  const prog = easeOut(seg(u, 0.4, d - 0.6));
  withShake(t, 0.7, () => {
    ctx.save(); ctx.translate(540 - 260 * 2.1 * 0.4, 960 - 150 * 2.1 + 80); ctx.rotate(0.03); ctx.scale(2.1, 2.1);
    drawSign(prog);
    ctx.restore();
    // 爪でこする(往復)
    const fx = 540 + Math.sin(u * 15) * 150, fy = 960 + 120 + Math.cos(u * 15) * 14;
    if (u < d - 0.35) drawFinger(fx + 60, fy, -0.35);
    flashlight(560, 900, 800, 0.88);
  });
}
function sceneReveal(t, u, d) {
  ctx.fillStyle = '#0b0c0d'; ctx.fillRect(0, 0, W, H);
  withShake(t, 0.9, () => {
    // 看板の「4444」が奥に、手前にスマホ
    ctx.save(); ctx.translate(540 - 260 * 2.1 * 0.4, 960 - 150 * 2.1 - 300); ctx.rotate(0.03); ctx.scale(2.1, 2.1);
    drawSign(1); ctx.restore();
    flashlight(560, 520, 700, 0.9);
    const up = easeOut(seg(u, 0.0, 0.6));
    ctx.save(); ctx.translate(0, lerp(1300, 280, up)); ctx.scale(0.8, 0.8); ctx.translate(135, 0);
    drawPhoneFrame(() => profileScreen(t, seg(u, 0.9, 0.4)));
    ctx.restore();
  });
}
function lotBehindPhone(t, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.filter = 'blur(10px)'; drawLot(t); ctx.filter = 'none'; ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 0, W, H);
}
function sceneCall(t, u, d) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  withShake(t, 0.8, () => { lotBehindPhone(t, 1); drawPhoneFrame(() => callScreen(t, 'dial')); });
}
function sceneAnswer(t, u, d) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  withShake(t, 0.8, () => { lotBehindPhone(t, 1); drawPhoneFrame(() => callScreen(t, 'talk', SC.answer.start)); });
}
function scenePhone(t, u, d) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // 画面に寄る
  withShake(t, 1.2, () => {
    ctx.save(); const s = lerp(1, 1.35, ease(u / d)); ctx.translate(540, 900); ctx.scale(s, s); ctx.translate(-540, -900);
    lotBehindPhone(t, 1); drawPhoneFrame(() => callScreen(t, 'talk', SC.answer.start)); ctx.restore();
  });
  ctx.fillStyle = `rgba(120,0,0,${0.15 + 0.1 * Math.sin(u * 8)})`; ctx.fillRect(0, 0, W, H);
}
function sceneSweep(t, u, d) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const pan = ease(seg(u, 0, 1.6)), zoomIn = ease(seg(u, 1.8, d - 1.8));
  const glow = seg(u, 0.9, 0.5) * (0.85 + 0.15 * Math.sin(u * 6));
  withShake(t, 1.3, () => {
    ctx.save();
    const fx = 560, fy = 1330, s = lerp(1.15, 3.2, zoomIn);
    ctx.translate(lerp(900, 540, pan), lerp(1150, 1050, zoomIn)); ctx.scale(s, s); ctx.translate(-fx, -fy + lerp(-150, 0, zoomIn));
    drawLot(t, { phoneGlow: glow });
    ctx.restore();
    // スマホのライトが左から中央へ
    const lx = lerp(150, 540, pan), ly = lerp(1300, 1050, pan);
    ctx.save(); ctx.globalCompositeOperation = 'screen'; const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 560);
    lg.addColorStop(0, 'rgba(120,125,120,0.55)'); lg.addColorStop(1, 'rgba(120,125,120,0)'); ctx.fillStyle = lg; ctx.fillRect(lx - 600, ly - 600, 1200, 1200); ctx.restore();
    flashlight(lx, ly, 760, 0.8);
  });
  // ズームしきった後、地面のスマホの画面が読める
  const rd = seg(u, d - 1.6, 0.6);
  if (rd > 0) {
    ctx.save(); ctx.globalAlpha = rd; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.font = `bold 60px ${GOTH}`;
    ctx.fillText('通話中  ' + fmtTimer(t - SC.answer.start), 540, 700);
    ctx.font = `bold 48px ${MONO}`; ctx.fillText('090-****-4444', 540, 780);
    ctx.restore();
  }
}
function sceneBehind(t, u, d) {
  // 自分のスマホ: 通話が切れ、暗転した画面に「後ろの誰か」が映り込む
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const black = seg(u, 0.6, 0.5);
  const who = seg(u, 1.6, 1.8);
  withShake(t, 0.6, () => {
    drawPhoneFrame(() => {
      if (black < 1) { callScreen(t, 'end'); }
      ctx.fillStyle = `rgba(4,5,6,${black})`; ctx.fillRect(PH.x, PH.y, PH.w, PH.h);
      if (black > 0) {
        // 反射: 手前に自分、肩越しにもう一人(同じ顔の輪郭)
        ctx.save(); ctx.globalAlpha = black * 0.16; ctx.filter = 'blur(8px)';
        ctx.fillStyle = '#7d858c';
        ctx.beginPath(); ctx.ellipse(540, 980, 150, 190, 0, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.moveTo(250, 1820); ctx.quadraticCurveTo(300, 1250, 540, 1210); ctx.quadraticCurveTo(780, 1250, 830, 1820); ctx.fill();
        ctx.fillStyle = '#0b0c0e'; ctx.beginPath(); ctx.ellipse(540, 900, 160, 120, 0, Math.PI, 0); ctx.fill();   // 髪
        ctx.restore();
        if (who > 0) {
          ctx.save(); ctx.globalAlpha = who * 0.24; ctx.filter = 'blur(6px)';
          ctx.fillStyle = '#9aa2a9';
          ctx.beginPath(); ctx.ellipse(770, 700, 120, 152, 0.15, 0, 7); ctx.fill();
          ctx.fillStyle = '#0b0c0e'; ctx.beginPath(); ctx.ellipse(770, 640, 128, 92, 0.15, Math.PI, 0); ctx.fill();
          // 目だけがわずかに光る
          ctx.filter = 'blur(1px)'; ctx.globalAlpha = who * 0.9; ctx.fillStyle = `rgba(230,235,240,${who})`;
          ctx.fillRect(722, 712, 24, 6); ctx.fillRect(800, 718, 24, 6);
          ctx.restore();
        }
      }
    }, { glass: 2 });
  });
}
function sceneEnd(t, u, d) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // 視聴者のスマホに通知が来た体の着信バナー
  const a = seg(u, 0.5, 0.35);
  if (a > 0) {
    const y = lerp(-220, 90, easeOut(a)) + (u > 0.85 ? Math.sin(u * 60) * 4 : 0);
    ctx.save(); ctx.fillStyle = 'rgba(40,42,48,0.96)'; rrect(60, y, 960, 190, 44); ctx.fill();
    ctx.fillStyle = '#2fbf5a'; ctx.beginPath(); ctx.arc(150, y + 95, 50, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(150, y + 95); ctx.rotate(-0.8); rrect(-26, -10, 52, 20, 10); ctx.fill(); ctx.restore();
    ctx.textAlign = 'left'; ctx.font = `bold 44px ${GOTH}`; ctx.fillText('着信', 230, y + 80);
    ctx.font = `bold 52px ${MONO}`; ctx.fillText('090-****-4444', 230, y + 148);
    ctx.restore();
  }
  ctx.save(); ctx.textAlign = 'center'; ctx.globalAlpha = seg(u, 1.6, 0.8);
  ctx.fillStyle = '#7d786f'; ctx.font = `30px ${GOTH}`;
  ctx.fillText('※この物語はフィクションです', W / 2, 1720);
  ctx.fillText('ナレーション VOICEVOX:青山龍星', W / 2, 1770);
  ctx.restore();
}
const SCENE_FN = { sign: sceneSign, scratch: sceneScratch, reveal: sceneReveal, call: sceneCall, answer: sceneAnswer,
  phone: scenePhone, sweep: sceneSweep, behind: sceneBehind, end: sceneEnd };

// ---------- 字幕(大きめ・縁取り。電話の声は赤) ----------
function drawSubtitle(t) {
  const c = TL.cues.find(c => t >= c.a - 0.1 && t <= c.b);
  if (!c) return;
  const a = Math.min(seg(t, c.a - 0.1, 0.12), 1 - seg(t, c.b - 0.15, 0.15));
  const pop = 1 + 0.08 * (1 - easeOut(seg(t, c.a - 0.1, 0.18)));
  const red = c.kind !== 'me';
  const lines = c.text.split('\n');
  const size = red ? 84 : 92, lh = size * 1.32;
  const base = c === CUE.reveal ? 1700 : (red ? 1420 : 1460);
  const y0 = base - (lines.length - 1) * lh / 2;
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.translate(W / 2, y0); ctx.scale(pop, pop);
  ctx.font = `bold ${size}px ${GOTH}`;
  lines.forEach((ln, i) => {
    const y = i * lh;
    ctx.lineJoin = 'round'; ctx.lineWidth = 18; ctx.strokeStyle = '#000'; ctx.strokeText(ln, 0, y);
    ctx.fillStyle = red ? '#ff3a30' : '#ffffff'; ctx.fillText(ln, 0, y);
  });
  ctx.restore();
}
// 画面上の注釈(下4桁)
function drawCallouts(t, sid, u) {
  if (sid === 'scratch' && u > SC.scratch.end - SC.scratch.start - 1.2) {
    const a = seg(u, SC.scratch.end - SC.scratch.start - 1.2, 0.2);
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center';
    ctx.fillStyle = '#e1261c'; rrect(300, 420, 480, 120, 20); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `bold 70px ${GOTH}`; ctx.fillText('下4桁「4444」', 540, 505);
    ctx.restore();
  }
}

// ---------- 仕上げ ----------
const BUF = mk(W, H), bctx = BUF.getContext('2d');
function glitch(t, amount) {
  if (amount <= 0) return;
  bctx.clearRect(0, 0, W, H); bctx.drawImage(cv, 0, 0);
  const r = rng(Math.floor(t * 30) * 7919 + 1);
  const n = Math.floor(3 + amount * 10);
  for (let i = 0; i < n; i++) {
    const y = r() * H, h = 8 + r() * 90 * amount, dx = (r() - 0.5) * 120 * amount;
    ctx.drawImage(BUF, 0, y, W, h, dx, y, W, h);
  }
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.3 * amount; ctx.drawImage(BUF, 10 * amount, 0); ctx.restore();
}
function glitchAmount(t, sid, u, d) {
  let g = 0;
  if (u < 0.1 && sid !== 'sign') g = 0.45;
  if (sid === 'reveal' && u > 0.9 && u < 1.15) g = 0.8;
  if (sid === 'phone' && u < 0.35) g = 0.7;
  if (sid === 'sweep' && u > d - 1.6 && u < d - 1.35) g = 0.7;
  if (sid === 'behind' && u > 1.6 && u < 1.8) g = 0.9;
  if (sid === 'behind' && u > d - 0.3) g = 1;
  return g;
}
function post(t, sid, u, d) {
  glitch(t, glitchAmount(t, sid, u, d));
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = '#c0cccb'; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.2;
  ctx.drawImage(GRAIN[Math.floor(t * FPS) % GRAIN.length], 0, 0, W, H); ctx.restore();
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function render(t) {
  t = Math.min(t, DURATION - 1e-3);
  const sc = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  const u = t - sc.start, d = sc.end - sc.start;
  ctx.save(); ctx.clearRect(0, 0, W, H);
  SCENE_FN[sc.id](t, u, d);
  ctx.restore();
  post(t, sc.id, u, d);
  drawCallouts(t, sc.id, u);
  drawSubtitle(t);
}
window.render = render;

if (!navigator.webdriver) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else render(0);
</script>
