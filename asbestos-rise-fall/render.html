<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>奇跡の鉱物の栄枯盛衰</title>
<style>
@font-face{font-family:"NSJ";font-weight:500;src:url(fonts/noto-sans-jp-japanese-500-normal.woff2) format("woff2");}
@font-face{font-family:"NSJ";font-weight:700;src:url(fonts/noto-sans-jp-japanese-700-normal.woff2) format("woff2");}
@font-face{font-family:"NSJ";font-weight:900;src:url(fonts/noto-sans-jp-japanese-900-normal.woff2) format("woff2");}
@font-face{font-family:"NSL";font-weight:500;src:url(fonts/noto-sans-jp-latin-500-normal.woff2) format("woff2");}
@font-face{font-family:"NSL";font-weight:700;src:url(fonts/noto-sans-jp-latin-700-normal.woff2) format("woff2");}
@font-face{font-family:"NSL";font-weight:900;src:url(fonts/noto-sans-jp-latin-900-normal.woff2) format("woff2");}
@font-face{font-family:"SMJ";font-weight:800;src:url(fonts/shippori-mincho-b1-japanese-800-normal.woff2) format("woff2");}
@font-face{font-family:"SML";font-weight:800;src:url(fonts/shippori-mincho-b1-latin-800-normal.woff2) format("woff2");}
html,body{margin:0;background:#000;}
canvas{display:block;max-height:100vh;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
// ------------------------------------------------------------------
// 奇跡の鉱物の栄枯盛衰(9:16 / 30fps)
// render(t) は時刻 t[秒] のフレームを決定論的に描画する。
// タイミングは narrate.py が出力する timeline.js(ナレーション実測)に従う。
// ------------------------------------------------------------------
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TL = window.TIMELINE;
const FPS = TL.fps, DURATION = TL.duration;
window.FPS = FPS; window.DURATION = DURATION;
const SANS = '"NSL","NSJ","Noto Color Emoji",sans-serif';
const SERIF = '"SML","SMJ",serif';
const EMOJI = '"Noto Color Emoji"';
const C = { ink: '#F6F3EC', dim: '#A9ADB6', mute: '#6C717C', gold: '#F2C14E', red: '#EF4B4B', teal: '#74D3C0', panel: 'rgba(255,255,255,0.06)', line: 'rgba(255,255,255,0.16)' };

// ---------- 数学ヘルパー ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - clamp(k), 3);
const eInOut = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const eBack = k => { k = clamp(k); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rnd(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
let T = 0;                                   // 現在時刻
const A = (t0, d = 0.4) => clamp((T - t0) / d);     // t0 から d 秒で 0→1
const LT = i => TL.lines[i].t0;
const LE = i => TL.lines[i].t1;
const CT = (i, j) => TL.lines[i].chunks[j].t0;
const fmt = n => Math.round(n).toLocaleString('en-US');

// ---------- 描画ヘルパー ----------
function txt(s, x, y, size, color = C.ink, o = {}) {
  ctx.save();
  ctx.font = `${o.w || 900} ${size}px ${o.serif ? SERIF : SANS}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 40; }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || size * 0.16; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
function emoji(s, x, y, size, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${size}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y + size * 0.04); ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function card(x, y, w, h, o = {}) {
  ctx.save(); rr(x, y, w, h, o.r ?? 28); ctx.fillStyle = o.fill || 'rgba(16,18,24,0.78)'; ctx.fill();
  ctx.lineWidth = o.lw || 2; ctx.strokeStyle = o.stroke || C.line; ctx.stroke(); ctx.restore();
}
// アニメ付きで描く: k(0..1) に応じて拡大+フェード
function pop(k, cx, cy, fn, back = true) {
  if (k <= 0) return;
  ctx.save(); const s = back ? eBack(k) : lerp(0.92, 1, eOut(k));
  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); ctx.globalAlpha *= clamp(k * 2.5); fn(); ctx.restore();
}
function rise(k, dy, fn) { if (k <= 0) return; ctx.save(); ctx.translate(0, (1 - eOut(k)) * dy); ctx.globalAlpha *= clamp(k * 2); fn(); ctx.restore(); }
function stamp(s, cx, cy, size, t0, rot = -0.2, color = C.red) {
  const k = A(t0, 0.22); if (k <= 0) return;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); const sc = lerp(2.6, 1, eOut(k)); ctx.scale(sc, sc); ctx.globalAlpha *= clamp(k * 3);
  ctx.font = `900 ${size}px ${SANS}`; const w = ctx.measureText(s).width + size * 0.7, h = size * 1.5;
  ctx.fillStyle = 'rgba(20,4,4,0.72)'; rr(-w / 2, -h / 2, w, h, 14); ctx.fill();
  ctx.lineWidth = size * 0.09; ctx.strokeStyle = color; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(s, 0, size * 0.02); ctx.restore();
  // 衝撃リング
  const r = A(t0 + 0.12, 0.6); if (r > 0 && r < 1) { ctx.save(); ctx.globalAlpha *= (1 - r) * 0.7; ctx.strokeStyle = color; ctx.lineWidth = 8 * (1 - r); ctx.beginPath(); ctx.arc(cx, cy, 120 + r * 420, 0, 7); ctx.stroke(); ctx.restore(); }
}
function shakeAt(t0, amp = 22, d = 0.4) { const k = (T - t0) / d; if (k < 0 || k > 1) return [0, 0]; const a = amp * (1 - k) * (1 - k); return [Math.sin(T * 91) * a, Math.cos(T * 77) * a]; }
function chip(s, cx, cy, size, o = {}) {
  ctx.save(); ctx.font = `${o.w || 700} ${size}px ${SANS}`; const w = ctx.measureText(s).width + size * 1.3, h = size * 1.9;
  rr(cx - w / 2, cy - h / 2, w, h, h / 2); ctx.fillStyle = o.fill || 'rgba(255,255,255,0.08)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = o.stroke || C.line; ctx.stroke(); ctx.restore();
  txt(s, cx, cy + 1, size, o.color || C.ink, { w: o.w || 700 });
}
function yearTag(s, sub, t0) {      // 画面上部の年号見出し
  rise(A(t0, 0.45), -40, () => { txt(s, 540, 300, 150, C.ink, { serif: true, w: 800, glow: 'rgba(0,0,0,0.6)' }); if (sub) txt(sub, 540, 400, 40, C.dim, { w: 700, ls: 6 }); });
}

// ---------- 背景 ----------
const BG = { hook: ['#1a0707', '#050505', '#EF4B4B'], miracle: ['#0c2a2c', '#04090b', '#74D3C0'], rise: ['#2b2110', '#07080d', '#F2C14E'], shadow: ['#101614', '#030404', '#7c8f86'],
  bomb: ['#240808', '#030303', '#EF4B4B'], fall: ['#2a0b0b', '#050404', '#EF4B4B'], japan: ['#0d1826', '#04060a', '#7FB2F0'], end: ['#18181c', '#050506', '#F2C14E'] };
const fibers = (() => { const r = rnd(11), a = []; for (let i = 0; i < 90; i++) a.push({ x: r() * W, y: r() * H, l: 20 + r() * 90, a: r() * Math.PI, v: 6 + r() * 22, w: 0.6 + r() * 1.6, p: r() * 6.28, z: r() }); return a; })();
const noise = (() => { const n = document.createElement('canvas'); n.width = n.height = 256; const c = n.getContext('2d'), d = c.createImageData(256, 256), r = rnd(5); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 20; } c.putImageData(d, 0, 0); return n; })();
function background(id, density = 1) {
  const [c1, c2, tint] = BG[id];
  const g = ctx.createRadialGradient(540, 760, 80, 540, 900, 1250); g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 漂う繊維
  ctx.save(); ctx.strokeStyle = tint; ctx.lineCap = 'round';
  const n = Math.round(fibers.length * clamp(density, 0, 1));
  for (let i = 0; i < n; i++) { const f = fibers[i]; const y = ((f.y - T * f.v) % H + H) % H, x = f.x + Math.sin(T * 0.4 + f.p) * 26, a = f.a + Math.sin(T * 0.3 + f.p) * 0.5;
    ctx.globalAlpha = 0.08 + f.z * 0.22; ctx.lineWidth = f.w; ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * f.l / 2, y - Math.sin(a) * f.l / 2); ctx.lineTo(x + Math.cos(a) * f.l / 2, y + Math.sin(a) * f.l / 2); ctx.stroke(); }
  ctx.restore();
}
function overlay() {
  const g = ctx.createRadialGradient(540, 900, 500, 540, 960, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.62)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const f = Math.floor(T * FPS), ox = (f * 97) % 256, oy = (f * 61) % 256; ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.translate(-ox, -oy); ctx.fillStyle = ctx.createPattern(noise, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}

// ---------- 部品 ----------
function rock(cx, cy, s, glow = 0) {       // 繊維状の鉱石
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  const r = rnd(42); if (glow) { ctx.shadowColor = `rgba(242,193,78,${glow})`; ctx.shadowBlur = 90; }
  ctx.beginPath(); const pts = [[-210, 40], [-150, -110], [-20, -170], [130, -130], [215, -10], [170, 120], [20, 165], [-140, 135]]; pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath();
  const g = ctx.createLinearGradient(-200, -160, 200, 160); g.addColorStop(0, '#5d6f6a'); g.addColorStop(0.5, '#2f3b3a'); g.addColorStop(1, '#182020'); ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
  ctx.clip(); ctx.lineCap = 'round';
  for (let i = 0; i < 150; i++) { const x = -230 + r() * 460, y = -180 + r() * 360, l = 60 + r() * 160, a = -0.55 + (r() - .5) * 0.35;
    ctx.strokeStyle = `rgba(${200 + r() * 55 | 0},${225 + r() * 30 | 0},${215 + r() * 30 | 0},${0.12 + r() * 0.5})`; ctx.lineWidth = 0.8 + r() * 2.2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.cos(a) * l * .5, y + Math.sin(a) * l * .5 + (r() - .5) * 20, x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke(); }
  const sw = (T * 0.35) % 1; const sx = -300 + sw * 700; const sg = ctx.createLinearGradient(sx - 60, 0, sx + 60, 0); sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,0.28)'); sg.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = sg; ctx.fillRect(-300, -200, 700, 400);
  ctx.restore();
}
function plaque(cx, cy, s, alive = 1) {     // 社名プレート
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  const w = 820, h = 190; const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  if (alive > 0.5) { g.addColorStop(0, '#f7dd8c'); g.addColorStop(.5, '#c9962e'); g.addColorStop(1, '#8a611a'); } else { g.addColorStop(0, '#7b7b7b'); g.addColorStop(1, '#3b3b3b'); }
  ctx.shadowColor = alive > 0.5 ? 'rgba(242,193,78,0.45)' : 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 50; rr(-w / 2, -h / 2, w, h, 16); ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 4; rr(-w / 2 + 14, -h / 2 + 14, w - 28, h - 28, 8); ctx.stroke();
  txt('JOHNS-MANVILLE', 0, 4, 66, alive > 0.5 ? '#2b1c05' : '#1a1a1a', { serif: true, w: 800, ls: 2 });
  ctx.restore();
}
const sky = (() => { const r = rnd(1858), a = []; let x = -20; while (x < W + 40) { const w = 50 + r() * 90; a.push({ x, w, h: 120 + r() * 420, win: r() }); x += w + 4; } return a; })();
function skyline(base, k, color = '#0b0d14', lit = 1) {
  ctx.save(); for (const [i, b] of sky.entries()) { const kk = eOut(clamp(k * 1.6 - i / sky.length * 0.6)); const h = b.h * kk; ctx.fillStyle = color; ctx.fillRect(b.x, base - h, b.w, h);
    if (lit > 0) { ctx.fillStyle = `rgba(242,193,78,${0.5 * lit})`; const r = rnd(i * 7 + 3); for (let y = base - h + 18; y < base - 16; y += 30) for (let x = b.x + 10; x < b.x + b.w - 14; x += 22) if (r() < 0.42) ctx.fillRect(x, y, 9, 13); } }
  ctx.restore();
}
function lungs(cx, cy, s, fill = 0, col = '#c9d6d2') {     // 肺のシルエット+蓄積する繊維
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  const lobe = sgn => { ctx.beginPath(); ctx.moveTo(sgn * 22, -150); ctx.bezierCurveTo(sgn * 150, -190, sgn * 215, 40, sgn * 190, 165); ctx.bezierCurveTo(sgn * 130, 200, sgn * 50, 160, sgn * 28, 110); ctx.closePath(); };
  ctx.lineWidth = 6; ctx.strokeStyle = col; ctx.fillStyle = 'rgba(201,214,210,0.10)';
  ctx.beginPath(); ctx.moveTo(0, -250); ctx.lineTo(0, -150); ctx.stroke();
  const r = rnd(9);
  for (const sgn of [-1, 1]) { lobe(sgn); ctx.fill(); ctx.stroke(); ctx.save(); lobe(sgn); ctx.clip(); const n = Math.round(160 * fill);
    for (let i = 0; i < 160; i++) { const x = sgn * (30 + r() * 170), y = -160 + r() * 340, a = r() * 3.14, l = 10 + r() * 22; if (i >= n) continue; ctx.strokeStyle = 'rgba(239,75,75,0.85)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke(); } ctx.restore(); }
  ctx.restore();
}
function clock(cx, cy, r, speed = 1, color = C.red) {
  ctx.save(); ctx.translate(cx, cy); ctx.strokeStyle = color; ctx.lineWidth = r * 0.07; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  for (let i = 0; i < 12; i++) { const a = i / 12 * 6.283; ctx.lineWidth = r * 0.04; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.82, Math.sin(a) * r * 0.82); ctx.lineTo(Math.cos(a) * r * 0.92, Math.sin(a) * r * 0.92); ctx.stroke(); }
  const tick = Math.floor(T * 2 * speed) / 60 * 6.283 - 1.5708; ctx.lineWidth = r * 0.06; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(tick) * r * 0.72, Math.sin(tick) * r * 0.72); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(tick / 12 + 1) * r * 0.45, Math.sin(tick / 12 + 1) * r * 0.45); ctx.stroke(); ctx.restore();
}
function pulse(cx, cy, t0, color = C.red, n = 3, R = 620) {
  ctx.save(); ctx.strokeStyle = color; for (let i = 0; i < n; i++) { const k = (((T - t0) * 0.55 + i / n) % 1 + 1) % 1; ctx.globalAlpha = (1 - k) * 0.5 * A(t0, 0.3); ctx.lineWidth = 6 * (1 - k) + 1; ctx.beginPath(); ctx.arc(cx, cy, 80 + k * R, 0, 7); ctx.stroke(); } ctx.restore();
}
// ダウ30社のタイル
function dowGrid(cx, cy, t0, mode) {
  const cols = 6, rows = 5, sz = 118, gap = 16, w = cols * sz + (cols - 1) * gap, h = rows * sz + (rows - 1) * gap, hi = 14;
  for (let i = 0; i < 30; i++) { const x = cx - w / 2 + (i % cols) * (sz + gap), y = cy - h / 2 + Math.floor(i / cols) * (sz + gap); const k = A(t0 + i * 0.022, 0.3); if (k <= 0) continue;
    ctx.save(); ctx.globalAlpha *= clamp(k * 2);
    if (i === hi) {
      if (mode === 'in') { const g = A(t0 + 1.0, 0.5); ctx.shadowColor = C.gold; ctx.shadowBlur = 50 * g; rr(x, y, sz, sz, 16); ctx.fillStyle = g > 0 ? C.gold : 'rgba(255,255,255,0.10)'; ctx.fill(); ctx.shadowBlur = 0; if (g > 0) txt('J-M', x + sz / 2, y + sz / 2 + 2, 40, '#2b1c05', { w: 900 }); }
      else { const d = A(t0 + 1.2, 0.9), dy = d * d * 900, rot = d * 1.1; ctx.globalAlpha *= 1 - d * 0.75; ctx.strokeStyle = 'rgba(239,75,75,0.6)'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); rr(x, y, sz, sz, 16); ctx.stroke(); ctx.setLineDash([]);
        ctx.translate(x + sz / 2, y + sz / 2 + dy); ctx.rotate(rot); rr(-sz / 2, -sz / 2, sz, sz, 16); ctx.fillStyle = d > 0 ? '#6b6b6b' : C.gold; ctx.fill(); txt('J-M', 0, 2, 40, '#1a1a1a', { w: 900 }); }
    } else { rr(x, y, sz, sz, 16); ctx.fillStyle = 'rgba(255,255,255,0.09)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.restore(); }
}
// 折れ線/棒グラフ
function axes(x, y, w, h, years, y0, y1, step) {
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.stroke(); ctx.restore();
  for (let v = y0; v <= y1; v += step) txt(String(v), x + (v - y0) / (y1 - y0) * w, y + h + 34, 28, C.mute, { w: 500 });
}
const WORLD = [[1900, 30], [1910, 110], [1920, 200], [1930, 390], [1940, 570], [1950, 1290], [1960, 2210], [1970, 3490], [1975, 4560], [1977, 4790], [1980, 4700], [1985, 4310], [1990, 4010], [1995, 2460], [2000, 2110], [2005, 2300], [2010, 2010], [2015, 1320], [2020, 1200], [2023, 1240], [2024, 950]];
const JP_IMPORT = [[1950, 5], [1955, 22], [1960, 77], [1965, 135], [1970, 293], [1974, 352], [1977, 300], [1980, 290], [1984, 240], [1988, 320], [1990, 292], [1995, 191], [2000, 99], [2003, 25], [2006, 0], [2023, 0]];
const JP_MESO = [[1995, 500], [1997, 597], [1999, 647], [2001, 772], [2003, 878], [2005, 911], [2007, 1068], [2009, 1156], [2011, 1258], [2013, 1410], [2015, 1504], [2017, 1555], [2019, 1466], [2021, 1635], [2023, 1595], [2024, 1562]];
function lineChart(data, x, y, w, h, x0, x1, ymax, k, color, fillc) {
  const X = v => x + (v - x0) / (x1 - x0) * w, Y = v => y + h - v / ymax * h; const lim = lerp(x0, x1, k); let last = null;
  ctx.save(); ctx.beginPath(); ctx.moveTo(X(data[0][0]), Y(data[0][1]));
  for (let i = 1; i < data.length; i++) { const [a, b] = data[i - 1], [c, d] = data[i]; if (c <= lim) { ctx.lineTo(X(c), Y(d)); last = [c, d]; } else { if (a < lim) { const q = (lim - a) / (c - a); last = [lim, lerp(b, d, q)]; ctx.lineTo(X(lim), Y(last[1])); } break; } }
  if (!last) last = data[0];
  ctx.lineWidth = 8; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 24; ctx.stroke(); ctx.shadowBlur = 0;
  if (fillc) { ctx.lineTo(X(last[0]), y + h); ctx.lineTo(X(data[0][0]), y + h); ctx.closePath(); ctx.fillStyle = fillc; ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(X(last[0]), Y(last[1]), 10, 0, 7); ctx.fill(); ctx.restore();
  return { X, Y, last };
}

// ---------- シーン ----------
const SC = {};
SC.hook = () => {
  const s1 = CT(0, 0), s2 = CT(0, 1), s3 = CT(0, 2), l1 = LT(1);
  const out = 1 - A(l1 - 0.25, 0.35);
  if (out > 0) { ctx.save(); ctx.globalAlpha *= out;
    const sh = shakeAt(s1, 30, 0.45), sh2 = shakeAt(CT(0, 3) + 0.3, 26, 0.4); ctx.translate(sh[0] + sh2[0], sh[1] + sh2[1]);
    const k = A(s1, 0.25); if (k > 0) { ctx.save(); const sc = lerp(1.9, 1, eOut(k)) * (1 + (T - s1) * 0.006); ctx.translate(540, 560); ctx.scale(sc, sc); ctx.globalAlpha *= clamp(k * 3); txt('1982', 0, 0, 330, C.ink, { serif: true, w: 800, glow: 'rgba(239,75,75,0.55)', blur: 80 }); ctx.restore(); }

// 字幕: [..] は強調。長い場合は 2 行に折り返す
function parseRich(s) { const out = []; let hl = false; for (const ch of s) { if (ch === '[') hl = true; else if (ch === ']') hl = false; else out.push({ ch, hl }); } return out; }
const NOHEAD = '、。」)ー・っゃゅょッャュョんン';
function subtitle() {
  let ln = null; for (const l of TL.lines) if (T >= l.t0 - 0.05 && T < l.t1 + 0.18) ln = l; if (!ln) return;
  let c = ln.chunks[0]; for (const k of ln.chunks) if (T >= k.t0) c = k;
  const chars = parseRich(c.text); const size = 74; ctx.save(); ctx.font = `900 ${size}px ${SANS}`;
  const widths = chars.map(o => ctx.measureText(o.ch).width); const total = widths.reduce((a, b) => a + b, 0);
  let rows = [chars];
  if (total > 940) { let best = -1, bd = 1e9, acc = 0; for (let i = 1; i < chars.length; i++) { acc += widths[i - 1]; if (NOHEAD.includes(chars[i].ch)) continue; if (chars[i - 1].ch === '「') continue; let d = Math.abs(acc - total / 2); if ('、はがをにでもとのや'.includes(chars[i - 1].ch)) d -= 230; const kj = c => /[\u4e00-\u9fff]/.test(c), kt = c => /[\u30a0-\u30ff]/.test(c); if ((kj(chars[i].ch) && kj(chars[i - 1].ch)) || (kt(chars[i].ch) && kt(chars[i - 1].ch))) d += 200; if (/[0-9]/.test(chars[i].ch) && /[0-9]/.test(chars[i - 1].ch)) d += 400; if (chars[i - 1].ch === 'と' && chars[i].ch === 'い') d += 500; if (d < bd) { bd = d; best = i; } } rows = [chars.slice(0, best), chars.slice(best)]; }
  const k = clamp((T - Math.max(c.t0, ln.t0 - 0.05)) / 0.12); const sc = lerp(0.9, 1, eOut(k)); const cy = 1455; const lh = 100;
  ctx.translate(540, cy); ctx.scale(sc, sc); ctx.globalAlpha = clamp(k * 2 + 0.3);
  rows.forEach((row, ri) => { const y = (ri - (rows.length - 1) / 2) * lh; const w = row.reduce((a, o) => a + ctx.measureText(o.ch).width, 0); let x = -w / 2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.lineWidth = 18; ctx.strokeStyle = 'rgba(0,0,0,0.92)'; ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 16;
    let xx = x; for (const o of row) { ctx.strokeText(o.ch, xx, y); xx += ctx.measureText(o.ch).width; } ctx.shadowBlur = 0;
    for (const o of row) { ctx.fillStyle = o.hl ? '#FFE14D' : '#fff'; ctx.fillText(o.ch, x, y); x += ctx.measureText(o.ch).width; } });
  ctx.restore();
}

function render(t) {
  T = t; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  let sc = TL.scenes[0]; for (const s of TL.scenes) if (t >= s.t0) sc = s;

  const fade = Math.min(1, (t - sc.t0) / 0.3 + (sc.t0 === 0 ? 1 : 0), (sc.t1 - t) / 0.3 + (sc.t1 >= DURATION ? 1 : 0));
  ctx.save(); ctx.globalAlpha = clamp(fade); const z = 1 + 0.03 * (t - sc.t0) / (sc.t1 - sc.t0); ctx.translate(540, 760); ctx.scale(z, z); ctx.translate(-540, -760);
  SC[sc.id](); ctx.restore();

}
