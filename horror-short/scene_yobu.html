<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-jp/900.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 960px; background: #000; overflow: hidden; }

  #text p.red { color: #e3231c; }
  #text p.big { font-size: 58px; }
  #text p.mid { font-size: 47px; }
  #fade, #black { position: absolute; inset: 0; background: #000; }
  #black { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="shade"></div><div id="vig"></div>
  <div id="fade"></div>
  <div id="text"></div>
  <div id="black"></div>
</div>
<script>
const $ = id => document.getElementById(id);

  g.fillStyle = '#0a0a10'; g.beginPath(); g.moveTo(112, 652); g.quadraticCurveTo(190, 560, 248, 524); g.lineTo(312, 524); g.quadraticCurveTo(370, 560, 448, 652); g.fill();   // thatch
  g.fillStyle = '#8b97b1'; g.beginPath(); g.moveTo(132, 630); g.quadraticCurveTo(196, 556, 250, 520); g.lineTo(310, 520); g.quadraticCurveTo(364, 556, 428, 630); g.quadraticCurveTo(360, 578, 306, 548); g.lineTo(254, 548); g.quadraticCurveTo(200, 578, 132, 630); g.fill();   // snow on the roof

  for (const [x1, y1, x2, y2, w] of [[70, 760, 74, 560, 7], [74, 640, 40, 580, 4], [74, 610, 104, 556, 4], [40, 580, 28, 548, 2.5], [104, 556, 118, 520, 2.5], [74, 580, 66, 520, 3]]) { g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }

const SH = { x0: 50, x1: 370, y0: 300, y1: 740, cx: 210, foot: 736 };
function shadowGranny(g, h, o, t) {     // an old woman kneeling on the far side of the paper, telling a story
  const u = h / 100, cx = SH.cx - 10 * u, foot = SH.foot, nod = o.nod ? Math.sin(t * 2.3) * 1.1 + Math.sin(t * 5.1) * 0.4 : 0;
  g.beginPath(); g.moveTo(cx - 36 * u, foot); g.quadraticCurveTo(cx - 40 * u, foot - 28 * u, cx - 24 * u, foot - 44 * u);
  g.quadraticCurveTo(cx - 4 * u, foot - 64 * u, cx + 16 * u, foot - 54 * u); g.quadraticCurveTo(cx + 30 * u, foot - 34 * u, cx + 36 * u, foot); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(cx + 14 * u, foot - 40 * u); g.quadraticCurveTo(cx + 30 * u, foot - 30 * u, cx + 26 * u, foot - 18 * u); g.lineTo(cx + 18 * u, foot - 16 * u); g.closePath(); g.fill();   // hands in the lap
  const hx = cx + 20 * u, hy = foot - 60 * u + nod * u;
  g.beginPath(); g.moveTo(cx + 8 * u, foot - 56 * u); g.lineTo(hx - 2 * u, hy + 4 * u); g.lineTo(hx + 4 * u, hy + 8 * u); g.lineTo(cx + 18 * u, foot - 50 * u); g.fill();

function shadowNow(g, h, o) {            // tonight it wears the shape of someone still expected home
  const u = h / 100, cx = SH.cx, foot = SH.foot, top = foot - h;
  g.beginPath(); g.rect(cx - 13 * u, foot - 44 * u, 10 * u, 44 * u); g.rect(cx + 3 * u, foot - 44 * u, 10 * u, 44 * u); g.fill();
  g.beginPath(); g.moveTo(cx - 21 * u, top + 26 * u); g.quadraticCurveTo(cx, top + 18 * u, cx + 21 * u, top + 26 * u); g.lineTo(cx + 18 * u, foot - 40 * u); g.lineTo(cx - 18 * u, foot - 40 * u); g.closePath(); g.fill();
  for (const sd of [-1, 1]) { g.beginPath(); g.moveTo(cx + sd * 20 * u, top + 26 * u); g.lineTo(cx + sd * 27 * u, top + 30 * u); g.lineTo(cx + sd * 25 * u, foot - 34 * u); g.lineTo(cx + sd * 18 * u, foot - 36 * u); g.fill(); }
  g.fillRect(cx - 4 * u, top + 16 * u, 8 * u, 8 * u); g.beginPath(); g.ellipse(cx, top + 9 * u, 8.5 * u, 10 * u, 0, 0, 7); g.fill();
  const a = o.arm || 0;
  if (a > 0) for (const sd of [-1, 1]) {                                   // both palms laid flat against the paper
    const sx = cx + sd * 21 * u, sy = top + 28 * u, ex = cx + sd * (30 + 6 * a) * u, ey = sy + (22 - 10 * a) * u, hx = cx + sd * (27 + 5 * a) * u, hy = sy + 24 * u - 33 * u * a;
    g.lineWidth = 7 * u; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(sx, sy + 4 * u); g.lineTo(ex, ey); g.lineTo(hx, hy); g.stroke();
    g.beginPath(); g.ellipse(hx, hy - 4 * u, 5.5 * u, 6.5 * u, 0, 0, 7); g.fill();
    g.lineWidth = 2.4 * u; for (let k = 0; k < 5; k++) { const an = -Math.PI / 2 + sd * (k - 2) * 0.3 + sd * 0.1, L = (9 + (k === 2 ? 2 : 0)) * u * a; g.beginPath(); g.moveTo(hx, hy - 7 * u); g.lineTo(hx + Math.cos(an) * L, hy - 7 * u + Math.sin(an) * L); g.stroke(); }

}
function shadowMan(g, h, o) {            // a man in a sedge hat and straw cape, as a shadow on paper
  const u = h / 100, st = o.stretch || 0, cx = SH.cx + (o.dx || 0) + (o.lean || 0) * 20, foot = SH.foot, H = h * (1 + 0.5 * st), top = foot - H;
  g.beginPath();                                                           // legs
  g.rect(cx - 12 * u, foot - 40 * u, 8 * u, 40 * u); g.rect(cx + 4 * u, foot - 40 * u, 8 * u, 40 * u); g.fill();
  const sy = top + 24 * u + 20 * u * st, by = foot - 36 * u;               // straw cape with a ragged hem
  g.beginPath(); g.moveTo(cx - 19 * u, sy); g.lineTo(cx + 19 * u, sy);
  const teeth = 9; g.lineTo(cx + 28 * u, by); for (let i = teeth; i >= 0; i--) { const x = cx - 28 * u + i * 56 * u / teeth; g.lineTo(x + 3 * u, by + (i % 2 ? 9 : 2) * u); } g.closePath(); g.fill();

  g.beginPath(); g.arc(cx, top + 16 * u, 8 * u, 0, 7); g.fill();
  g.beginPath(); g.moveTo(cx - 30 * u, top + 17 * u); g.quadraticCurveTo(cx, top - 12 * u, cx + 30 * u, top + 17 * u); g.quadraticCurveTo(cx, top + 24 * u, cx - 30 * u, top + 17 * u); g.fill();   // hat
  const a = o.arm || 0;
  if (a > 0) for (const sd of [-1, 1]) {                                   // elbows out, hands flat on the paper, fingers too long
    const sx = cx + sd * 17 * u, ex = cx + sd * (30 + 16 * a) * u, ey = sy + (34 - 6 * a) * u, hx = cx + sd * (36 + 12 * a) * u, hy = Math.max(SH.y0 + 46, sy + 30 * u - (46 + 26 * st) * u * a);
    g.lineWidth = 5.5 * u; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(sx, sy + 6 * u); g.lineTo(ex, ey); g.lineTo(hx, hy); g.stroke();
    g.beginPath(); g.ellipse(hx, hy - 4 * u, 6 * u, 7.5 * u, 0, 0, 7); g.fill();
    g.lineWidth = 2.3 * u; for (let k = 0; k < 5; k++) { const an = -Math.PI / 2 + sd * (k - 2) * 0.3 + sd * 0.12, L = (12 + 20 * st + (k === 2 ? 3 : 0)) * u * a; g.beginPath(); g.moveTo(hx, hy - 7 * u); g.lineTo(hx + Math.cos(an) * L, hy - 7 * u + Math.sin(an) * L); g.stroke(); }

function shoji(g, t, o) {

  else { pg.addColorStop(0, mixc([150, 112, 70], [52, 58, 78])); pg.addColorStop(1, mixc([104, 76, 48], [40, 45, 62])); }

  let info = null;
  if (o.alpha > 0) { g.save(); g.beginPath(); g.rect(SH.x0, SH.y0, SH.x1 - SH.x0, SH.y1 - SH.y0); g.clip(); g.filter = 'blur(2.6px)'; g.globalAlpha = o.alpha; g.fillStyle = '#08080e'; g.strokeStyle = '#08080e'; info = o.granny ? shadowGranny(g, o.h || 300, o, t) : o.now ? shadowNow(g, o.h || 300, o) : shadowMan(g, o.h || 300, o); g.restore(); g.filter = 'none'; g.globalAlpha = 1; }

  for (let i = 1; i < 6; i++) g.fillRect(SH.x0 + i * (SH.x1 - SH.x0) / 6 - 1.5, SH.y0, 3, SH.y1 - SH.y0);
  for (let j = 1; j < 6; j++) g.fillRect(SH.x0, SH.y0 + j * (SH.y1 - SH.y0) / 6 - 1.5, SH.x1 - SH.x0, 3);
  g.fillStyle = '#1a1512'; g.fillRect(SH.x0, SH.y1, SH.x1 - SH.x0, 126);
  g.fillStyle = '#0a0807'; g.fillRect(SH.x0 - 14, SH.y0 - 14, SH.x1 - SH.x0 + 28, 14); g.fillRect(SH.x0 - 14, SH.y0 - 14, 14, 584); g.fillRect(SH.x1, SH.y0 - 14, 14, 584); g.fillRect(SH.x0, SH.y1 - 2, SH.x1 - SH.x0, 7);
  g.fillRect(SH.x0 + (SH.x1 - SH.x0) / 2 - 3, SH.y0, 6, 566);              // the two sliding panels meet here
  if (o.hole > 0 && info) {                                                // a wet fingertip, then a hole, then an eye
    const hx = info.cx, hy = info.eyeY;
    if (o.hole < 1) { g.fillStyle = `rgba(10,10,16,${0.6 * o.hole})`; g.beginPath(); g.arc(hx, hy, 3 + 5 * o.hole, 0, 7); g.fill(); }
    else { g.fillStyle = '#020203'; g.beginPath(); for (let i = 0; i < 9; i++) { const a = i / 9 * 6.283, r = 9.5 + rnd(i + 3) * 4.5; g[i ? 'lineTo' : 'moveTo'](hx + Math.cos(a) * r * 1.2, hy + Math.sin(a) * r); } g.closePath(); g.fill();
      g.fillStyle = '#5a6480'; g.beginPath(); g.moveTo(hx + 10, hy + 6); g.lineTo(hx + 19, hy + 13); g.lineTo(hx + 9, hy + 12); g.fill();           // torn flap
      if (o.eye) { const e = o.eye; g.save(); g.beginPath(); g.ellipse(hx, hy, 9, 6.2 * e.open, 0, 0, 7); g.clip(); g.fillStyle = '#d6d0c2'; g.fillRect(hx - 12, hy - 9, 24, 18);
        g.fillStyle = '#0d0a0a'; g.beginPath(); g.arc(hx + e.dx, hy, 4.4, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.arc(hx + e.dx - 1.4, hy - 1.6, 1, 0, 7); g.fill(); g.restore(); } }

function snow(g, t) {                    // morning, looking out through the open door
  const gr = g.createLinearGradient(0, 0, 0, 960); gr.addColorStop(0, '#7f8ba3'); gr.addColorStop(0.45, '#b9c2d2'); gr.addColorStop(1, '#b9c2d2'); g.fillStyle = gr; g.fillRect(-60, -60, 660, 1080);
  ridge(g, 3.1, 470, 110, '#7b879f'); ridge(g, 6.4, 520, 60, '#66728b');
  g.fillStyle = '#3d465a'; for (let i = 0; i < 12; i++) { const x = 20 + i * 46 + rnd(i) * 20, h = 60 + rnd(i + 7) * 60; g.beginPath(); g.moveTo(x - 14, 560); g.lineTo(x, 560 - h); g.lineTo(x + 14, 560); g.fill(); }

window.render = function (t) {
  const g = $('cv').getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0); g.globalAlpha = 1; g.filter = 'none';
  let si = 0; TL.scenes.forEach((s, i) => { if (t >= s.t) si = i; });

  const zoom = (z, ox, oy) => { g.translate(ox, oy); g.scale(z, z); g.translate(-ox, -oy); };
  if (sc.k === 'house') { zoom(1 + 0.08 * p, 300, 680); house(g, t); }
  else if (sc.k === 'snow') { zoom(1 + 0.06 * p, 270, 700); snow(g, t); }
  else if (sc.k === 'shoji1') { zoom(1 + 0.07 * p, 210, 560); shoji(g, t, { alpha: 0.85 * smooth((t - TL.shadowIn) / 1.6) }); }
  else if (sc.k === 'shoji2') { zoom(1 + 0.07 * p, 210, 560);              // the shape never changes. it just slides, without walking, to where her hand is.
    const gl = smooth((t - TL.glide[0]) / (TL.glide[1] - TL.glide[0]));
    shoji(g, t, { alpha: 0.88, dx: 112 * gl, reach: t < TL.arm[1] ? clamp((t - TL.arm[0]) / 1.4) : 1 - clamp((t - TL.arm[1]) / 0.16) }); }
  else if (sc.k === 'shojiRoom' && t < TL.cut) {         // grandmother's shadow, lit by her lamp. then the lamp goes out. the shadow does not.
    const off = smooth((t - TL.lampOff) / 0.35);
    zoom(1.08 + 0.06 * p, 200, 600); shoji(g, t, { alpha: 0.9, granny: true, warm: 1 - off, nod: t < TL.lampOff });
  }
  else if (sc.k === 'shoji3' && t < TL.cut) {           // it never comes through the paper. it only waits, closer and closer.
    const near = smooth((t - TL.lastText + 1.5) / (TL.cut - TL.lastText + 1.5));
    zoom(1.2 + 0.2 * p, 215, 470); shoji(g, t, { alpha: 0.92, h: 380, now: true, arm: smooth((t - TL.lastText) / 2.2) });
  }

  $('fade').style.opacity = pic ? clamp(Math.max(1 - (t - sc.t) / 0.45, sc.k === 'shoji3' ? 0 : 1 - (t1 - t) / 0.3, 0)) : 0;
  $('shade').style.display = ['house', 'snow'].includes(sc.k) ? 'block' : 'none';
  $('shade').style.background = sc.k === 'snow' ? 'linear-gradient(rgba(0,0,0,.82), rgba(0,0,0,.62) 58%, rgba(0,0,0,.12) 82%)' : '';

  let pk = TL.scenes[0].k; if (pg) for (const x of TL.scenes) if (pg.t + 0.01 >= x.t) pk = x.k;      // a subtitle keeps the position of the scene it appeared in
  $('text').className = pk.startsWith('shoji') ? 'side' : '';
  $('text').innerHTML = pg ? pg.lines.map(l => `<p class="${l[2]}" style="opacity:${clamp((t - pg.t - l[0]) / 0.35)}">${l[1]}</p>`).join('') : '';
  $('black').style.display = t >= TL.cut ? 'block' : 'none';
