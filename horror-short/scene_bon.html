<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/noto-serif-jp/900.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 960px; background: #000; overflow: hidden; }
  body { font-family: "Noto Serif JP", serif; color: #f4efe6; }
  #stage { position: relative; width: 540px; height: 960px; overflow: hidden; background: #000; }
  canvas { position: absolute; left: 0; top: 0; width: 540px; height: 960px; }
  #shade { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,.2) 50%, rgba(0,0,0,0) 70%); }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 45%, rgba(0,0,0,.8) 100%); }
  #text { position: absolute; top: 120px; right: 0; left: 0; height: 520px; display: flex; flex-direction: row-reverse; justify-content: center; gap: 22px; }
  #text p { writing-mode: vertical-rl; font-size: 37px; font-weight: 900; letter-spacing: .1em; line-height: 1.2; text-shadow: 0 0 10px #000, 0 0 22px #000, 2px 2px 0 #000; white-space: nowrap; }
  #text p.red { color: #e3231c; }
  #final { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: row-reverse; gap: 30px; }
  #final p { writing-mode: vertical-rl; font-size: 80px; font-weight: 900; letter-spacing: .12em; color: #d3140f; }
  #fade, #black { position: absolute; inset: 0; background: #000; }
  #black { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="shade"></div><div id="vig"></div>
  <div id="fade"></div>
  <div id="text"></div>
  <div id="final"><p>いま、</p><p>数えたじゃろ。</p></div>
  <div id="black"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const rnd = n => { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
let TL;
window.init = async function (tl) {
  TL = tl;
  await document.fonts.ready;
  await document.fonts.load('900 30px "Noto Serif JP"', TL.pages.map(p => p.lines.map(l => l[1]).join('')).join('') + 'いま、数えたじゃろ。');
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  render(0);
};
const INK = '#050406';
function ridge(g, seed, base, amp, col) {
  g.fillStyle = col; g.beginPath(); g.moveTo(-80, 1100);
  for (let x = -80; x <= 620; x += 8) { const u = x * 0.006; g.lineTo(x, base - amp * (0.55 * Math.sin(u * 1.3 + seed) + 0.3 * Math.sin(u * 2.9 + seed * 2.1) + 0.15 * Math.sin(u * 6.3 + seed * 3.7))); }
  g.lineTo(620, 1100); g.fill();
}
function lantern(g, x, y, r, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r * 4.5); gr.addColorStop(0, `rgba(255,170,70,${0.5 * a})`); gr.addColorStop(1, 'rgba(255,170,70,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 4.5, 0, 7); g.fill();
  g.fillStyle = `rgba(255,${Math.round(190 + 30 * a)},${Math.round(110 + 40 * a)},1)`; g.beginPath(); g.ellipse(x, y, r * 0.8, r, 0, 0, 7); g.fill();
  g.fillStyle = '#1a0d08'; g.fillRect(x - r * 0.5, y - r - 2, r, 3); g.fillRect(x - r * 0.5, y + r - 1, r, 3);
}
function backdrop(g, t, big) {
  const gr = g.createLinearGradient(0, 0, 0, 960); gr.addColorStop(0, '#04050d'); gr.addColorStop(0.55, '#131a36'); gr.addColorStop(1, '#131a36'); g.fillStyle = gr; g.fillRect(-300, -300, 1140, 1560);
  g.fillStyle = 'rgba(255,255,255,.7)'; for (let i = 0; i < 40; i++) { g.globalAlpha = 0.3 + 0.6 * rnd(i + 3); g.fillRect(rnd(i) * 540, rnd(i + 80) * 420, 1.6, 1.6); } g.globalAlpha = 1;
  ridge(g, 2.4, 560, 120, '#090c1a'); ridge(g, 6.1, 620, 70, '#05060e');
  g.fillStyle = '#0c0a12'; g.fillRect(-300, 640, 1140, 700);
  const R = big ? 520 : 330, gy = big ? 800 : 735; const gl = g.createRadialGradient(270, gy, 20, 270, gy, R); gl.addColorStop(0, 'rgba(255,165,80,.62)'); gl.addColorStop(0.55, 'rgba(210,100,50,.28)'); gl.addColorStop(1, 'rgba(210,100,50,0)');
  g.save(); g.translate(270, gy); g.scale(1, big ? 0.62 : 0.42); g.translate(-270, -gy); g.fillStyle = gl; g.beginPath(); g.arc(270, gy, R, 0, 7); g.fill(); g.restore();
}
function yagura(g, t, still) {
  g.fillStyle = '#140b08'; g.beginPath(); g.moveTo(228, 720); g.lineTo(240, 520); g.lineTo(300, 520); g.lineTo(312, 720); g.fill();
  g.fillStyle = '#0b0605'; g.fillRect(214, 500, 112, 22); g.fillRect(222, 432, 7, 70); g.fillRect(311, 432, 7, 70);
  for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#c8c0b4' : '#a01d14'; g.fillRect(216 + i * 13.5, 522, 13.5, 30); }
  g.fillStyle = '#0b0605'; g.beginPath(); g.moveTo(200, 436); g.quadraticCurveTo(270, 396, 340, 436); g.lineTo(350, 428); g.lineTo(340, 444); g.lineTo(200, 444); g.lineTo(190, 428); g.fill();
  g.fillStyle = '#2a1510'; g.beginPath(); g.ellipse(270, 478, 24, 20, 0, 0, 7); g.fill(); g.fillStyle = '#d8cbb4'; g.beginPath(); g.ellipse(270, 478, 17, 14, 0, 0, 7); g.fill();
  for (const [ex, ey] of [[-40, 560], [580, 560], [-60, 470], [600, 470]]) {
    g.strokeStyle = '#0a0606'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(270, 430); g.quadraticCurveTo((270 + ex) / 2, (430 + ey) / 2 + 34, ex, ey); g.stroke();
    for (let k = 1; k <= 6; k++) { const u = k / 7, x = (1 - u) * (1 - u) * 270 + 2 * u * (1 - u) * (270 + ex) / 2 + u * u * ex, y = (1 - u) * (1 - u) * 430 + 2 * u * (1 - u) * ((430 + ey) / 2 + 34) + u * u * ey;
      lantern(g, x + (still ? 0 : Math.sin(t * 1.4 + k) * 1.5), y + 12, 9, 0.8 + 0.2 * Math.sin(t * 5 + k * 2 + ex)); }
  }
}
function dancer(g, x, y, s, ph, facing, shadow, cx) {
  if (shadow) { g.fillStyle = 'rgba(0,0,0,.5)'; const dx = (x - cx) * 0.22; g.beginPath(); g.ellipse(x + dx, y + 4 * s, 26 * s, 7 * s, 0, 0, 7); g.fill(); }
  const bob = facing ? 0 : Math.abs(Math.sin(ph)) * 4 * s; y -= bob;
  g.fillStyle = INK; g.strokeStyle = INK; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x - 12 * s, y - 64 * s); g.lineTo(x + 12 * s, y - 64 * s); g.lineTo(x + 17 * s, y - 4 * s); g.lineTo(x - 17 * s, y - 4 * s); g.fill();   // yukata
  g.fillRect(x - 10 * s, y - 5 * s, 7 * s, 7 * s + bob); g.fillRect(x + 3 * s, y - 5 * s, 7 * s, 7 * s + bob);
  g.lineWidth = 9 * s; g.beginPath();
  if (facing) { g.moveTo(x - 13 * s, y - 60 * s); g.lineTo(x - 18 * s, y - 22 * s); g.moveTo(x + 13 * s, y - 60 * s); g.lineTo(x + 18 * s, y - 22 * s); }
  else { const a = Math.sin(ph), b = Math.cos(ph);
    g.moveTo(x - 11 * s, y - 60 * s); g.lineTo(x - (24 + 4 * a) * s, y - (64 + 20 * a) * s); g.lineTo(x - (20 - 8 * a) * s, y - (84 + 16 * a) * s);
    g.moveTo(x + 11 * s, y - 60 * s); g.lineTo(x + (26 + 4 * b) * s, y - (54 - 12 * b) * s); g.lineTo(x + (36 + 2 * b) * s, y - (40 - 20 * b) * s); }
  g.stroke();
  const tilt = facing ? 9 * s : 0;                                                    // the hat that hides the face
  g.beginPath(); g.moveTo(x - 27 * s, y - 68 * s + tilt); g.quadraticCurveTo(x, y - 112 * s + tilt * 0.4, x + 27 * s, y - 68 * s + tilt); g.quadraticCurveTo(x, y - 60 * s + tilt, x - 27 * s, y - 68 * s + tilt); g.fill();
}
function festival(g, t, n, still) {
  backdrop(g, t);
  const cx = 270, cy = 748, rx = 212, ry = 66, rot = (still ? TL.musicStop : t) * 0.33, list = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + rot; list.push({ x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a), s: 0.72 + 0.34 * (Math.sin(a) + 1) / 2, ph: (still ? TL.musicStop : t) * 5.4 + i * 1.3, back: Math.sin(a) < 0, extra: n === 10 && i === 6 }); }
  list.sort((a, b) => a.y - b.y);
  for (const d of list) if (d.back) dancer(g, d.x, d.y, d.s, d.ph, false, !d.extra, cx);
  yagura(g, t, still);
  for (const d of list) if (!d.back) dancer(g, d.x, d.y, d.s, d.ph, false, !d.extra, cx);
}
function row(g, t, sc, y, gap) {
  backdrop(g, t, true); yagura(g, t, true);
  for (let i = 0; i < 10; i++) { const k = i - 4.5; dancer(g, 270 + k * gap, y + (i % 2) * 9 * sc - Math.abs(k) * 2, sc, 0, true, i !== 6, 270); }
}

window.render = function (t) {
  const g = $('cv').getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0); g.globalAlpha = 1;
  let si = 0; TL.scenes.forEach((s, i) => { if (t >= s.t) si = i; });
  const sc = TL.scenes[si], t1 = si + 1 < TL.scenes.length ? TL.scenes[si + 1].t : TL.end, p = (t - sc.t) / (t1 - sc.t);
  g.fillStyle = '#000'; g.fillRect(0, 0, 540, 960);
  const zoom = (z, ox, oy) => { g.translate(ox, oy); g.scale(z, z); g.translate(-ox, -oy); };
  if (sc.k === 'wide') { g.translate(0, 46); zoom(1 + 0.06 * p, 270, 700); festival(g, t, 9, false); }
  else if (sc.k === 'ring') { zoom(1.5 + 0.12 * p, 270, 770); festival(g, t, 10, false); }
  else if (sc.k === 'frozen') { zoom(1.62, 270, 770); festival(g, t, 10, true); }
  else if (sc.k === 'facing') { zoom(1 + 0.03 * p, 270, 700); row(g, t, 1.3, 850, 53); }
  else if (sc.k === 'closer') { zoom(1 + 0.04 * p, 270, 800); row(g, t, 2.3, 950, 104); }
  else if (sc.k === 'flash' && t < TL.cut) { const j = Math.round(t * 30); g.translate((rnd(j) - .5) * 14, (rnd(j + 5) - .5) * 10); zoom(1 + 0.25 * p, 270, 700); row(g, t, 4.6, 1090, 215); }
  const soft = ['wide', 'ring'].includes(sc.k) ? Math.max(1 - (t - sc.t) / 0.4, 0) : 0;
  $('fade').style.opacity = clamp(soft);
  $('shade').style.display = ['wide', 'ring', 'frozen', 'facing'].includes(sc.k) ? 'block' : 'none';
  let pg = null; for (const x of TL.pages) if (t >= x.t) pg = x;
  $('text').innerHTML = pg ? pg.lines.map(l => `<p class="${l[2]}" style="opacity:${clamp((t - pg.t - l[0]) / 0.35)}">${l[1]}</p>`).join('') : '';
  $('final').style.display = (t >= TL.finalText && t < TL.flash) ? 'flex' : 'none';
  $('black').style.display = t >= TL.cut ? 'block' : 'none';
};
</script>
</body>
</html>
