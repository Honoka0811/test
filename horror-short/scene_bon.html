<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<body>
<div id="stage">

  <div id="shade"></div><div id="vig"></div>

  <div id="final"><p>いま、</p><p>数えたじゃろ。</p></div>
  <div id="black"></div>

<script>

// ---------- the dance: one shared 8-beat routine, everyone in unison ----------

let PICK = {};
let SPOT = { x: 270, y: 800 };
