<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Osaka Univ Top 10</title>
<style>
  @font-face { font-family: 'MPR'; font-weight: 500; src: url(fonts/m-plus-rounded-1c-japanese-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'MPR'; font-weight: 800; src: url(fonts/m-plus-rounded-1c-japanese-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'MPR'; font-weight: 500; src: url(fonts/m-plus-rounded-1c-latin-500-normal.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'MPR'; font-weight: 800; src: url(fonts/m-plus-rounded-1c-latin-800-normal.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'MPR'; font-weight: 500; src: url(fonts/m-plus-rounded-1c-cyrillic-500-normal.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'MPR'; font-weight: 800; src: url(fonts/m-plus-rounded-1c-cyrillic-800-normal.woff2) format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="output/timeline.js"></script>
<script>
// ------------------------------------------------------------
// 大阪大学のここがすごい！10選 (9:16 ショート動画)
// render(t) は時刻 t[秒] のフレームを決定論的に描画する。シーン尺は narrate.py が出力する timeline.js に従う
// ------------------------------------------------------------
const W = 1080, H = 1920, FPS = 30;
const TL = window.TIMELINE;
const DURATION = TL.total;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"MPR","IPAPGothic",sans-serif';
const C = {
  bg1: '#1b1650', bg2: '#3a1d6e', ink: '#ffffff', ink2: '#d9d4ff', dark: '#1a1440',
  yellow: '#FFD23F', pink: '#FF5C8A', cyan: '#3FD0E0', green: '#4CD07D', violet: '#8C6CFF', orange: '#FF9F1C',
  gold: '#F7C948', silver: '#C9D1DC', bronze: '#D08A4E'
};
const ACC = [C.pink, C.orange, C.cyan, C.violet, C.green];

const ITEMS = {
  r10: { rank: 10, head: ['キャンパスから', 'ワニの化石が出た！'], stat: '全長 約7m', sub: 'マチカネワニ(1964年・豊中キャンパス)', sub2: '国の天然記念物に', icon: 'croc', short: 'ワニの化石' },
  r9:  { rank: 9,  head: ['あの手塚治虫も', '学んだ！'], stat: '漫画の神様', sub: '大阪帝国大学 附属医学専門部で学ぶ', icon: 'manga', short: '手塚治虫も学んだ' },
  r8:  { rank: 8,  head: ['学部生の数', '国立大学No.1！'], stat: '国立大学 No.1', sub: '女子学生数も国立大学で最多', icon: 'people', short: '学部生数 国立No.1' },
  r7:  { rank: 7,  head: ['国立総合大学で唯一の', '外国語学部！'], stat: '25言語', sub: '25の専攻語から選べる', icon: 'globe', short: '唯一の外国語学部' },
  r6:  { rank: 6,  head: ['大阪の熱意で', '生まれた大学！'], stat: '1931年', sub: '6番目の帝国大学として誕生', icon: 'building', short: '大阪の熱意で誕生' },
  r5:  { rank: 5,  head: ['人間そっくりの', 'アンドロイド！'], stat: '石黒浩 教授', sub: '大阪・関西万博ではパビリオンも', icon: 'robot', short: 'アンドロイド研究' },
  r4:  { rank: 4,  head: ['世界トップクラスの', 'レーザー！'], stat: '核融合に挑戦', sub: 'レーザー科学研究所', icon: 'laser', short: '巨大レーザー' },
  r3:  { rank: 3,  head: ['iPS細胞で', '世界初！'], stat: '2020年', sub: 'iPS細胞由来の心筋シートを移植', icon: 'heart', short: 'iPS細胞で世界初' },
  r2:  { rank: 2,  head: ['ルーツは江戸時代の', '「適塾」！'], stat: '1838年', sub: '緒方洪庵が開塾・福沢諭吉らが学ぶ', icon: 'juku', short: 'ルーツは適塾' },
  r1:  { rank: 1,  head: ['ノーベル賞に', 'つながる研究！'], stat: '2025年', sub: '坂口志文 特任教授が生理学・医学賞', sub2: '湯川秀樹は大阪帝大で中間子論を発表', icon: 'medal', short: 'ノーベル賞' },
};

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const backOut = t => { t = clamp(t); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, s, d) => clamp((t - s) / d);
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const TAU = Math.PI * 2;

function font(size, weight = 800) { return `${weight} ${size}px ${FONT}`; }
function text(str, x, y, { size = 48, weight = 800, color = C.ink, align = 'left', base = 'alphabetic', alpha = 1, stroke = null, sw = 0, shadow = 0 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = font(size, weight);
  ctx.textAlign = align; ctx.textBaseline = base;
  ctx.lineJoin = 'round';
  if (shadow) { ctx.fillStyle = 'rgba(10,6,40,0.55)'; ctx.fillText(str, x + shadow, y + shadow); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.restore();
}
function fitSize(str, size, maxW, weight = 800) {
  ctx.save(); ctx.font = font(size, weight);
  const w = ctx.measureText(str).width; ctx.restore();
  return w > maxW ? Math.floor(size * maxW / w) : size;
}
function rrectPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rrect(x, y, w, h, r, color, alpha = 1) {
  if (w <= 0 || h <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; rrectPath(x, y, w, h, r); ctx.fill(); ctx.restore();
}
function circle(x, y, r, color, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore();
}
function star(x, y, r1, r2, n, rot, color, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n - Math.PI / 2, r = i % 2 ? r2 : r1;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
// 日本語の簡易折り返し(行頭禁則: 、。！？」)
function wrap(str, size, maxW, weight = 800) {
  ctx.save(); ctx.font = font(size, weight);
  const lines = []; let cur = '';
  for (const ch of str) {
    if (ctx.measureText(cur + ch).width > maxW && cur && !'、。！？」』)'.includes(ch)) {
      if ('「『('.includes(cur.slice(-1))) { lines.push(cur.slice(0, -1)); cur = cur.slice(-1) + ch; }  // 行末禁則
      else { lines.push(cur); cur = ch; }
    }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  ctx.restore(); return lines;
}

// ---------- 背景 ----------
function ginkgo(x, y, s, rot, color, alpha) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.arc(0, 0, 40, -Math.PI * 0.86, -Math.PI * 0.14);
  ctx.closePath(); ctx.fill();
  // 中央の切れ込み
  ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath(); ctx.moveTo(0, -40); ctx.lineTo(-4, -44); ctx.lineTo(0, -22); ctx.lineTo(4, -44); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(3, 14, -2, 26); ctx.stroke();
  ctx.restore();
}
function background(t, tint) {
  const g = ctx.createLinearGradient(0, 0, W * 0.4, H);
  g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 回転する放射線
  ctx.save(); ctx.translate(W / 2, 920); ctx.rotate(t * 0.06);
  ctx.globalAlpha = 0.07; ctx.fillStyle = tint || '#ffffff';
  for (let i = 0; i < 18; i++) {
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.arc(0, 0, 1600, i * TAU / 18, i * TAU / 18 + TAU / 36); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // 水玉
  ctx.save(); ctx.globalAlpha = 0.06; ctx.fillStyle = '#fff';
  for (let yy = 0; yy < 22; yy++) for (let xx = 0; xx < 13; xx++) {
    const ox = (yy % 2) * 45, px = xx * 90 + ox - ((t * 12) % 90), py = yy * 90 + ((t * 20) % 90) - 60;
    ctx.beginPath(); ctx.arc(px, py, 6, 0, TAU); ctx.fill();
  }
  ctx.restore();
  // 舞うイチョウ
  for (let i = 0; i < 14; i++) {
    const sp = 40 + hash(i) * 50, y = ((hash(i + 9) * H + t * sp) % (H + 200)) - 100;
    const x = hash(i + 3) * W + Math.sin(t * 0.8 + i) * 40;
    ginkgo(x, y, 0.6 + hash(i + 5) * 0.7, Math.sin(t * 1.3 + i * 2) * 0.8 + i, i % 3 ? C.yellow : '#FFE58A', 0.22);
  }
}

// ---------- 共通パーツ ----------
function topBar(rank, alpha) {
  rrect(70, 92, W - 140, 96, 48, 'rgba(255,255,255,0.12)', alpha);
  text('大阪大学のここがすごい！', W / 2 - 55, 158, { size: 46, align: 'center', alpha });
  text('10選', W / 2 + 290, 160, { size: 52, align: 'center', color: C.yellow, alpha });
  // 進捗(10位→1位)
  const n = 10, gap = 12, w = (W - 140 - gap * (n - 1)) / n;
  for (let i = 0; i < n; i++) {
    const r = 10 - i, done = rank !== null && r >= rank, cur = r === rank;
    rrect(70 + i * (w + gap), 212, w, cur ? 16 : 12, 8, done ? (cur ? C.yellow : 'rgba(255,210,63,0.6)') : 'rgba(255,255,255,0.18)', alpha);
  }
}
function rankColor(r) { return r === 1 ? C.gold : r === 2 ? C.silver : r === 3 ? C.bronze : null; }
function rankBadge(r, u, acc) {
  const p = backOut(seg(u, 0.12, 0.45)), cx = W / 2, cy = 375;
  if (p <= 0) return;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(p, p); ctx.rotate((1 - p) * -0.4);
  const col = rankColor(r) || acc;
  star(0, 0, 150, 128, 16, u * 0.4, col, 1);
  circle(0, 0, 118, C.dark);
  circle(0, 0, 106, col);
  text('第', -62, 18, { size: 44, align: 'center', color: C.dark });
  text(String(r), 8, 42, { size: r === 10 ? 104 : 128, align: 'center', color: C.dark });
  text('位', 72, 18, { size: 44, align: 'center', color: C.dark });
  if (r <= 3) {  // 王冠
    ctx.fillStyle = col; ctx.strokeStyle = C.dark; ctx.lineWidth = 6; ctx.lineJoin = 'round';
    ctx.save(); ctx.translate(112, -116); ctx.rotate(0.5); ctx.scale(1.05, 1.05);
    ctx.beginPath(); ctx.moveTo(-70, 30); ctx.lineTo(-80, -42); ctx.lineTo(-38, -2); ctx.lineTo(0, -56); ctx.lineTo(38, -2);
    ctx.lineTo(80, -42); ctx.lineTo(70, 30); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function headline(lines, u) {
  lines.forEach((ln, i) => {
    const p = easeOut(seg(u, 0.3 + i * 0.12, 0.4));
    const size = fitSize(ln, 92, W - 120);
    text(ln, W / 2 + (1 - p) * 120, 612 + i * 104, { size, align: 'center', alpha: p, stroke: C.dark, sw: 16, color: i === lines.length - 1 ? C.yellow : C.ink });
  });
}
function panel(u, acc, draw) {
  const p = backOut(seg(u, 0.45, 0.5));
  if (p <= 0) return;
  const x = 90, y = 780, w = W - 180, h = 460;
  ctx.save();
  ctx.translate(W / 2, y + h / 2); ctx.scale(lerp(0.6, 1, p), lerp(0.6, 1, p)); ctx.translate(-W / 2, -(y + h / 2));
  ctx.globalAlpha = clamp(p);
  rrect(x + 10, y + 14, w, h, 44, 'rgba(8,4,30,0.45)');
  rrect(x, y, w, h, 44, '#FFF8E7');
  rrect(x, y, w, 18, 9, acc);
  ctx.save(); rrectPath(x, y, w, h, 44); ctx.clip();
  ctx.translate(W / 2, y + h / 2 + 10);
  draw(u - 0.45);
  ctx.restore();
  ctx.restore();
}
function statBlock(it, u, acc) {
  const p = backOut(seg(u, 1.0, 0.45));
  if (p > 0) {
    ctx.save(); ctx.translate(W / 2, 1318); ctx.scale(p, p);
    const size = fitSize(it.stat, 104, W - 160);
    text(it.stat, 0, 30, { size, align: 'center', color: C.yellow, stroke: C.dark, sw: 18, shadow: 0 });
    ctx.restore();
  }
  const q = easeOut(seg(u, 1.25, 0.4));
  if (q > 0) {
    const s1 = fitSize(it.sub, 44, W - 160, 800);
    text(it.sub, W / 2, 1428, { size: s1, align: 'center', alpha: q, color: C.ink, stroke: C.dark, sw: 10 });
    if (it.sub2) text(it.sub2, W / 2, 1484, { size: fitSize(it.sub2, 40, W - 160), align: 'center', alpha: q, color: C.ink2, stroke: C.dark, sw: 10 });
  }
}
function caption(t) {
  const c = TL.caps.find(c => t >= c.a - 0.05 && t <= c.b + 0.3);
  if (!c) return;
  const a = clamp(Math.min((t - c.a + 0.05) / 0.12, (c.b + 0.3 - t) / 0.12));
  const lines = wrap(c.text, 46, W - 200);
  const lh = 62, h = lines.length * lh + 36, y = 1525;
  rrect(80, y, W - 160, h, 26, 'rgba(255,255,255,0.95)', a);
  lines.forEach((ln, i) => text(ln, W / 2, y + 18 + 48 + i * lh, { size: 46, align: 'center', color: C.dark, alpha: a }));
}
function wipe(u, color) {
  const p = easeInOut(u / 0.5);
  if (p >= 1) return;
  const x = lerp(-W * 1.4, W * 1.4, p);
  ctx.save(); ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x - 300, 0); ctx.lineTo(x + 500, 0); ctx.lineTo(x + 300, H); ctx.lineTo(x - 500, H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.yellow;
  ctx.beginPath(); ctx.moveTo(x + 500, 0); ctx.lineTo(x + 560, 0); ctx.lineTo(x + 360, H); ctx.lineTo(x + 300, H); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---------- イラスト(原点 = パネル中心、およそ ±400 × ±230 に収める) ----------
const ICONS = {
  croc(u) {
    const bob = Math.sin(u * 3) * 6;
    ctx.save(); ctx.translate(20, -20 + bob);
    const green = '#3FAE5A', dk = '#2B7D40';
    // しっぽ
    const wig = Math.sin(u * 4) * 14;
    ctx.fillStyle = green; ctx.beginPath(); ctx.moveTo(-150, -30); ctx.quadraticCurveTo(-250, -10 + wig, -340, 10 + wig * 1.5); ctx.quadraticCurveTo(-250, 30, -150, 40); ctx.closePath(); ctx.fill();
    // 足
    [[-110, 0], [-40, 1], [40, 0], [100, 1]].forEach(([lx, k], i) => {
      const sw = Math.sin(u * 6 + i * 1.6) * 8;
      rrect(lx - 18 + sw, 30, 36, 64, 16, k ? dk : green);
    });
    // 胴体
    ctx.fillStyle = green; ctx.beginPath(); ctx.ellipse(-10, 0, 170, 62, 0, 0, TAU); ctx.fill();
    // 背中のトゲ
    ctx.fillStyle = dk;
    for (let i = 0; i < 9; i++) { const x = -150 + i * 34; ctx.beginPath(); ctx.moveTo(x, -52 + Math.abs(i - 4) * 2); ctx.lineTo(x + 16, -80 + Math.abs(i - 4) * 3); ctx.lineTo(x + 32, -52 + Math.abs(i - 4) * 2); ctx.fill(); }
    // 頭と口
    const open = 0.12 + 0.12 * (0.5 + 0.5 * Math.sin(u * 5));
    ctx.save(); ctx.translate(130, -10);
    ctx.save(); ctx.rotate(-open);
    rrect(0, -48, 200, 52, 24, green);
    ctx.fillStyle = '#fff'; for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.moveTo(40 + i * 22, 4); ctx.lineTo(51 + i * 22, 20); ctx.lineTo(62 + i * 22, 4); ctx.fill(); }
    circle(30, -50, 26, green); circle(34, -54, 15, '#fff'); circle(38, -54, 8, C.dark);
    circle(186, -40, 5, dk);
    ctx.restore();
    ctx.save(); ctx.rotate(open * 0.6);
    ctx.fillStyle = '#E8607A'; rrect(10, 0, 170, 26, 12, '#E8607A');
    rrect(0, 10, 196, 38, 18, green);
    ctx.fillStyle = '#fff'; for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.moveTo(40 + i * 22, 12); ctx.lineTo(51 + i * 22, -4); ctx.lineTo(62 + i * 22, 12); ctx.fill(); }
    ctx.restore();
    ctx.restore();
    // おなか
    ctx.fillStyle = '#B6E3A8'; ctx.beginPath(); ctx.ellipse(-10, 30, 130, 22, 0, 0, Math.PI); ctx.fill();
    ctx.restore();
    // 定規
    const p = easeOut(seg(u, 0.4, 0.8));
    const x0 = -340, x1 = lerp(x0, 350, p), y = 160;
    ctx.strokeStyle = C.dark; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0, y - 18); ctx.lineTo(x0, y + 18); ctx.moveTo(x1, y - 18); ctx.lineTo(x1, y + 18); ctx.stroke();
    if (p > 0.9) { rrect(-110, y - 34, 220, 68, 34, C.dark); text('約 7m', 0, y + 16, { size: 44, align: 'center', color: C.yellow }); }
    text('約45万年前のワニ', 0, -185, { size: 38, align: 'center', color: '#7a5a2a', alpha: easeOut(seg(u, 0.6, 0.5)) });
  },
  manga(u) {
    // 開いた本(コマ割り)
    const bw = 300, bh = 340, y0 = -175;
    [-1, 1].forEach(sd => {
      ctx.save(); ctx.translate(sd * 4, 0);
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = C.dark; ctx.lineWidth = 7; ctx.lineJoin = 'round';
      ctx.beginPath();
      if (sd < 0) { ctx.moveTo(0, y0 + 20); ctx.quadraticCurveTo(-bw / 2, y0 - 10, -bw, y0 + 10); ctx.lineTo(-bw, y0 + bh); ctx.quadraticCurveTo(-bw / 2, y0 + bh - 20, 0, y0 + bh + 10); }
      else { ctx.moveTo(0, y0 + 20); ctx.quadraticCurveTo(bw / 2, y0 - 10, bw, y0 + 10); ctx.lineTo(bw, y0 + bh); ctx.quadraticCurveTo(bw / 2, y0 + bh - 20, 0, y0 + bh + 10); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // コマ
      const koma = sd < 0 ? [[-270, -140, 230, 110], [-270, -15, 105, 150], [-150, -15, 110, 150]] : [[40, -140, 230, 70], [40, -55, 230, 190]];
      koma.forEach(([x, y, w, h], i) => {
        const a = seg(u, 0.3 + i * 0.25 + (sd > 0 ? 0.75 : 0), 0.3);
        ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.dark; ctx.lineWidth = 5; ctx.strokeRect(x, y, w, h); ctx.restore();
      });
      ctx.restore();
    });
    // 右ページの大ゴマに集中線と「!」
    const a = seg(u, 1.3, 0.3);
    if (a > 0) {
      ctx.save(); ctx.globalAlpha = a; ctx.beginPath(); ctx.rect(44, -51, 222, 182); ctx.clip();
      ctx.strokeStyle = C.dark; ctx.lineWidth = 2;
      for (let i = 0; i < 40; i++) { const an = i * TAU / 40; ctx.beginPath(); ctx.moveTo(155 + Math.cos(an) * 40, 40 + Math.sin(an) * 40); ctx.lineTo(155 + Math.cos(an) * 220, 40 + Math.sin(an) * 220); ctx.stroke(); }
      text('!', 155, 80, { size: 120, align: 'center', color: C.pink, stroke: C.dark, sw: 8 });
      ctx.restore();
    }
    // Gペン
    const px = 260 + Math.sin(u * 6) * 20, py = -150 + Math.cos(u * 4) * 10;
    ctx.save(); ctx.translate(px, py); ctx.rotate(0.7);
    rrect(-16, -230, 32, 170, 14, '#8a5a3a'); rrect(-20, -70, 40, 40, 8, '#c0c6cf');
    ctx.fillStyle = '#9aa3ad'; ctx.beginPath(); ctx.moveTo(-20, -30); ctx.lineTo(20, -30); ctx.lineTo(0, 20); ctx.closePath(); ctx.fill();
    ctx.restore();
  },
  people(u) {
    const cols = 9, rows = 3, gap = 84;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const i = r * cols + c, p = backOut(seg(u, 0.15 + i * 0.035, 0.35));
      if (p <= 0) continue;
      const x = (c - (cols - 1) / 2) * gap, y = (r - 1) * 120 - 10 + Math.sin(u * 4 + i) * 3;
      const col = (i * 7) % 3 === 0 ? C.pink : (i % 2 ? '#4F8DF0' : C.violet);
      ctx.save(); ctx.translate(x, y); ctx.scale(p, p);
      circle(0, -30, 22, col); rrect(-28, -2, 56, 60, 26, col);
      ctx.restore();
    }
    const a = backOut(seg(u, 1.4, 0.4));
    if (a > 0) {
      ctx.save(); ctx.translate(250, 175); ctx.scale(a, a); ctx.rotate(-0.08);
      rrect(-150, -42, 300, 84, 42, C.pink); text('女子学生も最多', 0, 16, { size: 40, align: 'center' });
      ctx.restore();
    }
  },
  globe(u) {
    const R = 140;
    circle(0, 0, R, '#3FA9F5');
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.clip();
    // 大陸っぽい形(回転)
    ctx.fillStyle = '#5DD37A';
    for (let i = 0; i < 6; i++) {
      const x = ((hash(i) * 2 * R + u * 40) % (2.6 * R)) - 1.3 * R, y = (hash(i + 4) - 0.5) * R * 1.4;
      ctx.beginPath(); ctx.ellipse(x, y, 30 + hash(i + 2) * 40, 20 + hash(i + 7) * 30, hash(i) * 3, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 3;
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.ellipse(0, 0, Math.abs(Math.cos(k * 0.5 + u * 0.6)) * R, R, 0, 0, TAU); ctx.stroke(); }
    for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(-R, k * 50); ctx.lineTo(R, k * 50); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = C.dark; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
    const words = ['Hello', '你好', 'Hola', 'Bonjour', 'Привет', 'Ciao', 'Olá', 'Danke', 'Salam', 'Jambo'];
    const cols = [C.pink, C.orange, C.violet, C.green, '#4F8DF0'];
    words.forEach((w, i) => {
      const p = backOut(seg(u, 0.2 + i * 0.1, 0.35));
      if (p <= 0) return;
      const an = i * TAU / words.length + u * 0.35;
      const x = Math.cos(an) * 320, y = Math.sin(an) * 175;
      ctx.save(); ctx.translate(x, y); ctx.scale(p, p);
      ctx.font = font(34); const tw = ctx.measureText(w).width + 40;
      rrect(-tw / 2, -30, tw, 60, 30, cols[i % 5]);
      text(w, 0, 12, { size: 34, align: 'center' });
      ctx.restore();
    });
  },
  building(u) {
    const ink = C.dark, wall = '#F4E3C1', roof = '#D9B26F';
    const p = easeOut(seg(u, 0.1, 0.6));
    ctx.save(); ctx.translate(0, (1 - p) * 60); ctx.globalAlpha = p;
    ctx.lineWidth = 6; ctx.strokeStyle = ink; ctx.lineJoin = 'round';
    // 階段
    [[-320, 170, 640, 24], [-290, 146, 580, 24]].forEach(([x, y, w, h]) => { ctx.fillStyle = '#E2CFA6'; ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h); });
    // 柱
    for (let i = 0; i < 6; i++) { const x = -250 + i * 100; ctx.fillStyle = wall; ctx.fillRect(x - 22, -40, 44, 186); ctx.strokeRect(x - 22, -40, 44, 186); }
    // 梁と屋根
    ctx.fillStyle = roof; ctx.fillRect(-300, -80, 600, 40); ctx.strokeRect(-300, -80, 600, 40);
    ctx.beginPath(); ctx.moveTo(-320, -80); ctx.lineTo(0, -200); ctx.lineTo(320, -80); ctx.closePath(); ctx.fill(); ctx.stroke();
    text('大阪帝国大学', 0, -48, { size: 30, align: 'center', color: ink, weight: 800 });
    // 旗
    const fx = 0, fy = -200;
    ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 30); ctx.stroke();
    ctx.restore();
    const b = backOut(seg(u, 0.8, 0.4));
    if (b > 0) {
      ctx.save(); ctx.translate(300, -150); ctx.scale(b, b); ctx.rotate(0.15);
      star(0, 0, 92, 76, 14, u * 0.5, C.pink); text('6番目', 0, 12, { size: 38, align: 'center' });
      ctx.restore();
    }
  },
  robot(u) {
    const blink = (u % 2.4) > 2.25 ? 0.15 : 1;
    ctx.save(); ctx.translate(-70, 10);
    // 肩
    rrect(-200, 140, 400, 160, 70, '#5B6B8C');
    rrect(-40, 90, 80, 70, 10, '#C7CFDB');
    // 頭 — 左半分は人の肌、右半分はメカ
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, -20, 135, 160, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = '#F6D3B3'; ctx.fillRect(-140, -190, 140, 340);
    ctx.fillStyle = '#C7CFDB'; ctx.fillRect(0, -190, 140, 340);
    ctx.strokeStyle = '#8D99AE'; ctx.lineWidth = 4;
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(10, -120 + i * 55); ctx.lineTo(60 + (i % 2) * 30, -120 + i * 55); ctx.lineTo(60 + (i % 2) * 30, -95 + i * 55); ctx.stroke(); circle(60 + (i % 2) * 30, -95 + i * 55, 7, '#8D99AE'); }
    // 髪
    ctx.fillStyle = '#2E2A3A'; ctx.beginPath(); ctx.ellipse(-30, -150, 150, 70, -0.15, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = C.dark; ctx.lineWidth = 7; ctx.beginPath(); ctx.ellipse(0, -20, 135, 160, 0, 0, TAU); ctx.stroke();
    // 目
    ctx.save(); ctx.translate(-55, -20); ctx.scale(1, blink); circle(0, 0, 18, C.dark); circle(6, -6, 6, '#fff'); ctx.restore();
    ctx.save(); ctx.translate(55, -20); ctx.scale(1, blink); circle(0, 0, 20, '#2EC4E6'); circle(0, 0, 9, '#E9FBFF'); ctx.restore();
    // 口
    ctx.strokeStyle = C.dark; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 50, 36, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.restore();
    // 吹き出し
    const p = backOut(seg(u, 0.6, 0.4));
    if (p > 0) {
      ctx.save(); ctx.translate(230, -120); ctx.scale(p, p);
      rrect(-140, -55, 280, 110, 40, C.cyan);
      ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.moveTo(-100, 40); ctx.lineTo(-150, 90); ctx.lineTo(-40, 50); ctx.fill();
      text('こんにちは', 0, 14, { size: 42, align: 'center', color: C.dark });
      ctx.restore();
    }
  },
  laser(u) {
    ctx.fillStyle = '#0E0B2C'; ctx.fillRect(-500, -300, 1000, 600);
    const n = 12, R = 360, p = easeOut(seg(u, 0.1, 1.0));
    for (let i = 0; i < n; i++) {
      const an = i * TAU / n + 0.13;
      const sx = Math.cos(an) * R, sy = Math.sin(an) * R * 0.62;
      const q = clamp(p * 1.2 - i * 0.015);
      const ex = lerp(sx, 0, q), ey = lerp(sy, 0, q);
      const col = i % 2 ? '#3FF0FF' : '#FF5CC8';
      ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round';
      ctx.globalAlpha = 0.35; ctx.lineWidth = 22; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.globalAlpha = 1; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.restore();
      circle(sx, sy, 14, col);
    }
    const f = seg(u, 1.0, 0.3), pulse = 0.5 + 0.5 * Math.sin(u * 9);
    if (f > 0) {
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 160 * f + pulse * 30);
      g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.3, 'rgba(255,240,160,0.9)'); g.addColorStop(1, 'rgba(255,120,200,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 200, 0, TAU); ctx.fill();
    }
    circle(0, 0, 16, '#fff');
    rrect(-260, 160, 520, 64, 32, 'rgba(14,11,44,0.85)', seg(u, 1.2, 0.4));
    text('激光XII号:12本のビームを1点に', 0, 205, { size: 32, align: 'center', color: '#E6E0FF', alpha: seg(u, 1.2, 0.4) });
  },
  heart(u) {
    const beat = 1 + 0.07 * Math.max(0, Math.sin(u * 7)) ** 6;
    ctx.save(); ctx.translate(-90, 0); ctx.scale(beat, beat);
    ctx.fillStyle = '#F2546B'; ctx.strokeStyle = C.dark; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(0, 170);
    ctx.bezierCurveTo(-260, 10, -170, -200, 0, -90);
    ctx.bezierCurveTo(170, -200, 260, 10, 0, 170); ctx.closePath(); ctx.fill(); ctx.stroke();
    circle(-90, -70, 26, 'rgba(255,255,255,0.5)');
    ctx.restore();
    // 心筋シート
    const p = easeOut(seg(u, 0.5, 0.6));
    ctx.save(); ctx.translate(lerp(380, 150, p), 20); ctx.rotate(-0.12); ctx.globalAlpha = clamp(p);
    rrect(-120, -110, 240, 220, 28, 'rgba(255,190,200,0.85)');
    ctx.strokeStyle = '#C93A57'; ctx.lineWidth = 5; ctx.strokeRect(-120, -110, 240, 220);
    for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) circle(-84 + c * 56, -74 + r * 50, 16, '#E7738A');
    ctx.restore();
    const b = backOut(seg(u, 1.0, 0.4));
    if (b > 0) { ctx.save(); ctx.translate(250, -160); ctx.scale(b, b); circle(0, 0, 70, C.green); text('iPS', 0, 14, { size: 44, align: 'center' }); ctx.restore(); }
  },
  juku(u) {
    const ink = C.dark;
    const p = easeOut(seg(u, 0.1, 0.6));
    ctx.save(); ctx.translate(0, (1 - p) * 60); ctx.globalAlpha = p;
    ctx.lineWidth = 6; ctx.strokeStyle = ink; ctx.lineJoin = 'round';
    // 1階
    ctx.fillStyle = '#EADBC0'; ctx.fillRect(-330, 20, 660, 170); ctx.strokeRect(-330, 20, 660, 170);
    // 格子
    ctx.fillStyle = '#7A4B2A'; ctx.fillRect(-300, 50, 220, 120); ctx.fillRect(80, 50, 220, 120);
    ctx.strokeStyle = '#EADBC0'; ctx.lineWidth = 4;
    for (let i = 1; i < 11; i++) { ctx.beginPath(); ctx.moveTo(-300 + i * 20, 50); ctx.lineTo(-300 + i * 20, 170); ctx.moveTo(80 + i * 20, 50); ctx.lineTo(80 + i * 20, 170); ctx.stroke(); }
    ctx.strokeStyle = ink; ctx.lineWidth = 6;
    // のれん
    const sway = Math.sin(u * 2.5) * 4;
    ctx.fillStyle = '#23306B';
    for (let i = 0; i < 3; i++) { ctx.fillRect(-75 + i * 52 + sway * (i - 1) * 0.5, 30, 48, 110); }
    text('適', -51 + sway * -0.5, 105, { size: 40, align: 'center', color: '#fff' });
    text('塾', 53 + sway * 0.5, 105, { size: 40, align: 'center', color: '#fff' });
    // 下屋根
    ctx.fillStyle = '#4A4E5C'; ctx.beginPath(); ctx.moveTo(-370, 30); ctx.lineTo(-310, -20); ctx.lineTo(310, -20); ctx.lineTo(370, 30); ctx.closePath(); ctx.fill(); ctx.stroke();
    // 2階
    ctx.fillStyle = '#EADBC0'; ctx.fillRect(-260, -110, 520, 90); ctx.strokeRect(-260, -110, 520, 90);
    ctx.fillStyle = '#7A4B2A'; ctx.fillRect(-200, -95, 400, 60);
    ctx.strokeStyle = '#EADBC0'; ctx.lineWidth = 4; for (let i = 1; i < 16; i++) { ctx.beginPath(); ctx.moveTo(-200 + i * 25, -95); ctx.lineTo(-200 + i * 25, -35); ctx.stroke(); }
    ctx.strokeStyle = ink; ctx.lineWidth = 6;
    // 上屋根
    ctx.fillStyle = '#4A4E5C'; ctx.beginPath(); ctx.moveTo(-310, -100); ctx.lineTo(-240, -175); ctx.lineTo(240, -175); ctx.lineTo(310, -100); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    const b = backOut(seg(u, 0.8, 0.4));
    if (b > 0) {
      ctx.save(); ctx.translate(-300, -190); ctx.scale(b, b); ctx.rotate(-0.12);
      rrect(-120, -40, 240, 80, 40, C.pink); text('江戸時代', 0, 14, { size: 40, align: 'center' });
      ctx.restore();
    }
  },
  medal(u) {
    // 紙吹雪
    for (let i = 0; i < 46; i++) {
      const sp = 90 + hash(i) * 80, y = ((hash(i + 1) * 600 + u * sp) % 640) - 320, x = (hash(i + 2) - 0.5) * 900;
      ctx.save(); ctx.translate(x + Math.sin(u * 3 + i) * 15, y); ctx.rotate(u * 4 + i);
      ctx.fillStyle = ACC[i % 5]; ctx.fillRect(-8, -4, 16, 8); ctx.restore();
    }
    const p = backOut(seg(u, 0.1, 0.5));
    ctx.save(); ctx.scale(p, p); ctx.translate(0, Math.sin(u * 2.5) * 6);
    // リボン
    ctx.fillStyle = '#3D6BE8'; ctx.beginPath(); ctx.moveTo(-90, -230); ctx.lineTo(-20, -230); ctx.lineTo(40, -60); ctx.lineTo(-30, -60); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#E8455F'; ctx.beginPath(); ctx.moveTo(90, -230); ctx.lineTo(20, -230); ctx.lineTo(-40, -60); ctx.lineTo(30, -60); ctx.closePath(); ctx.fill();
    // 光
    ctx.save(); ctx.rotate(u * 0.5); ctx.globalAlpha = 0.35;
    for (let i = 0; i < 12; i++) { ctx.fillStyle = C.yellow; ctx.beginPath(); ctx.moveTo(0, 40); ctx.arc(0, 40, 250, i * TAU / 12, i * TAU / 12 + 0.12); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    circle(0, 40, 140, '#B8860B'); circle(0, 40, 128, C.gold); circle(0, 40, 98, '#FFE38A');
    star(0, 40, 70, 30, 5, 0, '#D9A520');
    ctx.save(); ctx.beginPath(); ctx.arc(0, 40, 128, 0, TAU); ctx.clip();
    const sx = ((u * 260) % 700) - 350; ctx.globalAlpha = 0.45; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(sx, -100); ctx.lineTo(sx + 40, -100); ctx.lineTo(sx - 60, 200); ctx.lineTo(sx - 100, 200); ctx.fill();
    ctx.restore();
    ctx.restore();
    text('NOBEL', 0, 212, { size: 36, align: 'center', color: '#7a5a2a', alpha: seg(u, 0.8, 0.4) });
  },
};

// ---------- シーン ----------
function sceneTitle(u, t) {
  const a = backOut(seg(u, 0.05, 0.5));
  ctx.save(); ctx.translate(W / 2, 560); ctx.scale(a, a);
  text('大阪大学の', 0, 0, { size: 120, align: 'center', stroke: C.dark, sw: 20 });
  ctx.restore();
  const b = backOut(seg(u, 0.35, 0.5));
  ctx.save(); ctx.translate(W / 2, 760); ctx.rotate(-0.05 + Math.sin(t * 3) * 0.015); ctx.scale(b, b);
  text('ここがすごい！', 0, 0, { size: 140, align: 'center', color: C.yellow, stroke: C.dark, sw: 24 });
  ctx.restore();
  const c = backOut(seg(u, 0.8, 0.5));
  if (c > 0) {
    ctx.save(); ctx.translate(W / 2, 1110); ctx.scale(c, c); ctx.rotate(Math.sin(t * 2) * 0.05);
    star(0, 0, 250, 205, 18, t * 0.3, C.pink);
    star(0, 0, 205, 190, 18, t * 0.3, '#FF7BA2');
    text('10', -40, 60, { size: 210, align: 'center', stroke: C.dark, sw: 18 });
    text('選', 120, 50, { size: 110, align: 'center', stroke: C.dark, sw: 14 });
    ctx.restore();
  }
  const d = easeOut(seg(u, 1.4, 0.5));
  text('知ってた？ 驚きのポイントを紹介！', W / 2, 1440, { size: 48, align: 'center', alpha: d, stroke: C.dark, sw: 10 });
}
function sceneItem(id, u, t) {
  const it = ITEMS[id], acc = ACC[(10 - it.rank) % 5];
  topBar(it.rank, 1);
  rankBadge(it.rank, u, acc);
  headline(it.head, u);
  panel(u, acc, ICONS[it.icon]);
  statBlock(it, u, acc);
}
function sceneOutro(u, t) {
  topBar(1, 1);
  const a = backOut(seg(u, 0.05, 0.5));
  ctx.save(); ctx.translate(W / 2, 400); ctx.scale(a, a);
  text('あなたはいくつ', 0, 0, { size: 96, align: 'center', stroke: C.dark, sw: 18 });
  text('知ってた？', 0, 120, { size: 120, align: 'center', color: C.yellow, stroke: C.dark, sw: 20 });
  ctx.restore();
  // まとめリスト
  const x = 110, y = 620, w = W - 220, h = 780;
  const p = easeOut(seg(u, 0.3, 0.5));
  rrect(x, y + (1 - p) * 60, w, h, 40, 'rgba(255,255,255,0.94)', p);
  const ids = ['r1', 'r2', 'r3', 'r4', 'r5', 'r6', 'r7', 'r8', 'r9', 'r10'];
  ids.forEach((id, i) => {
    const it = ITEMS[id], q = easeOut(seg(u, 0.45 + i * 0.07, 0.3));
    const yy = y + 80 + i * 72 + (1 - p) * 60;
    const col = rankColor(it.rank) || ACC[(10 - it.rank) % 5];
    circle(x + 70, yy - 14, 28, col, q);
    text(String(it.rank), x + 70, yy, { size: 34, align: 'center', color: C.dark, alpha: q });
    text(it.short, x + 125, yy, { size: 44, color: C.dark, alpha: q });
  });
  const b = 1 + 0.04 * Math.sin(t * 6);
  const c = backOut(seg(u, 1.4, 0.4));
  if (c > 0) {
    ctx.save(); ctx.translate(W / 2, 1510); ctx.scale(c * b, c * b);
    rrect(-330, -56, 660, 112, 56, C.pink); text('コメントで教えてね！', 0, 18, { size: 54, align: 'center' });
    ctx.restore();
  }
}
function credits(alpha) {
  text('ナレーション VOICEVOX:四国めたん / BGM オリジナル', W / 2, 1610, { size: 30, weight: 500, align: 'center', color: C.ink2, alpha });
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  const idx = Math.max(0, TL.scenes.findIndex(s => t >= s.start && t < s.start + s.dur));
  const sc = TL.scenes[idx < 0 ? TL.scenes.length - 1 : idx];
  const u = t - sc.start;
  const it = ITEMS[sc.id];
  const acc = it ? ACC[(10 - it.rank) % 5] : C.pink;
  background(t, it ? acc : C.yellow);
  if (sc.id === 'title') sceneTitle(u, t);
  else if (sc.id === 'outro') { sceneOutro(u, t); credits(seg(u, 1.0, 0.5)); }
  else sceneItem(sc.id, u, t);
  if (sc.id !== 'outro' && sc.id !== 'title') caption(t);  // タイトルとまとめは画面の文字と同じなので字幕なし
  if (idx > 0) wipe(u, acc);
  // 最後 0.6 秒でフェードアウト
  const fo = seg(t, DURATION - 0.6, 0.6);
  if (fo > 0) { ctx.fillStyle = `rgba(10,6,30,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.FPS = FPS; window.DURATION = DURATION; window.render = render;
window.ready = Promise.all(['500', '800'].map(w => document.fonts.load(`${w} 40px MPR`, 'あ漢字ABC Привет 你好'))).then(() => document.fonts.ready);

// ブラウザで開いたときのプレビュー再生(?t=秒 で静止)
const q = new URLSearchParams(location.search);
window.ready.then(() => {
  if (q.has('t')) { render(parseFloat(q.get('t'))); return; }
  if (q.has('still')) return;
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
});
</script>
