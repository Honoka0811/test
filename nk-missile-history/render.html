// ---------- 地理データ(概略, [経度, 緯度]) ----------
const MAINLAND = [[110,53],[110,30],[121.8,30.9],[121.9,31.7],[120.9,32.6],[120.3,34.3],[119.2,34.7],[119.6,35.5],[120.7,36.3],

   [134.2,34.6],[133.0,34.4],[132.2,33.9],[130.9,33.9],[131.0,34.4],[132.0,35.0],[133.0,35.6],[134.5,35.6],[135.8,35.6],
   [136.0,35.9],[136.7,36.9],[137.3,36.8],[138.5,37.4],[139.5,38.2],[139.9,39.0],[140.0,40.0],[139.9,40.6],[140.3,41.2]], // 本州

  [[130.0,33.9],[130.9,33.9],[131.7,33.3],[131.4,31.4],[130.7,31.0],[130.2,31.3],[130.2,32.2],[129.8,32.7],[129.6,33.3]], // 九州

];

// ---------- データ(概数) ----------
const BARS = [ { y: 2016, v: 23 }, { y: 2017, v: 17 }, { y: 2018, v: 0 }, { y: 2019, v: 25 }, { y: 2020, v: 8 }, { y: 2021, v: 6 }, { y: 2022, v: 59 } ];
const CARDS = [
  { tag: '2023', name: '火星18', desc: '初の固体燃料ICBM' },
  { tag: '2024', name: '火星19', desc: '固体燃料ICBM・最長飛翔' },

];
const DOTS2026 = ['1/4', '1/27', '3/14', '4/8', '4/19', '10/12', '10/29', '11/4'];
const CHAPTER = { y1990: ['01', '始まり'], y2000: ['02', '散発期'], y2016: ['03', '急増'], chart: ['04', '発射数の推移'],
  y2022: ['05', '過去最多'], quality: ['06', '数から質へ'], now: ['07', '現在'] };
const FOOT = {
  hook: '',
  y1990: '1998年のテポドン発射を北朝鮮は「人工衛星」と主張',
  y2000: '2009年の発射も北朝鮮は「人工衛星」と主張',
  y2016: 'EEZの線は概略。2016年8月、秋田県男鹿半島沖に落下',
  chart: '発射数は概数。出典: 防衛白書ほか\n(2016〜17年 計40発、2022年 少なくとも59発)',
  y2022: '2022年10月4日、青森県上空を通過(防衛省発表)',
  quality: '回数は2022年の31回から2023年は18回へ(防衛省発表)',
  now: '累計は2026年5月末時点(令和8年版防衛白書)\n2026年の日付は報道ベースの主な発射',
  outro: ''
};
const CAMS = {
  hook: { cx: 137.0, cy: 40.0, z: 1.0 }, y1990: { cx: 135.5, cy: 40.3, z: 1.12 }, y2000: { cx: 135.0, cy: 40.2, z: 1.08 },
  y2016: { cx: 136.5, cy: 40.6, z: 1.04 }, chart: { cx: 136.5, cy: 40.6, z: 1.04 }, y2022: { cx: 137.0, cy: 40.5, z: 1.0 },
  quality: { cx: 134.0, cy: 39.6, z: 0.92 }, now: { cx: 134.0, cy: 39.6, z: 0.92 }, outro: { cx: 137.0, cy: 40.0, z: 0.98 }
};

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const backOut = t => { t = clamp(t); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const fmt = n => Math.round(n).toLocaleString('en-US');

function txt(s, x, y, { size = 48, color = C.ink, align = 'left', base = 'alphabetic', alpha = 1, font = FONT, bold = false, stroke = 0, strokeColor = '#000', ls = 0 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (ls) ctx.letterSpacing = ls + 'px';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(s, x, y); }
  if (bold) { ctx.lineWidth = Math.max(1.5, size / 28); ctx.strokeStyle = color; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// ---------- タイムライン ----------
let TL = null, SC = [], CUES = [], SHAKES = [], FLASHES = [];
function setup(tl) {
  TL = tl; SC = tl.scenes; CUES = [];
  SC.forEach((s, i) => s.cues.forEach((c, j) => CUES.push({ ...c, scene: s.id, si: i, key: s.id + j })));
  // salvo を個別の弾に展開(1発は直後に失敗した想定 = 2006年のテポドン2号)
  CUES.filter(c => c.type === 'salvo').forEach(c => {
    for (let i = 0; i < c.n; i++) {
      const fail = i === 3;
      const to = fail ? [c.from[0] + 0.9, c.from[1] + 0.5] : [130.6 + hash(i) * 2.6, 39.4 + hash(i + 9) * 2.0];
      CUES.push({ type: 'missile', t: c.t + i * c.step, from: c.from, to, dur: fail ? 0.5 : c.dur * (0.8 + 0.4 * hash(i + 3)),
        impact: true, small: true, scene: c.scene, si: c.si, key: c.key + '_' + i });
    }
  });
  SHAKES = []; FLASHES = [];
  SC.forEach((s, i) => { if (i) { SHAKES.push({ t: s.start, amp: 7, k: 9 }); FLASHES.push({ t: s.start, a: 0.28, k: 9, c: '255,255,255' }); } });
  CUES.forEach(c => {
    if (c.type === 'missile') {
      FLASHES.push({ t: c.t, a: c.big ? 0.18 : 0.05, k: 10, c: '255,140,90' });
      if (c.impact && !c.small) SHAKES.push({ t: c.t + c.dur, amp: c.eez ? 16 : 9, k: 5 });
      if (c.eez) FLASHES.push({ t: c.t + c.dur, a: 0.35, k: 5, c: '255,40,30' });
    }
    if (c.type === 'stamp') SHAKES.push({ t: c.t + 0.12, amp: c.id === 'title' ? 18 : 9, k: 7 });
    if (c.type === 'stamp' && c.id === 'title') FLASHES.push({ t: c.t, a: 0.5, k: 6, c: '255,255,255' });
    if (c.type === 'peak') { SHAKES.push({ t: c.t + 0.55, amp: 26, k: 4 }); FLASHES.push({ t: c.t + 0.55, a: 0.45, k: 4, c: '255,50,40' }); }
    if (c.type === 'warn') for (let k = 0; k < 4; k++) SHAKES.push({ t: c.t + k * 0.5, amp: 6, k: 8 });
    if (c.type === 'card') SHAKES.push({ t: c.t + 0.1, amp: 6, k: 9 });
  });
}
function sceneIndex(t) { let i = 0; while (i < SC.length - 1 && t >= SC[i + 1].start) i++; return i; }
function cue(type, si, id) { return CUES.find(c => c.type === type && c.si === si && (id === undefined || c.id === id)); }

// ---------- カメラと投影 ----------
const MAP = { x: 0, y: 300, w: 1080, h: 880 };
const K0 = 50.3, COSL = Math.cos(40 * Math.PI / 180);
let CAM = { cx: 137, cy: 40, z: 1 };
function P(ll) { const k = K0 * CAM.z; return [MAP.x + MAP.w / 2 + (ll[0] - CAM.cx) * k * COSL, MAP.y + MAP.h / 2 - (ll[1] - CAM.cy) * k]; }
function camAt(t) {
  const i = sceneIndex(t), s = SC[i], loc = t - s.start;
  const a = CAMS[(SC[i - 1] || s).id], b = CAMS[s.id], e = easeInOut(loc / 1.0);
  const drift = 1 + 0.035 * clamp(loc / s.dur);
  let z = lerp(a.z, b.z, e) * drift;
  if (s.id === 'hook') z *= lerp(1.35, 1, easeOut(loc / 2.2));
  return { cx: lerp(a.cx, b.cx, e), cy: lerp(a.cy, b.cy, e), z };
}
function poly(pts) { ctx.beginPath(); pts.forEach((p, i) => { const q = P(p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.closePath(); }

// ---------- 地図 ----------
function drawMap(t, si, dim, jpPulse) {
  ctx.save();
  ctx.beginPath(); ctx.rect(MAP.x, MAP.y, MAP.w, MAP.h); ctx.clip();
  ctx.fillStyle = C.sea; ctx.fillRect(MAP.x, MAP.y, MAP.w, MAP.h);
  // 経緯線
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1.5;
  for (let lon = 110; lon <= 160; lon += 2) { const a = P([lon, 25]), b = P([lon, 55]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  for (let lat = 26; lat <= 54; lat += 2) { const a = P([110, lat]), b = P([160, lat]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  // 陸地
  ctx.lineJoin = 'round';
  poly(MAINLAND); ctx.fillStyle = C.land; ctx.fill(); ctx.strokeStyle = C.landStroke; ctx.lineWidth = 2; ctx.stroke();
  poly(SAKHALIN); ctx.fill(); ctx.stroke();
  poly(NK); ctx.fillStyle = C.nk; ctx.fill(); ctx.strokeStyle = C.nkStroke; ctx.lineWidth = 2.5; ctx.stroke();
  JAPAN.forEach(isl => {
    poly(isl); ctx.fillStyle = C.jp; ctx.fill();
    ctx.strokeStyle = jpPulse > 0 ? `rgba(255,${Math.round(lerp(212, 70, jpPulse))},${Math.round(lerp(255, 60, jpPulse))},1)` : C.jpStroke;
    ctx.lineWidth = 2.5 + jpPulse * 3; ctx.stroke();
    if (jpPulse > 0) { ctx.fillStyle = `rgba(255,59,48,${0.28 * jpPulse})`; ctx.fill(); }
  });
  // レーダー掃引(平壌中心)
  const c = P([125.75, 39.03]); const ang = t * 1.6;
  const g = ctx.createConicGradient(ang, c[0], c[1]);
  g.addColorStop(0, 'rgba(255,80,70,0.16)'); g.addColorStop(0.08, 'rgba(255,80,70,0)'); g.addColorStop(1, 'rgba(255,80,70,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c[0], c[1], 1400, 0, Math.PI * 2); ctx.fill();
  for (let r = 1; r <= 4; r++) { ctx.strokeStyle = 'rgba(255,90,80,0.10)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(c[0], c[1], r * 230 * CAM.z, 0, Math.PI * 2); ctx.stroke(); }
  // 地名
  const lab = (s, ll, o = {}) => { const q = P(ll); txt(s, q[0], q[1], { size: 30, color: C.ink3, align: 'center', ...o }); };
  lab('日本海', [134.6, 42.3], { size: 34, ls: 8 });
  lab('太平洋', [146.5, 35.6], { size: 34, ls: 8 });
  lab('北朝鮮', [127.3, 40.5], { color: '#ff8a80', size: 34 });
  lab('韓国', [127.9, 36.4]); lab('中国', [124.0, 43.3]); lab('ロシア', [134.5, 46.4]);
  lab('日本', [138.6, 36.3], { color: C.cyan, size: 36 });
  const pyong = P([125.75, 39.03]); ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(pyong[0], pyong[1], 7, 0, 7); ctx.fill();
  txt('平壌', pyong[0] - 14, pyong[1] + 34, { size: 26, color: '#ff8a80', align: 'center' });
  const tok = P([139.7, 35.7]); ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.arc(tok[0], tok[1], 6, 0, 7); ctx.fill();
  txt('東京', tok[0] + 14, tok[1] + 30, { size: 26, color: C.cyan });
  ctx.restore();
  if (dim > 0) { ctx.fillStyle = `rgba(2,4,8,${dim})`; ctx.fillRect(MAP.x, MAP.y, MAP.w, MAP.h); }
  // 枠
  ctx.strokeStyle = 'rgba(95,212,255,0.35)'; ctx.lineWidth = 2;
  const L = 34; [[MAP.x + 18, MAP.y + 18, 1, 1], [MAP.x + MAP.w - 18, MAP.y + 18, -1, 1], [MAP.x + 18, MAP.y + MAP.h - 18, 1, -1], [MAP.x + MAP.w - 18, MAP.y + MAP.h - 18, -1, -1]]
    .forEach(([x, y, sx, sy]) => { ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke(); });
}

// ---------- ミサイル ----------
function missileGeom(m) {
  const A = P(m.from), B = P(m.to); const d = Math.hypot(B[0] - A[0], B[1] - A[1]);
  return { A, B, h: m.small ? Math.min(90, d * 0.35) : Math.min(330, d * 0.34) };
}
function arcPt(g, p) { return [lerp(g.A[0], g.B[0], p), lerp(g.A[1], g.B[1], p) - g.h * Math.sin(Math.PI * p)]; }
function crossP(m) { return clamp((140.6 - m.from[0]) / (m.to[0] - m.from[0]), 0, 1); }  // 日本(本州北部〜北海道)上空を横切る位置
function drawMissile(m, t, opt = {}) {
  const p = (t - m.t) / m.dur; if (p < 0) return;
  const g = missileGeom(m), q = Math.min(p, 1);
  const fade = opt.fade !== undefined ? opt.fade : (p > 1 ? Math.max(0.3, 1 - (p - 1) * 0.35) : 1);
  ctx.save(); ctx.globalAlpha = fade;
  // 地上軌跡
  ctx.setLineDash([6, 10]); ctx.strokeStyle = 'rgba(255,120,100,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(g.A[0], g.A[1]); ctx.lineTo(lerp(g.A[0], g.B[0], q), lerp(g.A[1], g.B[1], q)); ctx.stroke(); ctx.setLineDash([]);
  // 噴煙
  const ts = t - m.t;
  if (ts < 2.5) for (let i = 0; i < 6; i++) {
    const r = (10 + i * 5) * (1 + ts * 1.6) * (m.small ? 0.5 : 1), a = 0.22 * (1 - ts / 2.5);
    ctx.fillStyle = `rgba(200,200,210,${a})`; ctx.beginPath(); ctx.arc(g.A[0] + (hash(i + m.t) - .5) * 30 * ts, g.A[1] - i * 4, r, 0, 7); ctx.fill();
  }
  // 弾道(グロー + 芯)
  const N = 48; const pts = []; for (let i = 0; i <= N; i++) pts.push(arcPt(g, q * i / N));
  const head = pts[pts.length - 1];
  [[m.small ? 8 : 16, 'rgba(255,60,40,0.22)'], [m.small ? 3 : 5, '#ff4b36'], [m.small ? 1.2 : 2, '#ffd9c9']].forEach(([lw, col]) => {
    ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath();
    pts.forEach((pt, i) => i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1])); ctx.stroke();
  });
  if (p < 1) {
    const rg = ctx.createRadialGradient(head[0], head[1], 0, head[0], head[1], m.small ? 22 : 46);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.25, 'rgba(255,170,120,0.9)'); rg.addColorStop(1, 'rgba(255,60,40,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(head[0], head[1], m.small ? 22 : 46, 0, 7); ctx.fill();
  }
  // 着弾
  if (m.impact && p >= 1) {
    const d = t - (m.t + m.dur);
    for (let k = 0; k < 3; k++) {
      const dd = d - k * 0.18; if (dd < 0) continue;
      const r = (m.small ? 14 : 26) + dd * (m.small ? 40 : 90), a = Math.max(0, 1 - dd / 1.6);
      ctx.strokeStyle = `rgba(255,${m.eez ? 60 : 150},${m.eez ? 50 : 120},${a})`; ctx.lineWidth = m.eez ? 5 : 3;
      ctx.beginPath(); ctx.ellipse(g.B[0], g.B[1], r, r * 0.45, 0, 0, 7); ctx.stroke();
    }
    if (d < 0.25) { ctx.fillStyle = `rgba(255,230,200,${1 - d / 0.25})`; ctx.beginPath(); ctx.arc(g.B[0], g.B[1], m.small ? 14 : 34, 0, 7); ctx.fill(); }
    ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(g.B[0], g.B[1], m.small ? 5 : 9, 0, 7); ctx.fill();
    if (m.eez) {
      const e = backOut((d - 0.2) / 0.35); if (d > 0.2) {
        ctx.save(); ctx.translate(g.B[0], g.B[1] - 70); ctx.scale(e, e);
        rrect(-130, -38, 260, 66, 10); ctx.fillStyle = C.red; ctx.fill();
        txt('EEZ内に落下', 0, 10, { size: 36, align: 'center', bold: true, color: '#fff' }); ctx.restore();
      }
    }
  }
  // 日本上空通過ラベル
  if (m.big && opt.label !== false && !opt.montage) {
    const pc = crossP(m), d = (t - m.t) / m.dur - pc;
    if (d > 0) {
      const pt = arcPt(g, pc), e = backOut(d * m.dur / 0.3);

  }
}

// ---------- メイン描画 ----------
function render(t) {
  if (!TL) return;
  t = Math.min(t, TL.total - 1e-3);
  const si = sceneIndex(t), s = SC[si];
  CAM = camAt(t);
  // 画面の揺れ
  let amp = 0; SHAKES.forEach(e => { const d = t - e.t; if (d >= 0 && d < 1.5) amp += e.amp * Math.exp(-d * e.k); });
  const sx = amp * Math.sin(t * 91.7) * 0.9, sy = amp * Math.cos(t * 77.3) * 0.9;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(sx, sy);
  const dim = { quality: 0.55, now: 0.7 }[s.id] || 0;
  drawMap(t, si, dim, jpPulseAt(t, si));
  ctx.save(); ctx.beginPath(); ctx.rect(MAP.x, MAP.y, MAP.w, MAP.h); ctx.clip();
  if (s.id !== 'outro') CUES.filter(c => c.type === 'missile' && c.si === si).forEach((m, i, arr) => drawMissile(m, t, { label: arr.findIndex(x => x.big) === i }));
  if (s.id === 'y2016') { drawEEZ(t, si); }
  if (s.id === 'y2016' || s.id === 'y2022' || s.id === 'y1990' || s.id === 'y2000') {
    const st = CUES.filter(c => c.type === 'stamp' && c.si === si);
    st.forEach(c => {
      if (c.id === 'first_overflight') stamp('初の日本上空通過', 560, MAP.y + 700, c.t, t, { size: 52 });
      if (c.id === 'rare') stamp('数年に1度', 560, MAP.y + 700, c.t, t, { size: 56, color: '#d9a400', fg: '#111' });
      if (c.id === 'kim') stamp('2012年〜 金正恩体制', 540, MAP.y + 760, c.t, t, { size: 50, rot: -3, until: 2.0 });
    });
  }
  if (s.id === 'y2016') drawWarn(t, si, 'Jアラート発出');
  if (s.id === 'chart') drawChart(t, si);
  if (s.id === 'y2022') drawRange(t, si);
  if (s.id === 'quality') drawQuality(t, si);
  if (s.id === 'now') drawNow(t, si);
  if (s.id === 'outro') drawOutro(t, si);
  ctx.restore();
  if (s.id === 'hook') drawHook(t, si);
  drawHUD(t, si);
  drawCaption(t, si);
  if (FOOT[s.id]) FOOT[s.id].split('\n').forEach((l, i) => txt(l, 540, 1515 + i * 36, { size: 26, align: 'center', color: C.ink3, alpha: clamp((t - s.start) / 0.5) }));
  ctx.restore();
  post(t, si);
}
window.render = render; window.FPS = FPS; window.setupTimeline = setup;
Object.defineProperty(window, 'DURATION', { get: () => TL ? TL.total : 0 });

if (window.TIMELINE) setup(window.TIMELINE);
else fetch('output/timeline.json').then(r => r.json()).then(tl => {   // ブラウザでのプレビュー再生
  setup(tl); const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % tl.total); requestAnimationFrame(loop); }; loop();
});
</script>
</body>
