<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>東京の秘密5選</title>
<style>
@font-face { font-family: 'Dela'; src: url('fonts/DelaGothicOne-Regular.ttf'); }
@font-face { font-family: 'Maru'; src: url('fonts/MPLUSRounded1c-ExtraBold.ttf'); }
html, body { margin: 0; background: #000; }
canvas { display: block; width: 100vh; max-width: 100vw; aspect-ratio: 9/16; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<!-- フォントを先読みさせるためのダミー -->
<div style="position:absolute;opacity:0;font-family:Dela">あ</div><div style="position:absolute;opacity:0;font-family:Maru">あ</div>
<script>
'use strict';
const W = 1080, H = 1920;
window.FPS = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- タイムライン(capture.js が output/timeline.json を注入。ブラウザ単体ではfetch) ----------
let TL = null, SC = {};
window.setTimeline = (tl) => {
  TL = tl; SC = {};
  tl.scenes.forEach((s, i) => { s.index = i; SC[s.id] = s; });
  window.DURATION = tl.total;
};

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const easeInOut = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const backOut = k => { k = clamp(k); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const elastic = k => { k = clamp(k); if (k === 0 || k === 1) return k; return Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * 2 * Math.PI / 3) + 1; };
function rand(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }
const fmt = n => Math.round(n).toLocaleString('en-US');

const COL = {
  ink: '#0b0b1a', yellow: '#FFE14D', pink: '#FF3D8B', cyan: '#3DF2FF', red: '#FF3B3B', white: '#ffffff',
  navy1: '#070b2a', navy2: '#25105a', purple: '#5a1a8c'
};

function sceneAt(t) {
  let cur = TL.scenes[0];
  for (const s of TL.scenes) if (t >= s.start - 0.0001) cur = s;
  return cur;
}
function lineAt(s, t) {
  let idx = -1;
  s.lines.forEach((l, i) => { if (t >= l.start - 0.05) idx = i; });
  return idx;
}

// ---------- 背景 ----------
const STARS = (() => { const r = rand(11); return Array.from({ length: 140 }, () => ({ x: r() * W, y: r() * H * 0.8, s: 1 + r() * 2.5, p: r() * 6.28 })); })();
const BOKEH = (() => { const r = rand(23); const cs = ['#FF3D8B', '#3DF2FF', '#FFE14D', '#8B5CFF', '#FF8A3D'];
  return Array.from({ length: 34 }, () => ({ x: r() * W, y: r() * H, r: 30 + r() * 110, c: cs[Math.floor(r() * cs.length)], v: 10 + r() * 40, p: r() * 6.28 })); })();

function bgNight(t, top = COL.navy1, bot = COL.navy2) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top); g.addColorStop(0.65, bot); g.addColorStop(1, '#ff3d8b55');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) {
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 2 + s.p);
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
}
function bokeh(t, a = 0.18) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const b of BOKEH) {
    const y = ((b.y - t * b.v) % (H + 300) + H + 300) % (H + 300) - 150;
    const x = b.x + Math.sin(t * 0.6 + b.p) * 30;
    const g = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    g.addColorStop(0, b.c); g.addColorStop(1, 'transparent');
    ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, b.r, 0, 6.29); ctx.fill();
  }
  ctx.restore();
}

// ---------- 東京のシルエット ----------
const BLD = (() => { const r = rand(5); const a = []; let x = -40;
  while (x < W + 40) { const w = 50 + r() * 110; a.push({ x, w, h: 160 + r() * 420, win: r() }); x += w + 4 + r() * 10; } return a; })();
function skyline(t, baseY, scale = 1, glow = 1) {
  ctx.save();
  ctx.translate(W / 2, baseY); ctx.scale(scale, scale); ctx.translate(-W / 2, 0);
  // 東京タワー(左)とスカイツリー(右)
  drawTokyoTowerSil(250, 0, 640);
  drawSkytreeSil(800, 0, 1050);
  for (const b of BLD) {
    ctx.fillStyle = '#0a0820'; ctx.fillRect(b.x, -b.h, b.w, b.h + 400);
    // 窓
    const r = rand(Math.floor(b.x * 7 + 3));
    for (let yy = -b.h + 20; yy < -10; yy += 26) for (let xx = b.x + 10; xx < b.x + b.w - 14; xx += 20) {
      const on = r() < 0.45 + 0.1 * Math.sin(t * 1.3 + xx);
      if (on) { ctx.fillStyle = r() < 0.7 ? '#ffd86b' : '#7ef3ff'; ctx.globalAlpha = 0.55 * glow + 0.25; ctx.fillRect(xx, yy, 9, 13); }
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawTokyoTowerSil(cx, by, h) {
  ctx.save(); ctx.fillStyle = '#1a0f2e';
  ctx.beginPath();
  ctx.moveTo(cx - h * 0.2, by); ctx.quadraticCurveTo(cx - h * 0.05, by - h * 0.5, cx - 6, by - h);
  ctx.lineTo(cx + 6, by - h); ctx.quadraticCurveTo(cx + h * 0.05, by - h * 0.5, cx + h * 0.2, by); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff5a3d'; ctx.globalAlpha = 0.85;
  ctx.fillRect(cx - h * 0.07, by - h * 0.42, h * 0.14, 16); ctx.fillRect(cx - h * 0.035, by - h * 0.7, h * 0.07, 12);
  ctx.beginPath(); ctx.arc(cx, by - h, 7, 0, 6.29); ctx.fill();
  ctx.restore();
}
function drawSkytreeSil(cx, by, h) {
  ctx.save(); ctx.fillStyle = '#16122e';
  ctx.beginPath(); ctx.moveTo(cx - h * 0.07, by); ctx.lineTo(cx - 14, by - h * 0.85); ctx.lineTo(cx - 4, by - h);
  ctx.lineTo(cx + 4, by - h); ctx.lineTo(cx + 14, by - h * 0.85); ctx.lineTo(cx + h * 0.07, by); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#9fd8ff'; ctx.globalAlpha = 0.8;
  ctx.fillRect(cx - 34, by - h * 0.34, 68, 20); ctx.fillRect(cx - 24, by - h * 0.43, 48, 12);
  ctx.restore();
}

// ---------- テロップ ----------
// 【】で囲んだ部分を強調色・大きめで描く。行ごとに幅を自動フィット
function parseLine(str) {
  const segs = []; let emph = false, buf = '';
  for (const ch of str) {
    if (ch === '【' || ch === '】') { if (buf) segs.push({ s: buf, e: emph }); buf = ''; emph = ch === '【'; }
    else buf += ch;
  }
  if (buf) segs.push({ s: buf, e: emph });
  return segs;
}
function telop(text, cx, cy, k, opt = {}) {
  const base = opt.size || 92, emphScale = opt.emphScale || 1.32, maxW = opt.maxW || 960;
  const emphCol = opt.emphColor || COL.yellow;
  const rows = text.split('\n').map(parseLine);
  const measure = (segs, sz) => segs.reduce((w, sg) => { ctx.font = `${sz * (sg.e ? emphScale : 1)}px Dela`; return w + ctx.measureText(sg.s).width; }, 0);
  const sizes = rows.map(segs => { const w = measure(segs, base); return w > maxW ? base * maxW / w : base; });
  const heights = rows.map((segs, i) => sizes[i] * (segs.some(s => s.e) ? emphScale : 1) * 1.18);
  const totalH = heights.reduce((a, b) => a + b, 0);
  let y = cy - totalH / 2;
  rows.forEach((segs, ri) => {
    const sz = sizes[ri], rowH = heights[ri];
    const kk = clamp((k - ri * 0.12) / 0.5);
    const sc = backOut(kk);
    if (kk <= 0) { y += rowH; return; }
    const w = measure(segs, sz);
    ctx.save();
    ctx.translate(cx, y + rowH * 0.62); ctx.scale(sc, sc); ctx.rotate((1 - easeOut(kk)) * -0.06);
    let x = -w / 2;
    for (const sg of segs) {
      const fs = sz * (sg.e ? emphScale : 1);
      ctx.font = `${fs}px Dela`; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
      // 影 → 太いフチ → 中フチ → 塗り
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillText(sg.s, x + 8, 10);
      ctx.lineWidth = fs * 0.26; ctx.strokeStyle = sg.e ? COL.pink : '#000'; ctx.strokeText(sg.s, x, 0);
      ctx.lineWidth = fs * 0.12; ctx.strokeStyle = sg.e ? '#000' : (opt.rim || '#1b1b3a'); ctx.strokeText(sg.s, x, 0);
      ctx.fillStyle = sg.e ? emphCol : (opt.color || '#fff'); ctx.fillText(sg.s, x, 0);
      x += ctx.measureText(sg.s).width;
    }
    ctx.restore();
    y += rowH;
  });
}

// 順位バッジ(シーン冒頭の「第N位」スラム)
function rankSlam(n, lt, color) {
  if (lt < 0 || lt > 1.4) return;
  const k = clamp(lt / 0.25);
  const out = clamp((lt - 1.05) / 0.35);
  const s = lerp(3.2, 1, easeOut(k)) * (1 - 0.3 * easeInOut(out));
  ctx.save();
  ctx.globalAlpha = 1 - out;
  ctx.translate(W / 2, 880); ctx.scale(s, s); ctx.rotate(-0.08);
  // 放射線
  ctx.save(); ctx.rotate(lt * 0.6);
  for (let i = 0; i < 24; i++) { ctx.rotate(Math.PI / 12); ctx.fillStyle = i % 2 ? color + '55' : '#ffffff22';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, -70); ctx.lineTo(900, 70); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.font = '120px Dela'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  ctx.lineWidth = 34; ctx.strokeStyle = '#000'; ctx.strokeText('第', -150, -20);
  ctx.fillStyle = '#fff'; ctx.fillText('第', -150, -20);
  ctx.strokeText('位', 170, -20); ctx.fillText('位', 170, -20);
  ctx.font = '360px Dela';
  ctx.lineWidth = 60; ctx.strokeStyle = '#000'; ctx.strokeText(String(n), 10, 90);
  ctx.lineWidth = 26; ctx.strokeStyle = color; ctx.strokeText(String(n), 10, 90);
  ctx.fillStyle = COL.yellow; ctx.fillText(String(n), 10, 90);
  ctx.restore();
}

// 進捗バー + 順位トラッカー(視聴維持用)
function hud(t, s) {
  const p = t / TL.total;
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(0, 0, W, 14);
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, COL.cyan); g.addColorStop(1, COL.pink);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W * p, 14);
  const ids = ['r5', 'r4', 'r3', 'r2', 'r1'];
  const curIdx = ids.indexOf(s.id);
  const done = s.id === 'outro' ? 5 : curIdx;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 5; i++) {
    const x = 270 + i * 135, y = 150;
    const active = i === curIdx, past = i < done;
    const sc = active ? 1 + 0.08 * Math.sin(t * 8) : 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
    ctx.beginPath(); ctx.arc(0, 0, 50, 0, 6.29);
    ctx.fillStyle = active ? COL.yellow : past ? '#ff3d8b' : 'rgba(0,0,0,.45)'; ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = active ? '#000' : 'rgba(255,255,255,.8)'; ctx.stroke();
    ctx.font = '50px Dela'; ctx.fillStyle = active ? '#000' : '#fff';
    ctx.fillText(i === 4 ? '?' : String(5 - i), 0, 3);
    if (i === 4 && (curIdx === 4 || done === 5)) { ctx.fillStyle = active ? COL.yellow : '#ff3d8b'; ctx.fill(); ctx.fillStyle = active ? '#000' : '#fff'; ctx.fillText('1', 0, 3); }
    ctx.restore();
  }
  ctx.restore();
}

// カウンター
function counter(value, unit, cx, cy, k, size = 210, col = COL.yellow) {
  const v = value * easeOut(k);
  const str = fmt(v);
  ctx.save(); ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const pulse = k >= 1 ? 1 + 0.12 * Math.exp(-(k - 1) * 6) : 1;
  ctx.translate(cx, cy); ctx.scale(pulse, pulse);
  ctx.font = `${size}px Dela`;
  const w = ctx.measureText(str).width;
  ctx.font = `${size * 0.42}px Dela`; const uw = ctx.measureText(unit).width;
  const total = w + uw + 10; let x = -total / 2;
  ctx.textAlign = 'left';
  ctx.font = `${size}px Dela`;
  ctx.lineWidth = size * 0.2; ctx.strokeStyle = '#000'; ctx.strokeText(str, x, 0);
  ctx.lineWidth = size * 0.08; ctx.strokeStyle = COL.pink; ctx.strokeText(str, x, 0);
  ctx.fillStyle = col; ctx.fillText(str, x, 0);
  ctx.font = `${size * 0.42}px Dela`;
  ctx.lineWidth = size * 0.1; ctx.strokeStyle = '#000'; ctx.strokeText(unit, x + w + 10, 0);
  ctx.fillStyle = '#fff'; ctx.fillText(unit, x + w + 10, 0);
  ctx.restore();
}

// ---------- 各シーン ----------
function sceneHook(t, s) {
  const lt = t - s.start;
  bgNight(t); bokeh(t, 0.22);
  const z = 1.25 - 0.2 * easeOut(lt / 5);
  skyline(t, 1720, z);
  // 中央に巨大な「?」
  ctx.save(); ctx.translate(W / 2, 820);
  const k = clamp(lt / 0.35); ctx.scale(backOut(k) * (1 + 0.04 * Math.sin(t * 6)), backOut(k)); ctx.rotate(Math.sin(t * 3) * 0.06);
  ctx.font = '520px Dela'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.9; ctx.lineWidth = 50; ctx.strokeStyle = '#000'; ctx.strokeText('?', 0, 0);
  ctx.lineWidth = 20; ctx.strokeStyle = COL.pink; ctx.strokeText('?', 0, 0);
  ctx.fillStyle = COL.cyan; ctx.fillText('?', 0, 0);
  ctx.restore();
  // 「TOKYO」ネオン
  neon('TOKYO', W / 2, 400, 170, t, lt);
}
function neon(str, x, y, size, t, lt) {
  ctx.save(); ctx.textAlign = 'center'; ctx.font = `${size}px Dela`;
  const flick = lt < 0.6 ? (Math.sin(lt * 90) > 0 ? 1 : 0.3) : 1;
  ctx.shadowColor = COL.pink; ctx.shadowBlur = 40; ctx.globalAlpha = flick;
  ctx.lineWidth = 10; ctx.strokeStyle = COL.pink; ctx.strokeText(str, x, y);
  ctx.shadowBlur = 20; ctx.fillStyle = '#ffe6f2'; ctx.fillText(str, x, y);
  ctx.restore();
}

// 第5位 スカイツリー
function sceneSkytree(t, s) {
  const lt = t - s.start; const L = s.lines;
  bgNight(t, '#06122e', '#2a1c6e'); bokeh(t, 0.15);
  // カメラ: 根元から先端へパン(高さカウントと同期)
  const k = clamp((t - L[1].start - 0.1) / 1.0);
  const pan = easeInOut(k);
  const treeH = 2600;
  ctx.save();
  const zoom = lerp(1.0, 0.62, easeInOut(clamp((t - L[1].start) / 1.6)));
  ctx.translate(W / 2 - 60, 1750 + lerp(0, -0, pan));
  ctx.scale(zoom, zoom);
  ctx.translate(0, lerp(treeH * 0.55, treeH * 0.0, pan) * 0 + (1 - pan) * 900);
  drawSkytree(0, 0, treeH, t);
  ctx.restore();
  // 高さの目盛り
  const hv = 634 * easeOut(k);
  if (t > L[1].start && t < L[2].start) counter(634, 'm', W / 2, 610, k, 230);
  // む・さ・し
  if (t > L[2].start) {
    const k2 = t - L[2].start;
    ctx.fillStyle = `rgba(0,0,10,${0.55 * clamp(k2 / 0.3)})`; ctx.fillRect(0, 0, W, H);
    const digits = ['6', '3', '4'], kana = ['む', 'さ', 'し'];
    for (let i = 0; i < 3; i++) {
      const kk = clamp((k2 - i * 0.18) / 0.35);
      const flip = clamp((k2 - 0.9 - i * 0.2) / 0.3);
      const x = W / 2 + (i - 1) * 300, y = 760;
      ctx.save(); ctx.translate(x, y); ctx.scale(backOut(kk), backOut(kk) * Math.abs(Math.cos(flip * Math.PI)) + 0.001);
      ctx.beginPath(); ctx.arc(0, 0, 130, 0, 6.29);
      ctx.fillStyle = flip < 0.5 ? COL.cyan : COL.yellow; ctx.fill(); ctx.lineWidth = 12; ctx.strokeStyle = '#000'; ctx.stroke();
      ctx.font = flip < 0.5 ? '170px Dela' : '150px Dela'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000';
      ctx.fillText(flip < 0.5 ? digits[i] : kana[i], 0, 8);
      ctx.restore();
    }
    // 武蔵国
    const k3 = clamp((k2 - 1.7) / 0.4);
    if (k3 > 0) { ctx.save(); ctx.globalAlpha = k3; ctx.font = '64px Maru'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.fillText('(東京のあたりの旧国名「武蔵国」)', W / 2, 1000 + (1 - easeOut(k3)) * 30); ctx.restore(); }
  }
}
function drawSkytree(cx, by, h, t) {
  // 足元の三角形断面 → 上に行くほど円形に細くなる鉄骨タワー
  const half = y => lerp(h * 0.042, 18, Math.pow(y / h, 0.75));
  ctx.save();
  const g = ctx.createLinearGradient(-80, 0, 80, 0); g.addColorStop(0, '#cfe3ff'); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, '#8fb4e8');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-half(0), by);
  for (let y = 0; y <= h * 0.93; y += 20) ctx.lineTo(-half(y), by - y);
  ctx.lineTo(-6, by - h); ctx.lineTo(6, by - h);
  for (let y = h * 0.93; y >= 0; y -= 20) ctx.lineTo(half(y), by - y);
  ctx.closePath(); ctx.fill();
  // ラティス
  ctx.strokeStyle = 'rgba(40,70,140,.55)'; ctx.lineWidth = 3;
  for (let y = 0; y < h * 0.9; y += 46) {
    const a = half(y), b = half(y + 46);
    ctx.beginPath(); ctx.moveTo(-a, by - y); ctx.lineTo(b, by - y - 46); ctx.moveTo(a, by - y); ctx.lineTo(-b, by - y - 46); ctx.stroke();
  }
  // 展望デッキ(350m)・回廊(450m)
  const deck = (yy, w, hh) => { ctx.fillStyle = '#1b2b55'; ctx.fillRect(-w / 2, by - yy - hh, w, hh);
    ctx.fillStyle = '#9ff0ff'; for (let x = -w / 2 + 8; x < w / 2 - 8; x += 18) ctx.fillRect(x, by - yy - hh + 10, 10, hh - 22); };
  deck(h * 350 / 634, 190, 80); deck(h * 445 / 634, 130, 50);
  // 先端ライト
  ctx.fillStyle = Math.sin(t * 6) > 0 ? '#ff4d4d' : '#ffb3b3';
  ctx.beginPath(); ctx.arc(0, by - h, 14, 0, 6.29); ctx.fill();
  ctx.restore();
}

// 第4位 渋谷スクランブル交差点(真上から)
const PEOPLE = (() => { const r = rand(77); const cs = ['#ff5a8a', '#ffe14d', '#3df2ff', '#ffffff', '#9b7bff', '#ff9a3d', '#5dff9b'];
  return Array.from({ length: 520 }, () => { const path = Math.floor(r() * 6); return { path, off: r(), sp: 0.12 + r() * 0.1, c: cs[Math.floor(r() * cs.length)], lane: (r() - 0.5) * 120, d: r() < 0.5 ? 1 : -1 }; }); })();
function sceneShibuya(t, s) {
  const lt = t - s.start; const L = s.lines;
  ctx.fillStyle = '#2b2d36'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  const rot = -0.12 + lt * 0.02, z = 1.1 + lt * 0.03;
  ctx.translate(W / 2, 900); ctx.rotate(rot); ctx.scale(z, z);
  // 歩道ブロック
  ctx.fillStyle = '#4a4554';
  for (const [x, y] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) ctx.fillRect(x * 720 - 400, y * 720 - 400, 800, 800);
  // 横断歩道(縦・横・斜め)
  ctx.fillStyle = '#f2f2f2';
  const zebra = (ang, len) => { ctx.save(); ctx.rotate(ang); for (let i = -len; i < len; i += 46) ctx.fillRect(i, -95, 24, 190); ctx.restore(); };
  for (const [x, y, a] of [[0, -400, 0], [0, 400, 0], [-400, 0, Math.PI / 2], [400, 0, Math.PI / 2]]) { ctx.save(); ctx.translate(x, y); zebra(a, 300); ctx.restore(); }
  ctx.save(); ctx.rotate(Math.PI / 4); ctx.fillStyle = 'rgba(242,242,242,.85)'; for (let i = -480; i < 480; i += 46) ctx.fillRect(i, -70, 24, 140); ctx.restore();
  ctx.save(); ctx.rotate(-Math.PI / 4); ctx.fillStyle = 'rgba(242,242,242,.85)'; for (let i = -480; i < 480; i += 46) ctx.fillRect(i, -70, 24, 140); ctx.restore();
  // 人の流れ(青信号で一斉に渡る)
  const go = clamp((t - L[1].start + 0.2) / 0.6);
  const paths = [[[-400, -400], [400, -400]], [[400, 400], [-400, 400]], [[-400, 400], [-400, -400]], [[400, -400], [400, 400]], [[-420, -420], [420, 420]], [[420, -420], [-420, 420]]];
  const crowd = Math.floor(lerp(120, PEOPLE.length, clamp((t - L[2].start) / 1.2)));
  for (let i = 0; i < crowd; i++) {
    const p = PEOPLE[i]; const [a, b] = paths[p.path];
    let u = (p.off + (t - L[0].start) * p.sp * go) % 1; if (p.d < 0) u = 1 - u;
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
    const nx = -dy / len, ny = dx / len;

  ctx.save();
  ctx.translate(W / 2 + Math.sin(t * 97) * shake, H / 2 + Math.cos(t * 83) * shake);
  ctx.scale(1 + punch, 1 + punch);
  ctx.translate(-W / 2, -H / 2);
  DRAW[s.id](t, s);
  // 第5〜2位の順位スラム
  if (RANK[s.id]) rankSlam(RANK[s.id], t - s.start, RCOL[s.id]);
  ctx.restore();

  // シーン切替: ホワイトフラッシュ + 横方向ワイプ
  const d = t - s.start;
  if (s.index > 0 && d < 0.18) { ctx.fillStyle = `rgba(255,255,255,${0.85 * (1 - d / 0.18)})`; ctx.fillRect(0, 0, W, H); }
  const nxt = TL.scenes[s.index + 1];
  if (nxt) { const r = nxt.start - t; if (r < 0.2) { const k = 1 - r / 0.2; ctx.fillStyle = COL.yellow; ctx.fillRect(W * (1 - k), 0, W * k * 0.6, H); ctx.fillStyle = COL.pink; ctx.fillRect(W * (1 - k) + W * k * 0.6, 0, W * k * 0.4, H); } }

  hud(t, s);

  // テロップ(第N位の単発セリフはスラム演出があるので非表示)
  if (line && !/^第\d位$/.test(line.text) && !(s.id === 'r1' && li === 0)) {
    const k = (t - line.start) / 0.35;
    const y = s.id === 'hook' ? 1330 : 1420;
    // 下地の帯
    ctx.save(); ctx.globalAlpha = 0.55 * clamp(k * 2);
    const gg = ctx.createLinearGradient(0, y - 230, 0, y + 230); gg.addColorStop(0, 'rgba(0,0,0,0)'); gg.addColorStop(0.5, 'rgba(0,0,0,.7)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg; ctx.fillRect(0, y - 230, W, 460); ctx.restore();
    telop(line.text, W / 2, y, k, { size: s.id === 'hook' ? 108 : 92 });
  }
  // クレジット(常時、小さく)
  ctx.save(); ctx.font = '28px Maru'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.textAlign = 'left';
  ctx.fillText('VOICEVOX:四国めたん', 36, 236); ctx.restore();
};

// ブラウザ単体で開いた場合のプレビュー再生
if (!window.__CAPTURE__) {
  fetch('output/timeline.json').then(r => r.json()).then(tl => {
    setTimeline(tl);
    document.fonts.ready.then(() => { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % tl.total); requestAnimationFrame(loop); }; loop(); });
  }).catch(() => {});
}
</script>
