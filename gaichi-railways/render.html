<script>
// ------------------------------------------------------------
// 戦前日本の「外地」の鉄道網  (9:16 ショート動画 / 約60秒)
// render(t) は時刻 t[秒] の静止フレームを決定論的に描画する
// 地図: Natural Earth 10m(map_data.js)/ 路線・境界は概略
// ------------------------------------------------------------
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"IPAPGothic","IPAGothic",sans-serif';
const C = {
  sea: '#0b121c', grat: '#16202e',
  land: '#222a36', landEdge: '#323c4b',
  naichi: '#3d4656', gaichi: '#6a5634', gaichiHi: '#8a6d3b',
  ink: '#f3f4f6', ink2: '#b9bfca', ink3: '#7f8795', panel: 'rgba(14,20,30,0.88)',
  std: '#4FC3E8',      // 1435mm 標準軌
  nar: '#F5C451',      // 1067mm 狭軌
  lt: '#F08FB0',       // 762mm 軽便
  ferry: '#e8edf5',
  naichiRail: '#8a93a3',
  accent: '#F5C451', red: '#E8524F',
};
const FPS = 30, DURATION = 60.5;

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, s, d) => clamp((t - s) / d);

function text(str, x, y, { size = 48, weight = 'normal', color = C.ink, align = 'left', base = 'alphabetic', alpha = 1, halo = 0 } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (halo) { ctx.lineWidth = halo; ctx.strokeStyle = 'rgba(8,12,18,0.92)'; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function measure(str, size, weight = 'normal') { ctx.font = `${weight} ${size}px ${FONT}`; return ctx.measureText(str).width; }
function rrect(x, y, w, h, r, color, alpha = 1, stroke = null) {
  if (w <= 0 || h <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  ctx.fillStyle = color; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.restore();
}
function dot(x, y, r, color, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.fillStyle = '#0b121c'; ctx.beginPath(); ctx.arc(x, y, r + 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// ---------- 投影(メルカトル)とカメラ ----------
const RAD = Math.PI / 180;
const merc = lat => Math.log(Math.tan(Math.PI / 4 + lat * RAD / 2));
let cam = { lon: 132, lat: 30, span: 56, cy: 900 };
function P(lon, lat) {
  const s = W / (cam.span * RAD);
  return [W / 2 + (lon - cam.lon) * RAD * s, cam.cy - (merc(lat) - merc(cam.lat)) * s];
}
// 地図要素の bbox を前計算(画面外カリング用)
for (const sh of window.MAP) {
  let a = 1e9, b = -1e9, c = 1e9, d = -1e9;
  for (const [x, y] of sh.r) { a = Math.min(a, x); b = Math.max(b, x); c = Math.min(c, y); d = Math.max(d, y); }
  sh.bb = [a, b, c, d];
}
function visible(bb) {
  const [x0, y1] = P(bb[0], bb[2]), [x1, y0] = P(bb[1], bb[3]);
  return x1 >= -20 && x0 <= W + 20 && y1 >= -20 && y0 <= H + 20;
}
function shapePath(sh) {
  const r = sh.r; let [x, y] = P(r[0][0], r[0][1]);
  ctx.moveTo(x, y);
  for (let i = 1; i < r.length; i++) { [x, y] = P(r[i][0], r[i][1]); ctx.lineTo(x, y); }
  ctx.closePath();
}
// 外地の強調度(シーンごとに変化)
let HL = { korea: 0, taiwan: 0, sakhalin: 0, kwantung: 0, nanyo: 0, naichi: 0 };
let SAKH_NAICHI = 0;   // 樺太が内地に編入される演出(0..1)

function drawMap() {
  ctx.fillStyle = C.sea; ctx.fillRect(0, 0, W, H);
  // 経緯線
  ctx.save(); ctx.strokeStyle = C.grat; ctx.lineWidth = 1.5;
  for (let lon = 90; lon <= 180; lon += 5) { const [x] = P(lon, 0); ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let lat = -10; lat <= 60; lat += 5) { const [, y] = P(cam.lon, lat); ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.restore();

  const gaichiCol = k => lerpColor(C.gaichi, C.gaichiHi, HL[k] || 0);
  for (const sh of window.MAP) {
    if (!visible(sh.bb)) continue;
    let col = C.land;
    if (sh.t === 'naichi') col = C.naichi;
    else if (sh.t === 'korea' || sh.t === 'taiwan' || sh.t === 'nanyo') col = gaichiCol(sh.t);
    ctx.beginPath(); shapePath(sh);
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = C.landEdge; ctx.lineWidth = 1; ctx.stroke();
  }
  // 樺太: 北緯50度以南だけ外地色
  clipFill('sakhalin', [[140, 45], [146, 45], [146, 50], [140, 50]], lerpColor(gaichiCol('sakhalin'), C.naichi, SAKH_NAICHI));
  // 関東州(遼東半島先端、概略): 北の境界を北緯39.4度付近とする
  clipFill('china', [[120.6, 38.4], [123.2, 38.4], [123.2, 39.42], [122.25, 39.5], [121.6, 39.42], [120.6, 39.42]], gaichiCol('kwantung'));
  // 南洋群島の島は小さいので、位置を示すリング
  if (cam.span > 20) for (const [lon, lat] of [[145.7, 15.1], [134.5, 7.4]]) {
    const [x, y] = P(lon, lat);
    ctx.save(); ctx.strokeStyle = gaichiCol('nanyo'); ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
}
function clipFill(tag, poly, color) {
  ctx.save();
  ctx.beginPath();
  for (const sh of window.MAP) if (sh.t === tag && visible(sh.bb)) shapePath(sh);
  ctx.clip();
  ctx.beginPath();
  poly.forEach(([lon, lat], i) => { const [x, y] = P(lon, lat); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}
function lerpColor(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(lerp(v, pb[i], clamp(t))).toString(16).padStart(2, '0')).join('');
}

const GAUGE = {
  std: { color: C.std, w: 6, dash: null },
  nar: { color: C.nar, w: 6, dash: null },
  lt: { color: C.lt, w: 5, dash: [10, 8] },

};

// 折れ線を進捗 p(0..1) まで描く(画面座標の距離で按分)
function strokeRail(r, p, alpha = 1, scale = 1) {
  if (p <= 0 || alpha <= 0) return;
  const g = GAUGE[r.g];
  const pts = r.pts.map(([lon, lat]) => P(lon, lat));
  const lens = [0];
  for (let i = 1; i < pts.length; i++) lens.push(lens[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const target = lens[lens.length - 1] * p;
  const path = () => {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) {
      if (lens[i] <= target) ctx.lineTo(pts[i][0], pts[i][1]);
      else { const f = (target - lens[i - 1]) / (lens[i] - lens[i - 1]); ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); break; }
    }
  };
  ctx.save(); ctx.globalAlpha = alpha; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (r.g !== 'ferry') { // グロー
    ctx.strokeStyle = g.color; ctx.globalAlpha = alpha * 0.22; ctx.lineWidth = (g.w + 10) * scale; path(); ctx.stroke();
    ctx.globalAlpha = alpha;
  }
  ctx.strokeStyle = g.color; ctx.lineWidth = g.w * scale;
  if (g.dash) ctx.setLineDash(g.dash.map(v => v * scale));
  path(); ctx.stroke();
  ctx.restore();
}
// 折れ線上の位置(0..1)の画面座標
function pointOn(pts, p) {
  const lens = [0];
  for (let i = 1; i < pts.length; i++) lens.push(lens[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const target = lens[lens.length - 1] * clamp(p);
  for (let i = 1; i < pts.length; i++) if (lens[i] >= target) {
    const f = (target - lens[i - 1]) / ((lens[i] - lens[i - 1]) || 1);
    return [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)];
  }
  return pts[pts.length - 1];
}

// ---------- 画面部品 ----------
function header(no, title, sub, a) {
  const gr = ctx.createLinearGradient(0, 0, 0, 420);
  gr.addColorStop(0, 'rgba(8,12,18,0.95)'); gr.addColorStop(0.7, 'rgba(8,12,18,0.75)'); gr.addColorStop(1, 'rgba(8,12,18,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, 420);
  const dy = (1 - easeOut(a)) * 20;
  let x = 64;
  if (no) {
    const w = measure(no, 40, 'bold') + 40;
    rrect(64, 196 + dy, w, 80, 18, C.accent, a);
    text(no, 64 + w / 2, 251 + dy, { size: 40, weight: 'bold', color: '#1a1408', align: 'center', alpha: a });
    x = 64 + w + 22;
  }
  text(title, x, 266 + dy, { size: 80, weight: 'bold', alpha: a, halo: 8 });
  if (sub) text(sub, 66, 330 + dy, { size: 36, color: C.ink2, alpha: a, halo: 6 });
}
// 大きな一言 + 補足1行。phases: [{t, main, sub, color}] を時刻で切り替える
function banner(phases, lt, a, y = 1380) {
  const appear = easeOut((lt - phases[0].t) / 0.35) * a;
  if (appear <= 0) return;
  const h = 196;
  const s = 0.94 + 0.06 * appear;
  ctx.save(); ctx.translate(W / 2, y + h / 2); ctx.scale(s, s); ctx.translate(-W / 2, -(y + h / 2));

    const inn = easeOut((lt - p.t) / 0.3);
    const next = phases[i + 1];
    const out = next ? 1 - clamp((lt - next.t) / 0.2) : 1;
    const al = a * inn * out;
    if (al <= 0) return;
    const dy = (1 - inn) * 18;

    if (p.sub) text(p.sub, 90, y + 158 + dy, { size: 34, color: C.ink2, alpha: al });
  });

}
function legend(a, y = 1652) {
  if (a <= 0) return;

function footnote(str, a, y = 1700) { text(str, 64, y, { size: 24, color: C.ink3, alpha: a, halo: 5 }); }
function label(name, lon, lat, a, { size = 34, color = C.ink, dx = 14, dy = 12, align = 'left', weight = 'bold', mark = true, mcol = C.ink } = {}) {

function railLabel(r, a) {

function pulse(lon, lat, t, color, a) {
  const [x, y] = P(lon, lat);

// 走る列車(光る点)。tag があれば点の上に札を出す
function train(lonlats, p, a, color = C.std, tag = null) {

}
function stationLabels(list, lt, t0, a) {
  list.forEach((n, i) => {

// 大陸ルート: 東京→下関→釜山→京城→新義州→安東→奉天→新京→ハルビン
const ROUTE = st('東京', '名古屋', '大阪', '広島', '下関', [130.5, 34.15], [129.7, 34.65], '釜山', '密陽', '大邱', '金泉', '大田', '天安', '水原', '京城',
  '開城', '沙里院', '平壌', '新安州', '定州', '新義州', '安東', '鳳凰城', '草河口', '本渓湖', '蘇家屯', '奉天', '鉄嶺', '開原', '四平街', '公主嶺', '新京', [125.8, 44.5], [126.2, 45.1], 'ハルビン');
// ナレーションの地名に合わせて、ルート上の到達点を時刻で指定する(ROUTE の添字, シーン内秒)
const ROUTE_KEYS = [[0, 0.0], [4, 0.6], [7, 1.3], [14, 2.0], [26, 2.7], [34, 3.6]];
function routeProgress(lt) {
  const n = ROUTE.length - 1;
  if (lt <= ROUTE_KEYS[0][1]) return 0;
  for (let i = 1; i < ROUTE_KEYS.length; i++) {
    const [i0, t0] = ROUTE_KEYS[i - 1], [i1, t1] = ROUTE_KEYS[i];
    if (lt <= t1) return lerp(i0, i1, easeInOut((lt - t0) / (t1 - t0))) / n;
  }
  return 1;
}
// 頂点インデックスの割合 → 折れ線上の点
function routePoint(pts, f) {
  const x = f * (pts.length - 1), i = Math.min(Math.floor(x), pts.length - 2), r = x - i;
  return [lerp(pts[i][0], pts[i + 1][0], r), lerp(pts[i][1], pts[i + 1][1], r)];
}
function sceneSummary(lt, a) {
  header(null, 'まとめ', '外地の鉄道は「大陸への道」', a);
  const f = routeProgress(lt);
  const pts = ROUTE.map(([lon, lat]) => P(lon, lat));
  if (f > 0) {
    ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.globalAlpha = a;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    const x = f * (pts.length - 1);
    for (let i = 1; i <= Math.floor(x); i++) ctx.lineTo(pts[i][0], pts[i][1]);
    const [hx, hy] = routePoint(pts, f); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx, hy, 11, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const names = [['東京', 0.0, { dy: 34 }], ['下関', 0.6, { dy: 34 }], ['釜山', 1.3, { dy: 34 }], ['京城', 2.0, { dx: -12, align: 'right' }], ['奉天', 2.7, { dx: -12, align: 'right' }], ['ハルビン', 3.6, { dx: 16, dy: 10 }]];
  for (const [n, t0, o] of names) label(n, S[n][0], S[n][1], easeOut((lt - t0) / 0.25) * a, { size: 32, ...o });
  // ハルビンから西へ(シベリア鉄道 → ヨーロッパ)
  const pe = seg(lt, 3.8, 0.9);
  if (pe > 0) {
    const [hx, hy] = P(126.63, 45.75);
    const ex = lerp(hx, 70, easeOut(pe));
    ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = C.accent; ctx.lineWidth = 6; ctx.setLineDash([16, 10]);
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ex, hy - 90 * easeOut(pe)); ctx.stroke(); ctx.restore();
    const pt = easeOut((lt - 4.3) / 0.3) * a;
    text('シベリア鉄道で', 70, hy - 160, { size: 32, color: C.ink, alpha: pt, halo: 7 });
    text('ヨーロッパへ', 70, hy - 112, { size: 52, weight: 'bold', color: C.accent, alpha: pt, halo: 8 });
  }
  banner([
    { t: 0.4, main: '台湾・樺太は 1067mm', sub: '内地と同じ狭軌', color: C.nar },
    { t: 1.9, main: '朝鮮・満洲は 1435mm', sub: '大陸と直通できる標準軌', color: C.std },
    { t: 4.6, main: '東京 → ヨーロッパ', sub: '下関・釜山・奉天・ハルビン経由', color: C.accent },
  ], lt, a, 1400);
  legend(easeOut((lt - 0.4) / 0.4) * a, 1672);
}

function sceneCredits(lt, a) {
  ctx.fillStyle = `rgba(8,12,18,${0.85 * a})`; ctx.fillRect(0, 0, W, H);
  text('戦前日本の「外地」の鉄道', W / 2, 820, { size: 60, weight: 'bold', align: 'center', alpha: a });
  const lines = ['ナレーション: VOICEVOX:四国めたん', '地図: Natural Earth', 'BGM: 自作(権利フリー)', '路線・境界は概略です'];
  lines.forEach((s, i) => text(s, W / 2, 940 + i * 60, { size: 34, color: C.ink2, align: 'center', alpha: a }));
}

// ---------- カメラと路線の時刻計算 ----------
function sceneIndex(t) {
  let i = 0;
  while (i + 1 < SCENES.length && t >= SCENES[i + 1].s) i++;
  return i;
}
function camAt(t) {
  const i = sceneIndex(t);
  const sc = SCENES[i], prev = SCENES[Math.max(0, i - 1)];
  const f = easeInOut((t - sc.s) / MOVE);
  const A = prev.cam, B = sc.cam;
  const span = Math.exp(lerp(Math.log(A.span), Math.log(B.span), f));
  // 大きく移動するときは一度引く(ズームアウト→イン)
  const dist = Math.hypot(B.lon - A.lon, B.lat - A.lat);
  const pull = i > 0 && dist > Math.max(A.span, B.span) * 0.35 ? Math.sin(Math.PI * f) * dist * 0.9 : 0;
  return { lon: lerp(A.lon, B.lon, f), lat: lerp(A.lat, B.lat, f), span: span + pull, cy: lerp(A.cy, B.cy, f) };
}
function hlAt(t) {
  const i = sceneIndex(t);
  const sc = SCENES[i], prev = SCENES[Math.max(0, i - 1)];
  const f = easeInOut((t - sc.s) / MOVE);
  const o = {};
  for (const k of ['korea', 'taiwan', 'sakhalin', 'kwantung', 'nanyo']) o[k] = lerp(prev.hl[k] || 0, sc.hl[k] || 0, f);
  return o;
}
function railProgress(r, t) {
  return easeInOut((t - SCENES[r.sc].s - r.t0) / r.dur);
}

function render(t) {
  cam = camAt(t);
  HL = hlAt(t);
  const cur = sceneIndex(t);
  if (cur === 1) overviewHL(t - SCENES[1].s);
  // 1943年: 樺太が外地 → 内地(島の色を内地色へ)
  SAKH_NAICHI = cur === 5 ? seg(t - SCENES[5].s, 4.6, 0.8) : 0;
  drawMap();
  const ws = clamp(Math.sqrt(10 / cam.span), 0.55, 1.15);
  for (const r of RAILS) {
    const p = railProgress(r, t);
    if (p > 0) strokeRail(r, p, 1, ws);
  }
  const sc = SCENES[cur];
  const lt = t - sc.s;
  sc.f(lt, cur === 0 ? clamp(easeOut((sc.d - lt) / XF)) : clamp(sceneAlpha(lt, sc.d + (cur === SCENES.length - 1 ? 10 : 0))));
  rrect(0, H - 10, W, 10, 0, '#2a2f3a', 0.5);
  rrect(0, H - 10, W * clamp(t / DURATION), 10, 0, C.accent, 1);
}
window.render = render;
window.FPS = FPS; window.DURATION = DURATION;
if (!navigator.webdriver) {
  const t0 = performance.now();
  (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })();
}
</script>
