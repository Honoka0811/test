<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Semiconductor Shorts</title>
<style>
  @font-face { font-family: "NotoBlack"; src: url("vendor/fonts/NotoSansJP-Black.otf"); }
  @font-face { font-family: "NotoBold"; src: url("vendor/fonts/NotoSansJP-Bold.otf"); }
  @font-face { font-family: "Dela"; src: url("vendor/fonts/DelaGothicOne-Regular.ttf"); }
  html, body { margin: 0; background: #05070d; }
  canvas { display: block; }
</style>
<script src="output/timeline.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ------------------------------------------------------------------
// 半導体業界ショート(9:16 / 30fps)
// render(t) が時刻 t 秒のフレームを決定論的に描画する。
// シーン尺と字幕タイミングは narrate.py が書き出す output/timeline.js から読む。
// 効果音のタイミングは window.EVENTS として書き出し、mix.py が同じ時刻に音を置く。
// ------------------------------------------------------------------
const W = 1080, H = 1920, FPS = 30;
const TL = window.TIMELINE;
const DURATION = TL.total;
const SC = Object.fromEntries(TL.scenes.map(s => [s.id, s]));
const NOTO = '"NotoBlack", sans-serif', BOLD = '"NotoBold", sans-serif', DELA = '"Dela", "NotoBlack", sans-serif';
const C = {
  bg: '#05070d', bg2: '#0b1222', ink: '#ffffff', ink2: '#c9d3e6', ink3: '#7f8aa3',
  cyan: '#22e3ff', mag: '#ff3d8b', yel: '#ffe14d', red: '#ff2a3d', gold: '#e9c27a', purple: '#a66bff', green: '#3dffa8',
};

const main = document.getElementById('c');
const mctx = main.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H;
const bctx = buf.getContext('2d');
let ctx = bctx;

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, s, d) => clamp((t - s) / d);
const eOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const eIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eExpo = t => { t = clamp(t); return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); };
const eBack = t => { t = clamp(t); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => Math.round(n).toLocaleString('en-US');
// t に応じた「出現」アルファ(s で出て e で消える)
const show = (t, s, e = 1e9, fi = .18, fo = .18) => Math.min(eOut((t - s) / fi), e >= 1e8 ? 1 : eOut((e - t) / fo));

function T(str, x, y, o = {}) {
  const { size = 60, font = NOTO, color = C.ink, align = 'center', base = 'middle', alpha = 1, stroke = 0, sc = '#000',
    glow = 0, gc = null, ls = 0, rot = 0, scale = 1 } = o;
  if (alpha <= 0.002 || scale <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= clamp(alpha); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (scale !== 1) ctx.scale(scale, scale);
  ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = base; ctx.letterSpacing = ls + 'px';
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = sc; ctx.strokeText(str, 0, 0); }
  if (glow) { ctx.shadowColor = gc || color; ctx.shadowBlur = glow; }
  ctx.fillStyle = color; ctx.fillText(str, 0, 0);
  ctx.restore();
}
function tw(str, size, font = NOTO, ls = 0) { ctx.save(); ctx.font = `${size}px ${font}`; ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(str).width; ctx.restore(); return w; }
function rr(x, y, w, h, r, fill, alpha = 1, stroke = null, lw = 4) {
  if (w <= 0 || h <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(alpha); r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  ctx.restore();
}
function ln(x1, y1, x2, y2, color, w = 3, alpha = 1, glow = 0) {
  ctx.save(); ctx.globalAlpha *= clamp(alpha); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function circ(x, y, r, fill, alpha = 1, stroke = null, lw = 4, glow = 0) {
  if (r <= 0 || alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(alpha);
  if (glow) { ctx.shadowColor = fill || stroke; ctx.shadowBlur = glow; }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
  ctx.restore();
}
// 判子風スタンプ
function stamp(str, x, y, age, { color = C.red, size = 96, rot = -0.12, pad = 34 } = {}) {
  if (age < 0) return;
  const p = eBack(age / .22), sc = lerp(2.4, 1, p), a = clamp(age / .08);
  const w = tw(str, size, DELA) + pad * 2, h = size + pad * 1.2;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc); ctx.globalAlpha *= a;
  rr(-w / 2, -h / 2, w, h, 18, 'rgba(0,0,0,0.55)', 1, color, 10);
  T(str, 0, 6, { size, font: DELA, color, glow: 24 });
  ctx.restore();
}
// 角括弧つきラベル
function tag(str, x, y, color, alpha = 1, size = 40) {
  const w = tw(str, size, NOTO) + 44;
  rr(x, y - size / 2 - 14, w, size + 28, 14, color, alpha);
  T(str, x + 22, y + 2, { size, color: '#06080f', align: 'left', alpha });
  return w;
}

// ---------- 背景(回路パターン) ----------
const bgStatic = document.createElement('canvas'); bgStatic.width = W; bgStatic.height = H;
const TRACES = [];
(function buildBg() {
  const g = bgStatic.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, H); grad.addColorStop(0, '#070b16'); grad.addColorStop(.5, '#0a1020'); grad.addColorStop(1, '#04060c');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(80,140,255,0.06)'; g.lineWidth = 2;
  for (let x = 0; x <= W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y <= H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  const r = rng(11);
  for (let k = 0; k < 34; k++) {
    let x = Math.round(r() * 18) * 60, y = Math.round(r() * 32) * 60, dir = Math.floor(r() * 4);
    const pts = [[x, y]]; const n = 6 + Math.floor(r() * 14);
    for (let i = 0; i < n; i++) {
      if (r() < .35) dir = (dir + (r() < .5 ? 1 : 3)) % 4;
      const L = 60 * (1 + Math.floor(r() * 3));
      x += [L, 0, -L, 0][dir]; y += [0, L, 0, -L][dir];
      pts.push([x, y]);
    }
    let len = 0; for (let i = 1; i < pts.length; i++) len += Math.abs(pts[i][0] - pts[i - 1][0]) + Math.abs(pts[i][1] - pts[i - 1][1]);
    TRACES.push({ pts, len, sp: 260 + r() * 380, off: r() * 3000 });
    g.strokeStyle = 'rgba(34,227,255,0.10)'; g.lineWidth = 3; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    pts.forEach(p => g.lineTo(p[0], p[1])); g.stroke();
    g.fillStyle = 'rgba(34,227,255,0.18)';
    [pts[0], pts[pts.length - 1]].forEach(p => { g.beginPath(); g.arc(p[0], p[1], 7, 0, 7); g.fill(); });
  }
})();
function pointOn(tr, d) {
  const p = tr.pts;
  for (let i = 1; i < p.length; i++) {
    const L = Math.abs(p[i][0] - p[i - 1][0]) + Math.abs(p[i][1] - p[i - 1][1]);
    if (d <= L) { const f = d / L; return [lerp(p[i - 1][0], p[i][0], f), lerp(p[i - 1][1], p[i][1], f)]; }
    d -= L;
  }
  return p[p.length - 1];
}
function background(t, tint, tintA = .22) {
  ctx.drawImage(bgStatic, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const tr of TRACES) {
    const d = (t * tr.sp + tr.off) % (tr.len + 400);
    if (d > tr.len) continue;
    const [x, y] = pointOn(tr, d);
    circ(x, y, 5, tint, .75, null, 0, 18);
  }
  ctx.restore();
  const rg = ctx.createRadialGradient(W / 2, 760, 50, W / 2, 760, 900);
  rg.addColorStop(0, tint); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = tintA; ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H); ctx.restore();
}
const vignette = document.createElement('canvas'); vignette.width = W; vignette.height = H;
(function () {
  const g = vignette.getContext('2d'); const rg = g.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0.75)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);
})();

// ---------- ドット地図 ----------
const JAPAN = [
  [[141.0,41.4],[140.0,42.2],[139.8,42.6],[140.5,43.2],[141.4,43.3],[141.6,44.4],[141.9,45.4],[142.6,45.0],[143.6,44.2],[144.8,43.9],[145.5,43.3],[144.5,42.9],[143.3,41.9],[142.0,42.5],[141.2,41.8]],
  [[141.4,41.4],[141.5,40.5],[142.0,39.6],[141.6,38.3],[141.0,37.5],[140.9,36.8],[140.6,35.7],[139.8,35.0],[139.0,34.7],[138.2,34.6],[137.0,34.6],[136.8,34.3],[136.0,33.5],[135.1,34.3],[134.0,34.6],[132.0,33.9],[131.0,34.0],[130.9,34.4],[132.5,35.4],[134.0,35.6],[135.5,35.6],[136.5,36.5],[137.3,37.5],[136.9,37.1],[138.5,37.4],[139.5,38.4],[140.0,39.5],[140.0,40.5],[140.3,41.2]],
  [[132.5,33.0],[133.0,32.7],[134.2,33.3],[134.7,34.2],[133.5,34.3],[132.6,33.9]],
  [[129.8,33.3],[130.4,33.9],[131.0,33.9],[131.8,33.3],[131.6,32.4],[131.1,31.4],[130.6,31.0],[130.2,31.4],[130.2,32.6],[129.6,32.9]],
];
const TAIWAN = [[[121.0,25.3],[121.9,25.0],[121.6,24.0],[121.0,22.6],[120.8,21.9],[120.3,22.5],[120.1,23.0],[120.2,23.8],[120.7,24.6]]];
function projector(lon0, lat0, k, cx, cy) { return ([lo, la]) => [cx + (lo - lon0) * k, cy - (la - lat0) * k * 1.22]; }
function makeDots(polys, proj, step) {
  const c = document.createElement('canvas').getContext('2d');
  const paths = polys.map(poly => { const p = new Path2D(); poly.forEach((pt, i) => { const [x, y] = proj(pt); i ? p.lineTo(x, y) : p.moveTo(x, y); }); p.closePath(); return p; });
  const dots = [];
  for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) {
    if (paths.some(p => c.isPointInPath(p, x, y))) dots.push([x, y]);
  }
  return dots;
}
const PJ = projector(137.6, 38.2, 45, 540, 770);
const JP_DOTS = makeDots(JAPAN, PJ, 13);
const PT = projector(120.95, 23.6, 165, 540, 760);
const TW_DOTS = makeDots(TAIWAN, PT, 14);

// ---------- 砂粒 → チップの粒子 ----------
const NP = 1500;
const PARTS = (() => {
  const r = rng(5), arr = [];
  for (let i = 0; i < NP; i++) {
    const dx = (r() + r() + r() - 1.5) / 1.5 * 380;
    const hmax = 300 * Math.max(0, 1 - Math.pow(dx / 400, 2));
    const hx = 540 + dx, hy = 1140 - Math.pow(r(), .7) * hmax;
    const ang = r() * Math.PI * 2, sp = 300 + r() * 700;
    // チップ上の目標点(外周・格子・ピン)
    const k = i % 5, cx = 540, cy = 800, S = 460;
    let tx, ty;
    if (k === 0) { const u = r() * 4, f = u % 1, side = Math.floor(u); [tx, ty] = [[cx - S / 2 + f * S, cy - S / 2], [cx + S / 2, cy - S / 2 + f * S], [cx + S / 2 - f * S, cy + S / 2], [cx - S / 2, cy + S / 2 - f * S]][side]; }
    else if (k === 1) { const side = Math.floor(r() * 4), pin = Math.floor(r() * 9), f = (pin + 1) / 10, e = 30 + r() * 40; [tx, ty] = [[cx - S / 2 + f * S, cy - S / 2 - e], [cx + S / 2 + e, cy - S / 2 + f * S], [cx - S / 2 + f * S, cy + S / 2 + e], [cx - S / 2 - e, cy - S / 2 + f * S]][side]; }
    else { const g = Math.floor(r() * 7) + 1, f = r(); if (r() < .5) { tx = cx - S / 2 + g * S / 8; ty = cy - S / 2 + f * S; } else { tx = cx - S / 2 + f * S; ty = cy - S / 2 + g * S / 8; } }
    const shade = r();
    arr.push({ hx, hy, bx: hx + Math.cos(ang) * sp, by: hy + Math.sin(ang) * sp * .8 - 200, tx, ty, size: 2 + r() * 3.2, shade, d: r() * .35 });
  }
  return arr;
})();
function sandColor(s) { return `rgb(${Math.round(lerp(170, 245, s))},${Math.round(lerp(125, 205, s))},${Math.round(lerp(70, 140, s))})`; }
function drawHeap(alpha, t, shimmer = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  for (let i = 0; i < NP; i++) {
    const p = PARTS[i];
    ctx.fillStyle = sandColor(clamp(p.shade + .15 * Math.sin(t * 3 + i) * shimmer));
    ctx.fillRect(p.hx, p.hy, p.size, p.size);
  }
  ctx.restore();
}

// ---------- イベント(効果音・カメラ揺れ) ----------
const EVENTS = [];
function ev(t, type, g = 1, extra = {}) { EVENTS.push(Object.assign({ t: +t.toFixed(3), type, g }, extra)); }
// ルーレットの切り替え時刻(CTA)
const ROULETTE = (() => { const sc = SC.cta, a = sc.s + sc.phr[1] + .15, b = sc.s + sc.phr[2] - .05; const out = []; let t = a, dt = .07; while (t < b) { out.push(t); t += dt; dt *= 1.13; } return out; })();
(function buildEvents() {
  const s = id => SC[id].s, P = id => SC[id].phr.map(x => x + SC[id].s);
  TL.scenes.forEach((sc, i) => { if (i > 0) { ev(sc.s - .22, 'whoosh', .8); ev(sc.s, 'hit', .55); } });
  // hook
  ev(0, 'impact', .7); ev(0.05, 'sand', .7, { dur: P('hook')[1] - .05 });
  ev(P('hook')[1] - .45, 'uplift', .8, { dur: .45 }); ev(P('hook')[1], 'impact', 1.2); ev(P('hook')[1] + .02, 'cash', .7);
  ev(P('hook')[2] - .55, 'swoosh', .8); ev(P('hook')[2] + .25, 'shimmer', .9); ev(P('hook')[2] + .25, 'hit', .5);
  // purity
  for (let k = 0; k < 13; k++) ev(P('purity')[1] + k * .16, 'tick', k === 12 ? 1 : .7);
  ev(P('purity')[2], 'stamp', 1);
  // nano
  ev(P('nano')[0], 'impact', .8);
  for (let k = 0; k < 13; k++) ev(P('nano')[1] + .1 + k * .11, 'tick', .55);
  ev(P('nano')[2] - .1, 'swoosh', .7); ev(P('nano')[2] + .9, 'pop', .8);
  // transistor
  ev(P('tr')[0] + .1, 'pop', .6); ev(P('tr')[1], 'roll', .8, { dur: P('tr')[2] - P('tr')[1] - .25 }); ev(P('tr')[2] - .2, 'ding', .9);
  ev(P('tr')[2], 'roll', .5, { dur: 1.0 }); ev(P('tr')[3], 'pop', .7); ev(P('tr')[3] + 1.1, 'ding', .7);
  // TSMC
  ev(P('tsmc')[0] + 1.1, 'pop', .8); ev(P('tsmc')[1], 'whoosh', .7); ev(P('tsmc')[1] + .3, 'shimmer', .6);
  ev(P('tsmc')[2], 'stamp', 1.1); ev(P('tsmc')[3], 'alarm', .9, { dur: P('tsmc')[4] - P('tsmc')[3] + 1.6 });
  for (let k = 0; k < 3; k++) { ev(P('tsmc')[4] + .35 + k * .42, 'impact', .9); ev(P('tsmc')[4] + .35 + k * .42, 'glitch', .8); }
  // ASML
  ev(P('asml')[0] + .2, 'zap', .8); ev(P('asml')[1] + .3, 'stamp', 1);
  ev(P('asml')[2], 'roll', .8, { dur: 1.1 }); ev(P('asml')[2] + 1.15, 'cash', 1); ev(P('asml')[2] + 1.15, 'impact', .8);
  // Japan
  ev(P('japan')[0], 'pop', .8); for (let k = 0; k < 3; k++) ev(P('japan')[1] + .15 + k * .25, 'pop', .6);
  ev(P('japan')[2] + .1, 'roll', .6, { dur: .9 }); ev(P('japan')[2] + 1.05, 'ding', .8);
  ev(P('japan')[3] + .1, 'drop', 1); ev(P('japan')[4] + .1, 'drop', 1);
  // CTA
  ev(P('cta')[0], 'swoosh', .7); ROULETTE.forEach(t => ev(t, 'tick', .5)); ev(P('cta')[2], 'pop', 1);
  ev(DURATION - 1.0, 'sand', .45, { dur: 1.0 });
  EVENTS.sort((a, b) => a.t - b.t);
})();
const SHAKERS = EVENTS.filter(e => ['impact', 'stamp', 'hit', 'drop', 'glitch'].includes(e.type));
const GLITCHES = EVENTS.filter(e => e.type === 'glitch').map(e => e.t).concat(TL.scenes.slice(1).map(s => s.s));

// ---------- シーン ----------
function sceneHook(t, sc) {
  const P = sc.phr;
  background(t, C.gold, .25);
  // 砂山(開始時は静止、少し揺らめく)
  const burst = P[1], conv = P[2] - .5;
  if (t < burst) {
    drawHeap(1, t);
    // 上から砂が流れ落ちる
    ctx.save();
    for (let k = 0; k < 120; k++) {
      const ph = (t * 1.6 + k / 120) % 1, y = 300 + ph * 800, x = 540 + Math.sin(k * 12.9) * 14 * (0.4 + ph);
      ctx.fillStyle = sandColor((k * 37 % 100) / 100); ctx.fillRect(x, y, 3, 3);
    }
    ctx.restore();
    T('SAND', 540, 1225, { size: 46, font: DELA, color: C.gold, alpha: show(t, .1), ls: 14 });
    T('ケイ砂(SiO₂)', 540, 1290, { size: 32, font: BOLD, color: C.ink3, alpha: show(t, .2) });
  } else {
    // 爆発 → チップへ集合
    ctx.save();
    for (let i = 0; i < NP; i++) {
      const p = PARTS[i];
      const b = eExpo((t - burst) / .7);
      let x = lerp(p.hx, p.bx, b), y = lerp(p.hy, p.by, b);
      const c = eIO((t - conv - p.d) / .75);
      x = lerp(x, p.tx, c); y = lerp(y, p.ty, c);
      ctx.fillStyle = c > .98 ? C.cyan : sandColor(p.shade);
      const s = lerp(p.size, 4, c);
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
    }
    ctx.restore();
    const ch = eOut((t - P[2] - .2) / .5);
    if (ch > 0) {
      ctx.save(); ctx.globalAlpha = ch; ctx.shadowColor = C.cyan; ctx.shadowBlur = 60;
      rr(310, 570, 460, 460, 16, 'rgba(34,227,255,0.10)', 1, C.cyan, 6); ctx.restore();
      T('Si', 540, 800, { size: 190, font: DELA, color: C.cyan, alpha: ch, glow: 40 });
      T('SEMICONDUCTOR', 540, 1120, { size: 46, font: DELA, color: C.ink, alpha: ch, ls: 10 });
    }
  }
  // 100兆円 スラム
  const a = t - burst;
  if (a > 0) {
    const up = eIO((t - P[2] + .45) / .5);
    const y = lerp(650, 395, up), s = lerp(1, .52, up) * lerp(2.6, 1, eBack(a / .25));
    T('100兆円', 540, y, { size: 230, font: DELA, color: C.yel, stroke: 18, scale: s, glow: 50, alpha: clamp(a / .06) });
    T('世界の半導体市場(年間)', 540, lerp(800, 500, up), { size: 46, font: NOTO, color: C.ink, stroke: 10, alpha: show(t, burst + .25) * (1 - up) });
  }
  footnote('※2024年 約6,300億ドル(WSTS)。1ドル155円換算で約100兆円', t, burst + .3);
}

function scenePurity(t, sc) {
  const P = sc.phr;
  background(t, C.cyan, .18);
  // インゴット
  const rise = eOut(t / .7), dim = lerp(1, .32, eOut((t - P[1] + .1) / .4));
  const ix = 540, iy = lerp(1500, 560, rise), iw = 300, ih = 620;
  ctx.save(); ctx.globalAlpha = dim;
  const g = ctx.createLinearGradient(ix - iw / 2, 0, ix + iw / 2, 0);
  const sh = (t * .35) % 1;

    T('約' + fmt(v) + '億円〜', 540, 720, { size: ps, font: DELA, color: C.yel, stroke: 16, glow: 40, alpha: aC, scale: done ? lerp(1.12, 1, eOut((t - P[2] - 1.15) / .2)) : 1 });
    T('最新機は500億円超とも', 540, 880, { size: 52, color: C.ink, stroke: 10, alpha: show(t, P[2] + 1.3) });
    // 舞い上がる「¥」
    const r = rng(9);
    for (let k = 0; k < 26; k++) {
      const st = P[2] + 1.15 + r() * .3, age = t - st; if (age < 0) { r(); r(); continue; }
      const x = 540 + (r() - .5) * 900, vy = 600 + r() * 600;
      T('¥', x, 760 - vy * age + 900 * age * age, { size: 60 + k % 3 * 20, font: DELA, color: C.yel, alpha: aC * clamp(1.6 - age), rot: age * (k % 2 ? 3 : -3) });
    }
  }
  chapter('#5 独占装置', t, C.purple);
  footnote('※EUV露光装置を量産しているのは世界でASMLのみ。価格は報道ベースの概数', t, P[1]);
}

function pin(x, y, age, color, label1, label2, cardX, cardY, align) {
  if (age < 0) return;
  const drop = eBack(age / .35), yy = lerp(y - 260, y, drop);
  for (let k = 0; k < 2; k++) { const ph = ((age * .8) + k / 2) % 1; if (age > .3) circ(x, y, 14 + ph * 80, null, 1 - ph, color, 4); }
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 30;
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x, yy); ctx.bezierCurveTo(x - 40, yy - 50, x - 34, yy - 92, x, yy - 92); ctx.bezierCurveTo(x + 34, yy - 92, x + 40, yy - 50, x, yy); ctx.fill();
  ctx.restore(); circ(x, yy - 62, 13, '#fff');
  const ca = eOut((age - .25) / .25);
  if (ca <= 0) return;
  const w = 580, h = 150, cx = align === 'right' ? cardX : cardX - w;
  ln(x, yy - 60, align === 'right' ? cx : cx + w, cardY + h / 2, color, 4, ca);
  rr(cx, cardY, w, h, 22, 'rgba(5,7,13,0.85)', ca, color, 5);
  T(label1, cx + 28, cardY + 52, { size: 50, font: DELA, color, align: 'left', alpha: ca });
  T(label2, cx + 28, cardY + 112, { size: 34, color: C.ink, align: 'left', alpha: ca });
}

function sceneJapan(t, sc) {
  const P = sc.phr;
  background(t, C.red, .18);
  const dimMap = t >= P[1] && t < P[3] ? lerp(1, .18, eOut((t - P[1]) / .3)) : (t >= P[3] ? lerp(.18, 1, eOut((t - P[3]) / .3)) : 1);
  // 地図
  const r = rng(21);
  JP_DOTS.forEach(([x, y]) => {
    const d = r();
    const ap = eBack((t - P[0] - d * .5) / .3);
    if (ap <= 0) return;
    circ(x, y, 4.6 * ap, d < .12 ? C.red : '#f2f4f8', dimMap * (d < .12 ? 1 : .85));
  });
  T('？', 880, 520, { size: 260, font: DELA, color: C.yel, stroke: 16, glow: 40, alpha: show(t, P[0] + .15, P[1], .1, .2), rot: .15 * Math.sin(t * 4), scale: lerp(2, 1, eBack((t - P[0] - .15) / .3)) });
  // B: 材料カード
  const aB = show(t, P[1], P[2], .15, .2);
  if (aB > 0) {
    T('材料で世界トップクラス', 540, 470, { size: 64, color: C.yel, stroke: 12, alpha: aB });
    const cards = [['ウェーハ', 'wafer'], ['レジスト', 'bottle'], ['高純度薬品', 'flask']];
    cards.forEach(([name, kind], i) => {
      const x = 200 + i * 340, y = 780, ap = eBack((t - P[1] - .15 - i * .25) / .3);
      if (ap <= 0) return;
      ctx.save(); ctx.globalAlpha = aB; ctx.translate(x, y); ctx.scale(ap, ap); ctx.translate(-x, -y);
      rr(x - 150, y - 190, 300, 380, 26, 'rgba(255,255,255,0.06)', 1, C.red, 5);
      if (kind === 'wafer') { const g = ctx.createRadialGradient(x - 30, y - 70, 10, x, y - 40, 110); g.addColorStop(0, '#e9f0ff'); g.addColorStop(.5, '#8f8fff'); g.addColorStop(1, '#3a2f6a'); circ(x, y - 40, 100, g); }
      if (kind === 'bottle') { rr(x - 55, y - 120, 110, 160, 20, '#c9772b'); rr(x - 28, y - 150, 56, 36, 6, '#eee'); rr(x - 40, y - 70, 80, 60, 6, '#fff', .85); }
      if (kind === 'flask') { ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.moveTo(x - 22, y - 150); ctx.lineTo(x + 22, y - 150); ctx.lineTo(x + 22, y - 90); ctx.lineTo(x + 80, y + 30); ctx.lineTo(x - 80, y + 30); ctx.lineTo(x - 22, y - 90); ctx.closePath(); ctx.globalAlpha *= .85; ctx.fill(); }
      ctx.restore();
      T(name, x, y + 130, { size: 44, color: C.ink, alpha: aB * clamp(ap) });
    });
  }
  // C: シェアのバー
  const aC = show(t, P[2], P[3], .15, .2);
  if (aC > 0) {
    T('日本企業の世界シェア', 540, 470, { size: 56, color: C.ink2, alpha: aC });
    const bars = [['フォトレジスト', 90, '約9割'], ['シリコンウェーハ', 55, '約5割超']];
    bars.forEach(([name, v, lab], i) => {
      const y = 600 + i * 300, p = eOut((t - P[2] - .1 - i * .2) / .9);
      T(name, 110, y, { size: 52, color: C.ink, align: 'left', alpha: aC });
      rr(110, y + 50, 860, 90, 16, 'rgba(255,255,255,0.08)', aC);
      rr(110, y + 50, 860 * v / 100 * p, 90, 16, i === 0 ? C.red : '#c4495a', aC);
      T(lab, 960, y, { size: 64, font: DELA, color: i === 0 ? C.yel : C.ink, align: 'right', alpha: aC * clamp(p * 2 - 1) });
    });
  }
  // D, E: 拠点ピン
  const [kx, ky] = PJ([130.75, 32.85]), [hx, hy] = PJ([141.65, 42.8]);
  pin(kx, ky, t - P[3] - .1, C.cyan, '熊本', 'TSMC(JASM) 2024年量産', kx + 80, ky - 30, 'right');
  pin(hx, hy, t - P[4] - .1, C.yel, '北海道 千歳', 'Rapidus 2nm・27年量産目標', hx - 40, hy + 80, 'left');
  chapter('#6 日本の強み', t, C.red);
  footnote('※シェアは経済産業省資料などによる概数', t, P[2]);
}

function sceneCTA(t, sc) {
  const P = sc.phr;
  background(t, C.gold, .22);
  // A: 地球(ワイヤーフレーム)と砂の軌道
  const aA = show(t, P[0] - .1, P[1], .2, .25);
  if (aA > 0) {
    const R = 290, cx = 540, cy = 770, rot = t * .6;
    ctx.save(); ctx.globalAlpha = aA; ctx.strokeStyle = C.cyan; ctx.lineWidth = 3; ctx.shadowColor = C.cyan; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
    for (let k = 0; k < 6; k++) { const ph = (k / 6 * Math.PI + rot) % Math.PI; const rx = Math.abs(Math.cos(ph)) * R; ctx.beginPath(); ctx.ellipse(cx, cy, Math.max(rx, 1), R, 0, 0, 7); ctx.stroke(); }
    for (let k = 1; k < 5; k++) { const yy = -R + k * 2 * R / 5, rx = Math.sqrt(R * R - yy * yy); ctx.beginPath(); ctx.ellipse(cx, cy + yy, rx, rx * .18, 0, 0, 7); ctx.stroke(); }
    ctx.restore();
    ctx.save(); ctx.globalAlpha = aA;
    for (let i = 0; i < 400; i++) {
      const p = PARTS[i], a = i / 400 * Math.PI * 2 + t * (1 + p.shade), rr2 = R + 40 + p.shade * 90;
      ctx.fillStyle = sandColor(p.shade); ctx.fillRect(cx + Math.cos(a) * rr2, cy + Math.sin(a) * rr2 * .35 - Math.cos(a) * 40, 4, 4);
    }
    ctx.restore();
    T('砂 → 世界', 540, 440, { size: 90, font: DELA, color: C.gold, stroke: 14, glow: 30, alpha: aA });
  }
  // B: 投票カード
  const aB = show(t, P[1], P[2], .15, .2);
  if (aB > 0) {
    T('次に勝つのは？', 540, 440, { size: 90, font: DELA, color: C.ink, stroke: 14, glow: 30, gc: C.yel, alpha: aB });
    const opts = [['アメリカ', '#3c6cf0'], ['台湾', C.mag], ['日本', C.red], ['韓国', C.cyan], ['中国', '#ffb020']];
    let hi = -1; ROULETTE.forEach((rt, k) => { if (sc.s + t >= rt) hi = k % 5; });
    opts.forEach(([name, col], i) => {
      const y = 540 + i * 135, ap = eOut((t - P[1] - i * .07) / .25), on = i === hi;
      rr(170, y, 740, 112, 24, on ? col : 'rgba(255,255,255,0.06)', aB * ap, col, 5);
      T(String.fromCharCode(65 + i), 230, y + 60, { size: 56, font: DELA, color: on ? '#05070d' : col, alpha: aB * ap });
      T(name, 540, y + 60, { size: 60, color: on ? '#05070d' : C.ink, alpha: aB * ap });
    });
  }
  // C: コメント誘導
  const aC = show(t, P[2], DURATION - SC.cta.s - .9, .15, .4);
  if (aC > 0) {
    const b = 1 + .06 * Math.sin((t - P[2]) * 9) * Math.exp(-(t - P[2]) * 1.2), ap = eBack((t - P[2]) / .3);
    ctx.save(); ctx.globalAlpha = aC; ctx.translate(540, 760); ctx.scale(ap * b, ap * b);
    ctx.shadowColor = C.yel; ctx.shadowBlur = 40; ctx.fillStyle = C.yel;
    ctx.beginPath(); ctx.roundRect(-260, -170, 520, 300, 60); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-90, 120); ctx.lineTo(-170, 230); ctx.lineTo(10, 125); ctx.fill();
    ctx.shadowBlur = 0;
    [-130, 0, 130].forEach((x, k) => circ(x, -20, 34, '#05070d', .5 + .5 * (Math.sin(t * 8 - k) > 0)));
    ctx.restore();
    T('A〜Eで答えてね', 540, 1080, { size: 64, color: C.ink, stroke: 12, alpha: aC * show(t, P[2] + .4) });
    // コメントボタン(画面右)を指す矢印
    const k = (Math.sin(t * 7) + 1) / 2, ax = 900 + k * 25, ay = 1130 + k * 25;
    ctx.save(); ctx.globalAlpha = aC * show(t, P[2] + .6); ctx.strokeStyle = C.yel; ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.shadowColor = C.yel; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(ax - 120, ay - 120); ctx.lineTo(ax, ay); ctx.moveTo(ax, ay); ctx.lineTo(ax - 70, ay - 6); ctx.moveTo(ax, ay); ctx.lineTo(ax - 6, ay - 70); ctx.stroke(); ctx.restore();
  }
  // 最後: 砂山に戻る(冒頭へループ)
  const lp = eIO((t - (sc.d - 1.0)) / .8);
  if (lp > 0) drawHeap(lp, t);
  chapter('', t, C.gold);
}

// ---------- 共通オーバーレイ ----------
let CUR = null;
function chapter(label, t, color) { CUR = { label, t, color }; }
let FOOT = null;
function footnote(str, t, from) { FOOT = { str, a: show(t, from, 1e9, .3) }; }

function overlay(t) {
  // 上部タイトル帯
  const ta = eOut(t / .25);
  ctx.save(); ctx.globalAlpha = ta;
  const g = ctx.createLinearGradient(0, 0, 0, 280); g.addColorStop(0, 'rgba(0,0,0,0.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 280);
  ctx.restore();
  T('【知らないとヤバい】', 540, 108, { size: 44, color: C.yel, stroke: 8, alpha: ta });
  T('半導体のウラ側', 540, 186, { size: 84, font: DELA, color: C.ink, stroke: 12, glow: 24, gc: C.cyan, alpha: ta });
  // 章ごとの進捗
  const chs = TL.scenes.filter(s => !['hook', 'cta'].includes(s.id));
  const x0 = 120, x1 = 960, gap = 10, w = (x1 - x0 - gap * (chs.length - 1)) / chs.length;
  chs.forEach((s, i) => {
    const p = clamp((t - s.s) / s.d), x = x0 + i * (w + gap);
    rr(x, 246, w, 10, 5, 'rgba(255,255,255,0.18)', ta);
    rr(x, 246, w * p, 10, 5, CUR && p > 0 && p < 1 ? CUR.color : C.ink, ta);
  });
  // 章タグ
  if (CUR && CUR.label) {
    const a = eOut(CUR.t / .3), x = lerp(-300, 60, eOut(CUR.t / .35));
    tag(CUR.label, x, 330, CUR.color, a, 42);
  }
  // 字幕
  const subs = TL.subtitles;
  for (let i = 0; i < subs.length; i++) {
    const c = subs[i], next = subs[i + 1];
    const end = Math.min(c.e + .25, next ? next.s : 1e9);
    if (t < c.s - .02 || t >= end) continue;
    caption(c.text, t - c.s, end - t);
  }
  if (FOOT && FOOT.a > 0) T(FOOT.str, 540, 1490, { size: 28, font: BOLD, color: C.ink3, alpha: FOOT.a * .95, stroke: 6 });
}
function parseCaption(str) {
  return str.split('/').map(line => {
    const segs = []; let hl = false, cur = '';
    for (const ch of line) { if (ch === '[' || ch === ']') { if (cur) segs.push([cur, hl]); cur = ''; hl = ch === '['; } else cur += ch; }
    if (cur) segs.push([cur, hl]); return segs;
  });
}
function caption(str, age, left) {
  const lines = parseCaption(str), base = 96, HL = 1.14, maxW = 900, cx = 520;
  const pop = lerp(1.3, 1, eBack(age / .2)), a = Math.min(clamp(age / .07), clamp(left / .1));
  const widths = lines.map(segs => segs.reduce((s, [txt, hl]) => s + tw(txt, base * (hl ? HL : 1), NOTO), 0));
  const fit = Math.min(1, maxW / Math.max(...widths));
  const lh = base * 1.22 * fit, y0 = 1330 - (lines.length - 1) * lh / 2;
  ctx.save(); ctx.translate(cx, 1330); ctx.scale(pop, pop); ctx.translate(-cx, -1330);
  lines.forEach((segs, li) => {
    let x = cx - widths[li] * fit / 2; const y = y0 + li * lh;
    for (const [txt, hl] of segs) {
      const size = base * fit * (hl ? HL : 1);
      T(txt, x, y, { size, color: hl ? C.yel : C.ink, align: 'left', stroke: 18 * fit, alpha: a, glow: hl ? 18 : 0, gc: C.yel });
      x += tw(txt, size, NOTO);
    }
  });
  ctx.restore();
}

// ---------- メイン ----------
const FNS = { hook: sceneHook, purity: scenePurity, nano: sceneNano, tr: sceneTransistor, tsmc: sceneTSMC, asml: sceneASML, japan: sceneJapan, cta: sceneCTA };
function render(t) {
  t = Math.min(t, DURATION - 1e-3);
  ctx = bctx; CUR = null; FOOT = null;
  const sc = TL.scenes.find(s => t >= s.s && t < s.s + s.d) || TL.scenes[TL.scenes.length - 1];
  const lt = t - sc.s;
  bctx.save(); FNS[sc.id](lt, sc); bctx.restore();
  // カメラ: 揺れ + ズームパンチ + ゆっくりズーム
  let sx = 0, sy = 0, zoom = 1 + .025 * clamp(lt / sc.d);
  for (const e of SHAKERS) {
    const d = t - e.t; if (d < 0 || d > .6) continue;
    const k = e.g * Math.exp(-d * 10);
    sx += Math.sin(d * 90 + e.t * 7) * 26 * k; sy += Math.cos(d * 77 + e.t * 3) * 22 * k; zoom += .05 * k;
  }
  const entry = 1 - eOut(lt / .25); zoom += .1 * entry;
  ctx = mctx;
  mctx.fillStyle = C.bg; mctx.fillRect(0, 0, W, H);
  mctx.save(); mctx.translate(W / 2 + sx, H / 2 + sy); mctx.scale(zoom, zoom); mctx.translate(-W / 2, -H / 2);
  mctx.drawImage(buf, 0, 0); mctx.restore();
  // グリッチ(横方向のずれ)
  let gl = 0; for (const g of GLITCHES) { const d = t - g; if (d >= -.03 && d < .16) gl = Math.max(gl, 1 - d / .16); }
  if (gl > 0) {
    const r = rng(Math.floor(t * FPS) + 1);
    for (let k = 0; k < 9; k++) {
      const y = r() * H, h = 20 + r() * 140, off = (r() - .5) * 120 * gl;
      mctx.drawImage(main, 0, y, W, h, off, y, W, h);
      mctx.save(); mctx.globalAlpha = .25 * gl; mctx.fillStyle = r() < .5 ? C.cyan : C.mag; mctx.fillRect(0, y, W, 4 + r() * 8); mctx.restore();
    }
  }
  mctx.drawImage(vignette, 0, 0);
  overlay(t);
  // フラッシュ
  let fl = 0;
  for (const e of EVENTS) { if (!['impact', 'stamp'].includes(e.type) || e.g < .75) continue; const d = t - e.t; if (d >= 0 && d < .18) fl = Math.max(fl, .55 * (1 - d / .18)); }
  for (const s of TL.scenes.slice(1)) { const d = t - s.s; if (d >= 0 && d < .12) fl = Math.max(fl, .35 * (1 - d / .12)); }
  if (fl > 0) { mctx.save(); mctx.globalAlpha = fl; mctx.fillStyle = '#fff'; mctx.fillRect(0, 0, W, H); mctx.restore(); }
}
window.render = render; window.FPS = FPS; window.DURATION = DURATION; window.EVENTS = EVENTS;
if (!navigator.webdriver) {
  document.fonts.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
}
