<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Dog vs Cat</title>
<style>
  html,body{margin:0;background:#111;}
  canvas{display:block;max-height:100vh;margin:0 auto;}
</style>
<script src="output/timeline.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ------------------------------------------------------------
// 犬派 VS 猫派 対決!  (9:16 ショート動画)
// render(t) は時刻 t[秒] のフレームを決定論的に描画する。
// シーン尺・字幕は narrate.py が書き出す output/timeline.js に従う。
// ------------------------------------------------------------
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"IPAPGothic","IPAGothic",sans-serif';
const TL = window.TIMELINE;
const FPS = 30, DURATION = TL.total;
window.FPS = FPS; window.DURATION = DURATION;

const C = {
  inu: '#FF8A2B', inuDeep: '#D9621A', inuBg1: '#FFF0C9', inuBg2: '#FFC27E',
  neko: '#9B5DE5', nekoDeep: '#6E35B8', nekoBg1: '#FCE1F1', nekoBg2: '#C79BF2',
  gold: '#FFD23F', ink: '#FFFFFF', dark: '#2A1E3A', red: '#FF3B5C', pink: '#FF8FB1',
};

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, s, d) => clamp((t - s) / d);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const backOut = t => { t = clamp(t); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function txt(s, x, y, { size = 60, color = C.ink, align = 'center', base = 'middle', alpha = 1,
  outline = null, ow = 0, bold = true, rot = 0, scale = 1, shadow = false } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = base; ctx.lineJoin = 'round';
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowOffsetY = size * 0.08; ctx.shadowBlur = size * 0.1; }
  if (outline) { ctx.strokeStyle = outline; ctx.lineWidth = ow || size * 0.22; ctx.strokeText(s, 0, 0); }
  ctx.shadowColor = 'transparent';
  if (bold) { ctx.strokeStyle = color; ctx.lineWidth = size * 0.06; ctx.strokeText(s, 0, 0); }
  ctx.fillStyle = color; ctx.fillText(s, 0, 0);
  ctx.restore();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- タイムライン参照 ----------
function sceneAt(t) { let s = TL.scenes[0]; for (const sc of TL.scenes) if (t >= sc.start) s = sc; return s; }
function scoreAt(t) {
  let a = 0, b = 0;
  for (const sc of TL.scenes) if (sc.id === 'round' && t >= sc.lines[2].t0) sc.win === 'inu' ? a++ : b++;
  return { a, b };
}
function lastWinT(t) { let w = -99; for (const sc of TL.scenes) if (sc.id === 'round' && t >= sc.lines[2].t0) w = sc.lines[2].t0; return w; }

// ---------- 小物 ----------
function paw(x, y, s, col, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, 10, 26, 22, 0, 0, 7); ctx.fill();
  for (const [dx, dy] of [[-30, -18], [-11, -34], [11, -34], [30, -18]]) { ctx.beginPath(); ctx.ellipse(dx, dy, 10, 13, dx * 0.01, 0, 7); ctx.fill(); }
  ctx.restore();
}
function bone(x, y, s, col, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.fillStyle = col;
  ctx.fillRect(-40, -11, 80, 22);
  for (const [dx, dy] of [[-42, -12], [-42, 12], [42, -12], [42, 12]]) { ctx.beginPath(); ctx.arc(dx, dy, 15, 0, 7); ctx.fill(); }
  ctx.restore();
}
function fish(x, y, s, col, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, 0, 44, 22, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(36, 0); ctx.lineTo(70, -22); ctx.lineTo(70, 22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(-24, -5, 5, 0, 7); ctx.fill();
  ctx.restore();
}
function heart(x, y, s, col, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(0, 30); ctx.bezierCurveTo(-60, -10, -40, -60, 0, -30); ctx.bezierCurveTo(40, -60, 60, -10, 0, 30); ctx.fill(); ctx.restore();
}
function crown(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = C.gold; ctx.strokeStyle = '#C99700'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-60, 30); ctx.lineTo(-70, -35); ctx.lineTo(-35, -5); ctx.lineTo(0, -50); ctx.lineTo(35, -5); ctx.lineTo(70, -35); ctx.lineTo(60, 30); ctx.closePath();
  ctx.fill(); ctx.stroke();
  for (const [dx, col] of [[-35, C.red], [0, '#4FC3F7'], [35, C.red]]) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(dx, 12, 8, 0, 7); ctx.fill(); }
  ctx.restore();
}

// ---------- 背景: 斜めに分割(左=犬 / 右=猫) ----------
function background(t) {
  const sc = scoreAt(t), wt = lastWinT(t), cur = sceneAt(t);
  const target = (sc.a - sc.b) * 70;
  let off = target;
  if (cur.id === 'round' && t - wt < 0.6) {
    const prev = target - (cur.win === 'inu' ? 1 : -1) * 70;
    off = lerp(prev, target, backOut(seg(t, wt, 0.6)));
  }
  const sway = Math.sin(t * 1.3) * 10;
  const xTop = 650 + off + sway, xBot = 430 + off + sway;

  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.inuBg1); g.addColorStop(1, C.inuBg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 犬側: 骨と足あと(ゆっくり上へ流れる)
  for (let i = 0; i < 14; i++) {
    const x = hash(i) * 700, y = (hash(i + 20) * (H + 200) - t * (30 + hash(i + 5) * 30)) % (H + 200);
    const yy = y < -100 ? y + H + 200 : y;
    (i % 3 ? paw : bone)(x, yy, 0.9 + hash(i + 7) * 0.6, 'rgba(217,98,26,0.16)', hash(i + 3) * 6);
  }

  ctx.save();
  ctx.beginPath(); ctx.moveTo(xTop, 0); ctx.lineTo(W, 0); ctx.lineTo(W, H); ctx.lineTo(xBot, H); ctx.closePath(); ctx.clip();
  g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.nekoBg1); g.addColorStop(1, C.nekoBg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 14; i++) {
    const x = 380 + hash(i + 40) * 700, y = (hash(i + 60) * (H + 200) + t * (30 + hash(i + 45) * 30)) % (H + 200) - 100;
    (i % 3 ? paw : fish)(x, y, 0.9 + hash(i + 47) * 0.6, 'rgba(110,53,184,0.15)', hash(i + 43) * 6);
  }
  ctx.restore();

  // 境界線
  ctx.save();
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 14; ctx.shadowColor = C.gold; ctx.shadowBlur = 30;
  ctx.beginPath();
  const N = 12;
  for (let i = 0; i <= N; i++) {
    const p = i / N, x = lerp(xTop, xBot, p) + (i % 2 ? 1 : -1) * (i > 0 && i < N ? 16 : 0), y = p * H;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke(); ctx.restore();
}

// ---------- キャラクター ----------
function eyes(R, mood, ey, big = 1) {
  ctx.lineCap = 'round'; ctx.strokeStyle = C.dark; ctx.fillStyle = C.dark; ctx.lineWidth = R * 0.07;
  const ex = R * 0.34;
  for (const sx of [-1, 1]) {
    ctx.beginPath();
    if (mood === 'happy') { ctx.arc(sx * ex, ey + R * 0.06, R * 0.12, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    else if (mood === 'sad') { ctx.moveTo(sx * ex - R * 0.12, ey - R * 0.02 * sx); ctx.lineTo(sx * ex + R * 0.12, ey + R * 0.02 * sx + R * 0.03); ctx.stroke(); }
    else {
      ctx.ellipse(sx * ex, ey, R * 0.085 * big, R * 0.12 * big, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sx * ex + R * 0.03, ey - R * 0.05, R * 0.035 * big, 0, 7); ctx.fill(); ctx.fillStyle = C.dark;
    }
  }
  ctx.fillStyle = 'rgba(255,90,120,0.4)';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * R * 0.6, R * 0.2, R * 0.13, R * 0.08, 0, 0, 7); ctx.fill(); }
}
function sweat(R) {
  ctx.fillStyle = '#7EC8FF'; ctx.beginPath(); ctx.moveTo(R * 0.72, -R * 0.5); ctx.quadraticCurveTo(R * 0.88, -R * 0.22, R * 0.72, -R * 0.17); ctx.quadraticCurveTo(R * 0.56, -R * 0.22, R * 0.72, -R * 0.5); ctx.fill();
}
function dog(x, y, R, t, mood = 'normal', grey = false) {
  ctx.save(); ctx.translate(x, y);
  if (grey) ctx.filter = 'grayscale(0.85) brightness(0.85)';
  const flap = Math.sin(t * (mood === 'happy' ? 14 : 3)) * (mood === 'happy' ? 0.18 : 0.06) + (mood === 'sad' ? 0.25 : 0);
  // たれ耳
  ctx.fillStyle = '#9C5A2A';
  for (const sx of [-1, 1]) {
    ctx.save(); ctx.translate(sx * R * 0.78, -R * 0.45); ctx.rotate(sx * (0.35 + flap));
    ctx.beginPath(); ctx.ellipse(0, R * 0.42, R * 0.3, R * 0.58, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  const g = ctx.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.1, 0, 0, R);
  g.addColorStop(0, '#FBD49A'); g.addColorStop(1, '#E39A4B');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  ctx.lineWidth = R * 0.05; ctx.strokeStyle = '#B86B2A'; ctx.stroke();
  // 口まわり
  ctx.fillStyle = '#FFF4E2'; ctx.beginPath(); ctx.ellipse(0, R * 0.38, R * 0.46, R * 0.34, 0, 0, 7); ctx.fill();
  eyes(R, mood, -R * 0.12);
  ctx.fillStyle = C.dark; ctx.beginPath(); ctx.ellipse(0, R * 0.2, R * 0.14, R * 0.1, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = C.dark; ctx.lineWidth = R * 0.045; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, R * 0.28); ctx.lineTo(0, R * 0.38); ctx.stroke();
  if (mood === 'happy') {
    ctx.fillStyle = '#C2304A'; ctx.beginPath(); ctx.moveTo(-R * 0.2, R * 0.4); ctx.quadraticCurveTo(0, R * 0.72, R * 0.2, R * 0.4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.pink; ctx.beginPath(); ctx.ellipse(0, R * 0.58, R * 0.1, R * 0.1, 0, 0, 7); ctx.fill();
  } else if (mood === 'sad') {
    ctx.beginPath(); ctx.arc(0, R * 0.55, R * 0.14, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); sweat(R);
  } else {
    ctx.beginPath(); ctx.arc(-R * 0.1, R * 0.38, R * 0.1, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(R * 0.1, R * 0.38, R * 0.1, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}
function cat(x, y, R, t, mood = 'normal', grey = false) {
  ctx.save(); ctx.translate(x, y);
  if (grey) ctx.filter = 'grayscale(0.85) brightness(0.8)';
  const tw = mood === 'sad' ? 0.35 : Math.sin(t * 2.3) * 0.05;
  // 三角耳
  for (const sx of [-1, 1]) {
    ctx.save(); ctx.translate(sx * R * 0.58, -R * 0.62); ctx.rotate(sx * (0.15 + tw));
    ctx.fillStyle = '#8E98AD'; ctx.beginPath(); ctx.moveTo(-R * 0.3, R * 0.15); ctx.lineTo(0, -R * 0.55); ctx.lineTo(R * 0.3, R * 0.15); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.pink; ctx.beginPath(); ctx.moveTo(-R * 0.16, R * 0.08); ctx.lineTo(0, -R * 0.35); ctx.lineTo(R * 0.16, R * 0.08); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  const g = ctx.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.1, 0, 0, R);
  g.addColorStop(0, '#E8ECF3'); g.addColorStop(1, '#A3ADC2');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, R * 1.05, R * 0.95, 0, 0, 7); ctx.fill();
  ctx.lineWidth = R * 0.05; ctx.strokeStyle = '#7A8399'; ctx.stroke();
  // しま模様
  ctx.strokeStyle = '#7A8399'; ctx.lineWidth = R * 0.06; ctx.lineCap = 'round';
  for (const dx of [-0.18, 0, 0.18]) { ctx.beginPath(); ctx.moveTo(dx * R, -R * 0.88); ctx.lineTo(dx * R * 0.8, -R * 0.6); ctx.stroke(); }
  eyes(R, mood, -R * 0.08, 1.2);
  // 鼻と ω 口
  ctx.fillStyle = C.pink; ctx.beginPath(); ctx.moveTo(-R * 0.08, R * 0.14); ctx.lineTo(R * 0.08, R * 0.14); ctx.lineTo(0, R * 0.24); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = C.dark; ctx.lineWidth = R * 0.045;
  if (mood === 'sad') { ctx.beginPath(); ctx.arc(0, R * 0.45, R * 0.12, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); sweat(R); }
  else {
    const o = mood === 'happy' ? 0.13 : 0.1;
    ctx.beginPath(); ctx.arc(-R * o, R * 0.26, R * o, 0, Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(R * o, R * 0.26, R * o, 0, Math.PI); ctx.stroke();
  }
  // ひげ
  ctx.lineWidth = R * 0.025; ctx.strokeStyle = '#5B6378';
  for (const sx of [-1, 1]) for (const dy of [-0.06, 0.06, 0.18]) {
    ctx.beginPath(); ctx.moveTo(sx * R * 0.48, R * (0.18 + dy * 0.5)); ctx.lineTo(sx * R * 1.08, R * (0.12 + dy * 1.4)); ctx.stroke();
  }
  ctx.restore();
}

// ---------- 共通パーツ ----------
function scoreboard(t, y, big = 1) {
  const s = scoreAt(t), wt = lastWinT(t), cur = sceneAt(t);
  const pop = t - wt < 0.5 ? 1 + 0.35 * Math.sin(seg(t, wt, 0.5) * Math.PI) : 1;
  ctx.save(); ctx.translate(540, y); ctx.scale(big, big);
  ctx.fillStyle = 'rgba(42,30,58,0.88)'; rrect(-330, -62, 660, 124, 62); ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = C.gold; ctx.stroke();
  ctx.fillStyle = C.inu; rrect(-322, -54, 220, 108, 54); ctx.fill();
  ctx.fillStyle = C.neko; rrect(102, -54, 220, 108, 54); ctx.fill();
  txt('犬派', -212, 2, { size: 50 });
  txt('猫派', 212, 2, { size: 50 });
  txt(String(s.a), -48, 4, { size: 76, color: C.gold, scale: cur.win === 'inu' ? pop : 1 });
  txt('-', 0, 0, { size: 60 });
  txt(String(s.b), 48, 4, { size: 76, color: C.gold, scale: cur.win === 'neko' ? pop : 1 });
  ctx.restore();
}
function subtitle(t) {
  const sc = sceneAt(t);
  const ln = sc.lines.find(l => t >= l.t0 - 0.05 && t < l.t1 + 0.25);
  if (!ln) return;
  const a = Math.min(seg(t, ln.t0 - 0.05, 0.12), 1 - seg(t, ln.t1 + 0.1, 0.15));
  const size = 56, maxW = 940;
  ctx.font = `${size}px ${FONT}`;
  let lines = [ln.sub];
  if (ctx.measureText(ln.sub).width > maxW) {
    const s = ln.sub, mid = s.length / 2;
    let best = -1;
    for (let i = 1; i < s.length - 1; i++) if ('、。!'.includes(s[i]) && (best < 0 || Math.abs(i + 1 - mid) < Math.abs(best - mid))) best = i + 1;
    if (best < 0 || ctx.measureText(s.slice(0, best)).width > maxW || ctx.measureText(s.slice(best)).width > maxW) best = Math.ceil(mid);
    lines = [s.slice(0, best), s.slice(best)];
  }
  const y0 = 1470 - (lines.length - 1) * 38;
  lines.forEach((l, i) => txt(l, 540, y0 + i * 76, { size, color: '#FFFFFF', outline: C.dark, ow: 16, alpha: a }));
}
function confetti(t, t0, cx, cy, n = 60, seed = 0) {
  const p = t - t0; if (p < 0 || p > 2.2) return;
  const cols = [C.gold, C.red, '#4ADE80', '#60A5FA', '#FFFFFF', C.inu, C.neko];
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (hash(i + seed) - 0.5) * 2.4, sp = 700 + hash(i + 50 + seed) * 900;
    const x = cx + Math.cos(ang) * sp * p, y = cy + Math.sin(ang) * sp * p + 900 * p * p;
    ctx.save(); ctx.globalAlpha = clamp(1.6 - p * 0.8); ctx.translate(x, y); ctx.rotate(p * 8 + i);
    ctx.fillStyle = cols[i % cols.length]; ctx.fillRect(-9, -5, 18, 10); ctx.restore();
  }
}
function stamp(s, x, y, t, t0, { color = C.red, size = 150, rot = -0.18 } = {}) {
  const p = seg(t, t0, 0.28); if (p <= 0) return;
  const sc = lerp(2.4, 1, easeOut(p));
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc); ctx.globalAlpha = clamp(p * 2);
  ctx.font = `${size}px ${FONT}`;
  const w = ctx.measureText(s).width + size * 0.6;
  ctx.fillStyle = color; rrect(-w / 2, -size * 0.68, w, size * 1.3, size * 0.25); ctx.fill();
  ctx.lineWidth = 10; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
  ctx.restore();
  txt(s, x, y, { size, color: '#FFFFFF', rot, scale: sc, alpha: clamp(p * 2) });
}
function speechCard(lines, x, y, t, t0, col) {
  if (seg(t, t0, 0.35) <= 0) return;
  const p = backOut(seg(t, t0, 0.35));
  ctx.save(); ctx.translate(x, y); ctx.scale(p, p);
  ctx.fillStyle = '#FFFFFF'; ctx.shadowColor = 'rgba(0,0,0,0.2)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
  rrect(-235, -90, 470, 180, 40); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.moveTo(-30, -88); ctx.lineTo(0, -130); ctx.lineTo(30, -88); ctx.fill();
  ctx.lineWidth = 8; ctx.strokeStyle = col; rrect(-235, -90, 470, 180, 40); ctx.stroke();
  lines.forEach((l, i) => txt(l, 0, -36 + i * 74, { size: 52, color: C.dark }));
  ctx.restore();
}
function banner(label, t, t0, color = C.dark, textCol = C.gold) {
  const pb = easeOut(seg(t, t0, 0.35)), x = lerp(1400, 540, pb);
  ctx.save(); ctx.translate(x, 410); ctx.rotate(-0.05);
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(-430, -58); ctx.lineTo(450, -58); ctx.lineTo(430, 58); ctx.lineTo(-450, 58); ctx.closePath(); ctx.fill();
  ctx.restore();
  txt(label, x, 412, { size: 84, color: textCol, rot: -0.05 });
}
function flash(t, t0) { const a = 1 - seg(t, t0, 0.25); if (a > 0 && t >= t0) { ctx.fillStyle = `rgba(255,255,255,${a * 0.8})`; ctx.fillRect(0, 0, W, H); } }
const bob = (t, k = 0) => Math.sin(t * 3 + k) * 14;

// ---------- シーン ----------
function sceneTitle(t, sc) {
  const lt = t - sc.start;
  const pa = easeOut(seg(lt, 0, 0.5)), pv = backOut(seg(lt, 0.35, 0.45));
  txt('どっちが上!?', 540, 300, { size: 88, color: C.gold, outline: C.dark, ow: 20, scale: backOut(seg(lt, 0.15, 0.4)), rot: -0.04 });
  const happy = t >= sc.lines[1].t0;
  dog(lerp(-300, 290, pa), 570 + bob(t), 150, t, happy ? 'happy' : 'normal');
  txt('犬派', lerp(-300, 290, pa), 805, { size: 120, color: C.inu, outline: '#FFFFFF', ow: 26, shadow: true });
  cat(lerp(1380, 790, pa), 1110 + bob(t, 2), 140, t, happy ? 'happy' : 'normal');
  txt('猫派', lerp(1380, 790, pa), 1345, { size: 120, color: '#FFFFFF', outline: C.neko, ow: 26, shadow: true });
  const shake = lt > 0.35 && lt < 0.8 ? Math.sin(lt * 90) * 10 * (1 - seg(lt, 0.35, 0.45)) : 0;
  ctx.save(); ctx.translate(520 + shake, 960); ctx.rotate(-0.12);
  txt('VS', 0, 0, { size: 230, color: C.red, outline: '#FFFFFF', ow: 34, scale: lerp(3, 1, pv), alpha: clamp(pv * 3), shadow: true });
  ctx.restore();
}
function sceneIntro(t, sc) {
  const [l1, l2] = sc.lines;
  txt('選手入場', 540, 300, { size: 84, color: '#FFFFFF', outline: C.dark, ow: 20, scale: backOut(seg(t, sc.start, 0.4)) });
  const pa = easeOut(seg(t, l1.t0 - 0.1, 0.45));
  ctx.save(); ctx.globalAlpha = pa; ctx.translate(lerp(-400, 0, pa), 0);
  txt('赤コーナー', 270, 470, { size: 50, color: '#FFFFFF', outline: C.inuDeep, ow: 16 });
  dog(270, 730 + bob(t), 140, t, 'happy');
  txt('犬派', 270, 965, { size: 110, color: C.inu, outline: '#FFFFFF', ow: 24, shadow: true });
  txt('しっぽフリフリ', 270, 1085, { size: 50, color: C.dark, outline: '#FFFFFF', ow: 14 });
  ctx.restore();
  const pb = easeOut(seg(t, l2.t0 - 0.1, 0.45));
  ctx.save(); ctx.globalAlpha = pb; ctx.translate(lerp(400, 0, pb), 0);
  txt('青コーナー', 810, 470, { size: 50, color: '#FFFFFF', outline: C.nekoDeep, ow: 16 });
  cat(810, 740 + bob(t, 2), 135, t);
  txt('猫派', 810, 965, { size: 110, color: '#FFFFFF', outline: C.neko, ow: 24, shadow: true });
  txt('気まぐれクール', 810, 1085, { size: 50, color: '#FFFFFF', outline: C.nekoDeep, ow: 14 });
  ctx.restore();
}
function sceneRound(t, sc) {
  const lt = t - sc.start, [l1, l2, l3] = sc.lines;
  const decided = t >= l3.t0, dw = sc.win === 'inu';
  scoreboard(t, 250);
  banner(sc.round === 4 ? 'FINAL ROUND' : `ROUND ${sc.round}`, t, sc.start);
  txt(sc.topic, 540, 545, { size: sc.topic.length > 5 ? 96 : 108, color: '#FFFFFF', outline: C.dark, ow: 26, shadow: true, scale: backOut(seg(lt, 0.25, 0.4)), alpha: clamp(seg(lt, 0.25, 0.1)) });
  const jump = decided ? Math.abs(Math.sin((t - l3.t0) * 7)) * -40 * Math.exp(-(t - l3.t0) * 1.2) : 0;
  const dm = decided ? (dw ? 'happy' : 'sad') : 'normal', cm = decided ? (dw ? 'sad' : 'happy') : 'normal';
  const ent = easeOut(seg(lt, 0.1, 0.5));
  dog(lerp(-250, 270, ent), 880 + bob(t) + (dw ? jump : 0), 135 * (decided && dw ? 1.12 : 1), t, dm, decided && !dw);
  cat(lerp(1330, 810, ent), 890 + bob(t, 2) + (!dw ? jump : 0), 130 * (decided && !dw ? 1.12 : 1), t, cm, decided && dw);
  speechCard(sc.inu, 270, 1180, t, l2.t0, C.inu);
  speechCard(sc.neko, 810, 1180, t, l2.t0 + 0.25, C.neko);
  if (decided) {
    const wx = dw ? 270 : 810;
    confetti(t, l3.t0, wx, 860);
    stamp('WIN!', wx, 735, t, l3.t0, { color: C.red, size: 96, rot: dw ? -0.16 : 0.16 });
  }
}
function sceneSudden(t, sc) {
  const lt = t - sc.start, [l1, l2, l3] = sc.lines;
  scoreboard(t, 250);
  const pulse = 0.5 + 0.5 * Math.sin(t * 10);
  banner('SUDDEN DEATH', t, sc.start, C.red, '#FFFFFF');
  if (t >= l2.t0) txt('かわいさ', 540, 545, { size: 120, color: C.pink, outline: '#FFFFFF', ow: 26, shadow: true, scale: backOut(seg(t, l2.t0, 0.4)) });
  // 両者がにらみ合い → 判定後はどちらも笑顔
  const judged = t >= l3.t0, crowned = t >= l3.t1 + 0.3;
  const mood = judged ? 'happy' : 'normal';
  // かわいさ判定中: ハートがふわふわ
  if (t >= l2.t0) for (let i = 0; i < 10; i++) {
    const p = ((t - l2.t0) * 0.5 + hash(i)) % 1;
    heart(100 + hash(i + 3) * 880, 1250 - p * 750, 0.5 + hash(i + 8) * 0.5, i % 2 ? C.pink : C.red, Math.sin(p * Math.PI) * 0.8);
  }
  const ent = easeOut(seg(lt, 0.1, 0.5));
  const hop = judged ? Math.abs(Math.sin(t * 5)) * -30 : bob(t);
  const lean = judged ? 0 : Math.sin(t * 6) * 8;
  dog(lerp(-250, 290 + lean, ent), 900 + hop, 140, t, mood);
  cat(lerp(1330, 790 - lean, ent), 905 + (judged ? Math.abs(Math.sin(t * 5 + 1)) * -30 : bob(t, 2)), 132, t, mood);
  if (!judged && lt > 0.5) { // 火花
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2 + t * 4, r = 30 + pulse * 30;
      ctx.save(); ctx.translate(540 + Math.cos(a) * r, 880 + Math.sin(a) * r); ctx.rotate(a);
      ctx.fillStyle = i % 2 ? C.gold : '#FFFFFF'; ctx.fillRect(-18, -4, 36, 8); ctx.restore();
    }
  }
  if (judged && !crowned) stamp('判定不能!', 540, 1190, t, l3.t0, { color: C.dark, size: 100, rot: -0.06 });
  if (crowned) {
    const pc = easeOut(seg(t, l3.t1 + 0.3, 0.4));
    crown(290, lerp(400, 740, pc), 1.1); crown(790, lerp(400, 760, pc), 1.05);
    confetti(t, l3.t1 + 0.3, 290, 820, 50, 0); confetti(t, l3.t1 + 0.3, 790, 820, 50, 99);
    const pb = backOut(seg(t, l3.t1 + 0.45, 0.4));
    if (seg(t, l3.t1 + 0.45, 0.4) > 0) txt('両者優勝!', 540, 1190, { size: 130, color: C.gold, outline: C.dark, ow: 28, shadow: true, scale: pb });
  }
}
function sceneOutro(t, sc) {
  const lt = t - sc.start, [, l2] = sc.lines;
  txt('あなたはどっち派?', 540, 420, { size: 100, color: '#FFFFFF', outline: C.dark, ow: 24, shadow: true, scale: backOut(seg(lt, 0, 0.4)) });
  for (const [x, col, deep, label, k, ph] of [[285, C.inu, C.inuDeep, '犬派', 0.2, 0], [795, C.neko, C.nekoDeep, '猫派', 0.35, Math.PI]]) {
    if (seg(lt, k, 0.4) <= 0) continue;
    const p = backOut(seg(lt, k, 0.4)), pul = 1 + 0.05 * Math.sin(t * 6 + ph);
    ctx.save(); ctx.translate(x, 760); ctx.scale(p * pul, p * pul);
    ctx.fillStyle = deep; rrect(-215, -175, 430, 370, 60); ctx.fill();
    ctx.fillStyle = col; rrect(-215, -190, 430, 360, 60); ctx.fill();
    ctx.lineWidth = 8; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
    if (label === '犬派') dog(0, -50, 72, t, 'happy'); else cat(0, -45, 70, t, 'happy');
    txt(label, 0, 105, { size: 80, color: '#FFFFFF', outline: deep, ow: 12 });
    ctx.restore();
  }
  if (seg(t, l2.t0, 0.4) > 0) {
    const pc = backOut(seg(t, l2.t0, 0.4));
    ctx.save(); ctx.translate(540, 1105); ctx.scale(pc, pc);
    ctx.fillStyle = '#FFFFFF'; rrect(-400, -75, 800, 150, 75); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-200, 70); ctx.lineTo(-250, 130); ctx.lineTo(-140, 70); ctx.fill();
    ctx.restore();
    txt('コメントで教えてね!', 540, 1105, { size: 66, color: C.red, scale: pc });
  }
  txt('ナレーション  VOICEVOX:四国めたん', 540, 1270, { size: 36, color: '#FFFFFF', outline: C.dark, ow: 10, bold: false, alpha: seg(lt, 0.5, 0.4) });
  txt('BGM・効果音  オリジナル', 540, 1320, { size: 36, color: '#FFFFFF', outline: C.dark, ow: 10, bold: false, alpha: seg(lt, 0.5, 0.4) });
}

const SCENE_FN = { title: sceneTitle, intro: sceneIntro, round: sceneRound, sudden: sceneSudden, outro: sceneOutro };
function render(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  background(t);
  const sc = sceneAt(t);
  SCENE_FN[sc.id](t, sc);
  subtitle(t);
  if (sc.start > 0) flash(t, sc.start);
  const fo = seg(t, DURATION - 0.4, 0.4);
  if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;

if (!navigator.webdriver) {
  const st = performance.now();
  (function loop() { render(((performance.now() - st) / 1000) % DURATION); requestAnimationFrame(loop); })();
} else render(0);
</script>
