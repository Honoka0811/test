<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ご当地ラーメン TOP10</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a0f0a; }
  body { font-family: "M PLUS Rounded 1c", "IPAGothic", sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #bg { position: absolute; inset: 0; }
  .rays { position: absolute; left: 50%; top: 50%; width: 3200px; height: 3200px; margin: -1600px 0 0 -1600px;
          background: repeating-conic-gradient(rgba(255,255,255,.07) 0 7.5deg, transparent 7.5deg 15deg); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; left: 0; right: 0; text-align: center; will-change: transform, opacity; }

  /* header bar */
  #header { position: absolute; top: 90px; left: 60px; right: 60px; display: flex; align-items: center; gap: 20px; z-index: 5; }
  #header .tag { background: #e8382f; color: #fff; font-weight: 900; font-size: 40px; padding: 10px 26px; border-radius: 16px; }
  #header .ttl { font-weight: 800; font-size: 44px; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
  #progress { position: absolute; top: 50px; left: 60px; right: 60px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.2); z-index: 5; }
  #progress i { display: block; height: 100%; width: 0; border-radius: 6px; background: #ffd23f; }

  /* rank scene */
  .rank { top: 210px; font-weight: 900; line-height: 1; }
  .rank .num { font-size: 330px; letter-spacing: -10px; -webkit-text-stroke: 14px #2a160c; paint-order: stroke fill; }
  .rank .i { font-size: 120px; -webkit-text-stroke: 10px #2a160c; paint-order: stroke fill; margin-left: 6px; }
  .medal { position: absolute; left: 50%; top: 175px; width: 460px; height: 460px; margin-left: -230px; border-radius: 50%; }
  .bowl { top: 640px; height: 560px; }
  .name { top: 1230px; font-weight: 900; font-size: 128px; -webkit-text-stroke: 12px #2a160c; paint-order: stroke fill; }
  .region { top: 1400px; font-weight: 800; font-size: 56px; }
  .region span { display: inline-block; background: rgba(0,0,0,.45); padding: 10px 34px; border-radius: 50px; }
  .chips { top: 1530px; display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; padding: 0 60px; }
  .chip { font-weight: 800; font-size: 50px; background: #fff; color: #2a160c; padding: 14px 32px; border-radius: 20px; box-shadow: 0 8px 0 rgba(0,0,0,.3); }

  /* intro / outro */
  .big { font-weight: 900; -webkit-text-stroke: 14px #2a160c; paint-order: stroke fill; line-height: 1.12; }
  .sub { font-weight: 800; }
  .three { display: flex; justify-content: center; gap: 30px; }
  .three div { width: 290px; padding: 36px 0; border-radius: 30px; background: #fff; color: #2a160c; font-weight: 900; font-size: 64px; box-shadow: 0 12px 0 rgba(0,0,0,.35); }
  .three small { display: block; font-size: 36px; font-weight: 800; color: #8a5a3c; margin-top: 8px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div class="rays" id="rays"></div></div>
  <div id="progress"><i id="bar"></i></div>
  <div id="header"><div class="tag">TOP10</div><div class="ttl">全国ご当地ラーメン</div></div>
  <div id="scenes"></div>
</div>

<script>
// ---------- data ----------
const SOUP = {
  tonkotsu: "#f3e3c3", miso: "#d98a3a", shoyu: "#8a4b22", shio: "#f2e6b0",
  black: "#2b1a12", tonshoyu: "#b9733d", gyokai: "#9c5a2a"
};
const RANKS = [
  { n: 10, name: "和歌山ラーメン", pref: "和歌山県", tags: ["豚骨醤油", "早寿司と一緒に"], soup: "tonshoyu", bg: ["#8c2f1e", "#3d130b"] },
  { n: 9,  name: "函館塩ラーメン", pref: "北海道", tags: ["透き通る塩スープ", "ストレート麺"], soup: "shio", bg: ["#1e6f8c", "#0b2c3d"] },
  { n: 8,  name: "旭川醤油ラーメン", pref: "北海道", tags: ["魚介×豚骨", "ラードで熱々"], soup: "shoyu", bg: ["#2d4f8a", "#111f3a"] },
  { n: 7,  name: "熊本ラーメン", pref: "熊本県", tags: ["豚骨", "香ばしいマー油"], soup: "tonkotsu", bg: ["#5a3a8a", "#22143d"] },
  { n: 6,  name: "徳島ラーメン", pref: "徳島県", tags: ["甘辛豚バラ", "生卵トッピング"], soup: "tonshoyu", bg: ["#2f7a4a", "#0f3320"] },
  { n: 5,  name: "尾道ラーメン", pref: "広島県", tags: ["魚介醤油", "背脂ミンチ"], soup: "gyokai", bg: ["#1f6e78", "#0a2e33"] },
  { n: 4,  name: "家系ラーメン", pref: "神奈川県 横浜", tags: ["豚骨醤油×鶏油", "太麺"], soup: "tonshoyu", bg: ["#a3361f", "#43150b"] },
  { n: 3,  name: "喜多方ラーメン", pref: "福島県", tags: ["あっさり醤油", "平打ち縮れ麺", "朝ラー文化"], soup: "shoyu", bg: ["#9a5b1e", "#3f230a"], medal: "#cd7f32" },
  { n: 2,  name: "札幌味噌ラーメン", pref: "北海道", tags: ["濃厚味噌", "黄色い縮れ麺", "炒め野菜"], soup: "miso", bg: ["#b0681a", "#46280a"], medal: "#c0c7d0" },
  { n: 1,  name: "博多ラーメン", pref: "福岡県", tags: ["濃厚豚骨", "極細麺", "替え玉"], soup: "tonkotsu", bg: ["#c8102e", "#4a0610"], medal: "#ffcf3f" },
];

// ---------- bowl SVG ----------
function bowl(soupKey, id) {
  const soup = SOUP[soupKey];
  const egg = soupKey === "black" ? "" : `
    <ellipse cx="640" cy="300" rx="70" ry="52" fill="#fffaf0"/>
    <ellipse cx="640" cy="300" rx="38" ry="28" fill="#f5a623"/>`;
  return `
  <svg viewBox="0 0 1080 560" width="1080" height="560">
    <defs>
      <radialGradient id="sg${id}" cx="50%" cy="40%" r="60%">
        <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g class="steam" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="16" stroke-linecap="round">
      <path d="M420 150 q-30 -40 0 -80 q30 -40 0 -80"/>
      <path d="M540 140 q-30 -40 0 -80 q30 -40 0 -80"/>
      <path d="M660 150 q-30 -40 0 -80 q30 -40 0 -80"/>
    </g>
    <ellipse cx="540" cy="290" rx="370" ry="100" fill="#2a160c"/>
    <path d="M170 290 Q190 520 540 530 Q890 520 910 290 Z" fill="#d7262d"/>
    <path d="M200 360 Q540 410 880 360" stroke="#fff" stroke-width="10" fill="none" stroke-dasharray="26 18" opacity=".8"/>
    <ellipse cx="540" cy="288" rx="345" ry="86" fill="${soup}"/>
    <ellipse cx="540" cy="288" rx="345" ry="86" fill="url(#sg${id})"/>
    <g stroke="#f6d36b" stroke-width="12" fill="none" stroke-linecap="round" opacity=".95">
      <path d="M300 300 q25 -18 50 0 t50 0 t50 0 t50 0"/>
      <path d="M320 330 q25 -18 50 0 t50 0 t50 0 t50 0"/>
      <path d="M560 340 q25 -18 50 0 t50 0 t50 0"/>
    </g>
    <ellipse cx="420" cy="262" rx="90" ry="44" fill="#c47a4a" stroke="#7a3f1d" stroke-width="10"/>
    <ellipse cx="420" cy="262" rx="50" ry="22" fill="#e0a27a"/>
    ${egg}
    <rect x="720" y="196" width="120" height="150" rx="6" fill="#16301e" transform="rotate(12 780 270)"/>
    <ellipse cx="530" cy="232" rx="54" ry="26" fill="#fff"/>
    <path d="M500 232 q15 -14 30 0 t30 0" stroke="#e84a7f" stroke-width="7" fill="none"/>
    <g fill="#5fb84a"><circle cx="560" cy="300" r="10"/><circle cx="590" cy="315" r="9"/><circle cx="500" cy="310" r="9"/><circle cx="470" cy="330" r="8"/></g>
  </svg>`;
}

// ---------- timeline ----------
const INTRO = 3.0, PER = 3.2, OUTRO = 3.8;
const TOTAL = INTRO + PER * RANKS.length + OUTRO;
const scenesEl = document.getElementById("scenes");
const scenes = [];

function addScene(html, start, dur, bg) {
  const el = document.createElement("div");
  el.className = "scene";
  el.innerHTML = html;
  scenesEl.appendChild(el);
  scenes.push({ el, start, dur, bg });
  return el;
}

addScene(`
  <div class="abs sub" data-a="0.05" style="top:480px;font-size:70px;color:#ffd23f">食べ歩き保存版！</div>
  <div class="abs big" data-a="0.2" style="top:600px;font-size:150px">全国<br>ご当地ラーメン</div>
  <div class="abs big" data-a="0.5" data-pop="1" style="top:1000px;font-size:200px;color:#ffd23f">TOP10</div>
  <div class="abs bowl" data-a="0.8" style="top:1260px">${bowl("tonshoyu", "i")}</div>
`, 0, INTRO, ["#e8382f", "#5a0d08"]);

RANKS.forEach((r, i) => {
  const color = r.medal || "#ffffff";
  const medal = r.medal ? `<div class="medal" data-a="0" style="background:radial-gradient(circle, ${r.medal}88 0%, ${r.medal}00 70%)"></div>` : "";
  addScene(`
    ${medal}
    <div class="abs rank" data-a="0" data-pop="1"><span class="num" style="color:${color}">${r.n}</span><span class="i" style="color:${color}">位</span></div>
    <div class="abs bowl" data-a="0.12">${bowl(r.soup, i)}</div>
    <div class="abs name" data-a="0.3" style="font-size:${r.name.length > 7 ? 112 : 128}px">${r.name}</div>
    <div class="abs region" data-a="0.45"><span>📍 ${r.pref}</span></div>
    <div class="abs chips">${r.tags.map((t, k) => `<div class="chip" data-a="${0.6 + k * 0.12}">${t}</div>`).join("")}</div>
  `, INTRO + PER * i, PER, r.bg);
});

addScene(`
  <div class="abs sub" data-a="0.05" style="top:420px;font-size:72px;color:#ffd23f">ちなみに…</div>
  <div class="abs big" data-a="0.2" style="top:540px;font-size:140px">日本三大<br>ラーメン</div>
  <div class="abs three" data-a="0.5" style="top:920px">
    <div>札幌<small>味噌</small></div><div>博多<small>豚骨</small></div><div>喜多方<small>醤油</small></div>
  </div>
  <div class="abs sub" data-a="1.1" style="top:1300px;font-size:64px;line-height:1.5">あなたの推しは<br>何位だった？🍜</div>
  <div class="abs sub" data-a="1.6" data-pop="1" style="top:1560px"><span style="display:inline-block;background:#ffd23f;color:#2a160c;font-size:60px;padding:22px 56px;border-radius:60px;box-shadow:0 10px 0 rgba(0,0,0,.35)">コメントで教えてね</span></div>
`, INTRO + PER * RANKS.length, OUTRO, ["#2a160c", "#0d0603"]);

// ---------- render ----------
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const back = x => { x = Math.min(Math.max(x, 0), 1); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => { const p = s => s.match(/\w\w/g).map(h => parseInt(h, 16)); const A = p(a), B = p(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, "0")).join(""); };

window.TOTAL = TOTAL;
window.render = function (t) {
  document.getElementById("bar").style.width = (Math.min(t / TOTAL, 1) * 100) + "%";
  document.getElementById("rays").style.transform = `rotate(${t * 12}deg)`;
  const showHeader = t >= INTRO && t < INTRO + PER * RANKS.length;
  document.getElementById("header").style.opacity = showHeader ? 1 : 0;

  let cur = scenes.findIndex(s => t >= s.start && t < s.start + s.dur);
  if (cur < 0) cur = scenes.length - 1;
  const s = scenes[cur];
  const lt = t - s.start;

  // background crossfade from previous scene
  const prev = scenes[cur - 1];
  const k = prev ? ease(lt / 0.3) : 1;
  const c0 = prev ? mix(prev.bg[0], s.bg[0], k) : s.bg[0];
  const c1 = prev ? mix(prev.bg[1], s.bg[1], k) : s.bg[1];
  document.getElementById("bg").style.background = `radial-gradient(circle at 50% 40%, ${c0} 0%, ${c1} 75%)`;

  scenes.forEach((sc, i) => { sc.el.style.opacity = i === cur ? 1 : 0; });

  const isLast = cur === scenes.length - 1;
  const out = isLast ? 0 : ease((lt - (s.dur - 0.22)) / 0.22);   // exit 0..1
  s.el.style.transform = `translateX(${-out * 1080}px)`;

  s.el.querySelectorAll("[data-a]").forEach(el => {
    const a = parseFloat(el.dataset.a);
    const p = (lt - a) / 0.35;
    if (el.dataset.pop) {
      const sc = 1.8 - 0.8 * back(p);
      el.style.opacity = Math.min(Math.max(p * 2, 0), 1);
      el.style.transform = `scale(${sc})`;
    } else {
      el.style.opacity = Math.min(Math.max(p, 0), 1);
      el.style.transform = `translateY(${(1 - ease(p)) * 80}px)`;
    }
  });
  s.el.querySelectorAll(".steam path").forEach((p, i) => {
    p.style.transform = `translate(${Math.sin(t * 3 + i * 1.3) * 10}px, ${-((t * 40 + i * 25) % 40)}px)`;
    p.style.opacity = 0.4 + 0.4 * Math.sin(t * 4 + i);
  });
};
render(0);
</script>
</body>
</html>
