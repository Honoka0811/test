<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ご当地ラーメン TOP10</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&display=block">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a0f0a; }
  body { font-family: "M PLUS Rounded 1c", "IPAGothic", sans-serif; color: #fff; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  #bg { position: absolute; inset: 0; }
  .rays { position: absolute; left: 50%; top: 50%; width: 3200px; height: 3200px; margin: -1600px 0 0 -1600px;
          background: repeating-conic-gradient(rgba(255,255,255,.07) 0 7.5deg, transparent 7.5deg 15deg); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; left: 0; right: 0; text-align: center; will-change: transform, opacity; }

  #header { position: absolute; top: 80px; left: 60px; right: 60px; display: flex; align-items: center; gap: 20px; z-index: 5; }
  #header .tag { background: #e8382f; color: #fff; font-weight: 900; font-size: 38px; padding: 8px 24px; border-radius: 16px; }
  #header .ttl { font-weight: 800; font-size: 42px; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
  #progress { position: absolute; top: 44px; left: 60px; right: 60px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.2); z-index: 5; }
  #progress i { display: block; height: 100%; width: 0; border-radius: 6px; background: #ffd23f; }

  .stroke { -webkit-text-stroke: 14px #2a160c; paint-order: stroke fill; }
  .rank { top: 170px; font-weight: 900; line-height: 1; }
  .rank .num { font-size: 250px; letter-spacing: -8px; }
  .rank .i { font-size: 100px; margin-left: 6px; }
  .medal { position: absolute; left: 50%; top: 110px; width: 420px; height: 420px; margin-left: -210px; border-radius: 50%; }

  .photo { position: absolute; left: 70px; top: 455px; width: 940px; height: 705px; border: 14px solid #fff; border-radius: 28px;
           overflow: hidden; box-shadow: 0 24px 50px rgba(0,0,0,.55); background: #000; will-change: transform, opacity; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; will-change: transform; }

  .name { top: 1205px; font-weight: 900; font-size: 124px; }
  .region { top: 1370px; font-weight: 800; font-size: 54px; }
  .region span { display: inline-block; background: rgba(0,0,0,.45); padding: 8px 34px; border-radius: 50px; }
  .chips { top: 1490px; display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; padding: 0 60px; }
  .chip { font-weight: 800; font-size: 50px; background: #fff; color: #2a160c; padding: 14px 32px; border-radius: 20px; box-shadow: 0 8px 0 rgba(0,0,0,.3); }
  .credit { position: absolute; left: 40px; right: 40px; bottom: 34px; text-align: center; font-size: 26px; font-weight: 500;
            color: rgba(255,255,255,.75); line-height: 1.4; }

  .big { font-weight: 900; line-height: 1.12; }
  .sub { font-weight: 800; }
  .three { display: flex; justify-content: center; gap: 26px; }
  .three div { width: 300px; border-radius: 28px; background: #fff; color: #2a160c; font-weight: 900; font-size: 58px;
               box-shadow: 0 12px 0 rgba(0,0,0,.35); overflow: hidden; padding-bottom: 20px; }
  .three img { width: 100%; height: 230px; object-fit: cover; display: block; margin-bottom: 14px; }
  .three small { display: block; font-size: 34px; font-weight: 800; color: #8a5a3c; margin-top: 4px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div class="rays" id="rays"></div></div>
  <div id="progress"><i id="bar"></i></div>
  <div id="header"><div class="tag">TOP10</div><div class="ttl">全国ご当地ラーメン</div></div>
  <div id="scenes"></div>
</div>

<script>
// window.CREDITS (photos/credits.json) and window.DURS (audio/durations.json) are injected by render.js.
const CREDITS = window.CREDITS || {};
const DURS = window.DURS || {};

const RANKS = [
  { n: 10, key: "wakayama", name: "和歌山ラーメン",   pref: "和歌山県",      tags: ["豚骨醤油", "早寿司と一緒に"], bg: ["#8c2f1e", "#3d130b"] },
  { n: 9,  key: "hakodate", name: "函館塩ラーメン",   pref: "北海道",        tags: ["透き通る塩スープ", "ストレート麺"], bg: ["#1e6f8c", "#0b2c3d"] },
  { n: 8,  key: "asahikawa",name: "旭川醤油ラーメン", pref: "北海道",        tags: ["魚介×豚骨", "ラードで熱々"], bg: ["#2d4f8a", "#111f3a"] },
  { n: 7,  key: "kumamoto", name: "熊本ラーメン",     pref: "熊本県",        tags: ["豚骨", "香ばしいマー油"], bg: ["#5a3a8a", "#22143d"] },
  { n: 6,  key: "tokushima",name: "徳島ラーメン",     pref: "徳島県",        tags: ["甘辛豚バラ", "生卵トッピング"], bg: ["#2f7a4a", "#0f3320"] },
  { n: 5,  key: "onomichi", name: "尾道ラーメン",     pref: "広島県",        tags: ["魚介醤油", "背脂ミンチ"], bg: ["#1f6e78", "#0a2e33"] },
  { n: 4,  key: "iekei",    name: "家系ラーメン",     pref: "神奈川県 横浜", tags: ["豚骨醤油×鶏油", "太麺"], bg: ["#a3361f", "#43150b"] },
  { n: 3,  key: "kitakata", name: "喜多方ラーメン",   pref: "福島県",        tags: ["あっさり醤油", "平打ち縮れ麺", "朝ラー"], bg: ["#9a5b1e", "#3f230a"], medal: "#cd7f32" },
  { n: 2,  key: "sapporo",  name: "札幌味噌ラーメン", pref: "北海道",        tags: ["濃厚味噌", "縮れ麺", "炒め野菜"], bg: ["#b0681a", "#46280a"], medal: "#c0c7d0" },
  { n: 1,  key: "hakata",   name: "博多ラーメン",     pref: "福岡県",        tags: ["濃厚豚骨", "極細麺", "替え玉"], bg: ["#c8102e", "#4a0610"], medal: "#ffcf3f" },
];

// ---------- simple SVG bowl for the intro ----------
const bowlSVG = `
  <svg viewBox="0 0 1080 560" width="1080" height="560">
    <g class="steam" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="16" stroke-linecap="round">
      <path d="M420 150 q-30 -40 0 -80 q30 -40 0 -80"/><path d="M540 140 q-30 -40 0 -80 q30 -40 0 -80"/><path d="M660 150 q-30 -40 0 -80 q30 -40 0 -80"/>
    </g>
    <ellipse cx="540" cy="290" rx="370" ry="100" fill="#2a160c"/>
    <path d="M170 290 Q190 520 540 530 Q890 520 910 290 Z" fill="#d7262d"/>
    <path d="M200 360 Q540 410 880 360" stroke="#fff" stroke-width="10" fill="none" stroke-dasharray="26 18" opacity=".8"/>
    <ellipse cx="540" cy="288" rx="345" ry="86" fill="#b9733d"/>
    <g stroke="#f6d36b" stroke-width="12" fill="none" stroke-linecap="round"><path d="M300 300 q25 -18 50 0 t50 0 t50 0 t50 0"/><path d="M320 330 q25 -18 50 0 t50 0 t50 0 t50 0"/><path d="M560 340 q25 -18 50 0 t50 0 t50 0"/></g>
    <ellipse cx="420" cy="262" rx="90" ry="44" fill="#c47a4a" stroke="#7a3f1d" stroke-width="10"/>
    <ellipse cx="640" cy="300" rx="70" ry="52" fill="#fffaf0"/><ellipse cx="640" cy="300" rx="38" ry="28" fill="#f5a623"/>
    <rect x="720" y="196" width="120" height="150" rx="6" fill="#16301e" transform="rotate(12 780 270)"/>
    <ellipse cx="530" cy="232" rx="54" ry="26" fill="#fff"/><path d="M500 232 q15 -14 30 0 t30 0" stroke="#e84a7f" stroke-width="7" fill="none"/>
  </svg>`;

function creditText(key) {
  const c = CREDITS[key];
  if (!c) return "";
  return `Photo: ${c.artist} / ${c.license} / Wikimedia Commons`;
}

// ---------- timeline (scene length follows narration) ----------
const LEAD = 0.25, TAIL = 0.45;
const durOf = (k, min) => Math.max(min, (DURS[k] || min) + LEAD + TAIL);
const scenesEl = document.getElementById("scenes");
const scenes = [];
let cursor = 0;

function addScene(key, html, dur, bg) {
  const el = document.createElement("div");
  el.className = "scene";
  el.innerHTML = html;
  scenesEl.appendChild(el);
  scenes.push({ key, el, start: cursor, dur, bg });
  cursor += dur;
}

addScene("intro", `
  <div class="abs sub" data-a="0.05" style="top:470px;font-size:70px;color:#ffd23f">食べ歩き保存版！</div>
  <div class="abs big stroke" data-a="0.2" style="top:590px;font-size:150px">全国<br>ご当地ラーメン</div>
  <div class="abs big stroke" data-a="0.5" data-pop="1" style="top:990px;font-size:200px;color:#ffd23f">TOP10</div>
  <div class="abs" data-a="0.8" style="top:1240px">${bowlSVG}</div>
  <div class="credit">ナレーション　VOICEVOX:四国めたん</div>
`, durOf("intro", 3), ["#e8382f", "#5a0d08"]);

RANKS.forEach(r => {
  const color = r.medal || "#ffffff";
  const medal = r.medal ? `<div class="medal" data-a="0" style="background:radial-gradient(circle, ${r.medal}99 0%, ${r.medal}00 70%)"></div>` : "";
  addScene("r" + r.n, `
    ${medal}
    <div class="abs rank stroke" data-a="0" data-pop="1"><span class="num" style="color:${color}">${r.n}</span><span class="i" style="color:${color}">位</span></div>
    <div class="photo" data-a="0.1" data-photo="1"><img src="photos/${r.key}.jpg"></div>
    <div class="abs name stroke" data-a="0.3" style="font-size:${r.name.length > 7 ? 112 : 124}px">${r.name}</div>
    <div class="abs region" data-a="0.45"><span>📍 ${r.pref}</span></div>
    <div class="abs chips">${r.tags.map((t, k) => `<div class="chip" data-a="${0.6 + k * 0.12}">${t}</div>`).join("")}</div>
    <div class="credit">${creditText(r.key)}</div>
  `, durOf("r" + r.n, 3), r.bg);
});

addScene("outro", `
  <div class="abs sub" data-a="0.05" style="top:300px;font-size:70px;color:#ffd23f">ちなみに…</div>
  <div class="abs big stroke" data-a="0.2" style="top:410px;font-size:140px">日本三大<br>ラーメン</div>
  <div class="abs three" data-a="0.6" style="top:790px">
    <div><img src="photos/sapporo.jpg">札幌<small>味噌</small></div>
    <div><img src="photos/hakata.jpg">博多<small>豚骨</small></div>
    <div><img src="photos/kitakata.jpg">喜多方<small>醤油</small></div>
  </div>
  <div class="abs sub" data-a="3.2" style="top:1280px;font-size:66px;line-height:1.5">あなたの推しは<br>何位だった？🍜</div>
  <div class="abs sub" data-a="4.6" data-pop="1" style="top:1540px"><span style="display:inline-block;background:#ffd23f;color:#2a160c;font-size:60px;padding:22px 56px;border-radius:60px;box-shadow:0 10px 0 rgba(0,0,0,.35)">コメントで教えてね</span></div>
  <div class="credit">ナレーション　VOICEVOX:四国めたん<br>写真　Wikimedia Commons（撮影者・ライセンスは各シーンに表記）</div>
`, durOf("outro", 4) + 0.6, ["#2a160c", "#0d0603"]);

const TOTAL = cursor;
const RANK_END = scenes[scenes.length - 1].start;

// ---------- render ----------
const clamp = x => Math.min(Math.max(x, 0), 1);
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => { const p = s => s.match(/\w\w/g).map(h => parseInt(h, 16)); const A = p(a), B = p(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, "0")).join(""); };

window.TOTAL = TOTAL;
// narration start time (seconds) of each scene, keyed like the audio files
window.NARRATION = scenes.map(s => ({ key: s.key, at: s.start + LEAD }));

window.render = function (t) {
  document.getElementById("bar").style.width = (clamp(t / TOTAL) * 100) + "%";
  document.getElementById("rays").style.transform = `rotate(${t * 12}deg)`;
  document.getElementById("header").style.opacity = (t >= scenes[1].start && t < RANK_END) ? 1 : 0;

  let cur = scenes.findIndex(s => t >= s.start && t < s.start + s.dur);
  if (cur < 0) cur = scenes.length - 1;
  const s = scenes[cur];
  const lt = t - s.start;

  const prev = scenes[cur - 1];
  const k = prev ? ease(lt / 0.3) : 1;
  const c0 = prev ? mix(prev.bg[0], s.bg[0], k) : s.bg[0];
  const c1 = prev ? mix(prev.bg[1], s.bg[1], k) : s.bg[1];
  document.getElementById("bg").style.background = `radial-gradient(circle at 50% 40%, ${c0} 0%, ${c1} 75%)`;

  scenes.forEach((sc, i) => { sc.el.style.opacity = i === cur ? 1 : 0; });

  const isLast = cur === scenes.length - 1;
  const out = isLast ? 0 : ease((lt - (s.dur - 0.22)) / 0.22);
  s.el.style.transform = `translateX(${-out * 1080}px)`;

  s.el.querySelectorAll("[data-a]").forEach(el => {
    const a = parseFloat(el.dataset.a);
    const p = (lt - a) / 0.35;
    if (el.dataset.pop) {
      el.style.opacity = clamp(p * 2);
      el.style.transform = `scale(${1.8 - 0.8 * back(p)})`;
    } else if (el.dataset.photo) {
      el.style.opacity = clamp(p * 1.5);
      el.style.transform = `translateY(${(1 - ease(p)) * 120}px) rotate(${(1 - ease(p)) * -6 - 1.2}deg) scale(${0.85 + 0.15 * back(p)})`;
      el.querySelector("img").style.transform = `scale(${1.02 + 0.10 * (lt / s.dur)})`;   // slow Ken Burns zoom
    } else {
      el.style.opacity = clamp(p);
      el.style.transform = `translateY(${(1 - ease(p)) * 80}px)`;
    }
  });
  s.el.querySelectorAll(".steam path").forEach((p, i) => {
    p.style.transform = `translate(${Math.sin(t * 3 + i * 1.3) * 10}px, ${-((t * 40 + i * 25) % 40)}px)`;
    p.style.opacity = 0.4 + 0.4 * Math.sin(t * 4 + i);
  });
};
render(0);
</script>
</body>
</html>
