<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>食品サンプル職人</title>
<style>
@font-face { font-family: ZMG; src: url(fonts/ZenMaruGothic-500.ttf); font-weight: 500; }
@font-face { font-family: ZMG; src: url(fonts/ZenMaruGothic-900.ttf); font-weight: 900; }
html, body { margin: 0; background: #222; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
window.FPS = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
window.fontsReady = Promise.all([document.fonts.load('900 40px ZMG'), document.fonts.load('500 40px ZMG')]);

// ---------- 色 ----------
const C = {
  bg: '#FFF4E3', bg2: '#FBE6C8', ink: '#3B2416', red: '#C8352B', red2: '#E0584A',
  cream: '#FFFDF7', gold: '#E9A93B', green: '#5E9E4B', blue: '#6FB4D8', gray: '#9C8E80',
};

// ---------- シーン(narrate.py の SCRIPT と開始秒・長さを揃える) ----------
const SCENES = [
  { start: 0,  dur: 7, draw: sceneTitle,   chip: null,
    sub: 'お店の前に並ぶ、本物そっくりの料理。じつはこれ、職人さんの手作りですのよ。' },
  { start: 7,  dur: 8, draw: sceneOrigin,  chip: 'はじまり',
    sub: '食品サンプルは、昭和のはじめごろ日本で生まれた文化。最初は「ろう」で作られていましたわ。' },
  { start: 15, dur: 8, draw: sceneGujo,    chip: '一大産地',
    sub: '「食品サンプルの父」岩崎瀧三の故郷、岐阜県郡上市は、いまも国内生産の約6割を担いますの。' },
  { start: 23, dur: 7, draw: sceneMold,    chip: 'STEP 1',
    sub: '作り方を見てみましょう。まずは本物の料理から、シリコンで型を取ります。' },
  { start: 30, dur: 7, draw: scenePour,    chip: 'STEP 2',
    sub: '型に液体の樹脂を流し込み、オーブンで加熱して固めます。' },
  { start: 37, dur: 8, draw: scenePaint,   chip: 'STEP 3',
    sub: '色付けは職人の腕の見せどころ。エアブラシと筆で、焼き目や照りを重ねていきますわ。' },
  { start: 45, dur: 8, draw: sceneAssemble, chip: 'STEP 4',
    sub: '最後に盛り付け。立ちのぼる湯気も、持ち上げた麺も、まるで時間が止まったよう。' },
  { start: 53, dur: 9, draw: sceneLettuce, chip: '職人ワザ',
    sub: 'レタスは、お湯にろうを垂らし、手でふわっと広げて作るんですの。一瞬の勝負ですわね。' },
  { start: 62, dur: 7, draw: sceneEnd,     chip: null,
    sub: '店先のサンプルは、食欲をそそる小さな芸術作品。今度、じっくり眺めてみてくださいね。' },
];
window.DURATION = SCENES[SCENES.length - 1].start + SCENES[SCENES.length - 1].dur;
const LEAD = 0.45;

// ---------- 汎用 ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - clamp(k), 3);
const back = k => { k = clamp(k); const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const prog = (t, a, b) => clamp((t - a) / (b - a));
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function ell(x, y, rx, ry, fill, stroke, lw) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 4; ctx.stroke(); }
}
function font(px, w = 900) { ctx.font = `${w} ${px}px ZMG, IPAGothic, sans-serif`; }
function text(s, x, y, px, color, w = 900, align = 'center') {
  font(px, w); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function outlined(s, x, y, px, fill, stroke, lw) {
  font(px); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
// 日本語の折り返し(行頭禁則の簡易版)
function wrap(s, maxW, px, w = 500) {
  font(px, w);
  const NG = '、。」』）)!?！？ーぁぃぅぇぉっゃゅょ・';
  const lines = []; let cur = '';
  for (const ch of s) {
    if (ctx.measureText(cur + ch).width > maxW && cur) {
      if (NG.includes(ch)) { cur += ch; continue; }
      lines.push(cur); cur = ch;
    } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ---------- 背景・共通UI ----------
function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // 水玉
  ctx.fillStyle = 'rgba(232,170,110,0.13)';
  for (let r = 0; r < 22; r++) for (let c = 0; c < 9; c++) {
    const x = c * 130 + (r % 2) * 65 + 20, y = r * 95 - ((t * 12) % 190) + 40;
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
  }
  // 上部ののれん
  ctx.fillStyle = C.red; ctx.fillRect(0, 0, W, 150);
  for (const sx of [180, 900]) { ctx.fillStyle = C.bg; ctx.fillRect(sx - 4, 70, 8, 80); }
  text('食品サンプル職人', W / 2, 82, 54, '#fff');
}
function chip(label, t) {
  if (!label) return;
  const k = back(prog(t, 0.1, 0.6));
  font(46); const w = ctx.measureText(label).width + 70;
  ctx.save(); ctx.translate(W / 2, 230); ctx.scale(k, k);
  rr(-w / 2, -38, w, 76, 38); ctx.fillStyle = C.ink; ctx.fill();
  text(label, 0, 2, 46, '#fff'); ctx.restore();
}
function headline(s, t, y = 1340, px = 92, color = C.ink) {
  const k = easeOut(prog(t, 0.25, 0.85));
  ctx.save(); ctx.globalAlpha *= k; ctx.translate(0, (1 - k) * 40);
  outlined(s, W / 2, y, px, color, '#fff', 22);
  ctx.restore();
}
function subtitle(s, t, dur) {
  const k = prog(t, LEAD - 0.1, LEAD + 0.2) * (1 - prog(t, dur - 0.2, dur));
  if (k <= 0) return;
  let lines = wrap(s, 860, 50);
  // 行長をそろえる(最後の行だけ短く残らないように)
  for (let w = 600; w < 860; w += 10) { const l2 = wrap(s, w, 50); if (l2.length === lines.length) { lines = l2; break; } }
  const lh = 72, h = lines.length * lh + 50, y0 = 1470;
  ctx.save(); ctx.globalAlpha *= k;
  rr(70, y0, W - 140, h, 30); ctx.fillStyle = 'rgba(59,36,22,0.88)'; ctx.fill();
  lines.forEach((l, i) => text(l, W / 2, y0 + 25 + lh / 2 + i * lh, 50, '#fff', 500));
  ctx.restore();
}

// ---------- 料理イラスト ----------
function plate(x, y, rx) {
  ell(x, y + 8, rx, rx * 0.3, 'rgba(0,0,0,0.12)');
  ell(x, y, rx, rx * 0.3, '#fff', '#E3D8CB', 4);
  ell(x, y, rx * 0.72, rx * 0.2, null, '#EFE7DD', 3);
}
function omurice(x, y, s) {
  plate(x, y + 30 * s, 190 * s);
  const g = ctx.createLinearGradient(0, y - 80 * s, 0, y + 40 * s);
  g.addColorStop(0, '#FFE07A'); g.addColorStop(1, '#F0B53A');
  ctx.beginPath(); ctx.ellipse(x, y + 10 * s, 140 * s, 80 * s, 0, Math.PI, 0); ctx.ellipse(x, y + 10 * s, 140 * s, 30 * s, 0, 0, Math.PI);
  ctx.fillStyle = g; ctx.fill();
  ell(x - 40 * s, y - 35 * s, 40 * s, 14 * s, 'rgba(255,255,255,0.45)');
  ctx.beginPath(); ctx.moveTo(x - 100 * s, y - 20 * s);
  for (let i = 0; i <= 20; i++) { const k = i / 20; ctx.lineTo(x - 100 * s + 200 * s * k, y - 30 * s - Math.sin(k * Math.PI) * 30 * s + Math.sin(k * 28) * 12 * s); }
  ctx.strokeStyle = '#C8231B'; ctx.lineWidth = 14 * s; ctx.lineCap = 'round'; ctx.stroke();
  ell(x + 110 * s, y + 25 * s, 18 * s, 12 * s, C.green);
}
function parfait(x, y, s) {
  // y はグラスの底
  ctx.save();
  const top = y - 330 * s, rw = 95 * s;
  ctx.beginPath(); ctx.moveTo(x - rw, top); ctx.bezierCurveTo(x - rw, top + 200 * s, x - 40 * s, top + 240 * s, x - 22 * s, top + 260 * s);
  ctx.lineTo(x + 22 * s, top + 260 * s); ctx.bezierCurveTo(x + 40 * s, top + 240 * s, x + rw, top + 200 * s, x + rw, top); ctx.closePath();
  ctx.save(); ctx.clip();
  const layers = [['#F7F0E2', 0], ['#E04B5A', 50], ['#FFF8EE', 90], ['#D9A35A', 140], ['#F3C3C8', 190]];
  layers.forEach(([c, o]) => { ctx.fillStyle = c; ctx.fillRect(x - rw, top + o * s, rw * 2, 260 * s); });
  for (let i = 0; i < 14; i++) ell(x - 70 * s + rnd(i) * 140 * s, top + 150 * s + rnd(i + 9) * 30 * s, 10 * s, 6 * s, '#B97A35');
  ctx.restore();
  ctx.strokeStyle = 'rgba(160,190,210,0.9)'; ctx.lineWidth = 5 * s; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x - rw + 14 * s, top + 20 * s, 12 * s, 150 * s);
  // 脚
  ctx.fillStyle = 'rgba(190,215,230,0.95)'; ctx.fillRect(x - 10 * s, top + 258 * s, 20 * s, 60 * s);
  ell(x, y - 6 * s, 70 * s, 14 * s, 'rgba(190,215,230,0.95)');
  // クリーム・いちご・さくらんぼ
  for (const [dx, dy, r] of [[-55, -5, 42], [0, -25, 50], [55, -5, 42], [0, -65, 34]]) ell(x + dx * s, top + dy * s, r * s, r * 0.8 * s, '#FFFDF8', '#EADFD0', 3);
  for (const dx of [-70, 70]) { ctx.beginPath(); ctx.moveTo(x + dx * s, top - 40 * s); ctx.lineTo(x + (dx * 1.25) * s, top + 15 * s); ctx.lineTo(x + dx * 0.7 * s, top + 15 * s); ctx.closePath(); ctx.fillStyle = '#E8343F'; ctx.fill(); }
  ctx.fillStyle = '#E2B771'; ctx.save(); ctx.translate(x + 40 * s, top - 90 * s); ctx.rotate(0.35); ctx.fillRect(-12 * s, -70 * s, 24 * s, 110 * s); ctx.restore();
  ctx.beginPath(); ctx.moveTo(x, top - 100 * s); ctx.quadraticCurveTo(x + 10 * s, top - 150 * s, x + 30 * s, top - 160 * s); ctx.strokeStyle = '#5A7A2E'; ctx.lineWidth = 5 * s; ctx.stroke();
  ell(x, top - 92 * s, 24 * s, 24 * s, '#D6202C'); ell(x - 8 * s, top - 100 * s, 7 * s, 5 * s, 'rgba(255,255,255,0.7)');
  ctx.restore();
}
// ラーメン。o.k: トッピングごとの出現度(0..1)、o.lift: 持ち上げ麺、o.steam: 湯気
function ramen(x, y, s, t, o = {}) {
  const K = n => (o[n] === undefined ? 1 : o[n]);
  ell(x, y + 250 * s, 160 * s, 30 * s, 'rgba(0,0,0,0.13)');
  // 丼
  ctx.beginPath(); ctx.moveTo(x - 300 * s, y);
  ctx.bezierCurveTo(x - 290 * s, y + 160 * s, x - 190 * s, y + 230 * s, x - 120 * s, y + 235 * s);
  ctx.lineTo(x + 120 * s, y + 235 * s);
  ctx.bezierCurveTo(x + 190 * s, y + 230 * s, x + 290 * s, y + 160 * s, x + 300 * s, y);
  ctx.closePath();
  const g = ctx.createLinearGradient(x - 300 * s, 0, x + 300 * s, 0);
  g.addColorStop(0, '#A92A22'); g.addColorStop(0.45, C.red2); g.addColorStop(1, '#9B241D');
  ctx.fillStyle = g; ctx.fill();
  // 雷文の帯
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#FFF7EC'; ctx.fillRect(x - 320 * s, y + 40 * s, 640 * s, 46 * s);
  ctx.strokeStyle = C.red; ctx.lineWidth = 5 * s;
  for (let i = -7; i < 7; i++) {
    const bx = x + i * 46 * s, by = y + 50 * s;
    ctx.beginPath(); ctx.moveTo(bx, by + 26 * s); ctx.lineTo(bx, by); ctx.lineTo(bx + 30 * s, by); ctx.lineTo(bx + 30 * s, by + 18 * s); ctx.lineTo(bx + 12 * s, by + 18 * s); ctx.lineTo(bx + 12 * s, by + 8 * s); ctx.stroke();
  }
  ctx.restore();
  ell(x, y, 300 * s, 82 * s, '#FFF7EC');
  // スープ
  const kb = K('broth');
  if (kb > 0) {
    const gb = ctx.createRadialGradient(x - 60 * s, y - 20 * s, 10, x, y, 280 * s);
    gb.addColorStop(0, '#F2BC62'); gb.addColorStop(1, '#C97A2E');
    ctx.save(); ctx.globalAlpha *= kb; ell(x, y + 4 * s, 272 * s, 68 * s, gb); ctx.restore();
  }
  ctx.save(); ctx.beginPath(); ctx.ellipse(x, y + 4 * s, 272 * s, 68 * s, 0, 0, Math.PI * 2); ctx.clip();
  // 麺
  const kn = K('noodles');
  if (kn > 0) {
    ctx.strokeStyle = '#F6DA7A'; ctx.lineWidth = 7 * s; ctx.lineCap = 'round';
    for (let i = 0; i < 9; i++) {
      ctx.globalAlpha = kn; ctx.beginPath();
      for (let j = 0; j <= 30; j++) { const k = j / 30; const px = x - 230 * s + k * 460 * s; const py = y - 30 * s + i * 8 * s + Math.sin(k * 18 + i) * 7 * s; j ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  const drop = (n) => { const k = K(n); return { a: clamp(k * 3), dy: (1 - easeOut(k)) * -260 * s }; };
  // のり
  let d = drop('nori');
  if (d.a > 0) { ctx.save(); ctx.globalAlpha *= d.a; ctx.translate(x - 200 * s, y - 60 * s + d.dy); ctx.rotate(-0.25); rr(-48 * s, -70 * s, 96 * s, 110 * s, 6 * s); ctx.fillStyle = '#1F3324'; ctx.fill(); ctx.restore(); }
  // チャーシュー
  d = drop('chashu');
  if (d.a > 0) { ctx.save(); ctx.globalAlpha *= d.a; ctx.translate(0, d.dy);
    ell(x - 90 * s, y - 10 * s, 78 * s, 34 * s, '#B5643A'); ell(x - 90 * s, y - 14 * s, 66 * s, 26 * s, '#E8A487'); ell(x - 100 * s, y - 18 * s, 20 * s, 8 * s, '#F6D2C0'); ctx.restore(); }
  // なると
  d = drop('naruto');
  if (d.a > 0) { ctx.save(); ctx.globalAlpha *= d.a; ctx.translate(0, d.dy);
    ell(x + 70 * s, y - 25 * s, 46 * s, 20 * s, '#FFFDF8', '#F2D9DE', 3);
    ctx.beginPath(); for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 5, r = (i / 60) * 34 * s; ctx.lineTo(x + 70 * s + Math.cos(a) * r, y - 25 * s + Math.sin(a) * r * 0.42); }
    ctx.strokeStyle = '#E86A8A'; ctx.lineWidth = 4 * s; ctx.stroke(); ctx.restore(); }
  // 煮卵
  d = drop('egg');
  if (d.a > 0) { ctx.save(); ctx.globalAlpha *= d.a; ctx.translate(0, d.dy);
    ell(x + 170 * s, y + 5 * s, 52 * s, 32 * s, '#F4E2C2'); ell(x + 170 * s, y + 3 * s, 28 * s, 17 * s, '#F09A2A'); ell(x + 165 * s, y, 10 * s, 5 * s, '#FFC75A'); ctx.restore(); }
  // ねぎ
  d = drop('negi');
  if (d.a > 0) { ctx.save(); ctx.globalAlpha *= d.a; ctx.translate(0, d.dy);
    for (let i = 0; i < 12; i++) ell(x - 10 * s + (rnd(i) - 0.5) * 120 * s, y + 25 * s + (rnd(i + 3) - 0.5) * 30 * s, 9 * s, 5 * s, '#7DBA4C', '#4E8A2C', 2 * s);
    ctx.restore(); }
  // 持ち上げ麺 + 箸
  const kl = K('lift');
  if (kl > 0) {
    const bob = Math.sin(t * 2) * 4 * s;
    const hy = y - 60 * s - 240 * s * easeOut(kl) + bob;
    ctx.save(); ctx.globalAlpha *= clamp(kl * 3);
    ctx.strokeStyle = '#F6DA7A'; ctx.lineWidth = 8 * s; ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      ctx.beginPath(); const sx = x + 10 * s + i * 9 * s;
      for (let j = 0; j <= 30; j++) { const k = j / 30; const py = lerp(hy, y - 10 * s, k); const px = sx + Math.sin(k * 14 + i * 1.3) * 10 * s + k * (i - 2.5) * 10 * s; j ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();
    }
    ctx.strokeStyle = '#8A5A33'; ctx.lineWidth = 11 * s;
    for (const off of [-14, 14]) { ctx.beginPath(); ctx.moveTo(x + 30 * s + off * s, hy + 4 * s); ctx.lineTo(x + 260 * s + off * s, hy - 230 * s); ctx.stroke(); }
    ctx.restore();
  }
  // 湯気
  const ks = K('steam');
  if (ks > 0) {
    ctx.save(); ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const ph = (t * 0.45 + i * 0.25) % 1;
      ctx.globalAlpha = ks * Math.sin(ph * Math.PI) * 0.7;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 16 * s;
      ctx.beginPath();
      for (let j = 0; j <= 20; j++) { const k = j / 20; const px = x - 150 * s + i * 95 * s + Math.sin(k * 6 + t * 2 + i) * 22 * s; const py = y - 70 * s - ph * 120 * s - k * 170 * s; j ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();
    }
    ctx.restore();
  }
}
// サーモンのにぎり。paint: 0=真っ白, 1=色付き / sear: 炙り / gloss: 照り
function nigiri(x, y, s, o = {}) {
  const white = o.white || 0;
  ell(x, y + 70 * s, 170 * s, 30 * s, 'rgba(0,0,0,0.12)');
  // シャリ
  ell(x, y + 25 * s, 150 * s, 55 * s, '#FDFBF4', '#E7E0D2', 3);
  if (!white) for (let i = 0; i < 26; i++) ell(x + (rnd(i) - 0.5) * 260 * s, y + 30 * s + (rnd(i + 5) - 0.5) * 70 * s, 11 * s, 6 * s, null, '#ECE5D6', 2);
  // ネタの形
  const neta = () => { ctx.beginPath(); ctx.moveTo(x - 185 * s, y + 5 * s); ctx.bezierCurveTo(x - 160 * s, y - 70 * s, x + 120 * s, y - 75 * s, x + 190 * s, y - 15 * s); ctx.bezierCurveTo(x + 170 * s, y + 30 * s, x - 120 * s, y + 45 * s, x - 185 * s, y + 5 * s); ctx.closePath(); };
  neta(); ctx.fillStyle = '#FBF8F2'; ctx.fill(); ctx.strokeStyle = '#E3DBCF'; ctx.lineWidth = 3; ctx.stroke();
  if (white) return;
  const kp = o.paint === undefined ? 1 : o.paint;
  if (kp > 0) {
    ctx.save(); neta(); ctx.clip();
    // 左から塗られていく
    ctx.beginPath(); ctx.rect(x - 200 * s, y - 100 * s, 400 * s * kp, 200 * s); ctx.clip();
    const g = ctx.createLinearGradient(0, y - 70 * s, 0, y + 40 * s);
    g.addColorStop(0, '#FF8C5A'); g.addColorStop(1, '#F06A3A');
    ctx.fillStyle = g; ctx.fillRect(x - 200 * s, y - 100 * s, 400 * s, 200 * s);
    ctx.strokeStyle = 'rgba(255,240,228,0.9)'; ctx.lineWidth = 9 * s;
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(x - 150 * s + i * 60 * s, y - 70 * s); ctx.quadraticCurveTo(x - 120 * s + i * 60 * s, y - 10 * s, x - 160 * s + i * 60 * s, y + 50 * s); ctx.stroke(); }
    // 炙り
    const kse = o.sear || 0;
    if (kse > 0) {
      const gs = ctx.createLinearGradient(0, y - 75 * s, 0, y + 10 * s);
      gs.addColorStop(0, `rgba(90,40,15,${0.75 * kse})`); gs.addColorStop(1, 'rgba(120,50,20,0)');
      ctx.fillStyle = gs; ctx.fillRect(x - 200 * s, y - 100 * s, 400 * s, 200 * s);
      for (let i = 0; i < 18; i++) ell(x + (rnd(i * 3) - 0.5) * 300 * s, y - 50 * s + rnd(i * 7) * 30 * s, 14 * s, 7 * s, `rgba(70,30,10,${0.5 * kse})`);
    }
    ctx.restore();
  }
  const kg = o.gloss || 0;
  if (kg > 0) {
    ctx.save(); ctx.globalAlpha = kg * 0.85;
    ctx.beginPath(); ctx.ellipse(x - 30 * s, y - 40 * s, 110 * s, 12 * s, -0.08, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    star(x + 120 * s, y - 70 * s, 26 * s * kg); ctx.restore();
  }
}
function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr2 = i % 2 ? r * 0.25 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill();
}
function priceTag(x, y, label, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  rr(-80, -32, 160, 64, 10); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#D9CBB8'; ctx.lineWidth = 3; ctx.stroke();

}

  const end = prog(t, window.DURATION - 0.8, window.DURATION);
  subtitle(SCENES[i].sub, lt, SCENES[i].dur + (i === SCENES.length - 1 ? 0 : 0.2));
  if (end > 0) { ctx.fillStyle = `rgba(255,244,227,${end})`; ctx.fillRect(0, 0, W, H); }
};
window.SCENES_META = SCENES.map(s => ({ start: s.start, dur: s.dur, sub: s.sub }));
window.render(0);
</script>
