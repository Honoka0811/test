<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Stroke FAST Short</title>
<style>html,body{margin:0;background:#070A14;}canvas{display:block;}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ------------------------------------------------------------
// 脳卒中の見分け方 FAST(9:16 ショート動画)
// render(t) は時刻 t[秒] の静止フレームを決定論的に描画する。
// タイムラインと演出イベントは capture.js が window.setData(timeline, events) で渡す。
// ------------------------------------------------------------
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"Noto Sans CJK JP","IPAPGothic",sans-serif';
const C = {
  bg: '#070A14', bg2: '#101830', panel: '#161F3A', panel2: '#1E2A4D', grid: '#2A3454',
  ink: '#FFFFFF', ink2: '#B9C2D6', ink3: '#7A849C',
  red: '#FF3355', yellow: '#FFD60A', cyan: '#2DD4FF', green: '#3DDC84', orange: '#FF8A3D',
};
const TILE = [
  { ch: 'F', en: 'Face', ja: '顔', color: C.red },
  { ch: 'A', en: 'Arm', ja: '腕', color: C.yellow },
  { ch: 'S', en: 'Speech', ja: '言葉', color: C.cyan },
  { ch: 'T', en: 'Time', ja: '時間', color: C.green },
];
let TL = null, EV = [], FPS = 30, DURATION = 60;
window.setData = (tl, ev) => { TL = tl; EV = ev; FPS = tl.fps; DURATION = tl.duration; window.FPS = FPS; window.DURATION = DURATION; };

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeIn = t => { t = clamp(t); return t * t * t; };
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeBack = t => { t = clamp(t); const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, s, d) => clamp((t - s) / d);
const hash = (i, j = 0) => { let x = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return x - Math.floor(x); };
const ev = (kind, i) => { const a = EV.filter(e => e.kind === kind); return i === undefined ? a : a[i]; };
const decay = (T, t0, tau) => T < t0 ? 0 : Math.exp(-(T - t0) / tau);

function text(str, x, y, { size = 48, weight = 'bold', color = C.ink, align = 'center', base = 'middle', alpha = 1, ls = 0, stroke = 0, strokeColor = '#000', glow = 0, glowColor = null } = {}) {
  ctx.save();
  ctx.globalAlpha = alpha; ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (ls) ctx.letterSpacing = ls + 'px';
  if (glow) { ctx.shadowColor = glowColor || color; ctx.shadowBlur = glow; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.restore();
}
function measure(str, size, weight = 'bold') { ctx.font = `${weight} ${size}px ${FONT}`; return ctx.measureText(str).width; }
function rrectPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function rrect(x, y, w, h, r, color, alpha = 1, { stroke = 0, strokeColor = null, glow = 0 } = {}) {
  if (w <= 0 || h <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  if (glow) { ctx.shadowColor = strokeColor || color; ctx.shadowBlur = glow; }
  rrectPath(x, y, w, h, r);
  if (color) { ctx.fillStyle = color; ctx.fill(); }
  if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor || color; ctx.stroke(); }
  ctx.restore();
}
function line(x1, y1, x2, y2, color, width = 2, alpha = 1, { dash = null, glow = 0, cap = 'round' } = {}) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = cap;
  if (dash) ctx.setLineDash(dash);
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function circle(x, y, r, color, alpha = 1, { stroke = 0, strokeColor = null, glow = 0 } = {}) {
  if (r <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  if (glow) { ctx.shadowColor = strokeColor || color; ctx.shadowBlur = glow; }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (color) { ctx.fillStyle = color; ctx.fill(); }
  if (stroke) { ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor || color; ctx.stroke(); }
  ctx.restore();
}
function arrowDown(x, y, len, color, alpha = 1, width = 14) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 18;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + len); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 34, y + len - 30); ctx.lineTo(x, y + len + 8); ctx.lineTo(x + 34, y + len - 30); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function cross(x, y, s, color, alpha = 1, width = 22) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s); ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s); ctx.stroke();
  ctx.restore();
}
function check(x, y, s, color, p, alpha = 1, width = 22) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 20;
  const a = [x - s, y], b = [x - s * 0.3, y + s * 0.7], c = [x + s, y - s * 0.7];
  ctx.beginPath(); ctx.moveTo(...a);
  if (p < 0.4) ctx.lineTo(lerp(a[0], b[0], p / 0.4), lerp(a[1], b[1], p / 0.4));
  else { ctx.lineTo(...b); const q = (p - 0.4) / 0.6; ctx.lineTo(lerp(b[0], c[0], q), lerp(b[1], c[1], q)); }
  ctx.stroke(); ctx.restore();
}
// スタンプ(回転した枠+文字)が叩き込まれる
function stamp(str, x, y, T, t0, color = C.red, size = 64, rot = -0.14) {
  if (T < t0) return;
  const p = seg(T, t0, 0.16);
  const s = lerp(2.6, 1, easeOut(p));
  const w = measure(str, size) + 70, h = size + 50;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.globalAlpha = 0.92 * p;
  rrect(-w / 2, -h / 2, w, h, 16, 'rgba(255,51,85,0.14)', 1, { stroke: 9, strokeColor: color, glow: 14 });
  text(str, 0, 4, { size, color, glow: 10 });
  ctx.restore();
}
function shakeAmt(T) {
  let a = 0;
  for (const e of EV) {
    if (e.kind === 'stamp' || e.kind === 'slam') a += 16 * decay(T, e.t, 0.12);
    if (e.kind === 'flash') a += 8 * decay(T, e.t, 0.1);
    if (e.kind === 'tick') a += 4 * decay(T, e.t, 0.08);
  }
  return Math.min(a, 26);
}

// ---------- 字幕 ----------
const KEYWORDS = ['119番', '190万個', '最悪の選択', 'FAST', '危険', '4.5時間', '命を救う', '保存', '1分', '迷わず', '必ずメモ', '片側が下がる', '片方だけ落ちる',
  'ろれつが回らない', '言葉が出ない', '脳を救う', 'たった4文字', 'どうする?', '血栓を溶かす薬', '3つ', '家族に共有', 'Face', 'Arm', 'Speech', 'Time'];
function splitHighlight(word) {
  const out = []; let rest = word;
  while (rest.length) {
    let best = null;
    for (const k of KEYWORDS) { const i = rest.indexOf(k); if (i >= 0 && (best === null || i < best[0])) best = [i, k]; }
    if (!best) { out.push([rest, false]); break; }
    if (best[0] > 0) out.push([rest.slice(0, best[0]), false]);
    out.push([best[1], true]); rest = rest.slice(best[0] + best[1].length);
  }
  return out;
}
function subtitle(str, y, alpha, scale, { size = 72, maxW = 930, hl = C.yellow } = {}) {
  const words = str.split(' ');
  const lines = [[]]; let cur = 0;
  const sp = measure(' ', size);
  for (const w of words) {
    const ww = measure(w, size);
    if (cur > 0 && cur + sp + ww > maxW) { lines.push([]); cur = 0; }
    lines[lines.length - 1].push(w); cur += (cur ? sp : 0) + ww;
  }
  const lh = size * 1.3;
  ctx.save(); ctx.translate(W / 2, y); ctx.scale(scale, scale); ctx.globalAlpha = alpha;
  lines.forEach((ws, li) => {
    const ly = (li - (lines.length - 1) / 2) * lh;
    const total = ws.reduce((a, w) => a + measure(w, size), 0) + sp * (ws.length - 1);
    let x = -total / 2;
    for (const w of ws) {
      for (const [sg, isHl] of splitHighlight(w)) {
        const sw = measure(sg, size);
        text(sg, x, ly, { size, color: isHl ? hl : C.ink, align: 'left', stroke: 14, strokeColor: 'rgba(0,0,0,0.95)' });
        x += sw;
      }
      x += sp;
    }
  });
  ctx.restore();
}
function drawSubtitle(T, sc) {
  let cur = null;
  for (const ln of sc.lines) if (T >= ln.start - 0.08) cur = ln;
  if (!cur) return;
  const p = seg(T, cur.start - 0.08, 0.2);
  subtitle(cur.text, 1400, p, lerp(0.86, 1, easeBack(p)));
}

// ---------- 背景・共通 ----------
function background(T, tint = 0) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0B1226'); g.addColorStop(0.55, C.bg); g.addColorStop(1, '#05070E');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // ゆっくり上昇する粒子
  for (let i = 0; i < 40; i++) {
    const sp = 18 + 30 * hash(i, 1);
    const x = hash(i, 2) * W + Math.sin(T * 0.5 + i) * 20;
    const y = ((hash(i, 3) * H - T * sp) % H + H) % H;
    circle(x, y, 2 + 3 * hash(i, 4), C.cyan, 0.08 + 0.12 * hash(i, 5));
  }
  // ビネット
  const v = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.25, W / 2, H * 0.45, H * 0.85);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (tint > 0) { ctx.fillStyle = `rgba(255,51,85,${0.16 * tint})`; ctx.fillRect(0, 0, W, H); }
}
function chrome(T) {
  // 進行バー
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, C.red); g.addColorStop(1, C.yellow);
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(0, 0, W, 10);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W * clamp(T / DURATION), 10);
  // 上部ピル
  const label = '救急のきほん  |  脳卒中';
  const w = measure(label, 32) + 70;
  rrect(W / 2 - w / 2, 150, w, 64, 32, 'rgba(255,255,255,0.07)', 1, { stroke: 2, strokeColor: 'rgba(255,255,255,0.18)' });
  circle(W / 2 - w / 2 + 34, 182, 9, C.red, 1, { glow: 12 });
  text(label, W / 2 + 10, 183, { size: 32, color: C.ink2, weight: 'normal' });
}
function tilesRow(y, active, size, alpha = 1, gap = 36) {
  const total = 4 * size + 3 * gap, x0 = W / 2 - total / 2 + size / 2;
  TILE.forEach((t, i) => {
    const on = active === i, s = on ? 1.28 : 1, a = alpha * (active === -1 || on ? 1 : 0.32);
    const x = x0 + i * (size + gap);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    rrect(-size / 2, -size / 2, size, size, size * 0.18, t.color, a, { glow: on ? 30 : 0 });
    text(t.ch, 0, 4, { size: size * 0.66, color: '#0B1020', alpha: a, weight: '900' });
    ctx.restore();
  });
}
function choiceCards(T, slideP = 1, states = [0, 0, 0], checkP = 0, xP = 0) {
  const items = [['A', '様子を見る'], ['B', '水を飲ませる'], ['C', 'すぐに119番']];
  items.forEach(([k, s], i) => {
    const p = easeOut(seg(slideP, i * 0.12, 0.5));
    if (p <= 0) return;
    const y = 690 + i * 150, x = 90 + (1 - p) * 220;
    const st = states[i];
    const bg = st === 1 ? 'rgba(61,220,132,0.22)' : (st === 2 ? 'rgba(255,51,85,0.10)' : C.panel);
    const bd = st === 1 ? C.green : (st === 2 ? 'rgba(255,51,85,0.6)' : C.grid);
    rrect(x, y, 900, 125, 26, bg, p, { stroke: 3, strokeColor: bd, glow: st === 1 ? 26 : 0 });
    circle(x + 80, y + 62, 42, st === 1 ? C.green : C.panel2, p, { stroke: 3, strokeColor: st === 1 ? C.green : C.grid });
    text(k, x + 80, y + 65, { size: 46, color: st === 1 ? '#0B1020' : C.ink2, alpha: p });
    text(s, x + 150, y + 65, { size: 56, color: st === 2 ? C.ink3 : C.ink, align: 'left', alpha: p });
    if (st === 1 && checkP > 0) check(x + 800, y + 62, 36, C.green, checkP, p);
    if (st === 2 && xP > 0) cross(x + 800, y + 62, 30 * easeBack(xP), C.red, p);
  });
}
function ecgValue(T) {
  let v = 0;
  for (const e of ev('heartbeat')) {
    const d = T - e.t; if (d < -0.1 || d > 0.7) continue;
    v += 0.12 * Math.exp(-Math.pow((d - 0.0) / 0.03, 2));          // P
    v += -0.25 * Math.exp(-Math.pow((d - 0.085) / 0.012, 2));      // Q
    v += 1.0 * Math.exp(-Math.pow((d - 0.1) / 0.014, 2));          // R
    v += -0.35 * Math.exp(-Math.pow((d - 0.115) / 0.012, 2));      // S
    v += 0.28 * Math.exp(-Math.pow((d - 0.32) / 0.06, 2));         // T
  }
  return v;
}
function ecg(T, y, alpha = 1) {
  const x0 = 70, x1 = W - 70, speed = 420;
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = C.red; ctx.lineWidth = 6; ctx.lineJoin = 'round';
  ctx.shadowColor = C.red; ctx.shadowBlur = 22;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += 3) {
    const tt = T - (x1 - x) / speed;
    const yy = y - ecgValue(tt) * 150;
    if (x === x0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
  }
  ctx.stroke(); ctx.restore();
  circle(x1, y - ecgValue(T) * 150, 9, '#fff', alpha, { glow: 20 });
}
function faceShape(cx, cy, r, droop, { eyeOpen = 1, confused = false } = {}) {
  circle(cx, cy, r, C.panel2, 1, { stroke: 9, strokeColor: '#fff' });
  // 眉と目(右側が下がる)
  const dy = droop * 26;
  for (const sgn of [-1, 1]) {
    const ex = cx + sgn * r * 0.4, dd = sgn > 0 ? dy : 0;
    line(ex - 40, cy - r * 0.42 + dd + (sgn > 0 ? droop * 10 : 0), ex + 40, cy - r * 0.42 + dd - (sgn > 0 ? droop * 6 : 0), '#fff', 9);
    ctx.save(); ctx.fillStyle = '#fff'; ctx.beginPath();
    ctx.ellipse(ex, cy - r * 0.2 + dd, 24, 30 * (sgn > 0 ? lerp(1, 0.55, droop) : 1) * eyeOpen, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  // 口: 左は笑顔、右は垂れ下がる
  ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.beginPath();
  const my = cy + r * 0.3;
  if (confused) {
    ctx.moveTo(cx - r * 0.45, my);
    for (let i = 1; i <= 6; i++) ctx.lineTo(cx - r * 0.45 + i * r * 0.15, my + (i % 2 ? -14 : 14));
  } else {
    ctx.moveTo(cx - r * 0.5, my - 10);
    ctx.quadraticCurveTo(cx - r * 0.2, my + r * 0.3, cx, my + r * 0.12);
    ctx.quadraticCurveTo(cx + r * 0.25, my + r * 0.3 * (1 - droop) + droop * r * 0.4, cx + r * 0.5, my - 10 + droop * r * 0.45);
  }
  ctx.stroke(); ctx.restore();
}
function bubble(x, y, w, h, str, alpha = 1, { size = 46, color = C.ink, tail = 'left', fill = '#fff', ink = '#0B1020' } = {}) {
  ctx.save(); ctx.globalAlpha = alpha;
  rrectPath(x, y, w, h, 28); ctx.fillStyle = fill; ctx.fill();
  ctx.beginPath();
  if (tail === 'left') { ctx.moveTo(x + 40, y + h - 2); ctx.lineTo(x + 10, y + h + 40); ctx.lineTo(x + 90, y + h - 2); }
  else { ctx.moveTo(x + w - 90, y + h - 2); ctx.lineTo(x + w - 10, y + h + 40); ctx.lineTo(x + w - 40, y + h - 2); }
  ctx.fill();
  text(str, x + w / 2, y + h / 2 + 3, { size, color: ink });
  ctx.restore();
}
function clockIcon(x, y, r, color, T, alpha = 1) {
  circle(x, y, r, 'rgba(255,255,255,0.04)', alpha, { stroke: 8, strokeColor: color });
  const a = T * 2 * Math.PI / 4 - Math.PI / 2;  // 4 秒で 1 周
  line(x, y, x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7, color, 8, alpha);
  line(x, y, x, y - r * 0.45, color, 8, alpha);
  circle(x, y, 8, color, alpha);
}

// ---------- シーン ----------
function sceneQuiz(T, sc, t) {
  const hb = ev('heartbeat').filter(e => e.t <= T); const last = hb.length ? hb[hb.length - 1].t : -9;
  const pulse = 1 + 0.16 * decay(T, last, 0.18);
  const a0 = easeOut(t / 0.3);
  ctx.save(); ctx.translate(W / 2, 400); ctx.scale(pulse, pulse);
  circle(0, 0, 86, 'rgba(255,51,85,0.18)', a0 * 0.8 * decay(T, last, 0.5) + 0.2);
  circle(0, 0, 70, C.red, a0, { glow: 30 });
  text('Q', 0, 6, { size: 92, color: '#fff', weight: '900' });
  ctx.restore();
  ecg(T, 580, a0);
  const ch = ev('choices', 0);
  // フック: 選択肢が出るまで「緊急クイズ」を大きく
  const hookA = easeOut(seg(t, 0.15, 0.3)) * (ch ? 1 - seg(T, ch.t - 0.25, 0.25) : 1);
  if (hookA > 0) {
    const ps = 1 + 0.03 * Math.sin(T * 8);
    ctx.save(); ctx.translate(W / 2, 860); ctx.scale(ps, ps); ctx.globalAlpha = hookA;
    rrect(-300, -60, 600, 120, 60, 'rgba(255,51,85,0.15)', 1, { stroke: 4, strokeColor: C.red, glow: 20 });
    text('緊急クイズ', 0, 4, { size: 62, color: C.red, glow: 12 });
    text('3秒で判断できる?', 0, 130, { size: 46, color: C.ink2, weight: 'normal' });
    ctx.restore();
  }
  if (ch && T >= ch.t) choiceCards(T, (T - ch.t) / 0.9);
  const tm = ev('timer', 0);
  if (tm && T >= tm.t) {
    const p = 1 - clamp((T - tm.t) / (tm.end - tm.t));
    const ticks = ev('tick').filter(e => e.t <= T); const n = ticks.length ? ticks[ticks.length - 1].n : 3;
    const tk = ticks.length ? ticks[ticks.length - 1].t : tm.t;
    rrect(90, 1225, 900, 26, 13, 'rgba(255,255,255,0.08)');
    rrect(90, 1225, 900 * p, 26, 13, p > 0.4 ? C.yellow : C.red, 1, { glow: 14 });
    const s = 1 + 0.35 * decay(T, tk, 0.15);
    ctx.save(); ctx.translate(W / 2 + 40, 1170); ctx.scale(s, s);
    text(String(n), 0, 0, { size: 76, color: p > 0.4 ? C.yellow : C.red, glow: 18 });
    ctx.restore();
    text('制限時間', W / 2 - 90, 1172, { size: 34, color: C.ink3, weight: 'normal' });
  }
}
function sceneAnswer(T, sc, t) {
  const cr = ev('correct', 0), wr = ev('wrong', 0), st = ev('stamp', 0);
  const checkP = cr ? easeOut((T - cr.t) / 0.4) : 0, xP = wr ? seg(T, wr.t, 0.25) : 0;
  const states = [T >= (wr ? wr.t : 1e9) ? 2 : 0, T >= (wr ? wr.t : 1e9) ? 2 : 0, T >= (cr ? cr.t : 1e9) ? 1 : 0];
  // 「正解!」バースト
  const p = easeBack(seg(t, 0.05, 0.35));
  ctx.save(); ctx.translate(W / 2, 430);
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2 + t * 0.6;
    line(Math.cos(a) * 120, Math.sin(a) * 120, Math.cos(a) * (170 + 40 * p), Math.sin(a) * (170 + 40 * p), C.yellow, 6, 0.5 * p);
  }
  ctx.scale(p, p); text('正解!', 0, 0, { size: 120, color: C.yellow, weight: '900', glow: 30, stroke: 10, strokeColor: 'rgba(0,0,0,0.6)' });
  ctx.restore();
  choiceCards(T, 1, states, checkP, xP);

const SCENE_FN = { quiz: sceneQuiz, answer: sceneAnswer, why: sceneWhy, fast: sceneFast, F: (T, s, t) => sceneLetter(T, s, t, 0), A: (T, s, t) => sceneLetter(T, s, t, 1),

const TINT = { why: 1, ng: 0.8, answer: 0.3, T: 0.4 };

window.render = function (T) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const tint = (TINT[sc.id] || 0) * (sc.id === 'why' ? easeOut(seg(t, 2.5, 2)) : easeOut(t / 0.5));

  // 画面揺れ

  if (sh > 0) ctx.translate((hash(Math.floor(T * 60), 21) - 0.5) * 2 * sh, (hash(Math.floor(T * 60), 22) - 0.5) * 2 * sh);

  if (fo > 0) { ctx.fillStyle = `rgba(7,10,20,${fo})`; ctx.fillRect(0, 0, W, H); }
};
