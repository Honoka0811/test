const MOON = [118, 138, 178], DAWN1 = [196, 150, 150], DAY = [245, 232, 205];

// ---- 字幕 ----

      const z = Math.max(0, 1 - Math.abs(t - EV.t_morning) / 0.3); if (z) { ctx.fillStyle = `rgba(255,255,255,${z})`; ctx.fillRect(0, 0, W, H); } grain = 0.08; }

      room(t, f, { z: lerp(1.1, 1.6, k), cx: lerp(560, 700, k), cy: lerp(780, 760, k), two: true }); fadeIn(EV.t_night2, 0.5); }
    else { // ゆっくり起き上がり、こちらへ寄ってくる
      const u = prog(t, EV.move + 0.6, EV.move + 2.9), rise = u * u * (3 - 2 * u), lean = 0.5 * ease(prog(t, LN.now.start - 0.2, EV.hit)) ** 2;
      sideView(t, f, rise + (rise > 0 && rise < 1 ? (hash(f) - 0.5) * 0.008 : 0), lean); fadeIn(EV.move, 0.4); }
    const g = ctx.createLinearGradient(0, 1330, 0, 1500); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.8)'); ctx.fillStyle = g; ctx.fillRect(0, 1330, W, 600);
  } else if (t < EV.hit + 0.5) {
    const k = (t - EV.hit) / 0.5; sideView(t, f, 1, 0.5 + 6 * k * k + (hash(f) - 0.5) * 0.1);
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = f % 2 ? '#ff4038' : '#ffffff'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 9; i++) { const y = hash(f * 3 + i) * H | 0, h = 30 + hash(f + i) * 140 | 0, dx = (hash(f * 7 + i) - 0.5) * 400 | 0; ctx.drawImage(cv, 0, y, W, h, dx, y, W, h); }
    grain = 0.3;
  } else {
    if (t < EV.hit + 0.6) noise(0.7, f, 5, 'source-over');
    const a = prog(t, EV.hit + 0.7, EV.hit + 1.0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `800 64px ${MIN}`; ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillText('夜中に呼ばれても', W / 2, 860);
    ctx.fillStyle = `rgba(255,43,43,${a})`; ctx.fillText('返事をしてはいけない。', W / 2, 960);
    ctx.font = `800 38px ${MIN}`; ctx.fillStyle = `rgba(190,190,190,${a * 0.85})`; ctx.fillText('ナレーション  VOICEVOX:四国めたん', W / 2, 1250);
  }
  subtitle(t);
  noise(grain, f + 17, 2, 'overlay');
  const v = ctx.createRadialGradient(W / 2, H / 2, 520, W / 2, H / 2, 1180); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

window.FPS = FPS; window.DURATION = DURATION; window.render = render;
window.ready = document.fonts.load(`800 60px "Shippori Mincho"`, D.lines.map(l => l.text).join('') + '返事をしてはいけない禁夜中に呼ばれても。ナレーション四国めたん').then(() => document.fonts.ready);
if (!navigator.webdriver) window.ready.then(() => { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
