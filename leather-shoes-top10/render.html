<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Leather Shoes Top10</title>
<style>
  html,body{margin:0;background:#110d0a;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ------------------------------------------------------------
// 革靴ブランド TOP10  (9:16 ショート動画)
// render(t) は時刻 t[秒] のフレームを決定論的に描画する。
// シーンの尺は timeline.json(narrate.py が音声から生成)、写真は photos.json に従う。
// ------------------------------------------------------------
const W = 1080, H = 1920, FPS = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"IPAPGothic","IPAGothic","Noto Color Emoji",sans-serif';
const SERIF = '"IPAPMincho","IPAMincho","Noto Serif CJK JP",serif';
const C = {
  bg: '#110d0a', bg2: '#1d1612', ink: '#fbf6ef', ink2: '#d9cfc3', ink3: '#9b8f82',
  gold: '#E2B565', gold2: '#F6D998', red: '#E5484D', shadow: 'rgba(0,0,0,0.55)'
};

// ---------- ブランドデータ(価格は既製靴のおおよその目安) ----------
const BRANDS = {
  r10: { rank: 10, name: 'REGAL', kana: 'リーガル', country: '🇯🇵 日本', price: 20000, model: '2504 プレーントゥ' },
  r9:  { rank: 9,  name: 'Paraboot', kana: 'パラブーツ', country: '🇫🇷 フランス', price: 70000, model: 'シャンボード' },
  r8:  { rank: 8,  name: 'Santoni', kana: 'サントーニ', country: '🇮🇹 イタリア', price: 120000, model: 'ダブルモンク' },
  r7:  { rank: 7,  name: 'Alden', kana: 'オールデン', country: '🇺🇸 アメリカ', price: 100000, model: '990 コードバン' },
  r6:  { rank: 6,  name: 'J.M. Weston', kana: 'ジェイエムウエストン', country: '🇫🇷 フランス', price: 120000, model: '180 ローファー' },
  r5:  { rank: 5,  name: 'Crockett & Jones', kana: 'クロケット&ジョーンズ', country: '🇬🇧 イギリス', price: 100000, model: 'オードリー' },
  r4:  { rank: 4,  name: "Church's", kana: 'チャーチ', country: '🇬🇧 イギリス', price: 120000, model: 'コンサル' },
  r3:  { rank: 3,  name: 'Berluti', kana: 'ベルルッティ', country: '🇫🇷 フランス', price: 250000, model: 'アレッサンドロ' },
  r2:  { rank: 2,  name: 'Edward Green', kana: 'エドワードグリーン', country: '🇬🇧 イギリス', price: 200000, model: 'チェルシー' },
  r1:  { rank: 1,  name: 'John Lobb', kana: 'ジョンロブ', country: '🇬🇧 イギリス', price: 250000, model: 'シティII' },
};
const ORDER = ['r10', 'r9', 'r8', 'r7', 'r6', 'r5', 'r4', 'r3', 'r2', 'r1'];

let TL = null, SC = {}, PH = {}, IMG = {}, DURATION = 60;

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeIn = t => { t = clamp(t); return t * t * t; };
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const backOut = t => { t = clamp(t); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, s, d) => clamp((t - s) / d);
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const yen = n => '¥' + Math.round(n).toLocaleString('en-US');

function text(str, x, y, o = {}) {
  const { size = 48, weight = 'bold', color = C.ink, align = 'center', base = 'middle', alpha = 1,
          font = FONT, stroke = 0, strokeColor = '#000', shadow = 0, ls = 0, maxW = 0 } = o;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (ls) ctx.letterSpacing = ls + 'px';
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) { ctx.translate(x, y); ctx.scale(maxW / w, 1); x = 0; y = 0; } }
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = shadow; ctx.shadowOffsetY = shadow / 3; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(str, x, y); ctx.shadowColor = 'transparent'; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function rrectPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rrect(x, y, w, h, r, fill, alpha = 1) {
  if (w <= 0 || h <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = fill; rrectPath(x, y, w, h, r); ctx.fill(); ctx.restore();
}

// ---------- 写真 ----------
// 写真をボックスにカバー表示し、ゆっくりズーム&パン(Ken Burns)
function photo(key, x, y, w, h, p, { zoom = [1.04, 1.16], pan = [0, 0, 0, 0], alpha = 1, blur = 0, gray = 0, bright = 1 } = {}) {
  const img = IMG[key];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  if (!img) {
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, '#3a2a1e'); g.addColorStop(1, '#1a120c');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
    text('PHOTO: ' + key, x + w / 2, y + h / 2, { size: 40, color: C.ink3 });
    ctx.restore(); return;
  }
  const meta = PH[key] || {};
  const z = lerp(zoom[0], zoom[1], p);
  const s = Math.max(w / img.width, h / img.height) * z;
  const iw = img.width * s, ih = img.height * s;
  const fx = meta.fx ?? 0.5, fy = meta.fy ?? 0.5;     // 被写体の位置(0..1)
  let cx = x + w / 2 - (fx - 0.5) * iw + lerp(pan[0], pan[2], p);
  let cy = y + h / 2 - (fy - 0.5) * ih + lerp(pan[1], pan[3], p);
  cx = clamp(cx, x + w - iw / 2, x + iw / 2); cy = clamp(cy, y + h - ih / 2, y + ih / 2);
  const f = [];
  if (blur) f.push(`blur(${blur}px)`); if (gray) f.push(`grayscale(${gray})`); if (bright !== 1) f.push(`brightness(${bright})`);
  if (f.length) ctx.filter = f.join(' ');
  ctx.drawImage(img, cx - iw / 2, cy - ih / 2, iw, ih);
  ctx.restore();
}
function credit(keys, y, alpha = 1) {
  const s = keys.map(k => PH[k] && PH[k].credit).filter(Boolean);
  if (!s.length) return;
  text('Photo: ' + [...new Set(s)].join(' / '), W - 24, y, { size: 19, weight: 'normal', color: 'rgba(255,255,255,0.75)', align: 'right', alpha, maxW: W - 48, shadow: 6 });
}

// ---------- 背景・共通UI ----------
function background(t, tint = 0) {
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 100, W / 2, H * 0.5, H * 0.75);
  g.addColorStop(0, tint ? '#3a2410' : '#2a1d14'); g.addColorStop(1, C.bg);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 革のステッチ風の点線
  ctx.save(); ctx.strokeStyle = 'rgba(226,181,101,0.18)'; ctx.lineWidth = 3; ctx.setLineDash([14, 12]);
  ctx.lineDashOffset = -t * 30;
  ctx.strokeRect(28, 28, W - 56, H - 56); ctx.restore();
}
function vignette(a = 0.6) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function flash(a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = clamp(a); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function shake(t, t0, amp = 18, dur = 0.35) {
  const p = seg(t, t0, dur); if (p <= 0 || p >= 1) return;
  const k = (1 - p) * amp; ctx.translate((hash(t * 97) - 0.5) * 2 * k, (hash(t * 53 + 1) - 0.5) * 2 * k);
}
// 上部のランキング進行バー(10 → 1)
function progress(t, cur) {
  const x0 = 120, x1 = W - 120, y = 96;
  text('革靴ブランド TOP10', W / 2, 56, { size: 34, color: C.gold2, ls: 4, shadow: 8 });
  for (let i = 0; i < 10; i++) {
    const id = ORDER[i], x = lerp(x0, x1, i / 9);
    const done = ORDER.indexOf(cur) >= i;
    const active = cur === id;
    const r = active ? 22 + 3 * Math.sin(t * 8) : 16;
    ctx.save(); ctx.beginPath(); ctx.arc(x, y + 34, r, 0, Math.PI * 2);
    ctx.fillStyle = active ? C.gold : done ? 'rgba(226,181,101,0.55)' : 'rgba(255,255,255,0.14)'; ctx.fill(); ctx.restore();
    text(String(10 - i), x, y + 35, { size: active ? 24 : 19, color: active ? '#1b130c' : done ? '#1b130c' : C.ink3 });
  }
}
// 下部の字幕
function subtitle(str, t, s0, alpha = 1) {
  const p = easeOut(seg(t, s0, 0.25));
  const size = 50;
  ctx.save(); ctx.font = `bold ${size}px ${FONT}`;
  const lines = wrap(str, W - 160);
  ctx.restore();
  const lh = size * 1.32, h = lines.length * lh + 44, y = 1660 - h / 2 + (1 - p) * 30;
  rrect(60, y, W - 120, h, 26, 'rgba(10,7,5,0.78)', alpha * p);
  lines.forEach((l, i) => text(l, W / 2, y + 22 + lh * (i + 0.5), { size, alpha: alpha * p, color: C.ink }));
}
function wrap(str, maxW) {
  const out = []; let cur = '';
  for (const ch of str) {
    if (ctx.measureText(cur + ch).width > maxW && cur) {
      // 句読点・閉じ括弧は行頭に来ないように前の行へ
      if ('、。」』！？…'.includes(ch)) { cur += ch; continue; }
      out.push(cur); cur = ch;
    } else cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}

// ---------- シーン ----------
function sceneHook(t, s) {
  const lt = t - s.start;
  // 写真の高速カット(0.45 秒ごと)
  const cuts = ['hook1', 'hook2', 'hook3', 'hook4', 'hook5', 'hook6', 'hook7'];
  const i = Math.min(cuts.length - 1, Math.floor(lt / 0.45));
  const p = (lt % 0.45) / 0.45;
  photo(cuts[i], 0, 0, W, H, p, { zoom: [1.25, 1.08], bright: 0.75 });
  vignette(0.8);
  flash(0.55 * (1 - seg(lt % 0.45, 0, 0.12)) * (i > 0 ? 1 : 0));
  ctx.save(); shake(t, s.start, 22, 0.4);
  const a = backOut(seg(lt, 0.05, 0.35));
  ctx.translate(W / 2, 820); ctx.scale(lerp(2.2, 1, a), lerp(2.2, 1, a));
  text('一生モノの革靴', 0, 0, { size: 118, color: C.ink, stroke: 14, strokeColor: '#140d08', alpha: clamp(a * 2), shadow: 30 });
  ctx.restore();
  const b = backOut(seg(lt, 0.9, 0.35));
  ctx.save(); ctx.translate(W / 2, 1000); ctx.scale(lerp(0.3, 1, b), lerp(0.3, 1, b));
  text('どれを選ぶ？', 0, 0, { size: 150, color: C.gold2, stroke: 16, strokeColor: '#140d08', alpha: clamp(b * 2), shadow: 30 });
  ctx.restore();
  credit([cuts[i]], H - 50);
}

function sceneIntro(t, s) {
  const lt = t - s.start, d = s.dur;
  background(t);
  // 写真コラージュ(3×3)が順に飛び込む
  const keys = ['r10a', 'r9a', 'r8a', 'r7a', 'r6a', 'r5a', 'r4a', 'r3a', 'r2a'];
  const cw = 330, ch = 330, gx = (W - cw * 3 - 24 * 2) / 2, gy = 560;
  keys.forEach((k, i) => {
    const p = backOut(seg(lt, 0.05 + i * 0.07, 0.35));
    const x = gx + (i % 3) * (cw + 24), y = gy + Math.floor(i / 3) * (ch + 24);
    ctx.save();
    ctx.translate(x + cw / 2, y + ch / 2); ctx.scale(p, p); ctx.rotate((hash(i) - 0.5) * 0.12 * (1 - p));
    ctx.beginPath(); rrectPath(-cw / 2, -ch / 2, cw, ch, 18); ctx.clip();
    photo(k, -cw / 2, -ch / 2, cw, ch, lt / d, { zoom: [1.05, 1.15], gray: 0.15, bright: 0.85 });
    ctx.restore();
    // 謎の「?」を1位に(真ん中には置かず、右下を1位に置き換え)
  });
  // 中央のタイトル帯
  const a = easeOut(seg(lt, 0.1, 0.4));
  rrect(0, 330 - 10, W * a, 200, 0, 'rgba(10,7,5,0.88)');
  text('世界の革靴ブランド', W / 2 - (1 - a) * 300, 380, { size: 66, color: C.ink, alpha: a });
  const b = backOut(seg(lt, 0.45, 0.4));
  ctx.save(); ctx.translate(W / 2, 470); ctx.scale(lerp(1.8, 1, b), lerp(1.8, 1, b));
  text('TOP 10', 0, 0, { size: 120, font: SERIF, color: C.gold, alpha: clamp(b * 2), stroke: 6, strokeColor: '#140d08', ls: 8 });
  ctx.restore();
  const c = easeOut(seg(lt, 1.2, 0.4));
  rrect(140, 1680, W - 280, 110, 55, C.red, c);
  text('1位は最後に発表！', W / 2, 1736, { size: 54, alpha: c });
  text('※知名度・品質・歴史をもとにした独自選定 / 価格は既製靴の目安', W / 2, 1840, { size: 24, weight: 'normal', color: C.ink3, alpha: c });
  credit(keys, 1630, a * 0.8);
}

function sceneRank(t, s) {
  const b = BRANDS[s.id], lt = t - s.start, d = s.dur, top3 = b.rank <= 3, gold = b.rank === 1;
  background(t, top3);
  // 写真2枚: 前半A → 後半B(クロスズーム)
  const ka = s.id + 'a', kb = s.id + 'b';
  const sw = d * 0.5;
  const px = 0, py = 170, pw = W, ph = 1060;
  // シーン頭のスワイプイン
  const enter = easeOut(seg(lt, 0, 0.35));
  ctx.save();
  ctx.translate((1 - enter) * W * 0.9, 0);
  photo(ka, px, py, pw, ph, lt / sw, { zoom: [1.18, 1.05], pan: [-30, 0, 30, 0] });
  const xb = easeInOut(seg(lt, sw - 0.25, 0.5));
  if (xb > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(px + pw * (1 - xb), py, pw * xb, ph); ctx.clip();
    photo(kb, px, py, pw, ph, seg(lt, sw - 0.25, d - sw + 0.25), { zoom: [1.05, 1.17], pan: [20, -10, -20, 10] });
    ctx.restore();
    // 境目の光の線
    if (xb < 1) { ctx.fillStyle = 'rgba(255,240,210,0.9)'; ctx.fillRect(px + pw * (1 - xb) - 4, py, 8, ph); }
  }
  // 写真の下側をグラデーションで背景になじませる
  const g = ctx.createLinearGradient(0, py + ph - 420, 0, py + ph);
  g.addColorStop(0, 'rgba(17,13,10,0)'); g.addColorStop(1, 'rgba(17,13,10,1)');
  ctx.fillStyle = g; ctx.fillRect(px, py + ph - 420, pw, 420);
  const g2 = ctx.createLinearGradient(0, py, 0, py + 160);
  g2.addColorStop(0, 'rgba(17,13,10,0.85)'); g2.addColorStop(1, 'rgba(17,13,10,0)');
  ctx.fillStyle = g2; ctx.fillRect(px, py, pw, 160);
  ctx.restore();
  credit(xb > 0.5 ? [kb] : [ka], py + 60, 0.9);

  // 順位: 巨大な数字がスラム
  ctx.save(); shake(t, s.start + 0.12, top3 ? 26 : 16, 0.35);
  const r = backOut(seg(lt, 0.08, 0.32));
  const rx = 70, ry = 1120;
  ctx.translate(rx, ry); ctx.scale(lerp(2.6, 1, r), lerp(2.6, 1, r));
  const col = gold ? C.gold2 : top3 ? C.gold : C.ink;
  text('第', 0, -10, { size: 70, align: 'left', base: 'alphabetic', color: col, alpha: clamp(r * 2), stroke: 10, strokeColor: '#140d08' });
  text(String(b.rank), 76, 20, { size: 250, font: SERIF, align: 'left', base: 'alphabetic', color: col, alpha: clamp(r * 2), stroke: 12, strokeColor: '#140d08', shadow: 30 });
  const nw = b.rank === 10 ? 255 : 140;
  text('位', 76 + nw, -10, { size: 70, align: 'left', base: 'alphabetic', color: col, alpha: clamp(r * 2), stroke: 10, strokeColor: '#140d08' });
  ctx.restore();
  if (top3) {
    const k = easeOut(seg(lt, 0.3, 0.3));
    rrect(W - 300, 960, 240, 74, 37, C.red, k);
    text(gold ? '👑 KING' : 'TOP 3', W - 180, 998, { size: 40, alpha: k });
  }

  // ブランド名
  const n = easeOut(seg(lt, 0.35, 0.4));
  text(b.name, 70 - (1 - n) * 80, 1225, { size: gold ? 108 : 96, font: SERIF, align: 'left', color: gold ? C.gold2 : C.ink, alpha: n, maxW: W - 140, shadow: 16 });
  text(b.kana + '  ' + b.country, 74 - (1 - n) * 120, 1310, { size: 44, align: 'left', color: C.ink2, alpha: n, maxW: W - 140 });

  // 価格タグ(カウントアップ)と代表モデル
  const pc = easeOut(seg(lt, 1.4, 0.55));
  const pa = easeOut(seg(lt, 1.3, 0.3));
  rrect(70, 1372, 460, 92, 18, gold ? C.gold : 'rgba(226,181,101,0.95)', pa);
  text('価格目安', 100, 1418, { size: 28, align: 'left', color: '#2a1a0c', alpha: pa });
  text(yen(b.price * pc) + '〜', 505, 1420, { size: 50, align: 'right', color: '#1b130c', alpha: pa });
  const ma = easeOut(seg(lt, 1.7, 0.35));
  rrect(550, 1372, 460, 92, 18, 'rgba(255,255,255,0.1)', ma);
  text('代表作', 580, 1418, { size: 28, align: 'left', color: C.ink3, alpha: ma });
  text(b.model, 990, 1420, { size: 40, align: 'right', color: C.ink, alpha: ma, maxW: 300 });

  subtitle(s.sub, t, s.start + 0.6);
  progress(t, s.id);
  // 切り替わりのフラッシュ
  flash(0.7 * (1 - seg(lt, 0, 0.18)));
  if (gold) { confetti(t, s.start); flash(1 - seg(lt, 0, 0.35)); }
}

function sceneTease(t, s) {
  const lt = t - s.start, d = s.dur;
  ctx.fillStyle = '#050403'; ctx.fillRect(0, 0, W, H);
  // 1位の写真をシルエット(強いぼかし)で見せて焦らす
  const beat = Math.pow(Math.abs(Math.sin(lt * Math.PI * 2.07)), 8);
  photo('r1a', 0, 300, W, 1100, lt / d, { zoom: [1.3, 1.5], blur: 34, bright: 0.25 + 0.15 * beat });
  vignette(0.9);
  ctx.save(); const z = 1 + 0.04 * beat; ctx.translate(W / 2, 820); ctx.scale(z, z);
  text('第1位は…', 0, 0, { size: 150, color: C.gold2, stroke: 14, strokeColor: '#000', alpha: easeOut(seg(lt, 0.1, 0.4)), shadow: 40 });
  ctx.restore();
  text('？', W / 2, 1080, { size: 260, font: SERIF, color: 'rgba(255,255,255,0.85)', alpha: easeOut(seg(lt, 0.6, 0.4)) * (0.6 + 0.4 * beat) });
  progress(t, 'r1');
  subtitle(s.sub, t, s.start + 0.1);
  // 最後の 0.5 秒は暗転
  ctx.save(); ctx.globalAlpha = easeIn(seg(lt, d - 0.5, 0.45)); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore();
}

function confetti(t, t0) {
  const lt = t - t0; if (lt < 0 || lt > 4) return;
  for (let i = 0; i < 140; i++) {
    const vx = (hash(i) - 0.5) * 900, vy = -500 - hash(i + 9) * 900;
    const x = W / 2 + vx * lt, y = 900 + vy * lt + 700 * lt * lt;
    if (y > H + 40) continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate(lt * (3 + hash(i + 3) * 8));
    ctx.globalAlpha = clamp(1.6 - lt * 0.45);
    ctx.fillStyle = [C.gold, C.gold2, '#fff', '#C98A3B'][i % 4];
    ctx.fillRect(-9, -4, 18, 8 + 8 * Math.abs(Math.sin(lt * 9 + i))); ctx.restore();
  }
}

function sceneOutro(t, s) {
  const lt = t - s.start, d = s.dur;
  background(t);
  // 背景に1位の写真を大きく
  photo('r1b', 0, 0, W, H, lt / d, { zoom: [1.1, 1.2], bright: 0.28, blur: 4 });
  vignette(0.6);
  text('ランキングまとめ', W / 2, 190, { size: 64, color: C.gold2, alpha: easeOut(seg(lt, 0, 0.3)), shadow: 12 });
  const rows = [...ORDER].reverse();
  rows.forEach((id, i) => {
    const b = BRANDS[id], p = easeOut(seg(lt, 0.15 + i * 0.08, 0.35));
    const y = 290 + i * 104;
    rrect(90 - (1 - p) * 200, y, W - 180, 88, 16, i === 0 ? 'rgba(226,181,101,0.92)' : 'rgba(20,14,10,0.78)', p);
    const c = i === 0 ? '#1b130c' : C.ink;
    text(`${b.rank}位`, 130 - (1 - p) * 200, y + 46, { size: 40, align: 'left', color: i === 0 ? '#1b130c' : C.gold, alpha: p });
    text(b.name, 270 - (1 - p) * 200, y + 46, { size: 42, font: SERIF, align: 'left', color: c, alpha: p, maxW: 470 });
    text(yen(b.price) + '〜', W - 120 - (1 - p) * 200, y + 46, { size: 32, align: 'right', color: i === 0 ? '#2a1a0c' : C.ink2, alpha: p });
  });
  const c = backOut(seg(lt, 1.2, 0.4));
  ctx.save(); ctx.translate(W / 2, 1400); ctx.scale(c, c);
  rrect(-430, -80, 860, 160, 30, C.red);
  text('最初の一足なら', 0, -32, { size: 40, color: '#ffe9e9' });
  text('黒のストレートチップ', 0, 28, { size: 62 });
  ctx.restore();
  const e = easeOut(seg(lt, 2.6, 0.4)), pulse = 1 + 0.05 * Math.sin(lt * 7);
  ctx.save(); ctx.translate(W / 2, 1600); ctx.scale(pulse, pulse);
  rrect(-330, -52, 660, 104, 52, C.gold, e);
  text('🔖 保存して見返そう', 0, 2, { size: 48, color: '#1b130c', alpha: e });
  ctx.restore();
  const cr = ['ナレーション: VOICEVOX:青山龍星', 'BGM・効果音: 自作', '写真: Wikimedia Commons(各写真に撮影者・ライセンスを表示)'];
  cr.forEach((l, i) => text(l, W / 2, 1745 + i * 36, { size: 24, weight: 'normal', color: C.ink3, alpha: e }));
}

function render(t) {
  if (!TL) return;
  ctx.save(); ctx.clearRect(0, 0, W, H);
  const s = TL.scenes.find(s => t >= s.start && t < s.start + s.dur) || TL.scenes[TL.scenes.length - 1];
  if (s.id === 'hook') sceneHook(t, s);
  else if (s.id === 'intro') sceneIntro(t, s);
  else if (s.id === 'tease') sceneTease(t, s);
  else if (s.id === 'outro') sceneOutro(t, s);
  else sceneRank(t, s);
  if (s.id === 'intro') flash(0.6 * (1 - seg(t - s.start, 0, 0.2)));
  ctx.restore();
  // 最後にフェードアウト
  const fo = seg(t, DURATION - 0.6, 0.6);
  if (fo > 0) { ctx.save(); ctx.globalAlpha = fo; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

async function load() {
  TL = await (await fetch('timeline.json')).json();
  DURATION = TL.total; window.DURATION = DURATION;
  try { PH = await (await fetch('photos.json')).json(); } catch (e) { PH = {}; }
  await Promise.all(Object.entries(PH).map(([k, m]) => new Promise(res => {
    const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.onerror = () => res(); im.src = 'photos/' + m.file;
  })));
  await document.fonts.ready;
}
window.FPS = FPS;
window.render = render;
window.ready = load().then(() => {
  render(0);
  if (!navigator.webdriver) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
});
</script>
