<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Leather Shoes Top10</title>
<style>
  html,body{margin:0;background:#110d0a;}
  canvas{display:block;}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ------------------------------------------------------------
// 革靴ブランド TOP10  (9:16 ショート動画)
// render(t) は時刻 t[秒] のフレームを決定論的に描画する。
// シーンの尺は timeline.json(narrate.py が音声から生成)。写真は使わず、革靴はイラストとして描く。
// ------------------------------------------------------------
const W = 1080, H = 1920, FPS = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const FONT = '"IPAPGothic","IPAGothic","Noto Color Emoji",sans-serif';
const SERIF = '"IPAPMincho","IPAMincho","Noto Serif CJK JP",serif';
const C = {
  bg: '#110d0a', bg2: '#1d1612', ink: '#fbf6ef', ink2: '#d9cfc3', ink3: '#9b8f82',
  gold: '#E2B565', gold2: '#F6D998', red: '#E5484D', shadow: 'rgba(0,0,0,0.55)'
};

// ---------- ブランドデータ(価格は既製靴のおおよその目安) ----------
const BRANDS = {
  r10: { rank: 10, name: 'REGAL', kana: 'リーガル', country: '🇯🇵 日本', price: 20000, model: '2504 プレーントゥ', shoe: { type: 'plain', c: ['#3a3a3e', '#0c0c0e'] } },
  r9:  { rank: 9,  name: 'Paraboot', kana: 'パラブーツ', country: '🇫🇷 フランス', price: 70000, model: 'シャンボード', shoe: { type: 'chambord', c: ['#8a5a34', '#3b220f'], sole: 'chunky' } },
  r8:  { rank: 8,  name: 'Santoni', kana: 'サントーニ', country: '🇮🇹 イタリア', price: 120000, model: 'ダブルモンク', shoe: { type: 'monk', c: ['#b07040', '#3a1d0c'], grad: true } },
  r7:  { rank: 7,  name: 'Alden', kana: 'オールデン', country: '🇺🇸 アメリカ', price: 100000, model: '990 コードバン', shoe: { type: 'plain', c: ['#7a2430', '#2a070c'], sole: 'thick' } },
  r6:  { rank: 6,  name: 'J.M. Weston', kana: 'ジェイエムウエストン', country: '🇫🇷 フランス', price: 120000, model: '180 ローファー', shoe: { type: 'loafer', c: ['#6a3c22', '#26130a'] } },
  r5:  { rank: 5,  name: 'Crockett & Jones', kana: 'クロケット&ジョーンズ', country: '🇬🇧 イギリス', price: 100000, model: 'オードリー', shoe: { type: 'captoe', c: ['#b9824c', '#5a3416'] } },
  r4:  { rank: 4,  name: "Church's", kana: 'チャーチ', country: '🇬🇧 イギリス', price: 120000, model: 'コンサル', shoe: { type: 'captoe', c: ['#2e2e33', '#08080a'], brogue: true } },
  r3:  { rank: 3,  name: 'Berluti', kana: 'ベルルッティ', country: '🇫🇷 フランス', price: 250000, model: 'アレッサンドロ', shoe: { type: 'wholecut', c: ['#5a6fb0', '#3a1640'], patina: true } },
  r2:  { rank: 2,  name: 'Edward Green', kana: 'エドワードグリーン', country: '🇬🇧 イギリス', price: 200000, model: 'チェルシー', shoe: { type: 'captoe', c: ['#9a5a2c', '#3c1a08'], grad: true } },
  r1:  { rank: 1,  name: 'John Lobb', kana: 'ジョンロブ', country: '🇬🇧 イギリス', price: 250000, model: 'シティII', shoe: { type: 'captoe', c: ['#34343a', '#060607'], gold: true } },
};
const ORDER = ['r10', 'r9', 'r8', 'r7', 'r6', 'r5', 'r4', 'r3', 'r2', 'r1'];

let TL = null, DURATION = 60;

// ---------- ユーティリティ ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeIn = t => { t = clamp(t); return t * t * t; };
const easeInOut = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const backOut = t => { t = clamp(t); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, s, d) => clamp((t - s) / d);
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const yen = n => '¥' + Math.round(n).toLocaleString('en-US');

function text(str, x, y, o = {}) {
  const { size = 48, weight = 'bold', color = C.ink, align = 'center', base = 'middle', alpha = 1,
          font = FONT, stroke = 0, strokeColor = '#000', shadow = 0, ls = 0, maxW = 0 } = o;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if (ls) ctx.letterSpacing = ls + 'px';
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) { ctx.translate(x, y); ctx.scale(maxW / w, 1); x = 0; y = 0; } }
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = shadow; ctx.shadowOffsetY = shadow / 3; }
  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = stroke; ctx.strokeStyle = strokeColor; ctx.strokeText(str, x, y); ctx.shadowColor = 'transparent'; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function rrectPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rrect(x, y, w, h, r, fill, alpha = 1) {
  if (w <= 0 || h <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = fill; rrectPath(x, y, w, h, r); ctx.fill(); ctx.restore();
}

// ---------- 革靴のイラスト(横から見た図、つま先が右) ----------
// 座標は靴の長さ 1000 の単位系。原点はかかと下端付近。
function topY(x) { // 履き口〜甲のラインの高さ(紐やストラップの位置を決めるのに使う)
  if (x <= 300) return lerp(-248, -224, (x - 60) / 240);
  if (x <= 480) return lerp(-224, -266, (x - 300) / 180);
  return lerp(-266, -200, (x - 480) / 150);
}
function upperPath(type) {
  ctx.beginPath();
  ctx.moveTo(40, -24);
  if (type === 'loafer') {
    ctx.bezierCurveTo(5, -105, 14, -195, 62, -236);
    ctx.bezierCurveTo(150, -228, 260, -210, 340, -210);
    ctx.bezierCurveTo(420, -212, 470, -228, 520, -228);
    ctx.bezierCurveTo(620, -224, 700, -186, 760, -152);
  } else {
    ctx.bezierCurveTo(5, -110, 12, -200, 60, -248);
    ctx.bezierCurveTo(150, -240, 240, -222, 300, -224);
    ctx.bezierCurveTo(380, -238, 430, -262, 480, -266);
    ctx.bezierCurveTo(600, -262, 690, -200, 760, -152);
  }
  ctx.bezierCurveTo(850, -128, 922, -116, 958, -98);
  ctx.bezierCurveTo(1008, -76, 1012, -34, 978, -22);
  ctx.lineTo(40, -24);
  ctx.closePath();
}
function solePath(ts) {
  const hh = ts + 34;
  ctx.beginPath();
  ctx.moveTo(18, -26); ctx.lineTo(985, -26);
  ctx.quadraticCurveTo(1022, -22, 1004, ts - 8);
  ctx.quadraticCurveTo(880, ts + 26, 660, hh - 4);
  ctx.lineTo(560, hh - 4);
  ctx.quadraticCurveTo(420, hh - 22, 262, hh - 10);
  ctx.lineTo(250, hh); ctx.lineTo(28, hh); ctx.lineTo(18, -26);
  ctx.closePath();
}
function stitch(fn, color, w = 4, dash = [10, 8]) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.setLineDash(dash); ctx.lineCap = 'round';
  ctx.beginPath(); fn(); ctx.stroke(); ctx.restore();
}
function seam(fn, w = 5, color = 'rgba(0,0,0,0.55)') {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); fn(); ctx.stroke(); ctx.restore();
}
// spec: { type, c:[明, 暗], sole, grad, patina, brogue, gold }
// o: { sil: シルエット化(0..1), sweep: 光沢の帯の位置(0..1, 範囲外なら無し) }
function drawShoe(spec, x, y, k, o = {}) {
  const { rot = 0, sil = 0, sweep = -1, alpha = 1 } = o;
  const ts = spec.sole === 'chunky' ? 44 : spec.sole === 'thick' ? 30 : 22;
  const stitchCol = spec.gold ? 'rgba(240,200,120,0.75)' : 'rgba(255,235,210,0.28)';
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k); ctx.translate(-505, 120);
  // 影
  ctx.save(); ctx.globalAlpha = alpha * 0.55; ctx.fillStyle = '#000'; ctx.filter = 'blur(18px)';
  ctx.beginPath(); ctx.ellipse(510, ts + 50, 520, 34, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // ソール
  solePath(ts);
  const sg = ctx.createLinearGradient(0, -26, 0, ts + 34);
  sg.addColorStop(0, spec.sole === 'chunky' ? '#3a2a1e' : '#2a1a10'); sg.addColorStop(1, '#0b0705');
  ctx.fillStyle = sg; ctx.fill();
  if (spec.sole === 'chunky') { // ラバーソールの溝
    for (let i = 0; i < 26; i++) seam(() => { ctx.moveTo(40 + i * 37, ts + 22); ctx.lineTo(52 + i * 37, ts + 34); }, 4, 'rgba(0,0,0,0.6)');
  }
  // アッパー
  upperPath(spec.type);
  let g = ctx.createLinearGradient(0, -310, 0, -20);
  g.addColorStop(0, spec.c[0]); g.addColorStop(1, spec.c[1]);
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); upperPath(spec.type); ctx.clip();
  if (spec.grad || spec.patina) { // つま先とかかとを明るく(アンティーク仕上げ/パティーヌ)
    const rg = ctx.createRadialGradient(880, -110, 10, 880, -110, 330);
    rg.addColorStop(0, spec.patina ? 'rgba(140,170,255,0.55)' : 'rgba(255,190,120,0.45)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg; ctx.fillRect(0, -330, 1050, 340);
    const hg = ctx.createRadialGradient(70, -170, 10, 70, -170, 200);
    hg.addColorStop(0, spec.patina ? 'rgba(200,90,190,0.5)' : 'rgba(255,190,120,0.35)'); hg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hg; ctx.fillRect(0, -330, 1050, 340);
    const mg = ctx.createRadialGradient(470, -170, 10, 470, -170, 260);
    mg.addColorStop(0, 'rgba(0,0,0,0.35)'); mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg; ctx.fillRect(0, -330, 1050, 340);
  }
  // 細部
  const t = spec.type;
  if (t === 'captoe' || t === 'plain' || t === 'chambord') {
    // 羽根(紐を通す部分)
    seam(() => { ctx.moveTo(312, -196); ctx.quadraticCurveTo(420, -222, 525, -232); ctx.quadraticCurveTo(565, -200, 540, -168); });
    if (t !== 'captoe') seam(() => { ctx.moveTo(300, -222); ctx.bezierCurveTo(340, -160, 320, -90, 365, -26); }); // 外羽根
    else seam(() => { ctx.moveTo(318, -200); ctx.bezierCurveTo(290, -150, 320, -90, 292, -26); });            // 内羽根のクォーター
  }
  if (t === 'captoe') {
    seam(() => { ctx.moveTo(772, -146); ctx.quadraticCurveTo(800, -80, 808, -26); }, 6);
    stitch(() => { ctx.moveTo(756, -150); ctx.quadraticCurveTo(784, -82, 790, -26); }, stitchCol, 3, [8, 7]);
    if (spec.brogue) for (let i = 0; i < 9; i++) {
      const u = i / 8, px = lerp(784, 798, u) + 0 * u, py = lerp(-138, -36, u);
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.arc(px - 22, py, 5, 0, 7); ctx.fill();
    }
  }
  if (t === 'chambord') stitch(() => { ctx.moveTo(560, -238); ctx.bezierCurveTo(700, -210, 900, -150, 970, -78); }, 'rgba(255,230,190,0.6)', 6, [14, 9]);
  if (t === 'loafer') {
    stitch(() => { ctx.moveTo(470, -226); ctx.bezierCurveTo(640, -214, 880, -150, 975, -70); }, 'rgba(255,230,190,0.45)', 5, [12, 8]);
    // サドル(ストラップ)とペニースロット
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.moveTo(470, -224); ctx.lineTo(610, -214); ctx.quadraticCurveTo(600, -150, 560, -120); ctx.lineTo(430, -138); ctx.closePath(); ctx.fill();
    seam(() => { ctx.moveTo(470, -224); ctx.lineTo(430, -138); ctx.lineTo(560, -120); ctx.quadraticCurveTo(600, -150, 610, -214); }, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.ellipse(515, -170, 40, 10, -0.1, 0, 7); ctx.fill();
  }
  if (t === 'monk') {
    seam(() => { ctx.moveTo(760, -150); ctx.quadraticCurveTo(790, -80, 800, -26); }, 5);
    for (let i = 0; i < 2; i++) {
      const x0 = 400 + i * 66;
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.save(); ctx.beginPath(); ctx.moveTo(x0, topY(x0) + 4); ctx.lineTo(x0 + 46, topY(x0 + 46) + 4); ctx.lineTo(x0 - 6, -128 + i * 6); ctx.lineTo(x0 - 50, -136 + i * 6); ctx.closePath();
      const sg2 = ctx.createLinearGradient(0, -300, 0, -120); sg2.addColorStop(0, spec.c[0]); sg2.addColorStop(1, spec.c[1]);
      ctx.fillStyle = sg2; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
      // バックル
      ctx.save(); ctx.translate(x0 - 30, -132 + i * 6); ctx.rotate(-0.15);
      ctx.strokeStyle = '#d9b46a'; ctx.lineWidth = 7; ctx.strokeRect(-24, -18, 48, 34); ctx.restore();
    }
  }
  if (t === 'plain' || t === 'captoe' || t === 'chambord') {
    // 靴紐
    for (let i = 0; i < 5; i++) {
      const lx = 336 + i * 40, ly = topY(lx) + 18;
      ctx.fillStyle = '#1a120c'; ctx.beginPath(); ctx.arc(lx, ly, 6, 0, 7); ctx.fill();
      seam(() => { ctx.moveTo(lx - 14, ly - 12); ctx.lineTo(lx + 22, ly + 2); }, 8, spec.gold ? '#151515' : '#120c08');
    }
  }
  // ウェルトのステッチとかかとの縫い目
  stitch(() => { ctx.moveTo(50, -36); ctx.lineTo(975, -36); }, stitchCol, 3, [9, 8]);
  seam(() => { ctx.moveTo(30, -60); ctx.bezierCurveTo(14, -140, 24, -205, 60, -244); }, 3, 'rgba(255,255,255,0.12)');
  // 光沢(つま先・かかと)
  const sh = ctx.createRadialGradient(860, -130, 4, 860, -130, 120);
  sh.addColorStop(0, spec.gold ? 'rgba(255,240,210,0.6)' : 'rgba(255,255,255,0.45)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.beginPath(); ctx.ellipse(860, -130, 150, 46, -0.25, 0, 7); ctx.fill();
  const sh2 = ctx.createRadialGradient(80, -220, 4, 80, -220, 90);
  sh2.addColorStop(0, 'rgba(255,255,255,0.22)'); sh2.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh2; ctx.fillRect(0, -320, 200, 220);
  // 光沢の帯がゆっくり横切る
  if (sweep >= 0 && sweep <= 1) {
    const sx = lerp(-200, 1200, sweep);
    const bg2 = ctx.createLinearGradient(sx - 120, 0, sx + 120, 0);
    bg2.addColorStop(0, 'rgba(255,255,255,0)'); bg2.addColorStop(0.5, 'rgba(255,248,230,0.22)'); bg2.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = bg2; ctx.fillRect(sx - 120, -330, 240, 340);
  }
  ctx.restore();
  // シルエット(焦らし用): 黒く塗りつぶして金の縁取り
  if (sil > 0) {
    ctx.save(); ctx.globalAlpha = alpha * sil;
    upperPath(spec.type); ctx.fillStyle = '#050403'; ctx.fill(); solePath(ts); ctx.fill();
    ctx.shadowColor = C.gold; ctx.shadowBlur = 30; ctx.strokeStyle = 'rgba(226,181,101,0.9)'; ctx.lineWidth = 5;
    upperPath(spec.type); ctx.stroke(); solePath(ts); ctx.stroke();
    ctx.restore();
  }
  // 輪郭
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 3; upperPath(spec.type); ctx.stroke();
  ctx.restore();
}
// スポットライトと台座
function stage(x, y, w, alpha = 1, warm = false) {
  ctx.save(); ctx.globalAlpha = alpha;
  const g = ctx.createRadialGradient(x, y - 120, 20, x, y - 60, w * 0.75);
  g.addColorStop(0, warm ? 'rgba(255,200,120,0.32)' : 'rgba(255,225,190,0.22)'); g.addColorStop(1, 'rgba(255,225,190,0)');
  ctx.fillStyle = g; ctx.fillRect(x - w, y - w, w * 2, w * 2);
  const p = ctx.createRadialGradient(x, y + 90, 10, x, y + 90, w * 0.55);
  p.addColorStop(0, 'rgba(255,220,170,0.18)'); p.addColorStop(1, 'rgba(255,220,170,0)');
  ctx.fillStyle = p; ctx.beginPath(); ctx.ellipse(x, y + 90, w * 0.55, 70, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function rays(x, y, t, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(t * 0.25);
  for (let i = 0; i < 16; i++) {
    ctx.rotate(Math.PI * 2 / 16);
    const g = ctx.createLinearGradient(0, 0, 900, 0);
    g.addColorStop(0, 'rgba(246,217,152,0.35)'); g.addColorStop(1, 'rgba(246,217,152,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, -70); ctx.lineTo(900, 70); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ---------- 背景・共通UI ----------
function background(t, tint = 0) {
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 100, W / 2, H * 0.5, H * 0.75);
  g.addColorStop(0, tint ? '#3a2410' : '#2a1d14'); g.addColorStop(1, C.bg);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 革のステッチ風の点線
  ctx.save(); ctx.strokeStyle = 'rgba(226,181,101,0.18)'; ctx.lineWidth = 3; ctx.setLineDash([14, 12]);
  ctx.lineDashOffset = -t * 30;
  ctx.strokeRect(28, 28, W - 56, H - 56); ctx.restore();
}
function vignette(a = 0.6) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function shake(t, t0, amp = 18, dur = 0.35) {
  const p = seg(t, t0, dur); if (p <= 0 || p >= 1) return;
  const k = (1 - p) * amp; ctx.translate((hash(t * 97) - 0.5) * 2 * k, (hash(t * 53 + 1) - 0.5) * 2 * k);
}
// 上部のランキング進行バー(10 → 1)
function progress(t, cur) {
  const x0 = 120, x1 = W - 120, y = 96;
  text('革靴ブランド TOP10', W / 2, 56, { size: 34, color: C.gold2, ls: 4, shadow: 8 });
  for (let i = 0; i < 10; i++) {
    const id = ORDER[i], x = lerp(x0, x1, i / 9);
    const done = ORDER.indexOf(cur) >= i;
    const active = cur === id;
    const r = active ? 22 + 3 * Math.sin(t * 8) : 16;
    ctx.save(); ctx.beginPath(); ctx.arc(x, y + 34, r, 0, Math.PI * 2);
    ctx.fillStyle = active ? C.gold : done ? 'rgba(226,181,101,0.55)' : 'rgba(255,255,255,0.14)'; ctx.fill(); ctx.restore();
    text(String(10 - i), x, y + 35, { size: active ? 24 : 19, color: active ? '#1b130c' : done ? '#1b130c' : C.ink3 });
  }
}
// 下部の字幕
function subtitle(str, t, s0, alpha = 1) {
  const p = easeOut(seg(t, s0, 0.25));
  const size = 50;
  ctx.save(); ctx.font = `bold ${size}px ${FONT}`;
  const lines = wrap(str, W - 160);
  ctx.restore();
  const lh = size * 1.32, h = lines.length * lh + 44, y = 1660 - h / 2 + (1 - p) * 30;
  rrect(60, y, W - 120, h, 26, 'rgba(10,7,5,0.78)', alpha * p);
  lines.forEach((l, i) => text(l, W / 2, y + 22 + lh * (i + 0.5), { size, alpha: alpha * p, color: C.ink }));
}
function wrap(str, maxW) {
  const out = []; let cur = '';
  for (const ch of str) {
    if (ctx.measureText(cur + ch).width > maxW && cur) {
      // 句読点・閉じ括弧は行頭に来ないように前の行へ
      if ('、。」』！？…'.includes(ch)) { cur += ch; continue; }
      out.push(cur); cur = ch;
    } else cur += ch;
  }
  if (cur) out.push(cur);
  return out;
}

// ---------- シーン ----------
function sceneHook(t, s) {
  const lt = t - s.start;
  background(t, true);
  // 革靴のイラストを 0.45 秒ごとにテンポよく切り替える(横からスライドイン)
  const cuts = ['r10', 'r8', 'r3', 'r6', 'r2', 'r9', 'r5'];
  const i = Math.min(cuts.length - 1, Math.floor(lt / 0.45));
  const p = (lt % 0.45) / 0.45;
  stage(W / 2, 1380, 900, 1, true);
  const e = easeOut(clamp(p * 2.5));
  drawShoe(BRANDS[cuts[i]].shoe, W / 2 + (1 - e) * 500 * (i % 2 ? -1 : 1), 1380, 0.95 + 0.06 * p, { rot: -0.03 });
  vignette(0.7);
  ctx.save(); shake(t, s.start, 22, 0.4);
  const a = backOut(seg(lt, 0.05, 0.35));
  ctx.translate(W / 2, 560); ctx.scale(lerp(2.2, 1, a), lerp(2.2, 1, a));
  text('一生モノの革靴', 0, 0, { size: 118, color: C.ink, stroke: 14, strokeColor: '#140d08', alpha: clamp(a * 2), shadow: 30 });
  ctx.restore();
  const b = backOut(seg(lt, 0.9, 0.35));
  ctx.save(); ctx.translate(W / 2, 760); ctx.scale(lerp(0.3, 1, b), lerp(0.3, 1, b));
  text('どれを選ぶ？', 0, 0, { size: 150, color: C.gold2, stroke: 16, strokeColor: '#140d08', alpha: clamp(b * 2), shadow: 30 });
  ctx.restore();
}

function sceneIntro(t, s) {
  const lt = t - s.start, d = s.dur;
  background(t);
  // 2〜10位の靴のカード(3×3)が順に飛び込む
  const keys = ['r10', 'r9', 'r8', 'r7', 'r6', 'r5', 'r4', 'r3', 'r2'];
  const cw = 330, ch = 330, gx = (W - cw * 3 - 24 * 2) / 2, gy = 600;
  keys.forEach((k, i) => {
    const p = backOut(seg(lt, 0.05 + i * 0.07, 0.35));
    const x = gx + (i % 3) * (cw + 24), y = gy + Math.floor(i / 3) * (ch + 24);
    ctx.save();
    ctx.translate(x + cw / 2, y + ch / 2); ctx.scale(p, p); ctx.rotate((hash(i) - 0.5) * 0.12 * (1 - p));
    ctx.beginPath(); rrectPath(-cw / 2, -ch / 2, cw, ch, 18); ctx.clip();
    const g = ctx.createRadialGradient(0, -40, 10, 0, 0, cw * 0.8);
    g.addColorStop(0, '#4a3524'); g.addColorStop(1, '#1a120c');
    ctx.fillStyle = g; ctx.fillRect(-cw / 2, -ch / 2, cw, ch);
    drawShoe(BRANDS[k].shoe, 0, 30, 0.29 + 0.02 * (lt / d), { rot: -0.05 });
    text(BRANDS[k].name, 0, ch / 2 - 36, { size: 28, font: SERIF, color: C.ink2, maxW: cw - 30 });
    ctx.restore();
  });
  const a = easeOut(seg(lt, 0.1, 0.4));
  rrect(0, 330, W * a, 210, 0, 'rgba(10,7,5,0.88)');
  text('世界の革靴ブランド', W / 2 - (1 - a) * 300, 392, { size: 66, color: C.ink, alpha: a });
  const b = backOut(seg(lt, 0.45, 0.4));
  ctx.save(); ctx.translate(W / 2, 485); ctx.scale(lerp(1.8, 1, b), lerp(1.8, 1, b));
  text('TOP 10', 0, 0, { size: 120, font: SERIF, color: C.gold, alpha: clamp(b * 2), stroke: 6, strokeColor: '#140d08', ls: 8 });
  ctx.restore();
  const c = easeOut(seg(lt, 1.2, 0.4));
  rrect(140, 1690, W - 280, 110, 55, C.red, c);
  text('1位は最後に発表！', W / 2, 1746, { size: 54, alpha: c });
  text('※知名度・品質・歴史をもとにした独自選定 / 価格は既製靴の目安', W / 2, 1850, { size: 24, weight: 'normal', color: C.ink3, alpha: c });
}

function sceneRank(t, s) {
  const b = BRANDS[s.id], lt = t - s.start, d = s.dur, top3 = b.rank <= 3, gold = b.rank === 1;
  background(t, top3);
  const sx = W / 2, sy = 720;
  if (gold) rays(sx, sy - 60, t, 0.9 * easeOut(seg(lt, 0, 0.6)));
  // 背景にブランド名を大きく薄く
  text(b.name.toUpperCase(), sx + 200 - lt * 40, 430, { size: 210, font: SERIF, color: 'rgba(226,181,101,0.07)', maxW: 2000 });
  stage(sx, sy, 950, 1, top3);
  // 靴: 横からスライドイン → ゆっくりズーム&浮遊、光沢の帯が横切る
  const enter = easeOut(seg(lt, 0, 0.45));
  const zoom = lerp(0.9, 1.0, easeInOut(seg(lt, 0.4, d)));
  drawShoe(b.shoe, sx + (1 - enter) * W, sy + 8 * Math.sin(lt * 2.2), zoom * (gold ? 1.02 : 0.96),
    { rot: -0.035 + 0.012 * Math.sin(lt * 1.6), sweep: seg(lt, 0.8, 1.3) });

  // 順位: 巨大な数字がスラム
  ctx.save(); shake(t, s.start + 0.12, top3 ? 26 : 16, 0.35);
  const r = backOut(seg(lt, 0.08, 0.32));
  const rx = 70, ry = 1120;
  ctx.translate(rx, ry); ctx.scale(lerp(2.6, 1, r), lerp(2.6, 1, r));
  const col = gold ? C.gold2 : top3 ? C.gold : C.ink;
  text('第', 0, -10, { size: 70, align: 'left', base: 'alphabetic', color: col, alpha: clamp(r * 2), stroke: 10, strokeColor: '#140d08' });
  text(String(b.rank), 76, 20, { size: 250, font: SERIF, align: 'left', base: 'alphabetic', color: col, alpha: clamp(r * 2), stroke: 12, strokeColor: '#140d08', shadow: 30 });
  const nw = b.rank === 10 ? 255 : 140;
  text('位', 76 + nw, -10, { size: 70, align: 'left', base: 'alphabetic', color: col, alpha: clamp(r * 2), stroke: 10, strokeColor: '#140d08' });
  ctx.restore();
  if (top3) {
    const k = easeOut(seg(lt, 0.3, 0.3));
    rrect(W - 300, 960, 240, 74, 37, C.red, k);
    text(gold ? '👑 KING' : 'TOP 3', W - 180, 998, { size: 40, alpha: k });
  }

  const n = easeOut(seg(lt, 0.35, 0.4));
  text(b.name, 70 - (1 - n) * 80, 1225, { size: gold ? 108 : 96, font: SERIF, align: 'left', color: gold ? C.gold2 : C.ink, alpha: n, maxW: W - 140, shadow: 16 });
  text(b.kana + '  ' + b.country, 74 - (1 - n) * 120, 1310, { size: 44, align: 'left', color: C.ink2, alpha: n, maxW: W - 140 });

  const pc = easeOut(seg(lt, 1.4, 0.55));
  const pa = easeOut(seg(lt, 1.3, 0.3));
  rrect(70, 1372, 460, 92, 18, gold ? C.gold : 'rgba(226,181,101,0.95)', pa);
  text('価格目安', 100, 1418, { size: 28, align: 'left', color: '#2a1a0c', alpha: pa });
  text(yen(b.price * pc) + '〜', 505, 1420, { size: 50, align: 'right', color: '#1b130c', alpha: pa });
  const ma = easeOut(seg(lt, 1.7, 0.35));
  rrect(550, 1372, 460, 92, 18, 'rgba(255,255,255,0.1)', ma);
  text('代表作', 580, 1418, { size: 28, align: 'left', color: C.ink3, alpha: ma });
  text(b.model, 990, 1420, { size: 40, align: 'right', color: C.ink, alpha: ma, maxW: 300 });

  subtitle(s.sub, t, s.start + 0.6);
  progress(t, s.id);
  if (gold) confetti(t, s.start);
}

function sceneTease(t, s) {
  const lt = t - s.start, d = s.dur;
  ctx.fillStyle = '#050403'; ctx.fillRect(0, 0, W, H);
  // 1位の靴をシルエットだけ見せて焦らす(鼓動に合わせて少し脈打つ)
  const beat = Math.pow(Math.abs(Math.sin(lt * Math.PI * 2.07)), 8);
  stage(W / 2, 1250, 800, 0.5 + 0.2 * beat);
  drawShoe(BRANDS.r1.shoe, W / 2, 1250, 0.9 + 0.03 * beat + 0.04 * lt / d, { rot: -0.03, sil: 1, alpha: easeOut(seg(lt, 0.2, 0.6)) });
  vignette(0.8);
  ctx.save(); const z = 1 + 0.04 * beat; ctx.translate(W / 2, 640); ctx.scale(z, z);
  text('第1位は…', 0, 0, { size: 150, color: C.gold2, stroke: 14, strokeColor: '#000', alpha: easeOut(seg(lt, 0.1, 0.4)), shadow: 40 });
  ctx.restore();
  text('？', W / 2, 900, { size: 220, font: SERIF, color: 'rgba(255,255,255,0.85)', alpha: easeOut(seg(lt, 0.6, 0.4)) * (0.6 + 0.4 * beat) });
  progress(t, 'r1');
  subtitle(s.sub, t, s.start + 0.1);
  ctx.save(); ctx.globalAlpha = easeIn(seg(lt, d - 0.5, 0.45)); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore();
}

function confetti(t, t0) {
  const lt = t - t0; if (lt < 0 || lt > 4) return;
  for (let i = 0; i < 140; i++) {
    const vx = (hash(i) - 0.5) * 900, vy = -500 - hash(i + 9) * 900;
    const x = W / 2 + vx * lt, y = 700 + vy * lt + 700 * lt * lt;
    if (y > H + 40) continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate(lt * (3 + hash(i + 3) * 8));
    ctx.globalAlpha = clamp(1.6 - lt * 0.45);
    ctx.fillStyle = [C.gold, C.gold2, '#fff', '#C98A3B'][i % 4];
    ctx.fillRect(-9, -4, 18, 8 + 8 * Math.abs(Math.sin(lt * 9 + i))); ctx.restore();
  }
}

function sceneOutro(t, s) {
  const lt = t - s.start;
  background(t);
  vignette(0.5);
  text('ランキングまとめ', W / 2, 190, { size: 64, color: C.gold2, alpha: easeOut(seg(lt, 0, 0.3)), shadow: 12 });
  const rows = [...ORDER].reverse();
  rows.forEach((id, i) => {
    const b = BRANDS[id], p = easeOut(seg(lt, 0.15 + i * 0.08, 0.35));
    const y = 290 + i * 104, dx = (1 - p) * 200;
    rrect(90 - dx, y, W - 180, 88, 16, i === 0 ? 'rgba(226,181,101,0.92)' : 'rgba(20,14,10,0.78)', p);
    const c = i === 0 ? '#1b130c' : C.ink;
    text(`${b.rank}位`, 130 - dx, y + 46, { size: 40, align: 'left', color: i === 0 ? '#1b130c' : C.gold, alpha: p });
    drawShoe(b.shoe, 300 - dx, y + 50, 0.1, { alpha: p });
    text(b.name, 370 - dx, y + 46, { size: 40, font: SERIF, align: 'left', color: c, alpha: p, maxW: 380 });
    text(yen(b.price) + '〜', W - 120 - dx, y + 46, { size: 32, align: 'right', color: i === 0 ? '#2a1a0c' : C.ink2, alpha: p });
  });
  const c = backOut(seg(lt, 1.2, 0.4));
  ctx.save(); ctx.translate(W / 2, 1400); ctx.scale(c, c);
  rrect(-430, -80, 860, 160, 30, C.red);
  text('最初の一足なら', 0, -32, { size: 40, color: '#ffe9e9' });
  text('黒のストレートチップ', 0, 28, { size: 62 });
  ctx.restore();
  const e = easeOut(seg(lt, 2.6, 0.4)), pulse = 1 + 0.05 * Math.sin(lt * 7);
  ctx.save(); ctx.translate(W / 2, 1600); ctx.scale(pulse, pulse);
  rrect(-330, -52, 660, 104, 52, C.gold, e);
  text('🔖 保存して見返そう', 0, 2, { size: 48, color: '#1b130c', alpha: e });
  ctx.restore();
  const cr = ['ナレーション: VOICEVOX:青山龍星', 'BGM・効果音・イラスト: 自作'];
  cr.forEach((l, i) => text(l, W / 2, 1760 + i * 38, { size: 26, weight: 'normal', color: C.ink3, alpha: e }));
}

function render(t) {
  if (!TL) return;
  ctx.save(); ctx.clearRect(0, 0, W, H);
  const s = TL.scenes.find(s => t >= s.start && t < s.start + s.dur) || TL.scenes[TL.scenes.length - 1];
  if (s.id === 'hook') sceneHook(t, s);
  else if (s.id === 'intro') sceneIntro(t, s);
  else if (s.id === 'tease') sceneTease(t, s);
  else if (s.id === 'outro') sceneOutro(t, s);
  else sceneRank(t, s);
  ctx.restore();
  // 最後に黒へフェードアウト
  const fo = seg(t, DURATION - 0.6, 0.6);
  if (fo > 0) { ctx.save(); ctx.globalAlpha = fo; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

async function load() {
  TL = await (await fetch('timeline.json')).json();
  DURATION = TL.total; window.DURATION = DURATION;
  await document.fonts.ready;
}
window.FPS = FPS;
window.render = render;
window.ready = load().then(() => {
  render(0);
  if (!navigator.webdriver) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
});
</script>
</body>
